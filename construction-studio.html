        const cx = pt.p[0] + Math.cos(ang)*off, cz = pt.p[1] + Math.sin(ang)*off;
        ctx.out({ kind:'volume', role:'pile', layer:0, level:'L0',
          poly:Geom.rect(cx-d/2, cz-d/2, cx+d/2, cz+d/2),
          y:-1.2 - z.depth/1000 - p.depth, h:p.depth, mat:'C30',
          addr:ctx.A('pile', pt.i, pt.j, k), round:true });
      }
    }
  }
});

/* ==========================================================================
   GROUND FLOOR  -  the slab you stand on, which is not an upper floor
   ==========================================================================
   An upper floor spans between supports. A ground floor may not span at all:
   a ground-bearing slab is carried by the earth under it. That difference -
   and the damp-proofing and insulation that come with being in contact with
   the ground - is why this is its own choice.
   ========================================================================== */

/** Every ground floor covers the footprint; only the make-up differs. */
function groundSlab(ctx, thk, mat, z, label, buildUp, extra = {}){
  const { grid, level } = ctx;
  panel(ctx, 'slab', grid.outline, level.y - thk, thk, mat,
    Object.assign({ addr:ctx.A('slab'), meta:z, label, buildUp,
                    over:z ? { struct:z.depth } : null }, extra));
}

def({
  id:'ground.timber.suspended', part:'groundFloor', material:'timber',
  label:'Suspended timber floor', tectonic:'filigree',

  bears:'lines', spans:'oneWay',
  span:{ min:2, ok:[2.5, 4.5], max:5 },
  params:[

    { k:'void',    label:'Ventilated void', type:'num', unit:'m', def:0.3, min:0.15, max:0.9, step:0.05 },

/* ==========================================================================
   VERTICAL  -  wall and structure
   ========================================================================== */

/** Frames share one builder: columns on every grid node, optional bracing. */
function frameBuild(ctx, colRule, matId, opts = {}){
  const { grid, level, p, size, M } = ctx;
  const storeysAbove = ctx.storeys - level.idx;
  grid.forEachNode((q, i, j) => {
    const z = size(colRule, { Atrib:grid.tribArea(i,j), storeys:Math.max(1, storeysAbove),
                              w:SIZING.LOADING[M.use], h:level.storey });
    mem(ctx, 'column', P3(q, level.y), P3(q, level.y + level.storey),
        z.sectionId, matId,
        { addr:ctx.A('column', i, j), meta:z,
          label:`Column ${grid.ref(i,j)}`, roll:opts.roll || 0 });
    ctx.register('points', { p:q, i, j, trib:grid.tribArea(i,j) });
  });
  if(p.braced && opts.braceSec){
    const bs = size(opts.braceRule || 'steel.beam', { L:Math.hypot(grid.sx, level.storey) });
    const put = (a, b, n) => mem(ctx, 'brace', a, b, opts.braceSec, matId,
      { addr:ctx.A('brace', n), label:'Bracing' });
    put(P3(grid.node(0,0), level.y), P3(grid.node(1,0), level.y + level.storey), 'x0');
    put(P3(grid.node(0,0), level.y), P3(grid.node(0,1), level.y + level.storey), 'z0');
    put(P3(grid.node(grid.bx,grid.bz), level.y), P3(grid.node(grid.bx-1,grid.bz), level.y + level.storey), 'x1');
    put(P3(grid.node(grid.bx,grid.bz), level.y), P3(grid.node(grid.bx,grid.bz-1), level.y + level.storey), 'z1');
  }
  if(p.cladding !== false) claddingBuild(ctx, opts.cladBuildUp || 'wall.frame.cladding');
}

/** Non-loadbearing envelope on a frame, drawn as a thin wall on the perimeter. */
function claddingBuild(ctx, buildUp){
  const { grid, level } = ctx;
  const t = buildUpTotal(buildUp)/1000;
  grid.perimeterSegs().forEach((seg, i) => {
    wallOf(ctx, 'cladding', seg.a, seg.b, level.y, level.storey, t, buildUp, 'S275',
      { addr:ctx.A('clad', i), label:'Cladding', nonBearing:true, layer:2 });
  });
}

   FLOOR
   ========================================================================== */

/** Beams on the grid lines in one direction, sized by their span. */
function gridBeams(ctx, dir, rule, matId, role, dropBelow){
  const { grid, level, size } = ctx;
  const L = grid.maxStep(dir);
  const z = size(rule, { L, spacing:grid.maxStep(dir === 'x' ? 'z' : 'x') });
  const y = level.y - (dropBelow ? z.depth/2000 : 0);
  grid.forEachSpan(dir, (a, b, i, j) => {
    mem(ctx, role, P3(a, y), P3(b, y), z.sectionId, matId,
      { addr:ctx.A(role, dir, i, j), meta:z,
        label:`${role === 'primary' ? 'Primary' : 'Beam'} ${grid.ref(dir==='x'?i:i, dir==='x'?j:j)}` });
  });
  return z;
}

def({
  id:'floor.steel.composite', part:'floor', material:'steel',
  label:'Composite steel floor', tectonic:'filigree',
  blurb:'Profiled metal deck acting together with a thin concrete slab, on secondary beams ' +
        'at 3 to 4 metre centres. The standard office floor.',
  bears:'points', spans:'oneWay',
  span:{ min:4, ok:[6,12], max:15 },
  grid:{ presets:[[6,6],[7.5,7.5],[7.5,9],[7.5,12],[9,12]] },
  params:[
    { k:'spanDir',    label:'Secondaries span', type:'seg', opts:SPAN_DIR, def:'auto' },
    { k:'secSpacing', label:'Secondary spacing', type:'num', unit:'m', def:3.0, min:2, max:4.5, step:0.25 },
    { k:'slabDepth',  label:'Slab over deck', type:'num', unit:'mm', def:140, min:110, max:200, step:10 }
  ],
  sizing:{ primary:'steel.beam', secondary:'steel.composite', column:'steel.column' },
  buildUp:'floor.steel.composite', layer:3, seq:30,
  build(ctx){
    const { grid, level, p, size } = ctx;
    const dir = p.spanDir === 'auto' ? grid.shortDir : p.spanDir;
    const other = dir === 'x' ? 'z' : 'x';

    gridBeams(ctx, other, 'steel.beam', 'S355', 'primary', true);

    const secL = grid.maxStep(dir);
    const zs = size('steel.composite', { L:secL, spacing:p.secSpacing });
    const step = dir === 'x' ? [0,0,1] : [1,0,0];
    const secY = level.y - zs.depth/2000;
    grid.forEachBay((bay, i, j) => {
      const across = dir === 'x' ? bay.d : bay.w;
      const n = countAt(across, p.secSpacing);
      if(!n) return;
      const gap = across/(n+1);
      const a = dir === 'x' ? [bay.x0, secY, bay.z0 + gap] : [bay.x0 + gap, secY, bay.z0];
      const b = dir === 'x' ? [bay.x1, secY, bay.z0 + gap] : [bay.x0 + gap, secY, bay.z1];
      runOf(ctx, 'secondary', a, b, n, [step[0]*gap, 0, step[2]*gap], zs.sectionId, 'S355',
        { addr:ctx.A('secondary', i, j), meta:zs,
          label:`Secondary beams at ${U.fx(gap,2)} m` });
    });

    panel(ctx, 'slab', grid.outline, level.y - p.slabDepth/1000, p.slabDepth/1000, 'C30',
      { addr:ctx.A('slab'), meta:zs, label:`Composite slab ${p.slabDepth} mm`,
        buildUp:'floor.steel.composite', over:{ slab:p.slabDepth, struct:zs.depth } });
  }
});

def({

  params:[

  ],
  sizing:{ beam:'rc.beam', slab:'rc.slab1way' },
  buildUp:'floor.concrete.oneWay', layer:3, seq:30,
  build(ctx){
    const { grid, level, p, size } = ctx;
    const dir = p.spanDir === 'auto' ? grid.shortDir : p.spanDir;
    const other = dir === 'x' ? 'z' : 'x';
    const zb = gridBeams(ctx, other, 'rc.beam', 'C30', 'primary', true);

    for(let i = 0; i <= grid.bx; i++){

/* --- indexes and the compatibility rule --------------------------------- */
const SYS_BY_PART = { foundation:[], groundFloor:[], vertical:[], floor:[], roof:[] };
for(const s of Object.values(SYSTEMS)) SYS_BY_PART[s.part].push(s);
for(const k in SYS_BY_PART) SYS_BY_PART[k].sort((a,b) => a.material.localeCompare(b.material));

/** Will this horizontal system sit on that vertical one? */
function compatible(vert, horiz){
  if(!vert || !horiz) return { ok:true };
  if(horiz.bears === 'either' || !horiz.bears) return { ok:true };
  if(horiz.bears === vert.provides) return { ok:true };
  return { ok:false, why: horiz.bears === 'points'
    ? `${horiz.label} needs point supports — columns. Add a frame, or choose a system that spans onto walls.`
    : `${horiz.label} needs continuous support along walls. ${vert.label} gives columns instead.` };
}

/** Systems whose comfortable span range brackets this one. */
function suggestFor(part, span){
  return SYS_BY_PART[part].filter(s => s.span && span >= s.span.ok[0] && span <= s.span.ok[1]);
}
/* ==========================================================================
   8b  CONNECTIONS - how one system is joined to the next
   ==========================================================================
   A student can choose a steel frame and a timber floor and see both drawn,
   and still have no idea what happens where they meet. That junction is where
   most of the difficulty of building actually lives, and it is the thing
   drawings in a lecture spend the most time on.

   Connections are not a system and cannot be chosen. They are DERIVED: once
   the parts are built, the junctions are read off the plans and each one is
   resolved from the pair of materials meeting there. Steel on concrete is a
   base plate and holding-down bolts; concrete on concrete is starter bars;
   timber on concrete is a galvanised shoe. Three rules, no special cases, and
   a new system inherits the right joints the moment it declares its material.

   Every joint carries `how` - a sentence explaining what the connection has to
   do - which the property panel shows when the student clicks it.
   ========================================================================== */
const Connect = (() => {

  const R = m => ({ steel:'steel', concrete:'concrete', masonry:'masonry',
                    timber:'timber' }[m] || 'steel');

  /* --- the joints -------------------------------------------------------- */
  const JOINTS = {

    /* --- a column landing on its foundation ----------------------------- */
    'base.steel':{
      label:'Bolted base plate',
      how:'Steel bearing on concrete has to be spread out: a plate welded to the ' +
          'foot of the column turns a small, very high stress into one the concrete ' +
          'can take. Four holding-down bolts cast into the pad hold it down and keep ' +
          'the column upright while the frame goes up.',
      build(ctx, o){
        const B = Math.max(0.32, o.w*2.2), t = 0.028;
        vol(ctx, 'base', o.p, B, t, o.y - t, 'S355',
            { addr:o.A('base'), label:`Base plate ${Math.round(B*1000)} mm square`, how:this.how });
        const e = B/2 - 0.055;
        for(let k = 0; k < 4; k++){
          const dx = (k & 1 ? 1 : -1)*e, dz = (k & 2 ? 1 : -1)*e;
          vol(ctx, 'bolt', [o.p[0]+dx, o.p[1]+dz], 0.028, 0.09, o.y - 0.062, 'S355',
              { addr:o.A('bolt', k), label:'Holding-down bolt, cast in' });
        }
      }
    },

    'base.concrete':{
      label:'Cast-in starter bars',
      how:'Concrete on concrete is not really a joint at all — the bars are what ' +
          'is continuous. Starters are cast into the foundation and left projecting, ' +
          'the column steel is lapped onto them, and the column is poured off a short ' +
          'kicker so the shutter has something to seal against.',
      build(ctx, o){
        vol(ctx, 'kicker', o.p, o.w + 0.05, 0.075, o.y, 'C30',
            { addr:o.A('kicker'), label:'75 mm kicker', how:this.how });
        const e = o.w/2 - 0.045;
        for(let k = 0; k < 4; k++){
          const dx = (k & 1 ? 1 : -1)*e, dz = (k & 2 ? 1 : -1)*e;
          ctx.out({ kind:'member', role:'rebar', layer:ctx.layer, level:o.level,
            a:[o.p[0]+dx, o.y - 0.25, o.p[1]+dz], b:[o.p[0]+dx, o.y + 0.55, o.p[1]+dz],
            sectionId:LIB.synth('RC', 0.025, 0.025, 'C30').id, mat:'C30', roll:0,
            addr:o.A('bar', k), label:'Starter bar, lapped into the column' });
        }
      }
    },

    'base.timber':{
      label:'Galvanised post base',
      how:'Timber must never sit on concrete: the concrete stays damp and the post ' +
          'rots from the end. A galvanised shoe lifts the post clear of the surface ' +
          'and is bolted down, so water can drain away underneath it.',
      build(ctx, o){
        vol(ctx, 'shoe', o.p, o.w + 0.02, 0.006, o.y + 0.05, 'S355',
            { addr:o.A('shoe'), label:'Galvanised post base', how:this.how });
        for(const sgn of [-1, 1])
          vol(ctx, 'cheek', [o.p[0] + sgn*(o.w/2 + 0.004), o.p[1]], 0.008, 0.22,
              o.y + 0.056, 'S355', { addr:o.A('cheek', sgn > 0 ? 1 : 0),
                                     label:'Bolted side cheek' }, o.w);
        vol(ctx, 'pin', o.p, 0.024, 0.05, o.y, 'S355',
            { addr:o.A('pin'), label:'Cast-in dowel' });
      }
    },

    'base.masonry':{
      label:'Damp-proof course',
      how:'A wall carries its load straight into the footing, so nothing is needed ' +
          'to transfer it. What is needed is a barrier: a DPC bedded at least 150 mm ' +
          'above the ground stops water rising through the masonry by capillary action.',
      build(ctx, o){
        ctx.out({ kind:'wall', role:'dpc', layer:ctx.layer, level:o.level,
          a:o.a, b:o.b, y:o.y, h:0.012, thk:o.thk + 0.01, mat:'MAS10',
          addr:o.A('dpc'), label:'Damp-proof course', how:this.how });
      }
    },

    /* --- a horizontal system landing on a wall -------------------------- */
    'bearing.plate':{
      label:'Wall plate',
      how:'Joists and rafters cannot bear on masonry one at a time — each would ' +
          'punch into it. A timber plate bedded along the top of the wall spreads ' +
          'them into a line, gives something to nail to, and is strapped down so ' +
          'wind cannot lift the roof off.',
      build(ctx, o){
        ctx.out({ kind:'member', role:'plate', layer:ctx.layer, level:o.level,
          a:[o.a[0], o.y, o.a[1]], b:[o.b[0], o.y, o.b[1]], roll:0,
          sectionId:LIB.synth('SAWN', 0.047, Math.min(0.15, o.thk), 'C24').id,
          mat:'C24', addr:o.A('plate'), label:'Wall plate, strapped down', how:this.how });
      }
    },

    'bearing.pad':{
      label:'Padstone',
      how:'A beam landing on masonry concentrates its whole load on a few hundred ' +
          'millimetres of wall, which will crush. A padstone — a block of dense ' +
          'concrete built into the wall — spreads that load over enough of it.',
      build(ctx, o){
        vol(ctx, 'padstone', o.p, Math.max(0.215, o.w*1.6), 0.14, o.y - 0.14, 'C40',
            { addr:o.A('pad'), label:'Padstone', how:this.how });
      }
    },

    /* --- a beam meeting a column ---------------------------------------- */
    'beam.steel':{
      label:'Bolted end plate',
      how:'The beam arrives with a plate welded across its end, and that plate is ' +
          'bolted to the column in the air. Everything difficult is done in the ' +
          'fabricator’s shop; the site connection is eight bolts and a spanner.',
      build(ctx, o){
        vol(ctx, 'endplate', o.p, Math.max(0.18, o.w*1.1), 0.02, o.y - o.d/2, 'S355',
            { addr:o.A('ep'), label:'Bolted end plate', how:this.how }, o.d);
      }
    },

    'beam.timber':{
      label:'Joist hanger',
      how:'A galvanised hanger nailed to the supporting timber carries the joist ' +
          'on a folded steel seat. It keeps the top of the floor flat instead of ' +
          'dropping the joist onto a beam below it.',
      build(ctx, o){
        vol(ctx, 'hanger', o.p, 0.06, o.d*0.8, o.y - o.d*0.4, 'S355',
            { addr:o.A('hanger'), label:'Joist hanger', how:this.how }, o.w + 0.01);
      }
    }
  };

  /** A small rectangular solid, centred on `p`, `sx` wide and (optionally) `sz` deep. */
  function vol(ctx, role, p, sx, h, y, mat, o, sz){
    const b = sz || sx;
    ctx.out(Object.assign({
      kind:'volume', role, layer:ctx.layer, level:ctx.level.id,
      poly:Geom.rect(p[0]-sx/2, p[1]-b/2, p[0]+sx/2, p[1]+b/2),
      y, h, mat, connection:true
    }, o));
  }

  /* --- reading the junctions off the plans -------------------------------- */

  /** Half the width of a section, in metres. */
  const halfW = id => { const s = Model.sec(id); return (s && (s.b || s.h)) || 0.3; };
  const depthOf = id => { const s = Model.sec(id); return (s && s.h) || 0.3; };

  /**
   * Emits every joint in the building. Called once, after the parts are built,
   * with the finished plan list - so it never has to guess at geometry that a
   * system has already worked out.
   */
  function build(ctx, plans, M, grid, levels, base, vertSys, foundSys, detail){
    if(detail === 'diagram') return;          // the diagram is about the idea, not the joint
    const mat = vertSys ? R(vertSys.material) : null;
    let n = 0;
    const CAP = 400;

    /* 1. every column where it lands on its foundation.

          A footing is founded below the frost line - a metre or more down - while
          the frame starts at ground level, so there is a real gap between them
          that something has to fill. On site that something is a pedestal cast
          on the pad, or the foundation wall under a load-bearing wall. Without
          it the building floats above its own foundations, which is both wrong
          and the first thing a student notices. */
    const ground = levels[0];
    const tops = plans.filter(p => p.part === 'foundation' && p.kind === 'volume' &&
                                   p.role !== 'pile').map(p => p.y + p.h);
    const foundTop = tops.length ? Math.max(...tops) : null;
    const gapTo = y => (foundTop == null ? 0 : y - foundTop);

    const cols = plans.filter(p => p.part === 'vertical' && p.level === ground.id &&
                                  (p.role === 'column' || p.role === 'post'));
    const J = JOINTS['base.' + mat];
    if(J && foundSys) for(const c of cols){
      if(n++ > CAP) break;
      const w = halfW(c.sectionId)*2;
      const p = [c.a[0], c.a[2]];
      const g = gapTo(c.a[1]);
      if(g > 0.15)
        vol(ctx, 'pedestal', p, Math.max(w + 0.16, 0.35), g, foundTop, 'C30',
            { addr:ctx.A('pedestal', c.addr.split('/').pop()),
              label:`Pedestal, ${U.fx(g,2)} m`,
              how:'The footing is founded well below ground and the frame starts at ' +
                  'ground level. A pedestal cast on the pad carries the column down ' +
                  'to it, and gives the holding-down bolts something to be cast into.' });
      J.build(ctx, { p, y:c.a[1], w, level:ground.id,
                     A:(r, ...b) => ctx.A('base-' + r, ...b, c.addr.split('/').pop()) });
    }

    /* 2. a bearing wall gets its foundation wall, a DPC, and a plate at the top */
    if(base.kind === 'lines' && base.lines.length){
      const dpc = JOINTS['base.masonry'];
      for(const [i, ln] of base.lines.entries()){
        if(n++ > CAP) break;
        const g = gapTo(ground.y);
        if(g > 0.15)
          ctx.out({ kind:'wall', role:'fdnwall', layer:ctx.layer, level:ground.id,
            a:ln.a, b:ln.b, y:foundTop, h:g, thk:(ln.thk || 0.3),
            mat:'MAS10', connection:true,
            addr:ctx.A('fdnwall', i), label:`Foundation wall, ${U.fx(g,2)} m`,
            how:'Below ground the cavity is filled and the wall is built in dense ' +
                'blockwork off the footing, up to the damp-proof course. It is the ' +
                'same wall, doing the same job, in a material that does not mind ' +
                'being wet.' });
        dpc.build(ctx, { a:ln.a, b:ln.b, y:ground.y + 0.15, thk:ln.thk || 0.3,
                         level:ground.id, A:(r, ...b) => ctx.A(r, ...b, i) });
      }
      // and a plate under whatever the walls carry, at every level above the ground
      const plate = JOINTS['bearing.plate'];
      for(const lv of levels.slice(1)){
        for(const [i, ln] of base.lines.entries()){
          if(n++ > CAP) break;
          plate.build(ctx, { a:ln.a, b:ln.b, y:lv.y - 0.03, thk:ln.thk || 0.15,
                             level:lv.id, A:(r, ...b) => ctx.A(r, ...b, lv.id, i) });
        }
      }
    }

    /* 3. beams meeting columns, at Full assembly only - there are a lot of them */
    if(detail === 'full' && (mat === 'steel' || mat === 'timber')){
      const J2 = JOINTS['beam.' + (mat === 'steel' ? 'steel' : 'timber')];
      const beams = plans.filter(p => p.kind === 'member' &&
        (p.role === 'primary' || p.role === 'secondary') && p.part !== 'foundation');
      const nodes = new Set(plans.filter(p => p.role === 'column' || p.role === 'post')
        .map(p => `${p.a[0].toFixed(2)},${p.a[2].toFixed(2)}`));
      for(const bm of beams){
        for(const end of [bm.a, bm.b]){
          if(!nodes.has(`${end[0].toFixed(2)},${end[2].toFixed(2)}`)) continue;
          if(n++ > CAP) break;
          const d = depthOf(bm.sectionId);
          const dir = Math.abs(bm.b[0]-bm.a[0]) > Math.abs(bm.b[2]-bm.a[2]) ? 'x' : 'z';
          const sgn = end === bm.a ? 1 : -1;
          const p = dir === 'x' ? [end[0] + sgn*0.06, end[2]] : [end[0], end[2] + sgn*0.06];
          J2.build(ctx, { p, y:end[1], w:halfW(bm.sectionId)*2, d,
                          level:bm.level,
                          A:(r, ...b) => ctx.A(r, ...b, bm.addr.split('/').pop(), sgn > 0 ? 'a' : 'b') });
        }
      }
    }
    return n;
  }

  return { build, JOINTS };
})();

/* ==========================================================================
   9  GEN - parameters in, plans out
   ==========================================================================
   The order is fixed and comes straight from how a building actually stands
   up. Vertical systems run first, storey by storey, and REGISTER what they
   hold things up with. Floors and roofs then read that register through
   `ctx.support` without ever knowing which system put it there. Foundations
   run last, on the register left at ground level.

   Nothing here touches three.js. It emits plain data, which is why it can
   re-run on every drag of a slider.
   ========================================================================== */
const Gen = (() => {

  let plans = [], diag = { notes:[], orphans:[] }, index = new Map();
  let lastMs = 0, lastCounts = {};
  const CACHE = new Map();

  const hash = o => JSON.stringify(o);

  /* --- addresses -----------------------------------------------------------
     An address must survive a regeneration, so it is built from where a thing
     sits on the grid, never from its position in an array. Add a bay at the
     end and every existing address still means the same element. */
  const addr = (part, levelId, sysId, role, bits) =>
    `${part}/${levelId}/${sysId.split('.').slice(1).join('.')}/${role}` +
    (bits.length ? '/' + bits.join('.') : '');

  function makeCtx(part, sys, level, grid, levels, M, detail, support, base){
    const out = [];
    const notes = [];
    const reg = { points:[], lines:[] };
    const ctx = {
      M, grid, level, levels, detail, part, sys,
      /* Storeys ACTUALLY built, which is not always the number the document
         asks for - see levelsFor. Sizing rules must load a column with the
         storeys that exist above it, not with the ones that were typed. */
      storeys: levels.length - 1,
      layer: sys.layer ?? 3,
      p: {},                     // filled by the caller
      support, base,
      out: plan => {
        plan.part = part; plan.system = sys.id;
        plan.level = plan.level || level.id;
        plan.layer = plan.layer ?? (sys.layer ?? 3);
        plan.seq   = plan.seq ?? (sys.seq ?? 30);
        if(!plan.addr) plan.addr = addr(part, level.id, sys.id, plan.role, []);
        out.push(plan);
      },
      A: (role, ...bits) => addr(part, level.id, sys.id, role, bits),
      register: (kind, g) => reg[kind].push(g),
      note: (sev, text) => notes.push({ sev, text, part, system:sys.id }),
      size: (ruleId, c) => SIZING.size(ruleId, c)
    };
    return { ctx, out, notes, reg };
  }

  /**
   * The level list a document actually builds, which is not always the level
   * list it asks for. A portal frame spans the full width in one go - that is
   * the whole point of it - so it is a single-storey structure by definition,
   * and a document that says four storeys still builds two levels, ground and
   * roof. Everything downstream must agree with what was built rather than
   * with what was typed: the datums, the sequence, the load takedown, the
   * comparison. Otherwise the model sprouts levels with nothing on them, which
   * is exactly the "I changed the number and nothing happened" complaint.
   *
   * The document itself is left alone. Switching back to a moment frame must
   * restore the number the student had set, not a number we clamped behind
   * their back.
   */
  function levelsFor(M){
    const v = M.slots && M.slots.vertical && SYSTEMS[M.slots.vertical.sys];
    const n = v && v.singleStorey ? 1 : M.levels.storeys;
    return Model.makeLevels(n === M.levels.storeys
      ? M.levels : Object.assign({}, M.levels, { storeys:n }));
  }

  /**
   * Why the storey count is locked, or null if it is not. The control asks
   * this so it can explain itself: a field that accepts a number and then
   * throws it away is worse than one that will not accept it at all.
   */
  function storeyLock(M){
    const v = M.slots && M.slots.vertical && SYSTEMS[M.slots.vertical.sys];
    if(!(v && v.singleStorey)) return null;
    return `${v.label} is single-storey by nature — it spans the full width in `
         + `one go, which is the whole point of it. Choose a framed or `
         + `loadbearing wall system to stack storeys.`;
  }

  /* --- the pipeline -------------------------------------------------------- */
  function plan(M, detail = 'members'){
    const t0 = performance.now();
    const grid = Model.makeGrid(M.grid);
    const levels = levelsFor(M);
    const all = [];
    const notes = [];
    const support = {};                 // levelId -> { kind, points, lines }
    const base = { points:[], lines:[], kind:'points' };

    /* Read the slot from the document we were HANDED, not from the Store. They
       are the same object in the running app, but a comparison, a test or any
       what-if generation passes a different document - and silently generating
       the wrong building from the right document is a nasty way to be wrong. */
    const pick = (part, levelId) => {
      const b = M.slots[part] || { sys:null, p:{} };
      const over = levelId && M.perLevel && M.perLevel[levelId] && M.perLevel[levelId][part];
      const slot = over ? { sys:over.sys || b.sys, p:Object.assign({}, b.p, over.p) } : b;
      const s = SYSTEMS[slot.sys];
      if(!s) return null;
      const p = {};
      for(const q of (s.params || [])) p[q.k] = (slot.p && slot.p[q.k] !== undefined) ? slot.p[q.k] : q.def;
      return { sys:s, p };
    };

    /* 1. vertical, storey by storey, registering what it holds up */
    const vsel = pick('vertical');
    const storeys = levels.length - 1;      // levelsFor already honoured singleStorey
    let eaves = null;
    for(let i = 0; i < storeys; i++){
      const sel = pick('vertical', levels[i].id) || vsel;
      if(!sel) break;
      const above = levels[i+1] || levels[levels.length-1];
      const { ctx, out, notes:n, reg } =
        makeCtx('vertical', sel.sys, levels[i], grid, levels, M, detail,
                support[levels[i].id] || { kind:null, points:[], lines:[] }, base);
      ctx.p = sel.p;
      try { sel.sys.build(ctx); } catch(e){ n.push({ sev:'error', text:`${sel.sys.label}: ${e.message}` }); }
      if(ctx.eaves != null) eaves = ctx.eaves;
      all.push(...out); notes.push(...n);
      support[above.id] = {
        kind: reg.points.length ? 'points' : reg.lines.length ? 'lines' : null,
        points:reg.points, lines:reg.lines, provides:sel.sys.provides };
      if(i === 0){ base.points = reg.points; base.lines = reg.lines;
                   base.kind = reg.points.length ? 'points' : 'lines'; }
    }

    /* 2. floors, at every level above the ground and below the roof */
    const topIdx = levels.length - 1;
    for(let j = 1; j < topIdx; j++){
      const lv = levels[j];
      const sel = pick('floor', lv.id);
      if(!sel) continue;
      const sup = support[lv.id] || { kind:null, points:[], lines:[] };
      const c = compatible(vsel && vsel.sys, sel.sys);
      const { ctx, out, notes:n } =
        makeCtx('floor', sel.sys, lv, grid, levels, M, detail, sup, base);
      ctx.p = sel.p;
      try { sel.sys.build(ctx); } catch(e){ n.push({ sev:'error', text:`${sel.sys.label}: ${e.message}` }); }
      all.push(...out); notes.push(...n);
      if(!c.ok && j === 1) notes.push({ sev:'warn', text:c.why, part:'floor' });
    }

    /* 3. roof, at the top */
    const rsel = pick('roof', levels[topIdx].id);
    if(rsel){
      const lv = levels[topIdx];
      const { ctx, out, notes:n } =
        makeCtx('roof', rsel.sys, lv, grid, levels, M, detail,
                support[lv.id] || { kind:null, points:[], lines:[] }, base);
      ctx.p = rsel.p;
      ctx.eaves = eaves;
      try { rsel.sys.build(ctx); } catch(e){ n.push({ sev:'error', text:`${rsel.sys.label}: ${e.message}` }); }
      all.push(...out); notes.push(...n);
      const c = compatible(vsel && vsel.sys, rsel.sys);
      if(!c.ok) notes.push({ sev:'warn', text:c.why, part:'roof' });
    }

    /* 3b. the ground floor, which sits on the ground rather than spanning */
    const gsel = pick('groundFloor', levels[0].id);
    if(gsel){
      const { ctx, out, notes:n } =
        makeCtx('groundFloor', gsel.sys, levels[0], grid, levels, M, detail,
                { kind:base.kind, points:base.points, lines:base.lines }, base);
      ctx.p = gsel.p;
      try { gsel.sys.build(ctx); } catch(e){ n.push({ sev:'error', text:`${gsel.sys.label}: ${e.message}` }); }
      all.push(...out); notes.push(...n);
      // a suspended ground floor has to land on something, exactly as an upper one does
      const c = compatible(vsel && vsel.sys, gsel.sys);
      if(!c.ok) notes.push({ sev:'warn', text:c.why, part:'groundFloor' });
    }

    /* 4. foundations, on whatever the ground storey left behind */
    const fsel = pick('foundation');
    if(fsel){
      const { ctx, out, notes:n } =
        makeCtx('foundation', fsel.sys, levels[0], grid, levels, M, detail,
                { kind:base.kind, points:base.points, lines:base.lines }, base);
      ctx.p = fsel.p;
      try { fsel.sys.build(ctx); } catch(e){ n.push({ sev:'error', text:`${fsel.sys.label}: ${e.message}` }); }
      all.push(...out); notes.push(...n);
      if(fsel.sys.needs && fsel.sys.needs !== 'either' && base.kind && fsel.sys.needs !== base.kind)
        notes.push({ sev:'warn', part:'foundation',
          text: fsel.sys.needs === 'points'
            ? `${fsel.sys.label} sit under columns, and this building stands on walls. Try strip footings or a raft.`
            : `${fsel.sys.label} follow walls, and this building stands on columns. Try pad foundations.` });
    }

    /* 4b. the joints between all of it - derived, never chosen */
    if(M.connections !== false){
      const { ctx, out, notes:n } =
        makeCtx('connection', { id:'connection', layer:2, seq:25 },
                levels[0], grid, levels, M, detail, { kind:base.kind }, base);
      try {
        Connect.build(ctx, all, M, grid, levels, base,
                      vsel && vsel.sys, fsel && fsel.sys, detail);
      } catch(e){ n.push({ sev:'error', text:`Connections: ${e.message}` }); }
      all.push(...out); notes.push(...n);
    }

    /* 5. anything the student drew stays exactly as they left it */
    for(const m of M.manual || []) all.push(Object.assign({}, m, { manual:true }));

    lastMs = performance.now() - t0;
    return { plans:all, notes, grid, levels, support, base };
  }

  /* --- edits, applied between planning and drawing -------------------------
     This is where "parametric first, then edit" actually happens. Overrides
     are keyed by address; an address that no longer exists becomes an orphan,
     which is reported rather than quietly dropped. */
  function applyEdits(list, edits){
    const used = new Set();
    const orphans = [];
    const out = [];

    for(const pl of list){
      if(pl.manual){ out.push(pl); continue; }
      const e = edits[pl.addr];
      if(e){
        used.add(pl.addr);
        if(e.del) continue;
        out.push(Object.assign({}, pl, e, { edited:true }));
        continue;
      }
      if(pl.kind === 'run'){
        // per-repeat edits: pull the affected copies out of the run
        const prefix = pl.addr + '#';
        const hits = Object.keys(edits).filter(k => k.startsWith(prefix));
        if(!hits.length){ out.push(pl); continue; }
        const overrides = new Map();
        for(const k of hits){
          const i = parseInt(k.slice(prefix.length), 10);
          if(!isFinite(i) || i < 0 || i >= pl.count){ orphans.push(k); continue; }
          used.add(k); overrides.set(i, edits[k]);
        }
        let runStart = 0;
        const emitRun = (from, to) => {
          if(to <= from) return;
          out.push(Object.assign({}, pl, {
            count:to - from,
            a:[pl.a[0] + pl.step[0]*from, pl.a[1] + pl.step[1]*from, pl.a[2] + pl.step[2]*from],
            b:[pl.b[0] + pl.step[0]*from, pl.b[1] + pl.step[1]*from, pl.b[2] + pl.step[2]*from],
            addr:pl.addr, runFrom:from }));
        };
        for(let i = 0; i < pl.count; i++){
          const o = overrides.get(i);
          if(!o) continue;
          emitRun(runStart, i);
          runStart = i + 1;
          if(o.del) continue;
          out.push(Object.assign({}, pl, o, {
            kind:'member', count:1, edited:true, addr:pl.addr + '#' + i,
            a:[pl.a[0] + pl.step[0]*i, pl.a[1] + pl.step[1]*i, pl.a[2] + pl.step[2]*i],
            b:[pl.b[0] + pl.step[0]*i, pl.b[1] + pl.step[1]*i, pl.b[2] + pl.step[2]*i] }));
        }
        emitRun(runStart, pl.count);
        continue;
      }
      out.push(pl);
    }
    for(const k of Object.keys(edits)) if(!used.has(k)) orphans.push(k);
    return { plans:out, orphans:Util.uniq(orphans) };
  }

  /* --- how many objects will this actually draw? ---------------------------
     Cheap to compute from the plans alone, so it runs before any geometry is
     built and can degrade the detail level before the browser struggles. */
  function estimate(list){
    let n = 0;
    for(const pl of list) n += pl.kind === 'run' ? pl.count : 1;
    return n;
  }

  function run(M, detail){
    const r = plan(M, detail);
    const e = applyEdits(r.plans, M.edits || {});
    plans = e.plans;
    diag = { notes:r.notes, orphans:e.orphans, grid:r.grid, levels:r.levels,
             support:r.support, base:r.base };
    index = new Map();
    for(const pl of plans) if(pl.addr) index.set(pl.addr, pl);
    lastCounts = { plans:plans.length, elements:estimate(plans) };
    Bus.emit('gen', { plans, diag, counts:lastCounts, ms:lastMs });
    return { plans, diag, counts:lastCounts, ms:lastMs };
  }

  /** Describe an edit in words, so an orphan can be reported meaningfully. */
  function describe(address, edit){
    const bits = address.split('/');
    const part = bits[0], level = bits[1], role = bits[3];
    const what = edit.del ? 'deleted'
               : edit.sectionId ? (LIB.SEC[edit.sectionId]?.name || edit.sectionId)
               : 'changed';
    return `${what} — ${role} on ${level}`;
  }

  return {
    run, plan, applyEdits, estimate, describe, addr, levelsFor, storeyLock,
    get plans(){ return plans }, get diag(){ return diag },
    get index(){ return index }, get ms(){ return lastMs },
    get counts(){ return lastCounts },
    clearCache(){ CACHE.clear(); }
  };
})();
/* ==========================================================================
   11b  LOADS - where the weight goes
   ==========================================================================
   A student can name every part of a building and still not be able to answer
   the question the whole thing exists to answer: what holds this up? Gravity
   load starts spread over the roof, is collected by the floors, gathers into
   columns or walls, grows at every storey it passes, and arrives at the ground
   as a few very large numbers.

   This is a TAKEDOWN, not an analysis. Each support takes the load on the area
   nearest to it - its tributary area - and there is no frame action, no
   continuity, no moment anywhere. That is exactly the calculation done by hand
   at the start of a project, and it is the one worth being able to do.

   The arithmetic has an invariant worth stating: the loads on all the supports
   must add up to the loads on all the floors. Nothing may be lost on the way
   down. The test suite asserts it.
   ========================================================================== */
const Loads = (() => {

  /**
   * Works out what every support carries, level by level, from the roof down.
   * Pure data: no geometry, no three.js, so it can be checked without a browser.
   */
  function compute(doc){
    const grid   = Model.makeGrid(doc.grid);
    const levels = Gen.levelsFor(doc);   // what is built, not what was typed
    const wFloor = SIZING.LOADING[doc.use] ?? 11;
    const wRoof  = SIZING.LOADING.roof ?? 5;

    /* 1. what lands on each level, top down. The roof is lighter than a floor:
          nobody stands on it and there is no screed or partition allowance. */
    const rows = [];
    for(let i = levels.length - 1; i >= 1; i--){
      const L = levels[i];
      const w = L.isRoof ? wRoof : wFloor;
      rows.push({ id:L.id, name:L.name, y:L.y, isRoof:L.isRoof,
                  area:grid.area, w, load:grid.area*w });
    }
    let run = 0;
    for(const r of rows){ run += r.load; r.cumulative = run; }
    const total = run;

    /* 2. how the supports share it. Walls take load per metre run; columns take
          it per node, in proportion to the floor area nearest to each. */
    const base = doc.slots.vertical && SYSTEMS[doc.slots.vertical.sys];
    const onWalls = base && base.provides === 'lines';
    const supports = [];

    if(onWalls){
      // perimeter of the footprint - what a bearing-wall building stands on
      const runLen = 2*(grid.W + grid.D);
      for(const r of rows){
        // load from this level and everything above it, spread along the walls
        supports.push({ kind:'line', level:r.id, name:r.name, y:r.y,
                        length:runLen, perMetre:r.cumulative/runLen, N:r.cumulative });
      }
      return { rows, supports, total, onWalls, grid, levels,
               runLen, perMetre:total/runLen, wFloor, wRoof };
    }

    const nodes = [];
    for(let i = 0; i < grid.nx; i++)
      for(let j = 0; j < grid.nz; j++)
        nodes.push({ i, j, x:grid.xs[i], z:grid.zs[j], trib:grid.tribArea(i, j),
                     ref:grid.ref(i, j) });

    // Each node's share of a level is its tributary area times that level's load.
    for(const nd of nodes){
      let acc = 0;
      const perLevel = [];
      for(const r of rows){
        acc += nd.trib*r.w;
        perLevel.push({ level:r.id, name:r.name, y:r.y, N:acc });
      }
      supports.push({ kind:'point', i:nd.i, j:nd.j, x:nd.x, z:nd.z, ref:nd.ref,
                      trib:nd.trib, perLevel, N:acc });
    }

    const worst = supports.reduce((a, b) => b.N > a.N ? b : a, supports[0] || { N:0 });
    return { rows, supports, total, onWalls:false, grid, levels, nodes,
             worst, maxN:worst ? worst.N : 0, wFloor, wRoof };
  }

  /* --- which way does the load travel through this member? ----------------
     One geometric rule covers every system there is or will be. A role name
     would need a list to keep up with; a direction vector does not. */
  const VERT = 0.94, HORIZ = 0.09;
  function classify(a, b){
    const dx = b[0]-a[0], dy = b[1]-a[1], dz = b[2]-a[2];
    const L = Math.hypot(dx, dy, dz) || 1;
    const uy = Math.abs(dy/L);
    return uy > VERT ? 'vertical' : uy < HORIZ ? 'horizontal' : 'inclined';
  }

  /** Roles that carry floor or roof load along themselves to a support. */
  const SPANNING = new Set(['joist','secondary','primary','purlin','plank','rib',
                            'rafter','truss','beam','edge','panel','deck','slab',
                            'topping','tie','ridge']);

  /**
   * Where the load goes ALONG the structure, not just down it.
   *
   * A level's load is shared out among the members that span it, in proportion
   * to the strip of floor each one carries. Each member then delivers half of
   * what it collects to the support at either end - the classic w·L/2 - and an
   * inclined member also pushes its support sideways, which is the whole reason
   * a pitched roof needs a tie.
   *
   * The shares are normalised so they add back up to the level's load. Nothing
   * may be lost travelling horizontally any more than vertically, and the test
   * suite checks both.
   */
  function paths(doc, plans){
    const base = compute(doc);
    const grid = base.grid, levels = base.levels;
    const byLevel = new Map(base.rows.map(r => [r.id, r]));
    const segs = [];

    // members that actually span, grouped by the level whose load they carry
    const spans = new Map();
    for(const pl of plans){
      if(pl.part === 'connection' || pl.part === 'foundation') continue;
      if(pl.kind !== 'member' && pl.kind !== 'run') continue;
      if(!SPANNING.has(pl.role)) continue;
      const r = byLevel.get(pl.level);
      if(!r) continue;
      const L = Math.hypot(pl.b[0]-pl.a[0], pl.b[1]-pl.a[1], pl.b[2]-pl.a[2]);
      if(L < 0.4) continue;
      const n = pl.kind === 'run' ? (pl.count || 1) : 1;
      // the strip of floor this member carries: the spacing of its own family
      // where there is one, otherwise the bay it sits in
      const step = pl.kind === 'run' && pl.step
        ? Math.hypot(pl.step[0], pl.step[1], pl.step[2]) : 0;
      const trib = step > 0.05 ? step : Math.min(grid.sx, grid.sz)/2;
      const kind = classify(pl.a, pl.b);
      const list = spans.get(pl.level) || (spans.set(pl.level, []), spans.get(pl.level));
      list.push({ pl, L, n, trib, kind, share:L*trib*n });
    }

    for(const [levelId, list] of spans){
      const r = byLevel.get(levelId);
      const totalShare = list.reduce((a, x) => a + x.share, 0) || 1;
      // normalise: whatever the strips came to, together they carry this level
      const k = r.load/totalShare;
      for(const x of list){
        const load = x.share*k;              // kN carried by the whole family
        const each = load/x.n;               // kN carried by one member of it
        const R = each/2;                    // delivered to each end
        const rise = Math.abs(x.pl.b[1] - x.pl.a[1]);
        const run  = Math.hypot(x.pl.b[0]-x.pl.a[0], x.pl.b[2]-x.pl.a[2]);
        // a sloping member pushes its foot outward: H = V / tan(pitch)
        const thrust = x.kind === 'inclined' && rise > 1e-6 ? R*(run/rise) : 0;
        segs.push({ addr:x.pl.addr, role:x.pl.role, level:levelId, kind:x.kind,
                    a:x.pl.a, b:x.pl.b, count:x.n, step:x.pl.step || null,
                    length:x.L, trib:x.trib, inferred:!(x.pl.kind === 'run' && x.pl.step),
                    lineLoad:each/x.L, each, R, thrust,
                    pitch: rise > 1e-6 ? Math.atan2(rise, run)*180/Math.PI : 0 });
      }
    }

    // the vertical half, from the takedown already computed
    if(!base.onWalls) for(const sp of base.supports)
      for(const s of sp.perLevel)
        segs.push({ kind:'vertical', level:s.level, ref:sp.ref,
                    a:[sp.x, s.y, sp.z], b:[sp.x, levels[0].y, sp.z], N:s.N });

    const per = kindTotals(segs);
    return Object.assign({}, base, { segs, per,
      delivered: segs.filter(s => s.kind !== 'vertical')
                     .reduce((a, s) => a + s.R*2*(s.count || 1)/(s.count || 1), 0) });
  }

  /** How much of each kind there is, for the panel and the filter chips. */
  function kindTotals(segs){
    const out = { surface:0, horizontal:0, inclined:0, vertical:0 };
    for(const s of segs) if(out[s.kind] !== undefined) out[s.kind]++;
    return out;
  }

  /** A colour ramp for load: pale where it is light, deep red where it is heavy. */
  function colourFor(t){
    const stops = [[0.00, 0x8fb8e8], [0.35, 0x7fc9a6], [0.60, 0xe8c463],
                   [0.82, 0xe58b4a], [1.00, 0xd6453f]];
    t = Util.clamp(t, 0, 1);
    for(let i = 1; i < stops.length; i++){
      if(t <= stops[i][0]){
        const [t0, c0] = stops[i-1], [t1, c1] = stops[i];
        const k = (t - t0)/(t1 - t0 || 1);
        const mix = (a, b) => Math.round(a + (b - a)*k);
        return (mix((c0>>16)&255, (c1>>16)&255) << 16) |
               (mix((c0>>8)&255,  (c1>>8)&255)  << 8) |
                mix(c0&255,       c1&255);
      }
    }
    return stops[stops.length-1][1];
  }

  return { compute, paths, classify, colourFor, SPANNING };
})();

/* ==========================================================================
   10  RENDER - one renderer, one scene, on-demand drawing
   ========================================================================== */
const Render = (() => {
  let renderer, scene, camera, controls, labelRenderer, canvas, stage;
  // Starts as null, not 'ortho': boot calls setCamera(View.state.camera), and
  // that call early-returns when the mode already matches - which left the
  // perspective camera active while everything downstream believed the view
  // was orthographic.
  let persp, ortho, camMode = null;
  let raf = null, dirty = true, onScreen = true, disposed = false;
  const groups = {};
  const geoCache = new Map(), matCache = new Map();
  const pickables = [];
  let modelDiag = 20;

  /* Architectural colour coding: pale, distinct by material family, so the
     model reads on a projector and in an exported image. */
  const C = {
    steel:0x93a3b5, concrete:0xbdbab2, timber:0xc9a878, masonry:0xb08268,
    insul:0xf0d98a, board:0xe2e4e6, metal:0xa8b4c0, void:0x8892a0,
    sel:0x4da3ff, grid:0x3a4552, edge:0x1a1f26, ghost:0x7d8899
  };
  /* --- cross-section outlines ------------------------------------------- */
  function sectionShape(sec){
    const s = new THREE.Shape();
    const h = sec.h || 0.3, b = sec.b || 0.2;
    if(sec.shape === 'I'){
      const tw = sec.tw || b*0.06, tf = sec.tf || h*0.04;
      const hh = h/2, bb = b/2, wh = tw/2;
      s.moveTo(-bb,-hh); s.lineTo(bb,-hh); s.lineTo(bb,-hh+tf); s.lineTo(wh,-hh+tf);
      s.lineTo(wh, hh-tf); s.lineTo(bb, hh-tf); s.lineTo(bb, hh); s.lineTo(-bb, hh);
      s.lineTo(-bb, hh-tf); s.lineTo(-wh, hh-tf); s.lineTo(-wh,-hh+tf); s.lineTo(-bb,-hh+tf);
      s.closePath();
    } else if(sec.shape === 'round' || sec.shape === 'pipe'){
      s.absarc(0, 0, h/2, 0, Math.PI*2, false);
      if(sec.shape === 'pipe' && sec.t){
        const hole = new THREE.Path();
        hole.absarc(0, 0, Math.max(h/2 - sec.t, 1e-4), 0, Math.PI*2, true);
        s.holes.push(hole);
      }
    } else {
      const hh = h/2, bb = b/2;
      s.moveTo(-bb,-hh); s.lineTo(bb,-hh); s.lineTo(bb,hh); s.lineTo(-bb,hh); s.closePath();
      if(sec.shape === 'hollow' && sec.t){
        const t = sec.t, hole = new THREE.Path();
        hole.moveTo(-bb+t,-hh+t); hole.lineTo(-bb+t,hh-t);
        hole.lineTo(bb-t,hh-t); hole.lineTo(bb-t,-hh+t); hole.closePath();
        s.holes.push(hole);
      }
    }
    return s;
  }

  /** Unit-length extrusion of a section, cached; scaled per member in X. */
  function profileGeometry(sectionId, simple){
    const key = sectionId + (simple ? ':s' : '');
    if(geoCache.has(key)) return geoCache.get(key);
    const sec = Model.sec(sectionId);
    let g;
    if(simple){
      g = new THREE.BoxGeometry(1, sec.h || 0.3, sec.b || 0.2);
      g.translate(0.5, 0, 0);
    } else {
      g = new THREE.ExtrudeGeometry(sectionShape(sec), { depth:1, bevelEnabled:false, curveSegments:16 });
      // ExtrudeGeometry puts the section in XY and extrudes along +Z. The
      // section is authored with x = width (local z) and y = depth (local y),
      // so a single quarter turn about Y maps it to: extrude -> local x,
      // section depth -> local y, section width -> local z. The profile then
      // already spans 0..1 in x, which is what memberMatrix scales by L.
      g.rotateY(Math.PI/2);
      g.computeVertexNormals();
    }
    geoCache.set(key, g);
    return g;
  }

  function material(key, opts){
    if(matCache.has(key)) return matCache.get(key);
    const m = new THREE.MeshStandardMaterial(Object.assign(
      { roughness:0.75, metalness:0.05, flatShading:false }, opts));
    matCache.set(key, m);
    return m;
  }
  function familyColour(materialId){
    const f = Model.mat(materialId).family;
    return C[f] != null ? C[f] : C.steel;
  }

  /* --- lifecycle --------------------------------------------------------- */
  function init(canvasEl, stageEl, labelEl){
    canvas = canvasEl; stage = stageEl;
    /* Two of these are about the drawing buffer the browser hands back, which
       is not the same everywhere.

       `stencil` is not asked for because anything here uses a stencil. It is
       asked for because of what the driver allocates when it is NOT: three.js
       defaults it off, and ANGLE - which is how Chrome talks to the GPU on
       Windows - then has the option of a 16-bit depth buffer where asking for
       a stencil gets the packed 24-bit-plus-8 format instead. Sixteen bits
       over the range this model needs is under a millimetre of depth
       resolution, and a wall build-up stacks layers a millimetre thick.

       `preserveDrawingBuffer` was on so the PNG export could read the canvas.
       It does not need it: the export renders and reads back inside one
       synchronous block (see cs/21-export.js), which is defined to work
       without it. Leaving it on made Chrome resolve the multisampled buffer
       into a preserved copy every single frame, which is both a cost and a
       path other browsers do not take. */
    /* ?aa=0 turns multisampling off. It cannot be switched once the context
       exists, and the multisample resolve is the most browser-specific step in
       the pipeline, so it needs a way to be tested at all. */
    const noAA = /[?&]aa=0/.test(location.search);
    renderer = new THREE.WebGLRenderer({
      canvas, antialias:!noAA, alpha:false, stencil:true,
      powerPreference:'high-performance'
    });
    fullPixelRatio = Math.min(devicePixelRatio || 1, 2);
    renderer.setPixelRatio(fullPixelRatio);
    renderer.shadowMap.enabled = false;
    renderer.localClippingEnabled = true;   // the section box lives on this
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.NoToneMapping;

    scene = new THREE.Scene();
    persp = new THREE.PerspectiveCamera(45, 1, 0.05, 4000);
    ortho = new THREE.OrthographicCamera(-20, 20, 20, -20, -2000, 4000);
    camera = persp;
    camera.position.set(18, 14, 22);

    controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.09;
    controls.screenSpacePanning = false;
    controls.maxPolarAngle = Math.PI*0.98;
    controls.touches = { ONE:THREE.TOUCH.ROTATE, TWO:THREE.TOUCH.DOLLY_PAN };
    controls.addEventListener('change', () => { dirty = true; });
    // OrbitControls reports the start and end of every drag, wheel and pinch.
    controls.addEventListener('start', () => setInteracting(true));
    controls.addEventListener('end',   () => setInteracting(false));

    labelRenderer = new CSS2DRenderer({ element:labelEl });
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';

    for(const k of ['env','ref','underlay','context','build','loads','overlay']){
      groups[k] = new THREE.Group(); groups[k].name = k; scene.add(groups[k]);
    }

    buildEnvironment();
    applyTheme();
    bindContextLoss();
    resize();
    start();
  }

  /**
   * The renderer paints its own clear colour, so the CSS `--viewport` behind
   * the canvas never shows - which left the viewport black in the light
   * theme. Read the token and hand it to the renderer instead, and tune the
   * ground grid to match, because a dark grid on a pale ground reads as dirt.
   */
  function applyTheme(){
    if(!renderer) return;
    const light = document.documentElement.dataset.theme === 'light';
    // #stage already carries `background: var(--viewport)`. Reading a standard
    // property forces a full style recalculation, where reading the custom
    // property straight off :root can hand back the value from before the
    // data-theme attribute changed - which paints the viewport in the theme
    // just left behind.
    let col = light ? '#e7ebf1' : '#141820';
    const bg = stage && getComputedStyle(stage).backgroundColor;
    if(bg && bg !== 'transparent' && !/rgba\(0, 0, 0, 0\)/.test(bg)) col = bg;
    renderer.setClearColor(new THREE.Color(col), 1);
    paintGround();
    dirty = true;
  }

  /**
   * The ground grid, sized to the building.
   *
   * It used to be a fixed 120 metre field. Under a small house that is both
   * odd to look at and quietly expensive: a plane that large reaches past the
   * camera, and since nothing on screen may be clipped, it was the grid - not
   * the building - that decided how near the near plane could be. In
   * perspective the near plane is the whole ballgame for depth precision, so a
   * 120 m grid under a 20 m house cost three orders of magnitude of it.
   *
   * Squares stay one metre, because that is what they are for.
   */
  /* The ground is rebuilt when the building changes size, so how it looks
     cannot live only in applyTheme - it would be repainted white on the next
     rebuild. One function, called from both. */
  function paintGround(){
    const grid = groups.env && groups.env.getObjectByName('groundgrid');
    if(!grid) return;
    const light = document.documentElement.dataset.theme === 'light';
    grid.material.color.set(light ? 0x9aa6b6 : C.grid);
    grid.material.opacity = light ? 0.34 : 0.5;
    grid.material.needsUpdate = true;
  }

  function makeGround(size, cx = 0, cz = 0){
    const old = groups.env.getObjectByName('groundgrid');
    if(old){ groups.env.remove(old); old.geometry.dispose(); old.material.dispose(); }
    const n = Math.max(12, Math.round(size));
    const grid = new THREE.GridHelper(n, n, 0xffffff, 0xffffff);
    grid.material.transparent = true; grid.material.opacity = 0.5;
    grid.material.color.set(C.grid);
    grid.position.set(Math.round(cx), -0.002, Math.round(cz));
    grid.name = 'groundgrid';
    grid.visible = groundVisible;
    groups.env.add(grid);
    paintGround();
    return grid;
  }
  let groundVisible = true, groundKey = '';
  /** Re-laid only when the building has actually changed size or moved. */
  function fitGround(box){
    const c = box.getCenter(_gc), sz = box.getSize(_gs);
    const size = Math.max(24, Math.ceil(Math.max(sz.x, sz.z) * 2.2));
    const key = `${size}|${Math.round(c.x)}|${Math.round(c.z)}`;
    if(key === groundKey) return;
    groundKey = key;
    makeGround(size, c.x, c.z);
  }
  const _gc = new THREE.Vector3(), _gs = new THREE.Vector3();

  function buildEnvironment(){
    const hemi = new THREE.HemisphereLight(0xdfe8f5, 0x2a3240, 2.1);
    const dir  = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(24, 40, 18);
    dir.shadow.mapSize.set(2048, 2048);
    const fill = new THREE.DirectionalLight(0xbcd0e8, 0.5);
    fill.position.set(-20, 12, -16);
    // the target has to be IN the graph, or moving it does nothing: three reads
    // its world matrix, and an object outside the scene never gets one
    groups.env.add(hemi, dir, dir.target, fill);
    groups.env.userData.sun = dir;
    fitShadow();

    makeGround(60);

    const ax = new THREE.Group();
    const mkAxis = (v, col) => {
      const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), v]);
      return new THREE.Line(g, new THREE.LineBasicMaterial({ color:col }));
    };
    ax.add(mkAxis(new THREE.Vector3(2.4,0,0), 0xf2645a));
    ax.add(mkAxis(new THREE.Vector3(0,2.4,0), 0x4ec98b));
    ax.add(mkAxis(new THREE.Vector3(0,0,2.4), 0x4da3ff));
    ax.name = 'triad';
    groups.env.add(ax);
  }

  /* Context loss is a documented, reproducible problem for 3D canvases inside
     iframes on external portals - exactly our WordPress case. All model state
     lives in plain JS objects, so a full rebuild is cheap and loses nothing. */
  function bindContextLoss(){
    canvas.addEventListener('webglcontextlost', e => {
      e.preventDefault();                                  // without this, restore never fires
      stop();
      Bus.emit('gl:lost');
    }, false);
    canvas.addEventListener('webglcontextrestored', () => {
      disposeCaches();
      buildEnvironment();
      applyTheme();
      Bus.emit('gl:restored');
      rebuildAll();
      start();
    }, false);
  }

  function disposeCaches(){
    for(const g of geoCache.values()) g.dispose();
    for(const m of matCache.values()) m.dispose();
    geoCache.clear(); matCache.clear();
  }
  /* `deep` walks into wrappers. A group whose children are themselves groups -
     an imported drawing carrying its own transform, say - would otherwise
     leave every mesh inside it allocated. */
  /**
   * What the browser actually handed back, as opposed to what was asked for.
   *
   * Rendering faults that appear on one machine and not another are almost
   * always this: a different GPU, a different depth format, a different number
   * of samples. Guessing at it from a screenshot is slow and usually wrong, so
   * the numbers are on screen, in About.
   */
  /* --- diagnostics ---------------------------------------------------------
     Switches a reader can turn on to find out which suspect is responsible for
     a rendering fault, without anyone having to guess from a screenshot. They
     do nothing unless the panel is open, and the panel does nothing unless it
     is asked for. */
  const diag = { on:false, polyOffset:false, outerOnly:false, noEdges:false,
                 halfDepth:false, forceDpr:0 };

  /**
   * Can this machine keep two surfaces `mm` millimetres apart in the right
   * order, at the depth range currently in use?
   *
   * The question every theory about this fault has turned on, asked of the
   * hardware directly instead of inferred from arithmetic. Two quads are drawn
   * into a small off-screen target at the same place, the second `mm` closer;
   * if the depth buffer can tell them apart, every pixel comes back the second
   * quad's colour. Where it cannot, the two interleave and the read-back is a
   * mixture - which is z-fighting, in miniature, measured rather than argued
   * about.
   *
   * Walks down from 100 mm and returns the smallest separation that still
   * comes back clean.
   */
  function depthProbe(){
    if(!renderer || !camera || !canvas) return null;
    const gl = renderer.getContext();
    const bits = gl.getParameter(gl.DEPTH_BITS);
    const range = camera.far - camera.near;
    const isOrtho = !!camera.isOrthographicCamera;

    /* Into the CANVAS, not an off-screen target: a render target three.js
       allocates gets 24-bit depth whatever the canvas has, so probing one
       would measure the wrong buffer and cheerfully report that all is well.
       Nothing composites in the middle of a task, so the reader never sees
       this; the real frame is redrawn before the function returns. */
    const sc = new THREE.Scene();
    /* Measure where the MODEL is, not at the midpoint of the range. In
       perspective almost all the precision sits just past the near plane, so
       an answer from the wrong distance is not an answer. */
    const bx = bounds();
    camera.updateMatrixWorld();
    const em = camera.matrixWorld.elements;
    const fwd = [-em[8], -em[9], -em[10]], pos = [em[12], em[13], em[14]];
    const ctr = bx.getCenter(new THREE.Vector3());
    let mid = (ctr.x-pos[0])*fwd[0] + (ctr.y-pos[1])*fwd[1] + (ctr.z-pos[2])*fwd[2];
    if(!(mid > camera.near && mid < camera.far)) mid = (camera.near + camera.far)/2;
    const cam = isOrtho
      ? new THREE.OrthographicCamera(-1, 1, 1, -1, camera.near, camera.far)
      : new THREE.PerspectiveCamera(camera.fov, 1, camera.near, camera.far);
    // big enough to fill the view at `mid` in either projection
    const span = isOrtho ? 4 : mid*4;
    const quad = c => new THREE.Mesh(new THREE.PlaneGeometry(span, span),
      new THREE.MeshBasicMaterial({ color:c }));
    const near = quad(0x00ff00), far = quad(0x0000ff);
    /* Draw the NEAR one first. Three sorts opaque objects front-to-back, which
       would make the near quad win every time whether or not the buffer could
       tell them apart - the test would measure draw order and nothing else.
       Drawn in this order, the far quad is rejected while the two are
       distinguishable, and overwrites the moment they are not. */
    near.renderOrder = 0; far.renderOrder = 1;
    sc.add(near, far);

    const W = canvas.width, H = canvas.height;
    const S = Math.min(32, W, H);
    const x0 = (W - S) >> 1, y0 = (H - S) >> 1;
    const buf = new Uint8Array(S*S*4);
    const sorted = renderer.sortObjects;
    renderer.sortObjects = false;

    const steps = [100, 50, 20, 10, 5, 2, 1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01];
    let finest = null;
    try {
      for(const mm of steps){
        near.position.set(0, 0, -mid);
        far.position.set(0, 0, -mid - mm/1000);
        renderer.setRenderTarget(null);
        renderer.clear(true, true, true);
        renderer.render(sc, cam);
        gl.readPixels(x0, y0, S, S, gl.RGBA, gl.UNSIGNED_BYTE, buf);
        // the far quad showing through at all means the two have tied
        let tied = 0;
        for(let i = 0; i < S*S; i++) if(buf[i*4+2] > buf[i*4+1]) tied++;
        if(tied > S*S*0.01) break;
        finest = mm;
      }
    } catch(e){ finest = null; }

    renderer.sortObjects = sorted;
    near.geometry.dispose(); near.material.dispose();
    far.geometry.dispose(); far.material.dispose();
    renderNow();                      // put the real picture back, same task

    /* What the arithmetic says it ought to be, at the distance measured:
       linear for an orthographic camera, hyperbolic for a perspective one. */
    const theory = isOrtho ? range/2**bits
      : mid*mid*range/(camera.far*camera.near*2**bits);
    return { finestMm:finest, range:+range.toFixed(1), bits,
             camera:isOrtho ? 'parallel' : 'perspective',
             atMetres:+mid.toFixed(1), near:+camera.near.toFixed(3),
             theoryMm:+(theory*1000).toFixed(4) };
  }

  function glInfo(){
    if(!renderer) return null;
    const gl = renderer.getContext();
    let name = gl.getParameter(gl.RENDERER);
    try {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if(dbg) name = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);

             webgl: renderer.capabilities.isWebGL2 ? 2 : 1,
             depthBits: gl.getParameter(gl.DEPTH_BITS),
             stencilBits: gl.getParameter(gl.STENCIL_BITS),
             samples: gl.getParameter(gl.SAMPLES),
             pixelRatio: renderer.getPixelRatio(),
             // the camera that is DRAWING, not whichever one happens to exist

             near: camera ? +camera.near.toFixed(3) : null,
             depthRange: camera ? +(camera.far - camera.near).toFixed(1) : null };
  }

  function clearGroup(g, deep){
    for(let i = g.children.length-1; i >= 0; i--){
      const c = g.children[i];
      const drop = o => {
        if(o.geometry && !geoCache.has(o.geometry.uuid)) o.geometry.dispose?.();
        if(o.material && !matCache.has(o.material.uuid))
          (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose?.());
      };
      if(deep) c.traverse(drop); else drop(c);
      g.remove(c);
    }
  }

  function resize(){
    if(!renderer || !stage) return;
    const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
    renderer.setSize(w, h, false);
    labelRenderer.setSize(w, h);
    persp.aspect = (w/h)*aspectScale; persp.updateProjectionMatrix();
    fitOrtho(w/h);
    updateDepthRange();
    scene.traverse(o => { if(o.material && o.material.isLineMaterial) o.material.resolution.set(w,h); });
    dirty = true;
    // setSize cleared the buffer; draw before the browser gets a chance to show it
    if(camera && !inRender) renderNow();
  }

  /**
   * While the pointer is down, draw at one device pixel per CSS pixel and hide
   * the label layer. On a HiDPI screen full resolution is four times the
   * fragments, and in X-ray - translucent, depth-write off, so nothing is
   * rejected early - that is the difference between a smooth orbit and a
   * stuttering one. Both are restored the instant the drag ends.
   */
  let interacting = false, fullPixelRatio = 1, restoreTimer = null;

  /**
   * Changing the pixel ratio resizes the drawing buffer, and a resize CLEARS it.
   * Leaving the redraw to the next animation frame lets the browser composite an
   * empty canvas first, so the draw has to happen here, in the same task.

  function applyRatio(v){

  /**
   * Only a SUSTAINED gesture is worth dropping resolution for.
   *

   * wheel event, so acting on them literally reallocated the drawing buffer
   * twice per notch of the scroll wheel - measured at 120 reallocations for 30
   * notches. Reallocating is what the eye sees as flashing, and it is worth
   * nothing on a gesture that is already over.
   *
   * So the drop waits: if the pointer is still down after a moment, the gesture
   * is a real orbit and the resolution comes down once. A wheel notch, a click,
   * a tap - anything finished inside that moment - never resizes at all.
   */
  const HOLD_MS = 110, RESTORE_MS = 220;
  let holdTimer = null;
  function setInteracting(v){
    if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
    if(restoreTimer){ clearTimeout(restoreTimer); restoreTimer = null; }
    if(v){
      if(interacting) return;
      holdTimer = setTimeout(() => {
        holdTimer = null;
        interacting = true;
        if(countLabels() > LBL_LIVE_MAX){
          lblSuspended = true;
          labelRenderer.domElement.style.visibility = 'hidden';
        }
        applyRatio(1);
      }, HOLD_MS);
      return;
    }
    if(!interacting) return;               // the gesture ended before it counted
    restoreTimer = setTimeout(() => {
      restoreTimer = null;
      interacting = false;
      if(lblSuspended){ lblSuspended = false; labelRenderer.domElement.style.visibility = ''; }
      lastBudget = 0;                      // force one re-budget on release
      applyRatio(fullPixelRatio);

  }

  function start(){ if(!raf && !disposed) raf = requestAnimationFrame(tick); }
  function stop(){ if(raf){ cancelAnimationFrame(raf); raf = null; } }
  function tick(){

    const moved = controls.update();
    if(dirty || moved){ renderNow(); dirty = false; }
    raf = requestAnimationFrame(tick);
  }
  /** Something else may want to take over drawing - the side-by-side compare
      renders two scenes into scissor regions. It returns true when it has. */
  let renderHook = null;
  /* Labels are DOM. Every frame CSS2DRenderer writes a transform on each one and
     budgetLabels writes a display, and the browser must recompute style for all of
     it - which is most of the cost of an orbit frame, on a model whose geometry is
     only a few thousand triangles. While the camera is actually moving the labels
     are unreadable anyway, so the whole pipeline is suspended and resumed on
     release. When it is running, it is throttled: label positions do not need
     re-budgeting sixty times a second. */
  const LBL_MS = 100;
  let lastBudget = 0, inRender = false;
  /* ...but blanking it is only worth doing when there ARE enough labels for it
     to cost anything. A student's building carries a couple of dozen: hiding
     those saves nothing measurable (232.8 ms against 230.2 ms a frame, shaded)
     and costs a visible blink at the start and end of every gesture - and
     people orbit in a series of short nudges, so the blink repeats. Above the
     threshold the trade turns the other way and the layer goes. */
  const LBL_LIVE_MAX = 150;
  let lblSuspended = false;
  const countLabels = () => {
    let n = 0; (groups.ref || scene).traverse(o => { if(o.isCSS2DObject) n++; });
    return n;
  };
  function renderNow(){
    if(inRender) return;                    // resize() may draw, and drawing may resize
    inRender = true;
    try { renderFrame(); } finally { inRender = false; }
  }
  function renderFrame(){
    updateDepthRange();

    if(lblSuspended) return;
    labelRenderer.render(scene, camera);
    /* Labels follow the model through a gesture, but the decision about WHICH
       of them to show is not retaken while the camera is moving. Re-deciding
       ten times a second on a moving camera is how a label ends up blinking;
       whatever was on screen when the drag began stays on screen, and the
       budget is retaken once, on release. */
    if(interacting) return;
    const t = performance.now();
    if(t - lastBudget >= LBL_MS){ lastBudget = t; budgetLabels(); }
  }
  const invalidate = () => { dirty = true; start(); };

  /* --- orthographic view ---------------------------------------------------
     An axonometric with parallel projection is how construction is drawn, so
     it is the default here. The frustum is kept in step with the model size
     and the perspective camera's distance, so switching between the two does
     not change how big the building looks. */
  let orthoZoom = 12;
  /* The comparison view draws two scenes into half-width scissor regions. The
     camera is shared, so its frustum has to be narrowed to match the pane it is
     drawn into - otherwise both models are squashed to half their width. */
  let aspectScale = 1;
  function fitOrtho(aspect){
    const a = (aspect || ((stage?.clientWidth || 1)/(stage?.clientHeight || 1)))*aspectScale;
    ortho.left = -orthoZoom*a; ortho.right = orthoZoom*a;
    ortho.top = orthoZoom; ortho.bottom = -orthoZoom;
    ortho.updateProjectionMatrix();
  }
  /**
   * `orthoZoom` is a half-HEIGHT, so sizing it from the model diagonal alone
   * lets a wide building run off the sides of a tall, narrow viewport - a
   * phone held upright, or a short WordPress iframe. Project the bounding box
   * into camera space and take whichever of the two extents binds.
   */
  function fitOrthoTo(box, pad){
    if(camMode !== 'ortho') return;
    const a = ((stage?.clientWidth || 1)/(stage?.clientHeight || 1))*aspectScale;
    ortho.updateMatrixWorld(true);
    const inv = new THREE.Matrix4().copy(ortho.matrixWorld).invert();
    const ctr = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
    const v = new THREE.Vector3();
    let mx = 0, my = 0;
    for(let i = 0; i < 8; i++){
      v.set(ctr.x + ((i & 1) ? 0.5 : -0.5)*sz.x,
            ctr.y + ((i & 2) ? 0.5 : -0.5)*sz.y,
            ctr.z + ((i & 4) ? 0.5 : -0.5)*sz.z).applyMatrix4(inv);
      mx = Math.max(mx, Math.abs(v.x)); my = Math.max(my, Math.abs(v.y));
    }
    orthoZoom = Math.max(my, mx/a, 0.5)*pad;
    fitOrtho();          // no argument: fitOrtho applies aspectScale itself
    updateDepthRange();

  }
  function setCamera(mode){
    if(mode === camMode) return;
    const from = camera;
    camMode = mode;
    camera = mode === 'ortho' ? ortho : persp;
    camera.position.copy(from.position);
    camera.up.copy(from.up);
    camera.lookAt(controls.target);
    if(mode === 'ortho'){
      orthoZoom = from.position.distanceTo(controls.target)*Math.tan(persp.fov*Math.PI/360);
      fitOrtho();
    }
    controls.object = camera;
    controls.update();
    invalidate();
  }
  function setOnScreen(v){ onScreen = v; if(v) start(); else stop(); }

  /* --- camera helpers ----------------------------------------------------- */
  /**
   * An orthographic camera spreads its depth buffer evenly over near..far, so a
   * range chosen once and never revisited sets the precision for every frame.
   * The default here was -2000..4000 - six thousand units for a building twenty
   * metres across, which is about a third of a millimetre of depth resolution.
   * A wall build-up stacks layers one millimetre thick, so neighbouring leaves
   * were within a few depth steps of each other and swapped places as the
   * camera turned. That is the tearing.
   *
   * Fitting the range to what is actually on screen is a hundredfold gain and
   * costs eight point transforms. Symmetric about the orbit target, so it stays
   * correct through any rotation without being recomputed.
   */
  const _dp = new THREE.Vector3(), _dbox = new THREE.Box3();
  function updateDepthRange(){
    if(!camera) return;
    /* near and far are measured from the CAMERA, along the way it is looking -
       not from the orbit target the camera swings around. Getting that wrong
       clips the entire model away, which is a silent and total failure: the
       viewport goes empty and every scene-graph test still passes.
       Depth of a point is therefore its distance along the camera's forward
       axis, which is the third column of the camera's world matrix, negated. */
    camera.updateMatrixWorld();
    const e = camera.matrixWorld.elements;
    const fx = -e[8], fy = -e[9], fz = -e[10];
    const px = e[12], py = e[13], pz = e[14];
    const d = (x, y, z) => (x-px)*fx + (y-py)*fy + (z-pz)*fz;

    const box = bounds();
    fitShadow(box);           // same box, and it only does work when it changed
    fitGround(box);           // likewise - and it is why the near plane can be near

    /* Everything that must not be clipped, which is more than the model:
       the ground grid, an imported plan, the load-path arrows. bounds() is
       deliberately the model alone - it decides FRAMING, and framing the view
       to a 120 m grid would be wrong - so the depth fit widens it here. */
    _dbox.copy(box);
    for(const k of ['env', 'underlay', 'loads', 'overlay']){
      const g = groups[k];
      if(g && g.visible && g.children.length) _dbox.expandByObject(g);
    }
    const mn = _dbox.min, mx = _dbox.max;
    let lo = Infinity, hi = -Infinity;
    const see = v => { if(v < lo) lo = v; if(v > hi) hi = v; };
    for(let i = 0; i < 8; i++)
      see(d(i & 1 ? mx.x : mn.x, i & 2 ? mx.y : mn.y, i & 4 ? mx.z : mn.z));
    /* Labels carry no geometry, so bounds() cannot see them - and a grid bubble
       stands further out than anything it annotates. Clip one and it vanishes
       from the DOM entirely. */
    scene.traverse(o => {
      if(o.isCSS2DObject){ o.getWorldPosition(_dp); see(d(_dp.x, _dp.y, _dp.z)); }
    });
    if(!isFinite(lo)) return;

    /* A margin so nothing sits exactly on a plane, and so a small camera move
       between one fit and the next cannot push anything through it. */
    const pad = Math.max(1, (hi - lo) * 0.15);

    if(camera.isOrthographicCamera){
      camera.near = lo - pad; camera.far = hi + pad;
    } else {
      /* Perspective depth is hyperbolic: a step at distance z is about
         z² / (near · 2^bits), so nearly the whole buffer is spent just past
         the near plane and the only lever that matters is how far out that
         plane sits. It used to be 0.02 m whatever the building, which left
         10 to 35 mm per step where the walls actually are - against build-up
         layers of 1 and 12 mm. The buffer could not say which leaf was in
         front, and the answer changed as the camera moved. That was the
         hatching, and it was in perspective only because the fit below was
         written for the orthographic camera and returned early for this one.

         Pulling the near plane up to the nearest thing on screen is three
         orders of magnitude. It is safe to hug it this closely because this
         runs every frame, before the frame that would have clipped. */
      /* The margin has to be a FRACTION of the near distance, not the fixed
         pad the orthographic camera uses. The ground grid is 120 m across, so
         its near corner sits far in front of the building - subtract an
         additive pad sized from that whole span and the near plane lands at
         zero, which is precisely the case being fixed. Ten per cent of the
         nearest thing is scale-free and keeps the plane where the precision
         is. */
      camera.near = Math.max(0.05, lo * 0.9);
      camera.far = Math.max(camera.near + 1, hi + pad);
    }
    if(diag.halfDepth){                       // a diagnostic switch, not a setting
      const m = (camera.near + camera.far)/2, h2 = (camera.far - camera.near)/4;
      camera.near = camera.isOrthographicCamera ? m - h2 : Math.max(0.05, m - h2);
      camera.far = m + h2;
    }
    camera.updateProjectionMatrix();
  }

  /**
   * Fits the sun's shadow camera to the model.
   *
   * A shadow map is a depth picture taken from the light, and a surface is in
   * shadow when it is further from the light than that picture says. Spread
   * 1024 pixels over the 120 metres this used to cover and each pixel stands
   * for twelve centimetres of building - so a wall compares itself against a
   * depth measured twelve centimetres away and decides, in stripes, that it is
   * in its own shadow. That is the dark hatching that appeared across the
   * walls in Realistic and crawled as the camera turned.
   *
   * Three things fix it together: cover the building rather than a field
   * around it, take the picture at 2048 rather than 1024, and offset the
   * comparison by what one texel is still worth. The first two are worth about
   * seven times between them; the bias absorbs the rest.

  const _shC = new THREE.Vector3(), _shS = new THREE.Vector3(), _shD = new THREE.Vector3();

    const b = box || bounds();
    const key = `${b.min.x},${b.min.y},${b.min.z},${b.max.x},${b.max.y},${b.max.z}`;
    if(key === _shKey) return;                    // the model has not moved
    _shKey = key;

    const c = b.getCenter(_shC);
    const r = Math.max(4, b.getSize(_shS).length()/2 * 1.06);
    // keep the direction the light came from, stand it off far enough to clear
    _shD.copy(sun.position).sub(sun.target.position);
    if(_shD.lengthSq() < 1e-6) _shD.set(24, 40, 18);
    _shD.normalize();
    sun.target.position.copy(c);
    sun.target.updateMatrixWorld();
    sun.position.copy(c).addScaledVector(_shD, r*2.6);
    sun.updateMatrixWorld();

    const cam = sun.shadow.camera;
    cam.left = -r; cam.right = r; cam.top = r; cam.bottom = -r;
    cam.near = r*0.4; cam.far = r*5;
    cam.updateProjectionMatrix();

    // one texel of the map, in metres - the scale the bias has to work at
    const texel = (2*r) / sun.shadow.mapSize.width;
    sun.shadow.normalBias = Math.max(0.015, texel*2.2);
    sun.shadow.bias = -Math.min(0.0008, texel*0.0004);
    sun.shadow.needsUpdate = true;
  }

  function bounds(){
    const box = new THREE.Box3();
    for(const k of ['build','ref','context']){
      const g = groups[k];
      if(g.children.length) box.expandByObject(g);
    }
    if(box.isEmpty()) box.set(new THREE.Vector3(-6,0,-6), new THREE.Vector3(6,6,6));
    return box;
  }
  function fit(pad = 1.35){
    // The ResizeObserver fires asynchronously, so a fit requested straight
    // after a layout change (rotating a phone, an iframe being resized) would
    // otherwise be computed against the previous aspect ratio.
    resize();
    const box = bounds();
    const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
    modelDiag = Math.max(size.length(), 2);
    const dist = (modelDiag*pad) / (2*Math.tan(persp.fov*Math.PI/360));
    const dirv = camera.position.clone().sub(controls.target).normalize();
    if(!isFinite(dirv.x) || dirv.lengthSq() < 1e-6) dirv.set(0.7, 0.55, 0.85).normalize();
    controls.target.copy(ctr);
