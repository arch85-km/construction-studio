        el('button', { class:'btn ghost sm', title:'Remove this import',
          onclick:() => remove(u.id) }, ['Remove'])
      ]));
      item.appendChild(UI.row('Position', el('div', { class:'pair' }, [
        UI.num(T.x, v => set('x', v), { step:0.1 }),
        el('span', { class:'x', text:'×' }),
        UI.num(T.z, v => set('z', v), { step:0.1 })]), 'm', 'east × north from the model origin'));
      item.appendChild(UI.row('Height', UI.num(T.y, v => set('y', v), { step:0.1 }), 'm',
        'lift it to trace an upper floor'));
      item.appendChild(UI.row('Rotation',
        UI.num(T.rot || 0, v => set('rot', v), { min:-180, max:180, step:1 }), '°'));
      item.appendChild(UI.row('Size',
        UI.num(Math.round((T.s || 1)*100), v => set('s', Util.clamp(v, 1, 2000)/100),
               { min:1, max:2000, step:1 }), '%',
        T.w ? `${U.fx(T.w*(T.s||1),2)} × ${U.fx((T.h||0)*(T.s||1),2)} m as placed` : null));
      item.appendChild(UI.row('Opacity', UI.slider(u.opacity ?? 0.65, 0.05, 1, 0.05,
        v => setOpacity(u.id, v), v => `${Math.round(v*100)}%`)));
      if(u.kind === 'image') item.appendChild(el('div', { class:'row wide' }, [
        el('button', { class:'btn ghost sm', onclick:() => calibrate(u.id) },
          [icon('i-table'), 'Scale by two known points'])]));
      body.appendChild(item);
    }

    const d = el('details', { class:'card-sect', open:true });
    d.appendChild(el('summary', {}, [icon('i-import'),
      el('span', { class:'t', text:'Imports' }),
      el('span', { class:'s', text:`${list.length} reference${list.length === 1 ? '' : 's'}` })]));
    d.appendChild(body);
    return d;
  }

  return { pick, parseDXF, applyDXF, drawUnderlays, card, refresh, setOpacity,
           moveTool, remove, calibrate, applyXf,
           loadDXF:dxf, loadOBJ:obj, loadImage:image };
})();
/* ==========================================================================
   17  TOUR - the walkthrough, on every launch
   ==========================================================================
   This used to run once per browser and never again, which is wrong for a
   page students arrive at cold each week - and on a shared machine, or a
   lecturer's browser that has already opened it, it meant nobody saw it. So
   it greets everyone, every time, and anyone who does not want it says so
   once: the checkbox in the bubble writes that preference immediately, and
   shows its stored state next time so the decision can be taken back.
   ========================================================================== */
const Tour = (() => {
  const steps = [
    { sel:'#dock', title:'A building is four choices',
      text:'Foundation, walls and structure, floor, roof. Pick a system for each and the whole ' +
           'building rebuilds. Change one and watch what the others have to do about it.' },
    { sel:'#cmd', title:'The grid drives everything',
      text:'Bays, spans and storeys. Every member is sized from the span you set here — widen a ' +
           'bay and the beams get deeper in front of you.' },
    { sel:'#sizing-card', title:'The rule, not just the answer',
      text:'This is the span-to-depth rule doing its work. A 7.5 m composite beam divided by ' +
           '23.5 gives 319 mm, so the app picks an IPE 330. The arithmetic stays on screen.' },
    { sel:'#seg-detail-vp', title:'Three levels of detail',
      text:'<b>Diagram</b> is sticks and planes. <b>Members</b> gives real cross-sections. ' +
           '<b>Full assembly</b> draws every stud, joist and layer of the build-up.' },
    { sel:'#explode-ctl', title:'Take it apart',
      text:'The explode slider lifts each layer clear of the one below, in the order it gets ' +
           'built. This is the exploded axonometric you are asked to draw by hand.' },
    { sel:'#layer-card', title:'Every layer, measured',
      prep(){
        const w = Gen.plans.find(x => x.role === 'wall') ||
                  Gen.plans.find(x => x.buildUp);
        if(w){ Store.select([w.addr]); Dock.mode = 'element'; }
      },
      text:'Click any wall or floor and its build-up is drawn beside the model, with real ' +
           'thicknesses. Change the insulation and the drawing and the 3D model move together.' },
    { sel:'#q-png', title:'Export your work',
      text:'<b>Export image</b> writes a PNG with the labels, a title block and the credit line — ' +
           'ready for a crit board or a report.' }
  ];
  let i = 0, host, spot, bubble;

  function start(){
    host = $('#tour'); spot = host.querySelector('.spot'); bubble = host.querySelector('.bubble');
    i = 0; host.classList.add('open'); render();
    watch(true);
  }

  /* Whether the tour opens by itself. Unset means yes: a reader who has never
     expressed a preference is a reader who has not seen it. */
  const onLaunch = () => IO.prefs().tourOnLaunch !== false;
  function stop(){
    watch(false);
    host.classList.remove('open');
    // hand the app back the way it was found, not mid-demonstration
    Store.clearSelection();
    Dock.mode = 'building';
    LayerDiagram.hide();
  }

  const warned = new Set();

  /**
   * Where the spotlight and the bubble go, for the step already on screen.
   *
   * Separate from render() because it has to be able to run again on its own.
   * The tour measures the element it is pointing at, and a measurement taken
   * once is wrong the moment the viewport changes underneath it - going full
   * screen from a WordPress embed takes the window from 1500 x 760 to
   * 1920 x 1080, and the hole in the dimmed overlay stayed where the dock
   * used to be, over the middle of the model. Everything else in the app
   * re-lays-out on resize; this did not, because nothing asked it to.
   */
  function place(){
    const s = steps[i];
    const t = $(s.sel);
    const r = t && t.getClientRects().length ? t.getBoundingClientRect()
            : { left:innerWidth/2-120, top:innerHeight/2-60, width:240, height:120 };
    const pad = 6;
    const sx = Math.max(0, r.left-pad), sy = Math.max(0, r.top-pad);
    spot.style.left = sx+'px'; spot.style.top = sy+'px';
    spot.style.width = Math.min(r.width+pad*2, innerWidth-sx)+'px';
    spot.style.height = Math.min(r.height+pad*2, innerHeight-sy)+'px';

    /* Clear of the highlighted element, and against the height the bubble
       ACTUALLY has. A guessed height is what leaves a bubble hanging off the
       bottom of a laptop screen. */
    bubble.style.left = '0px'; bubble.style.top = '0px';
    const bb = bubble.getBoundingClientRect();
    const bw = bb.width || 320, bh = bb.height || 210;
    let bx = r.left + r.width + 16, by = r.top;
    if(bx + bw > innerWidth - 12) bx = Math.max(12, r.left - bw - 16);
    if(bx < 12) bx = Math.min(Math.max(12, innerWidth - bw - 12), Math.max(12, r.left));
    if(by + bh > innerHeight - 12) by = Math.max(12, innerHeight - bh - 12);
    bubble.style.left = bx+'px'; bubble.style.top = by+'px';
  }

  /* Re-placing once, on the event, is not enough: the app's own layout is
     still settling when `resize` fires, and a spotlight measured against a
     dock that has not finished moving lands next to it rather than on it.
     Measured going from an embed to full screen, the dock was still 274 px
     short of its final position at the moment of the event.
     So each viewport change opens a short window during which the tour keeps
     re-placing itself, every frame, until the layout stops moving. Idle cost
     is nothing: no event, no frames. */
  const SETTLE_MS = 520;
  let settleUntil = 0, raf = null;
  function replace_(){
    if(!host || !host.classList.contains('open')) return;
    settleUntil = performance.now() + SETTLE_MS;
    if(raf) return;
    const step = () => {
      raf = null;
      if(!host || !host.classList.contains('open')) return;
      place();
      if(performance.now() < settleUntil) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  /* `scroll` in the capture phase catches the dock scrolling under a
     spotlight as well as the window moving. */
  const VIEWPORT_EVENTS = ['resize', 'orientationchange', 'fullscreenchange',
                           'webkitfullscreenchange', 'scroll'];
  function watch(on){
    for(const ev of VIEWPORT_EVENTS){
      const target = ev === 'resize' || ev === 'orientationchange' ? window : document;
      target[on ? 'addEventListener' : 'removeEventListener'](ev, replace_, true);
    }
    if(!on && raf){ cancelAnimationFrame(raf); raf = null; settleUntil = 0; }
  }

  function render(){
    const s = steps[i];
    if(s.prep) try { s.prep(); } catch(e){ /* a demo step must never break the tour */ }
    const t = $(s.sel);
    // A step whose selector matches nothing silently spotlights the middle of the
    // screen, which looks deliberate and hides the mistake. Say so instead.
    if((!t || !t.getClientRects().length) && !warned.has(s.sel)){
      warned.add(s.sel);
      console.warn(`Tour step ${i+1} ("${s.title}") targets ${s.sel}, which is not on screen.`);
    }

    bubble.textContent = '';
    bubble.append(
      el('h4', { text:s.title }),
      el('p', { html:s.text }),
      el('div', { class:'nav' }, [
        el('span', { class:'step', text:`${i+1} / ${steps.length}` }),
        el('button', { class:'btn ghost sm', onclick:stop }, ['Skip']),
        i > 0 ? el('button', { class:'btn ghost sm', onclick:() => { i--; render(); } }, ['Back']) : null,
        el('button', { class:'btn primary sm',
          onclick:() => { if(i === steps.length-1) stop(); else { i++; render(); } } },
          [i === steps.length-1 ? 'Start modelling' : 'Next'])
      ].filter(Boolean)),
      /* On every step, not only the last: someone who wants this gone should
         not have to reach step seven to say so. It takes effect the moment it
         is ticked rather than when the tour closes, so ticking it and then
         closing the tab is enough. And it shows what is stored, because
         starting the tour by hand and unticking it is the way back. */
      el('label', { class:'chk optout' }, [
        el('input', { type:'checkbox', checked:!onLaunch(),
          onchange:e => IO.prefs({ tourOnLaunch: !e.target.checked }) }),
        'Don’t show this on launch'])
    );
    place();
  }

  return { start, stop, place,
           get onLaunch(){ return onLaunch() },
           set onLaunch(v){ IO.prefs({ tourOnLaunch: !!v }); } };
})();

/* ==========================================================================
   18  DOCK - the four part cards, and the property sheet
   ==========================================================================
   The dock is the primary navigation. Not a tree, not a browser - four cards
   reading Foundation, Wall & Structure, Floor, Roof, each showing the chosen
   system, its parameters, and the sizing rule that gave it its dimensions.
   ========================================================================== */
const Dock = (() => {
  let mode = 'building';           // 'building' | 'element'
  let openCard = 'floor';

  function render(){
    const host = UI.dom.dock;
    host.textContent = '';
    if(mode === 'element' && Store.selection.size) host.appendChild(elementSheet());
    else host.appendChild(buildingSheet());
  }

  /* ---------------------------------------------------------------- building */
  function buildingSheet(){
    const doc = Store.doc;
    const wrap = el('div', { class:'dock-scroll' });

    const d = Gen.diag;
    // Notes go ABOVE the part cards. A note explaining that a floor cannot sit
    // on the walls beneath it is the most useful thing on the panel; below four
    // expanded cards it would be off the bottom of the scroll, unread.
    if(d && d.notes && d.notes.length){
      const notes = Util.uniq(d.notes.map(n => n.sev + '|' + n.text));
      wrap.appendChild(el('div', { class:'notes' }, notes.map(n => {
        const [sev, text] = n.split('|');
        return el('div', { class:'note ' + sev, html:Util.esc(text) });
      })));
    }
    if(d && d.orphans && d.orphans.length) wrap.appendChild(orphanCard(d.orphans));

    // the load path, when it is on, above everything - it is about the whole
    // building rather than any one part of it
    const lp = LoadPath.card();
    if(lp) wrap.appendChild(lp);

    // and anything imported, which is a reference the student placed rather
    // than a part the generator made - so it gets its own card, not a slot
    const imp = Import.card();
    if(imp) wrap.appendChild(imp);

    // and the part a note names is flagged, so the panel and the note agree
    const flagged = new Set((d && d.notes || []).filter(n => n.part).map(n => n.part));
    wrap.appendChild(gridCard(doc));
    for(const part of Model.PARTS) wrap.appendChild(partCard(doc, part, flagged.has(part)));
    return wrap;
  }

  function gridCard(doc){
    const g = doc.grid, L = doc.levels;
    const body = el('div', { class:'body' });
    const commit = (fn, tag) => { Store.begin(tag); fn(); Store.touch('grid'); };

    body.appendChild(UI.row('Bays', el('div', { class:'pair' }, [
      UI.num(g.bx, v => commit(() => { g.bx = Util.clamp(Math.round(v),1,10); }, 'Grid'),
             { min:1, max:10, step:1 }),
      el('span', { class:'x', text:'×' }),
      UI.num(g.bz, v => commit(() => { g.bz = Util.clamp(Math.round(v),1,10); }, 'Grid'),
             { min:1, max:10, step:1 })])));
    body.appendChild(UI.row('Span', el('div', { class:'pair' }, [
      UI.num(g.sx, v => commit(() => { g.sx = Util.clamp(v,1.8,30); }, 'Grid'),
             { min:1.8, max:30, step:0.1 }),
      el('span', { class:'x', text:'×' }),
      UI.num(g.sz, v => commit(() => { g.sz = Util.clamp(v,1.8,60); }, 'Grid'),
             { min:1.8, max:60, step:0.1 })]), null, 'metres between grid lines'));
    const slock = Gen.storeyLock(doc);
    body.appendChild(UI.row('Storeys', UI.num(slock ? 1 : L.storeys,
      v => commit(() => { L.storeys = Util.clamp(Math.round(v),1,12); }, 'Levels'),
      { min:1, max:12, step:1, disabled:!!slock, title:slock || null }),
      null, slock || null));
    body.appendChild(UI.row('Storey height', UI.num(L.height,
      v => commit(() => { L.height = Util.clamp(v,2.2,14); }, 'Levels'),
      { min:2.2, max:14, step:0.1 }), null, 'metres, floor to floor'));
    body.appendChild(UI.row('Use', UI.select(
      Object.keys(SIZING.LOADING).map(k => ({ value:k, label:k[0].toUpperCase()+k.slice(1) })),
      doc.use, v => commit(() => { doc.use = v; }, 'Use')), null,
      `${SIZING.LOADING[doc.use]} kN/m² per storey, used to size the columns`));

    const presets = presetGrids(doc);
    if(presets.length) body.appendChild(UI.rowWide(
      el('div', { class:'presets' }, presets.map(([x,z]) =>
        el('button', { class:'btn ghost sm',
          'aria-pressed':String(Math.abs(g.sx-x) < 0.01 && Math.abs(g.sz-z) < 0.01),
          onclick:() => commit(() => { g.sx = x; g.sz = z; }, 'Grid preset') },
          [`${x} × ${z}`])))));

    return card('grid', 'Grid & levels',
      `${g.bx} × ${g.bz} bays · ${U.fx(g.sx,1)} × ${U.fx(g.sz,1)} m · ${slock ? 1 : L.storeys} storeys`,
      body, 'i-grid');
  }

  /** The grids the chosen systems actually like. */
  function presetGrids(doc){
    const seen = new Set(), out = [];
    for(const part of Model.PARTS){
      const s = SYSTEMS[doc.slots[part].sys];
      for(const p of (s && s.grid && s.grid.presets) || []){
        const k = p.join('x');
        if(!seen.has(k)){ seen.add(k); out.push(p); }
      }
    }
    return out.slice(0, 6);
  }

  function partCard(doc, part, alert){
    const slot = doc.slots[part];
    const sys = SYSTEMS[slot.sys];
    const body = el('div', { class:'body' });
    if(!sys){ body.appendChild(UI.empty('No system chosen.')); return card(part, Model.PART_LABEL[part], '—', body); }

    body.appendChild(el('div', { class:'syshead' }, [
      el('span', { class:'swatch ' + sys.material }),
      el('div', { class:'sysname' }, [
        el('b', { text:sys.name || sys.label }),
        el('span', { class:'blurb', text:sys.blurb || '' })]),
      el('button', { class:'btn ghost sm', onclick:() => picker(part) }, ['Change'])
    ]));

    const locked = lockedBy(doc, part);
    if(locked) body.appendChild(el('div', { class:'note info',
      html:`Chosen automatically with <b>${Util.esc(SYSTEMS[locked].label)}</b> — the two are one structure.` }));

    // Say it on the card that caused it, not only on the field it disabled.
    if(part === 'vertical' && sys.singleStorey) body.appendChild(
      el('div', { class:'note info', text:Gen.storeyLock(doc) }));

    for(const q of sys.params || []) body.appendChild(paramRow(doc, part, sys, q));

    const z = sizingFor(doc, part);
    if(z) body.appendChild(sizingCard(z, part));

    if(sys.buildUp) body.appendChild(el('div', { class:'row wide' }, [
      el('button', { class:'btn ghost sm', onclick:() => { LayerDiagram.show(sys.buildUp, overridesFor(doc, part)); } },
        [icon('i-table'), `Build-up — ${Math.round(buildUpTotal(sys.buildUp, overridesFor(doc, part)))} mm`])]));

    return card(part, Model.PART_LABEL[part], sys.label, body,
                { foundation:'i-footing', groundFloor:'i-slab', vertical:'i-wall', floor:'i-slab', roof:'i-beam' }[part],
                sys.material, alert);
  }

  const lockedBy = (doc, part) => {
    for(const p of Model.PARTS){
      const s = SYSTEMS[doc.slots[p].sys];
      if(s && s.implies && s.implies[part]) return s.id;
    }
    return null;
  };

  function overridesFor(doc, part){
    const sys = SYSTEMS[doc.slots[part].sys];
    if(!sys) return {};
    const p = paramsOf(doc, part);
    // parameters whose key matches a build-up layer key drive that layer live
    const B = BUILDUPS[sys.buildUp];
    if(!B) return {};
    const out = {};
    for(const l of B.layers) if(p[l.k] !== undefined) out[l.k] = p[l.k];
    // and the structural layer follows whatever the sizing rule produced
    const z = sizingFor(doc, part);
    if(z && z.depth) out.struct = z.depth;
    if(p.thk) out.struct = p.thk;
    if(p.slabDepth) out.slab = p.slabDepth;
    if(p.insul) out.insul = p.insul;
    if(p.topping) out.topping = p.topping;
    return out;
  }

  function paramsOf(doc, part){
    const sys = SYSTEMS[doc.slots[part].sys];
    const p = {};
    for(const q of (sys && sys.params) || [])
      p[q.k] = doc.slots[part].p[q.k] !== undefined ? doc.slots[part].p[q.k] : q.def;
    return p;
  }

  /** Auto span direction is only honest if it says which way it resolved. */
  function hintFor(doc, q, cur){
    if(q.k !== 'spanDir' || cur !== 'auto') return null;
    const g = Model.makeGrid(doc.grid);
    return `spanning ${g.shortDir.toUpperCase()} — the short direction, ` +
           `${U.fx(g.maxStep(g.shortDir), 2)} m`;
  }

  function paramRow(doc, part, sys, q){
    const cur = doc.slots[part].p[q.k] !== undefined ? doc.slots[part].p[q.k] : q.def;
    const set = v => { Store.begin('Set ' + q.label); doc.slots[part].p[q.k] = v; Store.touch('param'); };
    let ctrl;
    if(q.type === 'check')      ctrl = UI.check(q.label, cur, set);
    else if(q.type === 'seg')   ctrl = UI.seg(q.opts, cur, set);
    else if(q.type === 'select')ctrl = UI.select(q.opts, cur, set);
    else                        ctrl = UI.num(cur, set, { min:q.min, max:q.max, step:q.step });
    if(q.type === 'check') return UI.rowWide(ctrl);
    // A dropdown's options are self-describing; everything else takes the
    // unit as a suffix, so "Joist centres [400|450|600] mm" reads as one line.
    const unit = q.type === 'select' ? null : q.unit;
    return UI.row(q.label, ctrl, unit, hintFor(doc, q, cur));
  }

  /* --- the sizing readout, the whole point of the app ---------------------- */
  function sizingFor(doc, part){
    const sys = SYSTEMS[doc.slots[part].sys];
    if(!sys || !sys.sizing) return null;
    // the most telling plan this system produced: the one with a formula
    const mine = Gen.plans.filter(p => p.system === sys.id && p.meta && p.meta.formula);
    if(!mine.length) return null;
    const rank = { secondary:0, joist:0, panel:0, plank:0, slab:1, primary:2, truss:0,
                   rafter:0, wall:0, column:3, pad:0, strip:0, raft:0 };
    // Within the chosen role, show the member that GOVERNS. Columns are sized one
    // by one from their own tributary area, so without this the readout reports a
    // corner column - a quarter bay - which is the least of them, not the size the
    // student needs to see.
    const worst = m => m.meta.N ?? m.meta.depth ?? 0;
    mine.sort((a,b) => (rank[a.role] ?? 5) - (rank[b.role] ?? 5) || worst(b) - worst(a));
    return mine[0].meta;
  }

  function sizingCard(z, part){
    const box = el('div', { class:'sizing ' + z.status, id: part === 'floor' ? 'sizing-card' : null }, [
      el('div', { class:'head' }, [
        el('span', { class:'ttl', text:z.label || 'Sizing' }),
        UI.statusChip(z.status)]),
      el('div', { class:'formula', text:z.formula }),
      z.rule ? el('div', { class:'rule', html:'rule: ' + Util.esc(z.rule) }) : null,
      z.advice ? el('div', { class:'advice', text:z.advice }) : null,
      z.note ? el('div', { class:'foot', html:Util.esc(z.note) }) : null
    ].filter(Boolean));
    if(z.status === 'over' || z.status === 'under'){
      const span = Store.doc.grid.sx > Store.doc.grid.sz ? Store.doc.grid.sx : Store.doc.grid.sz;
      const alt = suggestFor(part, span).filter(s => s.id !== Store.doc.slots[part].sys).slice(0,3);
      if(alt.length) box.appendChild(el('div', { class:'alts' },
        [el('span', { text:'or try ' })].concat(alt.map(s =>
          el('button', { class:'link', onclick:() => choose(part, s.id) }, [s.label])))));
    }
    return box;
  }

  function orphanCard(orphans){
    const doc = Store.doc;
    const body = el('div', { class:'body' }, [
      UI.explain('These changes were made to elements that no longer exist — a bay was removed, ' +
        'or a system was swapped. They are kept so an undo brings them back.'),
      el('ul', { class:'orphans' }, orphans.slice(0,8).map(a =>
        el('li', { text:Gen.describe(a, doc.edits[a] || {}) }))),
      el('div', { class:'row wide' }, [
        el('button', { class:'btn ghost sm', onclick:() => {
          Store.checkpoint('Discard stale changes');
          for(const a of orphans) delete doc.edits[a];
          Store.touch('edits');
        } }, ['Discard them'])])
    ]);
    return card('orphans', `${orphans.length} change${orphans.length>1?'s no longer apply':' no longer applies'}`,
                '', body, 'i-trash', null, true);
  }

  /* --- the system picker ---------------------------------------------------- */
  function picker(part){
    const doc = Store.doc;
    let filter = 'all';
    const grid = el('div', { class:'cards' });
    const vert = SYSTEMS[doc.slots.vertical.sys];
    const span = Math.max(doc.grid.sx, doc.grid.sz);

    function paint(){
      grid.textContent = '';
      for(const s of SYS_BY_PART[part]){
        if(filter !== 'all' && s.material !== filter) continue;
        const c = part === 'foundation' || part === 'vertical'
                ? { ok:true } : compatible(vert, s);
        const fits = !s.span || (span >= s.span.min && span <= s.span.max);
        const chosen = s.id === doc.slots[part].sys;
        grid.appendChild(el('button', {
          class:'card sys' + (c.ok ? '' : ' dim') + (chosen ? ' on' : ''),
          onclick:() => { UI.close(); choose(part, s.id); } }, [
          el('div', { class:'top' }, [
            el('span', { class:'swatch ' + s.material }),
            el('h5', { text:s.label }),
            s.tectonic ? el('span', { class:'tect', text:s.tectonic }) : null ].filter(Boolean)),
          el('p', { text:s.blurb || '' }),
          s.span ? spanBar(s, span) : null,
          c.ok ? (fits ? null : el('div', { class:'why warn',
                   text:`Outside its usual span range of ${s.span.min}–${s.span.max} m.` }))
               : el('div', { class:'why', text:c.why })
        ].filter(Boolean)));
      }
    }
    paint();

    UI.modal({
      title:`${Model.PART_LABEL[part]} — choose a system`,
      sub:`current span ${U.fx(span,1)} m`, wide:true,
      body:[
        el('div', { class:'filters' }, ['all'].concat(LIB.families).map(f =>
          el('button', { class:'btn ghost sm', 'aria-pressed':String(f === filter),
            onclick:e => { filter = f;
              [...e.currentTarget.parentNode.children].forEach(c => c.setAttribute('aria-pressed','false'));
              e.currentTarget.setAttribute('aria-pressed','true'); paint(); } },
            [f === 'all' ? 'All materials' : LIB.familyLabel[f]]))),
        UI.explain('Systems that will not sit on what you have chosen below are shown dimmed, ' +
          'with the reason. Seeing why something does not work is worth more than not seeing it.'),
        grid
      ],
      footer:[el('button', { class:'btn ghost', onclick:UI.close }, ['Cancel'])]
    });
  }

  /** A little bar showing where the current span sits in a system's range. */
  function spanBar(s, span){
    const lo = s.span.min, hi = s.span.max;
    const pct = v => Util.clamp((v-lo)/(hi-lo)*100, 0, 100);
    return el('div', { class:'spanbar' }, [
      el('div', { class:'track' }, [
        el('div', { class:'ok', style:{ left:pct(s.span.ok[0])+'%',
                                        width:(pct(s.span.ok[1])-pct(s.span.ok[0]))+'%' } }),
        span >= lo && span <= hi
          ? el('div', { class:'now', style:{ left:pct(span)+'%' } }) : null
      ].filter(Boolean)),
      el('div', { class:'ends' }, [
        el('span', { text:lo + ' m' }), el('span', { text:hi + ' m' })])
    ]);
  }

  function choose(part, sysId){
    const doc = Store.doc;
    Store.checkpoint('Change ' + Model.PART_LABEL[part].toLowerCase());
    doc.slots[part] = { sys:sysId, p:{} };
    const s = SYSTEMS[sysId];
    if(s && s.implies) for(const [k, v] of Object.entries(s.implies)) doc.slots[k] = { sys:v, p:{} };
    // adopt the system's preferred grid if the current one is outside its range
    if(s && s.grid && s.grid.presets){
      const span = Math.max(doc.grid.sx, doc.grid.sz);
      if(s.span && (span < s.span.min || span > s.span.max)){
        const [x, z] = s.grid.presets[0];
        doc.grid.sx = x; doc.grid.sz = z;
        UI.toast(`Grid set to ${x} × ${z} m — the span this system is happiest at.`, 'ok', 4500);
      }
    }
    openCard = part;
    Store.touch('system');
  }

  /* -------------------------------------------------------------- element */
  function elementSheet(){
    const addrs = [...Store.selection];
    const a = addrs[0];
    const pl = Realize.planFor(a);
    const wrap = el('div', { class:'dock-scroll' });
    if(!pl){ wrap.appendChild(UI.empty('Nothing selected.')); return wrap; }

    const sys = SYSTEMS[pl.system];
    const sec = pl.sectionId ? LIB.SEC[pl.sectionId] : null;
    const doc = Store.doc;
    const isRepeat = a.includes('#');
    const edit = doc.edits[a] || doc.edits[pl.addr];

    wrap.appendChild(el('div', { class:'crumb' }, [
      el('button', { class:'link', onclick:() => { Store.clearSelection(); } }, ['‹ Building']),
      el('span', { text:` / ${Model.PART_LABEL[pl.part] || 'Connection'} / ${pl.level} / ${pl.label || pl.role}` })
    ]));

    const body = el('div', { class:'body' });
    body.appendChild(el('div', { class:'elhead' }, [
      el('b', { text:sec ? sec.name : (pl.label || pl.role) }),
      pl.mat ? el('span', { text:LIB.MAT[pl.mat] ? LIB.MAT[pl.mat].name : pl.mat }) : null,
      edit ? el('span', { class:'pin', title:'Changed by hand', text:'edited' }) : null,
      pl.manual ? el('span', { class:'pin manual', text:'yours' }) : null
    ].filter(Boolean)));

    // A connection's whole point is the explanation, so it goes first.
    if(pl.how) body.appendChild(el('div', { class:'joint' }, [
      el('div', { class:'jh' }, [icon('i-brace'), el('b', { text:'Why it is like this' })]),
      el('p', { text:pl.how })
    ]));

    if(pl.kind === 'member' || pl.kind === 'run'){
      const L = Math.hypot(pl.b[0]-pl.a[0], pl.b[1]-pl.a[1], pl.b[2]-pl.a[2]);
      body.appendChild(UI.row('Length', el('input', { type:'text', readonly:true, value:`${U.fx(L,3)} m` })));
    }
    if(sec){
      body.appendChild(UI.row('Section', sectionPicker(sec, v => setEdit(a, { sectionId:v }))));
      body.appendChild(el('div', { class:'secfacts' }, [
        el('span', { text:`${Math.round(sec.h*1000)} × ${Math.round(sec.b*1000)} mm` }),
        el('span', { text:`A = ${U.fx(sec.A*1e4,1)} cm²` })]));
    }
    if(pl.meta && pl.meta.formula){
      body.appendChild(el('div', { class:'sizing ' + (pl.meta.status || 'ok') }, [
        el('div', { class:'head' }, [el('span', { class:'ttl', text:'Why this size' }),
                                     UI.statusChip(pl.meta.status || 'ok')]),
        el('div', { class:'formula', text:pl.meta.formula }),
        pl.meta.rule ? el('div', { class:'rule', text:'rule: ' + pl.meta.rule }) : null,
        pl.meta.source ? el('div', { class:'foot', text:pl.meta.source }) : null
      ].filter(Boolean)));
    }

    const acts = el('div', { class:'row wide acts' });
    if(edit) acts.appendChild(el('button', { class:'btn ghost sm', onclick:() => {
      Store.checkpoint('Revert to parametric');
      delete doc.edits[a]; delete doc.edits[pl.addr];
      Store.touch('edits'); } }, ['Revert to parametric']));
    acts.appendChild(el('button', { class:'btn ghost sm', onclick:() => setEdit(a, { del:true }) },
      [icon('i-trash'), 'Delete this one']));
    body.appendChild(acts);

    body.appendChild(UI.explain(
      'Elements follow the parameters. A change here is remembered by <b>where the element is</b>, ' +
      'so it survives you altering the grid — and if its place disappears, the app tells you rather ' +
      'than quietly forgetting.'));

    wrap.appendChild(card('element', sys ? sys.label : 'Element', '', body,
      { foundation:'i-footing', groundFloor:'i-slab', vertical:'i-wall', floor:'i-slab', roof:'i-beam' }[pl.part]));

    if(sys && sys.buildUp && (pl.kind === 'wall' || pl.kind === 'panel'))
      LayerDiagram.show(sys.buildUp, overridesFor(doc, pl.part), a.split('~')[1]);
    return wrap;
  }

  function setEdit(address, patch){
    const doc = Store.doc;
    Store.checkpoint(patch.del ? 'Delete element' : 'Change element');
    doc.edits[address] = Object.assign({}, doc.edits[address], patch);
    if(patch.del) Store.clearSelection();
    Store.touch('edits');
  }

  function sectionPicker(cur, onchange){
    const fam = cur.family2;
    const list = LIB.BY_FAMILY.get(fam) || [];
    return UI.select(list.map(s => ({ value:s.id, label:s.name })), cur.id, onchange);
  }

  /* --- the collapsible card --------------------------------------------- */
  function card(key, title, sub, body, ic, material, alert){
    const open = openCard === key || key === 'element' || alert;
    const d = el('details', { class:'card-sect' + (alert ? ' alert' : ''), open });
    d.appendChild(el('summary', {}, [
      ic ? icon(ic) : null,
      el('span', { class:'t', text:title }),
      material ? el('span', { class:'swatch ' + material }) : null,
      el('span', { class:'s', text:sub })
    ].filter(Boolean)));
    d.appendChild(body);
    d.addEventListener('toggle', () => { if(d.open) openCard = key; });
    return d;
  }

  return { render, picker, choose, overridesFor, get mode(){ return mode },
           set mode(v){ mode = v; render(); },
           overridesFor, paramsOf, sizingFor };
})();

/* ==========================================================================
   19  LAYER DIAGRAM - the build-up drawing, generated from the same data
   ==========================================================================
   This is the drawing students are asked to redraw by hand: a labelled stack
   of layers with a dimension chain and a running total. It is built from the
   same `layers` array that builds the 3D geometry, so the drawing and the
   model cannot disagree. Change the insulation and both move in one frame.
   ========================================================================== */
const LayerDiagram = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  let current = null, currentOver = null;

  const svg = (t, a, kids) => {
    const n = document.createElementNS(NS, t);
    for(const k in (a || {})) if(a[k] != null) n.setAttribute(k, a[k]);
    for(const c of [].concat(kids || [])) if(c) n.appendChild(c);
    return n;
  };
  const HEX = v => '#' + (v >>> 0).toString(16).padStart(6, '0');

  /**
   * A right-anchored label, broken onto a second line if it is too long for
   * the gutter. SVG has no text wrapping, so the split is done here on the
   * last space that fits.
   */
  function wrapped(text, x, cy, limit = 25){
    const t = svg('text', { x, y:cy + 3.2, class:'lab', 'text-anchor':'end' });
    if(text.length <= limit){ t.textContent = text; return t; }
    let cut = text.lastIndexOf(' ', limit);
    if(cut < limit*0.5) cut = limit;
    t.setAttribute('y', cy - 1.4);
    t.appendChild(svg('tspan', { x }, [document.createTextNode(text.slice(0, cut))]));
    t.appendChild(svg('tspan', { x, dy:9.4 },
      [document.createTextNode(text.slice(cut).trim())]));
    return t;
  }

  function show(key, over, activeLayer){
    current = key; currentOver = over || {};
    const host = UI.dom.layerHost;
    if(!host) return;
    const B = BUILDUPS[key];
    host.textContent = '';
    if(!B){ host.hidden = true; return; }
    host.hidden = false;

    const shown = B.layers.filter(l => !l.within);
    const inner = B.layers.filter(l => l.within);
    const t = l => (currentOver[l.k] ?? l.t);
    const total = shown.reduce((s, l) => s + t(l), 0);

    // thickness maps to height, but compressed above 200 mm so a 350 mm
    // services zone does not swamp a 12.5 mm sheet of plasterboard
    const H = l => { const v = t(l); return Math.max(11, v <= 200 ? v*0.42 : 84 + (v-200)*0.09); };
    const rows = shown.map(l => ({ l, h:H(l) }));
    const stackH = rows.reduce((s, r) => s + r.h, 0);
    // The label gutter has to hold the longest name in the catalogue
    // ("Studs at 400 mm centres"), or the text runs off the left of the
    // viewBox. Long names wrap to a second line rather than shrink.
    const LX = 6, LW = 120, DX = LX + LW + 22, RW = 74;
    const DIMX = DX + RW + 6, CHX = DX + RW + 36, W = CHX + 20;

    const g = [];
    let y = 22;
    for(const r of rows){
      const fill = HEX(LAYER_MAT[r.l.mat] ?? 0xcccccc);
      const isVoid = r.l.mat === 'void';
      const cls = 'lyr' + (r.l.struct ? ' struct' : '') + (activeLayer === r.l.k ? ' on' : '');
      const grp = svg('g', { class:cls, 'data-layer':r.l.k });
      grp.appendChild(svg('rect', { x:DX, y, width:74, height:r.h, fill:isVoid ? 'none' : fill,
        stroke:'currentColor', 'stroke-width':r.l.struct ? 1.4 : 0.8,
        'stroke-dasharray':isVoid ? '3 2' : null, 'fill-opacity':isVoid ? 0 : 0.85 }));
      grp.appendChild(svg('line', { x1:DX-16, y1:y + r.h/2, x2:DX, y2:y + r.h/2,
        stroke:'currentColor', 'stroke-width':0.6, opacity:0.4 }));
      grp.appendChild(wrapped(r.l.label, DX-19, y + r.h/2));
      const dim = svg('text', { x:DIMX, y:y + r.h/2 + 3.2, class:'dim' });
      dim.textContent = U.fx(t(r.l), t(r.l) % 1 ? 1 : 0);
      grp.appendChild(dim);
      grp.addEventListener('click', () => Bus.emit('layer:pick',
        { key, sub:r.l.k, label:r.l.label, struct:!!r.l.struct }));
      g.push(grp);
      y += r.h;
    }

    // A bracket beside the structural rows. The heavier outline alone was too
    // quiet to answer the one question the drawing exists to answer: which part
    // of this carries the load?
    let sy = null, ey = null, y2 = 22;
    for(const r of rows){
      if(r.l.struct){ if(sy == null) sy = y2; ey = y2 + r.h; }
      y2 += r.h;
    }
    if(sy != null){
      const bx = DX - 5;
      g.push(svg('path', { class:'sbrk',
        d:`M ${bx+3} ${sy} L ${bx} ${sy} L ${bx} ${ey} L ${bx+3} ${ey}`,
        fill:'none', 'stroke-width':1.6 }));
      const cap = svg('text', { class:'scap', x:bx - 3, y:(sy+ey)/2,
        transform:`rotate(-90 ${bx-3} ${(sy+ey)/2})`, 'text-anchor':'middle' });
      cap.textContent = 'STRUCTURE';
      g.push(cap);
    }

    // the dimension chain down the right
    g.push(svg('line', { x1:CHX + 4, y1:22, x2:CHX + 4, y2:22 + stackH,
      stroke:'currentColor', 'stroke-width':0.8, opacity:0.5 }));
    for(const yy of [22, 22 + stackH])
      g.push(svg('line', { x1:CHX, y1:yy, x2:CHX + 8, y2:yy,
        stroke:'currentColor', 'stroke-width':0.8, opacity:0.5 }));
    const tot = svg('text', { x:CHX, y:22 + stackH/2, class:'tot',
      transform:`rotate(-90 ${CHX} ${22 + stackH/2})`, 'text-anchor':'middle' });
    tot.textContent = `${U.fx(total, total % 1 ? 1 : 0)} mm overall`;
    g.push(tot);

    const head = svg('text', { x:LX, y:13, class:'ttl' });
    head.textContent = B.label;
    g.push(head);

    const root = svg('svg', { viewBox:`0 0 ${W} ${stackH + 40}`, class:'buildup',
      width:'100%', preserveAspectRatio:'xMidYMin meet' }, g);
    host.appendChild(root);

    if(inner.length) host.appendChild(el('div', { class:'within' },
      inner.map(l => el('span', { text:`${l.label} ${U.fx(t(l),0)} mm, within the structure` }))));
    if(shown.some(l => l.struct)) host.appendChild(el('div', { class:'hint',
      html:'The bracketed band is the <b>structure</b> — the part that carries load. ' +
           'Everything else is carried by it.' }));
    host.appendChild(el('div', { class:'hint',
      text:'Click a layer to pick it out in the model.' }));
  }

  function hide(){ const h = UI.dom.layerHost; if(h){ h.hidden = true; h.textContent = ''; } }
  return { show, hide, get current(){ return current } };
})();

/* ==========================================================================
   20  SEQUENCE - watch it go up in the order it is built
   ==========================================================================
   Build order is derived, never written down: sort by level, then by layer
   index, then by a rank for the role. That way it stays right for any
   combination of systems, including ones added later.
   ========================================================================== */
const Seq = (() => {
  const ROLE_RANK = { pad:0, strip:0, raft:0, pile:0, cap:1, column:10, wall:12, core:12,
    plate:14, stud:16, sheath:18, brace:19, primary:20, secondary:22, edge:21,
    joist:24, purlin:25, rib:26, plank:27, panel:27, deck:28, slab:29, drop:30,
    topping:32, cladding:36, truss:40, rafter:41, tie:42, ridge:43, cover:46 };

  let steps = [], at = null, playing = false, timer = null;

  function build(plans, levels){
    const yOf = id => { const l = levels.find(v => v.id === id); return l ? l.y : 0; };
    const sorted = plans.slice().sort((a,b) =>
      yOf(a.level) - yOf(b.level) ||
      (a.layer ?? 3) - (b.layer ?? 3) ||
      (ROLE_RANK[a.role] ?? 50) - (ROLE_RANK[b.role] ?? 50) ||
      String(a.addr).localeCompare(String(b.addr)));

    steps = [];
    let cur = null;
    for(const pl of sorted){
      const key = `${pl.level}|${pl.part}|${pl.role}`;
      if(!cur || cur.key !== key){
        cur = { key, i:steps.length, level:pl.level, part:pl.part, role:pl.role,
                title:`${levelName(levels, pl.level)} — ${roleName(pl.role)}`,
                addrs:[], count:0, note:pl.meta && pl.meta.formula };
        steps.push(cur);
      }
      cur.addrs.push(pl.addr);
      cur.count += pl.kind === 'run' ? pl.count : 1;
      if(!cur.note && pl.meta && pl.meta.formula) cur.note = pl.meta.formula;
    }
    // merge tiny steps so the timeline stays readable
    const merged = [];
    for(const s of steps){
      const last = merged[merged.length-1];
      if(last && last.level === s.level && last.part === s.part && s.count <= 2 && last.count <= 6){
        last.addrs.push(...s.addrs); last.count += s.count;
        last.title = `${levelName(levels, s.level)} — ${roleName(last.role)} and ${roleName(s.role)}`;
      } else merged.push(s);
    }
    steps = merged.slice(0, 40).map((s, i) => Object.assign(s, { i }));
    return steps;
  }
  const levelName = (levels, id) => (levels.find(l => l.id === id) || {}).name || id;
  const roleName = r => ({ pad:'pad foundations', strip:'strip footings', raft:'raft slab',
    pile:'piles', cap:'pile caps', column:'columns', wall:'walls', core:'core walls',
    stud:'studs', plate:'plates', brace:'bracing', primary:'primary beams',
    secondary:'secondary beams', edge:'edge beams', joist:'joists', purlin:'purlins',
    rib:'ribs', plank:'planks', panel:'panels', deck:'decking', slab:'slab',
    drop:'drop panels', topping:'topping', cladding:'cladding', truss:'trusses',
    rafter:'rafters', tie:'ceiling ties', ridge:'ridge', cover:'roof covering' }[r] || r);

  function show(i){
    at = i;
    if(i == null){ for(const o of Realize.groups) o.visible = true; View.applyVisibility();
                   Bus.emit('seq', { at:null, steps }); Render.invalidate(); return; }
    const done = new Set();
    for(let k = 0; k <= i; k++) for(const a of steps[k].addrs) done.add(a);
    for(const o of Realize.groups){
      const R = o.userData.ranges;
      if(!R){ o.visible = true; continue; }
      // reveal a merged batch progressively by clipping the draw range
      let tri = 0, any = false;
      for(const r of R){ if(done.has(r.addr)){ tri = Math.max(tri, r.tri0 + r.triN); any = true; } }
      o.visible = any;
      if(any) o.geometry.setDrawRange(0, tri*3);
    }
    for(const o of Realize.groups) if(!o.userData.ranges) o.visible = false;
    Bus.emit('seq', { at:i, steps, step:steps[i] });
    Render.invalidate();
  }

  function reset(){
    for(const o of Realize.groups) if(o.geometry) o.geometry.setDrawRange(0, Infinity);
    at = null; stop();
    View.applyVisibility();
    Bus.emit('seq', { at:null, steps });
  }
  function play(){
    if(!steps.length) return;
    playing = true;
    if(at == null || at >= steps.length-1) show(0); else show(at+1);
    timer = setInterval(() => {
      if(at >= steps.length-1){ stop(); return; }
      show(at+1);
    }, 850);
    Bus.emit('seq', { at, steps, playing:true });
  }
  function stop(){ playing = false; if(timer){ clearInterval(timer); timer = null; }
                   Bus.emit('seq', { at, steps, playing:false }); }

  return { build, show, reset, play, stop,
           get steps(){ return steps }, get at(){ return at }, get playing(){ return playing } };
})();

/* ==========================================================================
   21  COMPARE - two systems, same grid, one camera
   ==========================================================================
   One renderer, two scenes, ONE camera and a scissor split. Sharing the
   camera means orbiting one side orbits the other, which is the strongest
   teaching signal available and costs nothing.
   ========================================================================== */
const Compare = (() => {
  let on = false, part = null, sysB = null, sceneB = null, groupsB = [], metricsA = null, metricsB = null;

  function metrics(plans, doc, sysId){
    const sys = SYSTEMS[sysId];
    const g = Model.makeGrid(doc.grid);
    let depth = 0, formula = '', status = 'ok', count = 0;
    const vol = { steel:0, concrete:0, timber:0, masonry:0 };
    for(const pl of plans){
      count += pl.kind === 'run' ? pl.count : 1;
      if(pl.meta && pl.meta.depth && pl.meta.depth > depth){
        depth = pl.meta.depth; formula = pl.meta.formula; status = pl.meta.status;
      }
      const fam = LIB.MAT[pl.mat] ? LIB.MAT[pl.mat].family : null;
      if(!fam) continue;
      if(pl.kind === 'member' || pl.kind === 'run'){
        const L = Math.hypot(pl.b[0]-pl.a[0], pl.b[1]-pl.a[1], pl.b[2]-pl.a[2]);
        const sec = LIB.SEC[pl.sectionId];
        if(sec) vol[fam] += sec.A * L * (pl.kind === 'run' ? pl.count : 1);
      } else if(pl.kind === 'panel' || pl.kind === 'volume'){
        vol[fam] += Geom.area(pl.poly) * (pl.h ?? pl.thk ?? 0);
      }
    }
    // Take the build-up thickness through the same overrides the dock uses,
    // or the table and the dock's "Build-up - N mm" button disagree.
    const zone = sys && sys.buildUp
      ? buildUpTotal(sys.buildUp, Dock.overridesFor(doc, sys.part)) : depth;
    // The part repeats on every level it occupies, so normalise by the floor
    // area it actually covers, not by one footprint.
    const storeys = new Set(plans.map(pl => pl.level)).size || 1;
    const area = g.area*storeys;
    return { system:sys ? sys.label : '—', material:sys ? sys.material : '',
             depth, zone, formula, status, count,
             steel:vol.steel*7850/area, concrete:vol.concrete/area,
             timber:vol.timber/area, area,
             buildUp:sys ? sys.buildUp : null };
  }

  function open(p, altId){
    const doc = Store.doc;
    part = p; sysB = altId; on = true;

    const docB = Util.clone(doc);
    docB.slots[p] = { sys:altId, p:{} };
    docB.edits = {}; docB.manual = [];

    const rA = Gen.run(doc, View.state.detail);
    metricsA = metrics(rA.plans.filter(x => x.part === p), doc, doc.slots[p].sys);
    const saved = Store.doc;

    // generate B into its own scene
    sceneB = new THREE.Scene();
    const hostB = new THREE.Group(); sceneB.add(hostB);
    for(const c of Render.groups.env.children) sceneB.add(c.clone());
    Store.load(docB);
    const rB = Gen.run(docB, View.state.detail);
    metricsB = metrics(rB.plans.filter(x => x.part === p), docB, altId);
    Realize.build(rB.plans, View.state.detail, View.state.style);
    groupsB = Realize.groups.slice();
    for(const o of groupsB) hostB.add(o);
    Store.load(saved);
    Render.aspectScale = 0.5;        // each scene now gets half the width
    Bus.emit('compare', { on, part, metricsA, metricsB });
    App.rebuild();
    Render.fit();
  }

  function close(){
    on = false; sceneB = null; groupsB = [];
    Render.aspectScale = 1;
    Bus.emit('compare', { on:false });
    App.rebuild();
  }

  function render(){
    if(!on || !sceneB) return false;
    const R = Render.renderer, cam = Render.camera;
    const w = R.domElement.width, h = R.domElement.height, gap = 2;
    R.setScissorTest(true);
    R.setViewport(0, 0, w/2 - gap, h); R.setScissor(0, 0, w/2 - gap, h);
    R.render(Render.scene, cam);
    R.setViewport(w/2 + gap, 0, w/2 - gap, h); R.setScissor(w/2 + gap, 0, w/2 - gap, h);
    R.render(sceneB, cam);
    R.setScissorTest(false);
    R.setViewport(0, 0, w, h);
    return true;
  }

  function table(){
    if(!metricsA || !metricsB) return null;
    const rows = [
      ['System',            metricsA.system,                       metricsB.system],
      ['Structural depth',  `${Math.round(metricsA.depth)} mm`,    `${Math.round(metricsB.depth)} mm`],
      ['Total floor zone',  `${Math.round(metricsA.zone)} mm`,     `${Math.round(metricsB.zone)} mm`],
      ['Elements',          metricsA.count,                        metricsB.count],
      ['Steel',             `${U.fx(metricsA.steel,1)} kg/m²`,     `${U.fx(metricsB.steel,1)} kg/m²`],
      ['Concrete',          `${U.fx(metricsA.concrete,3)} m³/m²`,  `${U.fx(metricsB.concrete,3)} m³/m²`],
      ['Timber',            `${U.fx(metricsA.timber,3)} m³/m²`,    `${U.fx(metricsB.timber,3)} m³/m²`]
    ];
    const t = el('table', { class:'tbl cmp' }, [
      el('thead', {}, [el('tr', {}, [el('th',{text:''}), el('th',{text:'A'}), el('th',{text:'B'})])]),
      el('tbody', {}, rows.map(([k,a,b]) => el('tr', {}, [
        el('td', { text:k }), el('td', { class:'num', text:String(a) }), el('td', { class:'num', text:String(b) })])))
    ]);
    return el('div', {}, [t, el('div', { class:'hint',
      text:'Quantities cover this part only, per square metre of the floor area it covers.' })]);
  }

  return { open, close, render, table, metrics,
           get on(){ return on }, get part(){ return part },
           get metricsA(){ return metricsA }, get metricsB(){ return metricsB } };
})();
/* ==========================================================================
   19b  LOAD PATH - the takedown, drawn
   ==========================================================================
   Loads.compute does the vertical arithmetic and Loads.paths the horizontal;
   this draws both. Around every column stands a translucent sleeve, one segment
   per storey, that widens and warms in colour as the load accumulates on the
   way down - and along every member runs an arrow pointing the way the weight
   actually travels.

   The three directions are the point. Load starts spread over a SURFACE, is
   collected HORIZONTALLY by joists and beams into a few points, may run down an
   INCLINED rafter on the way, and finally goes VERTICALLY down a column or wall
   to the ground. A student who can name those four steps on their own building
   understands the structure.

   An inclined member gets one arrow nothing else in the app can show: the
   horizontal thrust at its foot. A pitched roof pushes its walls apart, and
   that is the entire reason a ceiling tie exists.
   ========================================================================== */
const LoadPath = (() => {
  let on = false, data = null, filter = 'all', shown = null;

  const KINDS = ['surface','horizontal','inclined','vertical'];
  const KIND_LABEL = { surface:'Surface', horizontal:'Horizontal',
                       inclined:'Inclined', vertical:'Vertical' };
  const THRUST_COL = 0xd6453f;

  const MAT = new Map();
  function mat(hex, opacity = 0.42){
    const key = hex + '|' + opacity;
    if(MAT.has(key)) return MAT.get(key);
    // depthTest off: a load diagram is of no use hidden inside the cladding it
    // is trying to explain, so it reads through the building like an overlay.
    const m = new THREE.MeshBasicMaterial({ color:hex, transparent:true, opacity,
      depthWrite:false, depthTest:false, side:THREE.DoubleSide });
    MAT.set(key, m);
    return m;
  }

  const box = (() => { let g; return () => (g || (g = new THREE.BoxGeometry(1,1,1))); })();

  /** A unit arrow: length 1 along +Y, radius 1, shaft and head in one geometry. */
  const arrowGeo = (() => {
    let g;
    return () => {
      if(g) return g;
      const shaft = new THREE.CylinderGeometry(0.3, 0.3, 0.66, 7);
      shaft.translate(0, 0.33, 0);
      const head = new THREE.ConeGeometry(0.85, 0.34, 10);
      head.translate(0, 0.83, 0);
      g = BufferGeometryUtils.mergeGeometries([shaft, head]);
      return g;
    };
  })();

  /* Arrows are merged into one mesh per (colour, layer). The layer has to stay
     separate so the diagram moves with the part it belongs to when the model is
     exploded or opened; the colour, so the ramp still reads. */
  let buckets = null;
  const _up = new THREE.Vector3(0,1,0);
  const _q = new THREE.Quaternion(), _d = new THREE.Vector3(), _s = new THREE.Vector3();
  function arrow(from, dir, len, rad, hex, layer){
    const L = Math.hypot(dir[0], dir[1], dir[2]);
    if(L < 1e-6 || len < 1e-4) return;
    _d.set(dir[0]/L, dir[1]/L, dir[2]/L);
    _q.setFromUnitVectors(_up, _d);
    const m = new THREE.Matrix4().compose(
      new THREE.Vector3(from[0], from[1], from[2]), _q, _s.set(rad, len, rad));
    const key = hex + '|' + layer;
    let b = buckets.get(key);
    if(!b){ b = { hex, layer, geos:[] }; buckets.set(key, b); }
    const g = arrowGeo().clone();
    g.applyMatrix4(m);
    b.geos.push(g);
  }

  function flushArrows(g){
    for(const b of buckets.values()){
      if(!b.geos.length) continue;
      const merged = BufferGeometryUtils.mergeGeometries(b.geos);
      for(const x of b.geos) x.dispose();
      if(!merged) continue;
      const m = new THREE.Mesh(merged, mat(b.hex, 0.72));
      m.renderOrder = 901;
      m.userData = { loadpath:true, layer:b.layer };
      g.add(m);
    }
    buckets = new Map();
  }

  function clear(){
    Render.clearGroup(Render.groups.loads);
    Render.invalidate();
  }

  const wants = k => filter === 'all' || filter === k;

  /* --- drawing ------------------------------------------------------------ */
  function build(){
    const g = Render.groups.loads;
    Render.clearGroup(g);
    if(!on){ shown = null; return; }
    buckets = new Map();
    const doc = Store.doc;
    data = Loads.paths(doc, Gen.plans);
    const levels = data.levels, grid = data.grid;
    const groundY = levels[0].y;
    const span = Math.max(1, Math.min(grid.sx, grid.sz));
    shown = { surface:[0,0], horizontal:[0,0], inclined:[0,0], vertical:[0,0] };

    /* 1. where it starts: a downward arrow over each bay of each level */
    if(wants('surface')){
      for(const r of data.rows){
        const t = r.w/Math.max(...data.rows.map(x => x.w));
        for(let i = 0; i < grid.nx - 1; i++)
          for(let j = 0; j < grid.nz - 1; j++){
            shown.surface[1]++;
            if(shown.surface[0] >= 96) continue;
            shown.surface[0]++;
            const x = (grid.xs[i] + grid.xs[i+1])/2, z = (grid.zs[j] + grid.zs[j+1])/2;
            arrow([x, r.y + 0.95, z], [0,-1,0], 0.8, 0.10 + 0.05*t,
                  Loads.colourFor(0.12), r.isRoof ? 6 : 4);
          }
      }
    }

    /* 2. along the members, to their supports. A run of 34 rafters becomes a
          few arrows: the diagram has to stay a diagram. */
    const horiz = data.segs.filter(s => s.kind === 'horizontal');
    const incl  = data.segs.filter(s => s.kind === 'inclined');
    const maxR  = Math.max(1, ...data.segs.filter(s => s.R).map(s => s.R));
    const maxThrust = Math.max(1e-6, ...incl.map(s => s.thrust || 0));

    for(const [list, kind, cap] of [[horiz,'horizontal',30], [incl,'inclined',26]]){
      if(!wants(kind)) continue;
      for(const s of list){
        const n = s.count || 1;
        shown[kind][1] += n;
        const take = Math.min(n, n > 1 ? 2 : 1);          // at most two of a run
        for(let k = 0; k < take; k++){
          if(shown[kind][0] >= cap) break;
          shown[kind][0]++;
          const f = n > 1 ? (k + 0.5)/take : 0;
          const off = s.step ? [s.step[0]*f*(n-1), s.step[1]*f*(n-1), s.step[2]*f*(n-1)] : [0,0,0];
          const a = [s.a[0]+off[0], s.a[1]+off[1], s.a[2]+off[2]];
          const b = [s.b[0]+off[0], s.b[1]+off[1], s.b[2]+off[2]];
          const mid = [(a[0]+b[0])/2, (a[1]+b[1])/2, (a[2]+b[2])/2];
          const t = s.R/maxR;
          const len = Math.min(s.length*0.34, span*0.42);
          const rad = 0.075 + 0.13*Math.sqrt(t);
          const hex = Loads.colourFor(0.25 + 0.65*t);
          const layer = s.level === levels[levels.length-1].id ? 5 : 3;
          // from mid-span outward to each support: that is where the load goes
          for(const end of [a, b]){
            const d = [end[0]-mid[0], end[1]-mid[1], end[2]-mid[2]];
            const dl = Math.hypot(d[0], d[1], d[2]) || 1;
            const start = [mid[0] + d[0]/dl*0.18, mid[1] + d[1]/dl*0.18 + 0.30,
                           mid[2] + d[2]/dl*0.18];
            arrow(start, d, len, rad, hex, layer);
          }
          // and the sideways push an inclined member puts into its support
          if(kind === 'inclined' && s.thrust > 0){
            const low = a[1] <= b[1] ? a : b;
            const out = [low[0] - mid[0], 0, low[2] - mid[2]];
            const ol = Math.hypot(out[0], out[2]) || 1;
            const ft = s.thrust/maxThrust;
            arrow([low[0], low[1] + 0.12, low[2]], [out[0]/ol, 0, out[2]/ol],
                  span*0.3*(0.55 + 0.45*ft), 0.09 + 0.11*Math.sqrt(ft), THRUST_COL, 5);
          }
        }
      }
    }

    /* 3. down the vertical structure, inside the accumulation sleeve */
    if(wants('vertical')){
      if(data.onWalls) buildWallBands(g, data, levels, grid);
      else buildColumnSleeves(g, data, levels, groundY);
    }

    flushArrows(g);
    Render.invalidate();
  }

  /** A wall gathers along its whole length, so it gets a band, not a stack. */
  function buildWallBands(g, data, levels, grid){
    const segs = [[[0,0],[grid.W,0]], [[grid.W,0],[grid.W,grid.D]],
                  [[grid.W,grid.D],[0,grid.D]], [[0,grid.D],[0,0]]];
    for(let k = 0; k < data.rows.length; k++){
      const r = data.rows[k];
      const below = levels[levels.length - 1 - k - 1] || levels[0];
      const t = r.cumulative/data.total;
      /* The load is the band's PROJECTION out from the wall, not its height:
         a bar you read outward is easier to compare storey to storey than a
         block of colour, and it leaves the building visible behind it. */
      const H = 0.3, proj = 0.12 + 0.9*Math.sqrt(t);
      const y = below.y + (r.y - below.y)*0.12;
      for(const [a, b] of segs){
        const L = Math.hypot(b[0]-a[0], b[1]-a[1]);
        const ang = Math.atan2(b[1]-a[1], b[0]-a[0]);
        const n = Geom.normalOf(a, b);
        const off = 0.12 + proj/2;
        const m = new THREE.Mesh(box(), mat(Loads.colourFor(t)));
        m.scale.set(L, H, proj);
        m.position.set((a[0]+b[0])/2 + n[0]*off, y, (a[1]+b[1])/2 + n[1]*off);
        m.rotation.y = -ang;
        m.renderOrder = 900;
        // stamped like a real wall leaf, so Open swings it aside with the wall
        m.userData = { loadpath:true, layer:2, wall:{ i:0, n:1, nx:n[0], nz:n[1] } };
        g.add(m);
        if(shown.vertical[0] < 40){
          shown.vertical[0]++; shown.vertical[1]++;
          arrow([(a[0]+b[0])/2 + n[0]*off, y + 0.22, (a[1]+b[1])/2 + n[1]*off],
                [0,-1,0], 0.55, 0.06 + 0.08*Math.sqrt(t), Loads.colourFor(t), 2);
        }
      }
      g.add(Render.label(`${U.fx(r.cumulative/data.runLen, 0)} kN/m`,
        new THREE.Vector3(-0.3 - proj, y, grid.D/2), 'val', 10));
    }
  }

  function buildColumnSleeves(g, data, levels, groundY){
    const maxN = data.maxN || 1;
    for(const sp of data.supports){
      const per = sp.perLevel;
      for(let k = 0; k < per.length; k++){
        const here = per[k];
        const belowY = per[k+1] ? per[k+1].y : groundY;
        const t = here.N/maxN;
        const side = 0.3 + 1.0*Math.sqrt(t);
        const m = new THREE.Mesh(box(), mat(Loads.colourFor(t)));
        m.scale.set(side, Math.max(0.05, here.y - belowY), side);
        m.position.set(sp.x, (here.y + belowY)/2, sp.z);
        m.renderOrder = 900;
        m.userData = { loadpath:true, layer:2 };
        g.add(m);
        {
          shown.vertical[1]++;
          if(shown.vertical[0] < 72){
            shown.vertical[0]++;
            arrow([sp.x, here.y - 0.15, sp.z], [0,-1,0],
                  Math.min(0.9, (here.y - belowY)*0.5), 0.05 + 0.10*Math.sqrt(t),
                  Loads.colourFor(t), 2);
          }
        }
      }
      // what arrives at the foundation, and where it goes
      g.add(Render.label(`${U.fx(sp.N, 0)} kN`,
        new THREE.Vector3(sp.x, groundY + 0.35, sp.z), 'val',
        sp.N >= maxN*0.999 ? 12 : 8));
      arrow([sp.x, groundY - 0.25, sp.z], [0,-1,0], 0.75,
              0.06 + 0.12*Math.sqrt(sp.N/maxN), Loads.colourFor(sp.N/maxN), 0);
    }
    const w = data.worst;
    if(w) for(const s of w.perLevel)
      g.add(Render.label(`${U.fx(s.N, 0)} kN`,
        new THREE.Vector3(w.x + 0.6, s.y - 0.4, w.z + 0.6), 'val', 11));
  }

  /* --- the chain, in words ------------------------------------------------ */
  function chain(doc){
    const sys = p => SYSTEMS[(doc.slots[p] || {}).sys];
    const roof = sys('roof'), vert = sys('vertical'), fdn = sys('foundation');
    const kindOf = seg => (data && data.segs.some(s => s.kind === seg)) ? seg : null;
    const out = [];
    if(roof) out.push({ t:roof.label, k:kindOf('inclined') ? 'inclined' : 'horizontal' });
    out.push({ t:'floors', k:'horizontal' });
    if(vert) out.push({ t:vert.label, k:'vertical' });
    if(fdn)  out.push({ t:fdn.label, k:'vertical' });
    out.push({ t:'ground', k:null });
    return out;
  }

  /* --- the takedown, as a table ------------------------------------------- */
  function card(){
    if(!on) return null;
    const d = data || Loads.compute(Store.doc);
    const body = el('div', { class:'body' });

    // the chain first: it is the shape of the answer
    const ch = chain(Store.doc);
    body.appendChild(el('div', { class:'chain' }, ch.flatMap((c, i) => [
      i ? el('span', { class:'arw', text:'→' }) : null,
      el('span', { class:'lnk ' + (c.k || ''), text:c.t })
    ].filter(Boolean))));

    body.appendChild(el('div', { class:'note info', html:
      'Every square metre of floor is carried by the support nearest to it. ' +
      'Follow one column down and watch the number grow — that is the load path.' }));

    const rows = d.rows.map(r => [
      r.name, `${U.fx(r.w,0)}`, `${U.fx(r.load,0)}`, `${U.fx(r.cumulative,0)}`]);
    const t = el('table', { class:'tbl loads' }, [
      el('thead', {}, [el('tr', {}, ['Level','kN/m²','This level','Running']
        .map(h => el('th', { text:h })))]),
      el('tbody', {}, rows.map(r => el('tr', {}, r.map((c, i) =>
        el('td', { class:i ? 'num' : '', text:c })))))
    ]);
    body.appendChild(el('div', { class:'tbl-wrap' }, [t]));
    body.appendChild(el('div', { class:'hint',
      text:`Each level is ${U.fx(d.grid.area,0)} m², and every figure is in kN.` }));

    if(d.onWalls){
      body.appendChild(el('div', { class:'sizing ok' }, [
        el('div', { class:'head' }, [el('span', { class:'ttl', text:'At the foundation' })]),
        el('div', { class:'formula',
          text:`${U.fx(d.total,0)} kN ÷ ${U.fx(d.runLen,1)} m of wall = ${U.fx(d.perMetre,1)} kN/m` }),
        el('div', { class:'advice',
          text:'A wall spreads its load along its whole length, which is why it needs ' +
               'only a narrow strip footing under it.' })
      ]));
    } else {
      const w = d.worst;
      body.appendChild(el('div', { class:'sizing ok' }, [
        el('div', { class:'head' }, [
          el('span', { class:'ttl', text:`Worst column — ${w ? w.ref : '—'}` })]),
        el('div', { class:'formula', text: w
          ? `${U.fx(w.trib,2)} m² × ${d.rows.length} levels = ${U.fx(w.N,0)} kN` : '—' }),
        el('div', { class:'advice',
          text:'An interior column takes a whole bay; a corner takes a quarter of one. ' +
               'That is the whole difference between them.' })
      ]));
      body.appendChild(el('div', { class:'note',
        html:`<b>${U.fx(d.total,0)} kN</b> reaches the ground across ` +
             `<b>${d.supports.length}</b> columns.` }));
    }

    // the thrust an inclined roof puts into its walls, where there is one
    const inc = (d.segs || []).filter(s => s.kind === 'inclined' && s.thrust > 0);
    if(inc.length){
      const worst = inc.reduce((a, b) => b.thrust > a.thrust ? b : a);
      body.appendChild(el('div', { class:'sizing marginal' }, [
        el('div', { class:'head' }, [
          el('span', { class:'ttl', text:'Thrust at the eaves' })]),
        el('div', { class:'formula',
          text:`${U.fx(worst.R,1)} kN ÷ tan ${U.fx(worst.pitch,0)}° = ${U.fx(worst.thrust,1)} kN outward` }),
        el('div', { class:'advice',
          text:'A sloping roof does not only press down — it pushes the walls apart. ' +
               'That push is what a ceiling tie, a ring beam or a buttress is for.' })
      ]));
    }

    if(shown){
      const bits = KINDS.filter(k => shown[k][1])
        .map(k => `${shown[k][0]} of ${shown[k][1]} ${KIND_LABEL[k].toLowerCase()}`);
      if(bits.length) body.appendChild(el('div', { class:'hint',
        text:`Arrows drawn: ${bits.join(', ')} — repeats are thinned so the diagram ` +
             `stays readable.` }));
    }
    if((d.segs || []).some(s => s.inferred)) body.appendChild(el('div', { class:'hint',
      text:'Where a member’s spacing is not given by the system, the strip it carries ' +
           'is taken as half the bay.' }));

    body.appendChild(el('div', { class:'hint',
      text:'Gravity only, by tributary area — no frame action, no wind. This is the ' +
           'hand calculation done at the start of a project, not a structural analysis.' }));

    const det = el('details', { class:'card-sect alert', open:true });
    det.appendChild(el('summary', {}, [icon('i-load'),
      el('span', { class:'t', text:'Load path' }),
      el('span', { class:'s', text:`${U.fx(d.total,0)} kN to the ground` })]));
    det.appendChild(body);
    return det;
  }

  return {
    get on(){ return on },
    set on(v){ on = !!v; build(); },
    get data(){ return data },
    get filter(){ return filter },
    set filter(v){ filter = v; build(); },
    get shown(){ return shown },
    KINDS, KIND_LABEL, build, clear, card
  };
})();

/* ==========================================================================
   22  PICK - a raycast, resolved back through the merged batches
   ========================================================================== */
const Pick = (() => {
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const coarse = () => window.matchMedia('(pointer:coarse)').matches;

  function at(ev){
    const r = Render.canvas.getBoundingClientRect();
    ndc.x = ((ev.clientX - r.left)/r.width)*2 - 1;
    ndc.y = -((ev.clientY - r.top)/r.height)*2 + 1;
    ray.setFromCamera(ndc, Render.camera);
    const hits = ray.intersectObjects(Render.groups.build.children, false);
    for(const h of hits){
      if(!h.object.userData.batch) continue;
      const addr = Realize.resolve(h.object, h.faceIndex);
      if(addr) return { addr, point:h.point, object:h.object };
    }
    return null;
  }
  function onGround(ev, y = 0){
    const r = Render.canvas.getBoundingClientRect();
    ndc.x = ((ev.clientX - r.left)/r.width)*2 - 1;
    ndc.y = -((ev.clientY - r.top)/r.height)*2 + 1;
    ray.setFromCamera(ndc, Render.camera);
    const out = new THREE.Vector3();
    return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0), -y), out) ? out : null;
  }
  return { at, onGround, coarse };
})();

     A tool takes the pointer away from the camera for as long as it is armed:
     dragging an imported plan into place, or picking two points to scale one.
     Orbit is disabled while a tool holds the pointer, because a drag cannot
     mean two things at once, and the cursor says which mode you are in. */
  let tool = null;
  function setTool(t){
    if(tool && tool.cancel) tool.cancel();
    tool = t || null;
    if(Render.controls) Render.controls.enabled = !tool;
    if(UI.dom.gl) UI.dom.gl.style.cursor = tool ? (tool.cursor || 'crosshair') : '';
    if(tool && tool.hint) UI.dom.hint.textContent = tool.hint;
    else if(!tool) UI.dom.hint.textContent = '';
  }

  /* --- the one rebuild path ------------------------------------------------
     Generate, apply edits, realize, then re-apply whatever the view state
     says. Called on every parameter change; measured at a few tens of
     milliseconds for a normal student building. */
  function rebuild(opts = {}){
    const doc = Store.doc;
    const detail = dragging && View.state.detail === 'full' ? 'members' : View.state.detail;
    const r = Gen.run(doc, detail);

    const est = Gen.estimate(r.plans);
    if(est > 12000 && detail === 'full'){
      UI.toast(`That is ${est.toLocaleString()} elements — showing members instead of full framing.`,
        'warn', 6000);
      View.state.detail = 'members';
      return rebuild(opts);
    }

    Realize.build(r.plans, detail, View.state.style);
    Build.refsFor(doc, r.grid || Model.makeGrid(doc.grid), r.diag.levels || Gen.levelsFor(doc));

    View.setBounds(Render.bounds());
    View.applyStyle();
    View.applyVisibility();
    View.applyExplode();
    if(View.state.section.on) View.refreshClipping();
    Seq.build(r.plans, r.diag.levels || Gen.levelsFor(doc));

    if(LoadPath.on) LoadPath.build();
    highlightSelection();
    Render.invalidate();
    refreshChrome();
    if(opts.fit) Render.fit();

  /* --- rendering diagnostics -----------------------------------------------
     A rendering fault that appears on one machine and not another cannot be
     found by reasoning from a screenshot; three rounds of that proved it. So
     the machine that HAS the fault gets the instruments: a measurement of its
     own depth buffer, and a switch per suspect that can be turned on while
     watching the picture. Whichever switch clears it names the cause.

     Nobody reaches this by accident - ?diag=1, or a button inside About. */
  function diagnostics(){
    const D = Render.diag;
    D.on = true;
    const out = { probe:null, tried:{} };

    const body = el('div', { class:'diag' });
    const probeRow = el('div', { class:'formula', text:'not run yet' });

    const runProbe = () => {
      const r = Render.depthProbe();
      out.probe = r;
      probeRow.textContent = !r ? 'could not run'
        : r.finestMm == null
          ? `this machine cannot separate two surfaces even 100 mm apart at the ` +
            `current range (${r.range} units) — something is very wrong`
          : `separates surfaces ${r.finestMm} mm apart at the current range ` +
            `(${r.range} units over ${r.bits} bits, so ${r.theoryMm} mm per step in theory)`;
    };

    const refresh = () => { Realize.disposeCaches(); rebuild(); Render.invalidate(); };
    // full width, label on the box: these labels are sentences, not field names
    const sw = (key, label, why) => el('div', { class:'row wide swrow' }, [
      UI.check(label, D[key], v => { D[key] = v; out.tried[key] = v; refresh(); }),
      el('div', { class:'hint', text:why })
    ]);

    body.appendChild(UI.explain(
      'Turn these on one at a time and watch the model. <b>Whichever one makes the ' +
      'fault disappear names its cause.</b> None of them is a setting — they are ' +
      'here to find out what is wrong, and they reset when you reload.'));

    body.appendChild(UI.section('What this machine can resolve', null, [
      UI.explain('Two surfaces are drawn a known distance apart and read back. ' +
        'This is the depth buffer measured rather than assumed.'),
      probeRow,
      el('div', { class:'row wide' }, [
        el('button', { class:'btn ghost sm', onclick:runProbe }, ['Measure again'])])
    ]));

    body.appendChild(UI.section('Switches', null, [
      sw('polyOffset', 'Push build-up layers apart',
         'if this clears it: surfaces are tying in the depth buffer'),
      sw('outerOnly', 'Draw only the outermost layer',
         'if this clears it: the layers of a build-up are fighting each other'),
      sw('noEdges', 'Hide the edge outlines',
         'if this clears it: the outlines are tying with the faces they trace'),
      sw('halfDepth', 'Halve the depth range',
         'if this clears it: depth precision after all'),
      el('div', { class:'row wide swrow' }, [
        el('label', { class:'chk', text:'Pixel ratio' })]),
      UI.row('', UI.select(
        [{ value:'0', label:'as the screen says' }, { value:'1', label:'force 1' },
         { value:'2', label:'force 2' }],
        String(D.forceDpr), v => {
          D.forceDpr = +v; out.tried.forceDpr = +v;
          Render.renderer.setPixelRatio(+v || Math.min(devicePixelRatio || 1, 2));
          Render.resize(); Render.invalidate();
        }), null, 'if a ratio clears it: resolution or the multisample resolve'),
      UI.explain('Multisampling is fixed when the page loads and cannot be switched ' +
        'here. To test it, reload with <b>?aa=0</b> on the address.')
    ]));

    const report = () => {
      const V = View.state;
      const r = {
        gl: Render.glInfo(), probe: out.probe, switchesTried: out.tried,
        model: { template:Store.doc.name || '—', style:V.style, detail:V.detail,
                 open:V.open, explode:V.explode, section:V.section.on },
        canvas: { w:Render.canvas.clientWidth, h:Render.canvas.clientHeight,
                  devicePixelRatio },
        ua: navigator.userAgent
      };
      const text = JSON.stringify(r, null, 1);
      const done = () => UI.toast('Report copied — paste it back.', 'ok', 4000);
      try { navigator.clipboard.writeText(text).then(done, () => fallback(text)); }
      catch(e){ fallback(text); }
      function fallback(t){
        const ta = el('textarea', { class:'diag-dump' }); ta.value = t;
        body.appendChild(ta); ta.select(); UI.toast('Select and copy the text below.', 'warn', 6000);
      }
    };

    runProbe();
    UI.modal({ title:'Rendering diagnostics', sub:'for finding a fault that only happens on some machines',
      wide:true, body:[body],
      footer:[
        el('button', { class:'btn ghost', onclick:report }, [icon('i-doc'), 'Copy report']),
        el('button', { class:'btn primary', onclick:UI.close }, ['Close'])],
      onClose:() => { D.on = false; } });
  }

  function toggleTheme(){
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    IO.prefs({ theme:next });
    Render.applyTheme();
    Realize.disposeCaches();
    rebuild();
  }

  return { rebuild, rebuildSoon, refreshChrome, highlightSelection, describeBuilding,
           newBuilding, showTemplates, showHelp, diagnostics, compareDialog, toggleTheme, TEMPLATES,
           get tool(){ return tool }, setTool,
           get tab(){ return tab }, set tab(v){ tab = v; refreshChrome(); },
           set dragging(v){ dragging = v; }, get dragging(){ return dragging } };
})();

/* ==========================================================================
   24  BUILD - grid lines and level datums (everything else is Realize's job)
   ========================================================================== */
const Build = (() => {
  const lineMat = (color, width) => Object.assign(new LineMaterial({
      color, linewidth:width, worldUnits:false, alphaToCoverage:true }),
    { resolution:new THREE.Vector2(Render.canvas?.clientWidth || 1, Render.canvas?.clientHeight || 1) });

  function segs(pairs, color, width, opts){
    const geo = new LineSegmentsGeometry();
    geo.setPositions(pairs);
    const l = new LineSegments2(geo, Object.assign(lineMat(color, width), opts || {}));
    l.computeLineDistances();
    return l;
  }

  function refsFor(doc, grid, levels){
    const g = Render.groups.ref;
    Render.clearGroup(g);
    const y = 0, ext = 1.4;
    const pts = [];
    for(let i = 0; i < grid.xs.length; i++){
      pts.push(grid.xs[i], y, -ext, grid.xs[i], y, grid.D + ext);
      if(View.state.labels.grid)
        g.add(Render.label(grid.labX(i), new THREE.Vector3(grid.xs[i], y, -ext), 'grid', 10));
    }
    for(let j = 0; j < grid.zs.length; j++){
      pts.push(-ext, y, grid.zs[j], grid.W + ext, y, grid.zs[j]);
      if(View.state.labels.grid)
        g.add(Render.label(grid.labZ(j), new THREE.Vector3(-ext, y, grid.zs[j]), 'grid', 10));
    }
    if(pts.length) g.add(segs(pts, Render.C.grid, 1.3, { transparent:true, opacity:0.75 }));

    if(View.state.labels.level){
      /* Level tags used to hang off the SAME near corner as the grid bubbles,
         which put "Ground +0.00" on top of "A" and "1". Two labels a few
         pixels apart take turns winning the budget as the camera turns, and
         taking turns at ten passes a second is what the eye reads as flashing.
         The budget below no longer has that failure mode, but two labels on
         top of each other still means one of them is hidden, so the tag sits
         at the far end of its own leader line instead - which is where a
         drafter would put it anyway, and still inside the framed view. */
      const lext = ext + 1.5, lp = [];
      for(const L of levels){
        lp.push(-lext, L.y, -lext, grid.W + ext, L.y, -lext);
        lp.push(-lext, L.y, -lext, -lext, L.y, grid.D + ext);
        g.add(Render.label(`${L.name}  +${U.fx(L.y,2)}`,
          new THREE.Vector3(-lext - 1.2, L.y, grid.D + ext + 1.2), 'dim', 9));
      }
      g.add(segs(lp, 0x4ec98b, 1.0, { transparent:true, opacity:0.32 }));
    }
  }

  return { refsFor, segs, lineMat };
})();
