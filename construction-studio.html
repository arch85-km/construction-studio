<style>
/* ==========================================================================
   CONSTRUCTION STUDIO - stylesheet
   Design tokens -> layout -> chrome -> panels -> widgets -> responsive -> print
   ========================================================================== */

/* --- design tokens ------------------------------------------------------ */
:root{
  --bg-0:#12151a; --bg-1:#181c23; --bg-2:#1f242d; --bg-3:#272d38; --bg-4:#333b49;
  --line:#39424f; --line-soft:#2b323d;
  --ink-0:#eef2f7; --ink-1:#b6c0cd; --ink-2:#7d8899; --ink-3:#5a6474;
  --accent:#4da3ff; --accent-dim:#2e6fb5; --accent-ghost:rgba(77,163,255,.14);
  --ok:#4ec98b; --warn:#f0b23c; --bad:#f2645a; --info:#7f8cff;
  --viewport:#141820; --viewport-2:#0e1116;
  --grid-major:#3a4552; --grid-minor:#232a34;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 6px 24px rgba(0,0,0,.45);
  --shadow-3:0 18px 60px rgba(0,0,0,.55);
  --r-s:4px; --r-m:7px; --r-l:12px;
  --rail:52px; --ribbon:38px; --tabs:34px; --cmd:46px; --status:26px; --panel:310px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --dur:.16s;
}
html[data-theme="light"]{
  --bg-0:#eef1f5; --bg-1:#f6f8fa; --bg-2:#ffffff; --bg-3:#eaeef3; --bg-4:#dde3ea;
  --line:#c8d1dc; --line-soft:#dee4ec;
  --ink-0:#141a22; --ink-1:#3d4757; --ink-2:#6b7686; --ink-3:#939daa;
  --accent:#1668c7; --accent-dim:#4d94dd; --accent-ghost:rgba(22,104,199,.12);
  --viewport:#e7ebf1; --viewport-2:#f4f6f9;
  --grid-major:#b4bfcc; --grid-minor:#d5dce4;
  --shadow-1:0 1px 2px rgba(20,30,45,.12);
  --shadow-2:0 6px 24px rgba(20,30,45,.14);
  --shadow-3:0 18px 60px rgba(20,30,45,.2);
}

*,*::before,*::after{box-sizing:border-box}
/* 100% rather than 100vh - an iframe on iOS mis-measures vh and clips the status bar */
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  font-family:var(--sans); font-size:13px; line-height:1.45;
  color:var(--ink-0); background:var(--bg-0);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden; touch-action:none;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box}

/* --- app shell ---------------------------------------------------------- */
#app{
  position:fixed; inset:0; display:grid;
  grid-template-rows:var(--ribbon) var(--tabs) var(--cmd) 1fr var(--status);
  grid-template-columns:1fr auto;
  grid-template-areas:
    "brand  brand"
    "tabs   tabs"
    "cmd    cmd"
    "stage  side"
    "status status";
  background:var(--bg-0);
  min-height:0;
}
#side{
  grid-area:side; width:var(--panel); display:flex; flex-direction:column;
  background:var(--bg-1); border-left:1px solid var(--line); z-index:20; min-height:0;
}

/* --- brand bar ---------------------------------------------------------- */
/* Grid items are min-width:auto, so any row whose contents cannot shrink -
   the brand bar's icon cluster, above all - widens the whole column and pushes
   the viewport off the side of a phone. Every row must be allowed to shrink. */
#app>*{min-width:0}
#brand{
  grid-area:brand; display:flex; align-items:center; gap:10px;
  padding:0 10px; background:var(--bg-1); border-bottom:1px solid var(--line-soft);
  z-index:30; overflow:hidden;
}
#brand .logo{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
#brand .logo svg{width:20px;height:20px;color:var(--accent);flex:none}
#brand .logo b{font-weight:650}
#brand .logo span{color:var(--ink-2);font-weight:450}
#brand .proj{
  margin-left:6px;padding:3px 9px;border-radius:var(--r-s);background:var(--bg-3);
  color:var(--ink-1);font-size:12px;max-width:34vw;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;border:1px solid transparent;cursor:text
}
#brand .proj:hover{border-color:var(--line)}
#brand .spacer{flex:1}
#brand .quick{display:flex;gap:2px;align-items:center;flex:none}
#brand .logo{min-width:0;overflow:hidden}

/* --- ribbon tabs -------------------------------------------------------- */
#tabs{
  grid-area:tabs; display:flex; align-items:stretch; gap:0; padding:0 6px;
  background:var(--bg-2); border-bottom:1px solid var(--line); z-index:25;
  overflow-x:auto; scrollbar-width:none;
}
#tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none;background:none;border:0;padding:0 15px;cursor:pointer;
  color:var(--ink-2);font-size:12.5px;font-weight:520;letter-spacing:.15px;
  white-space:nowrap;position:relative;transition:color var(--dur)
}
.tab:hover{color:var(--ink-0)}
.tab[aria-selected="true"]{color:var(--ink-0)}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;left:9px;right:9px;bottom:0;height:2px;
  background:var(--accent);border-radius:2px 2px 0 0
}
#tabs .tab-sep{width:1px;background:var(--line-soft);margin:8px 6px;flex:none}

/* --- ribbon panel (contextual toolbar) ---------------------------------- */
#cmd{
  grid-area:cmd; display:flex; align-items:center; gap:2px; padding:0 8px;
  background:var(--bg-1); border-bottom:1px solid var(--line);
  z-index:24; overflow-x:auto; overflow-y:hidden; scrollbar-width:thin;
  min-width:0; white-space:nowrap
}
#cmd::-webkit-scrollbar{height:5px}
#cmd .grp{display:flex;align-items:center;gap:5px;padding:0 9px;position:relative;flex:none;min-width:0}
/* A prose group is the one thing in the bar that has no natural width, so it
   is the one thing allowed to shrink - otherwise the sentence runs on under
   whatever sits to its right. */
#cmd .grp.prose{flex:0 1 auto;overflow:hidden}
#cmd .hintbox{font-size:11px;color:var(--ink-2);line-height:1.35;
  max-width:38ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cmd .grp + .grp::before{
  content:"";position:absolute;left:0;top:5px;bottom:5px;width:1px;background:var(--line-soft)
}
/* The five tabs already name the context, so per-group captions in a bar this
   short cost more than they explain. Kept in the markup for the tooltip. */
#cmd .grp-label{display:none}

/* --- generic buttons ---------------------------------------------------- */
.btn{
  appearance:none;display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:var(--r-s);border:1px solid transparent;
  background:transparent;color:var(--ink-1);cursor:pointer;white-space:nowrap;
  font-size:12.5px;transition:background var(--dur),color var(--dur),border-color var(--dur)
}
.btn:hover{background:var(--bg-3);color:var(--ink-0)}
.btn:active{background:var(--bg-4)}
.btn[aria-pressed="true"],.btn.on{background:var(--accent-ghost);color:var(--accent);border-color:var(--accent-dim)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn svg{width:15px;height:15px;flex:none}
.btn.icon{padding:6px}
.btn.primary{background:var(--accent);color:#fff;font-weight:560}
.btn.primary:hover{background:var(--accent-dim);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:3px 7px;font-size:11.5px}

/* --- stage / viewport --------------------------------------------------- */
#stage{grid-area:stage;position:relative;background:var(--viewport);overflow:hidden;min-width:0}
#gl{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#labels>*{pointer-events:none}
.lbl{
  font-family:var(--mono);font-size:10.5px;line-height:1;white-space:nowrap;
  padding:2px 5px;border-radius:3px;transform:translate(-50%,-50%);
  background:rgba(10,14,20,.72);color:var(--ink-0);border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(3px)
}
html[data-theme="light"] .lbl{background:rgba(255,255,255,.86);color:#141a22;border-color:rgba(0,0,0,.12)}
.lbl.node{color:var(--info)} .lbl.dim{color:var(--ink-1)}
.lbl.tag{color:var(--ok)} .lbl.val{color:var(--warn)}
.lbl.grid{color:var(--accent);font-weight:600;border-radius:50%;padding:4px 6px;min-width:20px;text-align:center}

/* rendering diagnostics - only ever seen by someone chasing a fault */
.diag .row{align-items:flex-start}
.diag .swrow{display:block;margin:9px 0}
.diag .swrow .chk{font-size:12px;color:var(--ink-0)}
.diag .swrow .hint{margin:2px 0 0 20px}
.diag .formula{margin:6px 0}
.diag-dump{width:100%;height:140px;margin-top:10px;font-family:var(--mono);font-size:10.5px}

/* imported references - one block per import in the dock */
.imp{border:1px solid var(--line);border-radius:7px;padding:8px 9px;margin:8px 0;background:var(--bg-2)}
.imp .row{margin:5px 0}
.imphead{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
.imphead b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.imphead .blurb{font-size:10.5px;color:var(--ink-2);flex:1 1 auto;white-space:nowrap}
.imphead .btn{flex:0 0 auto;padding:2px 7px}

/* viewport overlays */
.vp-overlay{position:absolute;z-index:6;pointer-events:none}
.vp-overlay>*{pointer-events:auto}
#vp-tl{top:10px;left:10px;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
#vp-tr{top:10px;right:10px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
#vp-bl{bottom:10px;left:10px;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
#vp-br{bottom:10px;right:10px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}

.pill{
  display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  background:rgba(20,26,34,.78);border:1px solid var(--line);color:var(--ink-1);
  font-size:11.5px;backdrop-filter:blur(8px);box-shadow:var(--shadow-1)
}
html[data-theme="light"] .pill{background:rgba(255,255,255,.86)}
.pill b{color:var(--ink-0);font-weight:600}
.seg{
  display:flex;background:rgba(20,26,34,.78);border:1px solid var(--line);
  border-radius:var(--r-m);overflow:hidden;backdrop-filter:blur(8px);box-shadow:var(--shadow-1)
}
html[data-theme="light"] .seg{background:rgba(255,255,255,.86)}
.seg button{
  appearance:none;background:none;border:0;padding:5px 11px;cursor:pointer;
  color:var(--ink-2);font-size:11.5px;white-space:nowrap;transition:background var(--dur),color var(--dur)
}
.seg button + button{border-left:1px solid var(--line-soft)}
.seg button:hover{background:var(--bg-3);color:var(--ink-0)}
.seg button[aria-pressed="true"]{background:var(--accent-ghost);color:var(--accent)}

/* copyright badge - always bottom-left of the model space */
#copyright{
  position:absolute;left:12px;bottom:10px;z-index:9;pointer-events:none;
  font-size:11.5px;letter-spacing:.35px;color:var(--ink-1);
  user-select:none;white-space:nowrap;
  padding:3px 9px;border-radius:999px;
  background:rgba(20,26,34,.62);border:1px solid var(--line-soft);
  backdrop-filter:blur(6px)
}
html[data-theme="light"] #copyright{background:rgba(255,255,255,.72)}
#copyright b{font-weight:600;color:var(--ink-0)}
#copyright .mark{color:var(--accent);font-weight:700;margin-right:1px}

/* view cube / nav */
#navcube{
  width:82px;height:82px;border-radius:var(--r-m);
  background:rgba(20,26,34,.72);border:1px solid var(--line);
  backdrop-filter:blur(8px);display:grid;grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);gap:1px;padding:5px;box-shadow:var(--shadow-1)
}
html[data-theme="light"] #navcube{background:rgba(255,255,255,.86)}
#navcube button{
  appearance:none;background:transparent;border:0;border-radius:3px;cursor:pointer;
  color:var(--ink-2);font-size:9px;font-weight:600;letter-spacing:-.2px;padding:0;
  /* grid items are min-width:auto by default, which let "AXO" and "FIT" widen
     their columns and push the right-hand one out past the cube's edge */
  min-width:0;overflow:hidden;
  transition:background var(--dur),color var(--dur)
}
#navcube button:hover{background:var(--accent-ghost);color:var(--accent)}
#navcube button.mid{color:var(--ink-3)}

/* snap indicator + tool hint */
#snaphint{
  position:absolute;z-index:7;pointer-events:none;font-family:var(--mono);font-size:10px;
  color:var(--warn);background:rgba(20,26,34,.85);padding:2px 6px;border-radius:3px;
  border:1px solid var(--warn);transform:translate(12px,-26px);display:none;white-space:nowrap
}
#toolhint{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:8;
  padding:6px 14px;border-radius:999px;background:rgba(20,26,34,.88);border:1px solid var(--line);
  color:var(--ink-1);font-size:12px;backdrop-filter:blur(8px);box-shadow:var(--shadow-2);
  display:none;pointer-events:none;max-width:min(560px,84%);text-align:center
}
html[data-theme="light"] #toolhint{background:rgba(255,255,255,.92)}
#toolhint kbd{
  font-family:var(--mono);font-size:10.5px;background:var(--bg-3);border:1px solid var(--line);
  border-radius:3px;padding:1px 4px;margin:0 2px;color:var(--ink-0)
}

/* selection marquee */
#marquee{
  position:absolute;z-index:7;border:1px solid var(--accent);
  background:var(--accent-ghost);pointer-events:none;display:none
}

/* --- right dock --------------------------------------------------------- */
#dock{ flex:1 1 auto; overflow-y:auto; overflow-x:hidden; min-height:0 }
#layer-card{ flex:0 0 auto; max-height:46%; overflow:auto }
.dock-scroll{padding:9px}
/* --- property sheet ----------------------------------------------------- */
.sect{margin-bottom:12px;border:1px solid var(--line-soft);border-radius:var(--r-m);overflow:hidden;background:var(--bg-2)}
.sect>summary{
  padding:7px 10px;cursor:pointer;font-size:11px;font-weight:640;color:var(--ink-1);
  text-transform:uppercase;letter-spacing:.55px;background:var(--bg-3);
  list-style:none;display:flex;align-items:center;gap:6px;user-select:none
}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary::before{
  content:"";width:0;height:0;border-left:4px solid var(--ink-2);
  border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
  transition:transform var(--dur);flex:none
}
.sect[open]>summary::before{transform:rotate(90deg)}
.sect>summary .badge{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.sect .body{padding:9px 10px}

.row{display:grid;grid-template-columns:104px 1fr;gap:7px;align-items:center;margin-bottom:6px}
.row:last-child{margin-bottom:0}
.row>label{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.wide{grid-template-columns:1fr}
.row.unit{grid-template-columns:104px 1fr auto}
.row .u{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);white-space:nowrap}
.row.tri{grid-template-columns:104px 1fr 1fr 1fr;gap:5px}
.row .hint{grid-column:1/-1;font-size:10.5px;color:var(--ink-3);margin-top:-2px}

input[type=text],input[type=number],select,textarea{
  width:100%;padding:5px 8px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--bg-0);color:var(--ink-0);font-size:12px;transition:border-color var(--dur)
}
html[data-theme="light"] input[type=text],html[data-theme="light"] input[type=number],
html[data-theme="light"] select,html[data-theme="light"] textarea{background:#fff}
input[type=number]{font-family:var(--mono);text-align:right}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input[readonly]{color:var(--ink-2);background:var(--bg-1)}
input[type=range]{width:100%;accent-color:var(--accent);background:none;border:0;padding:0}
input[type=color]{width:100%;height:26px;padding:1px;background:var(--bg-0);border:1px solid var(--line);border-radius:var(--r-s)}
select{cursor:pointer}
textarea{resize:vertical;min-height:52px;font-family:var(--mono);font-size:11px;text-align:left}

.chk{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11.5px;color:var(--ink-1);user-select:none}
.chk input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;flex:none}
.chkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 8px}

.empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:12px;line-height:1.6}
.empty svg{width:34px;height:34px;opacity:.34;margin-bottom:8px}

/* --- tables ------------------------------------------------------------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line-soft);border-radius:var(--r-m);background:var(--bg-2)}
table.tbl{border-collapse:collapse;width:100%;font-size:11.5px}
table.tbl th{
  position:sticky;top:0;z-index:1;background:var(--bg-3);color:var(--ink-1);
  font-weight:620;text-align:left;padding:6px 8px;white-space:nowrap;
  border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px
}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--ink-0)}
table.tbl td{padding:4px 8px;border-bottom:1px solid var(--line-soft);white-space:nowrap;color:var(--ink-1)}
table.tbl td.num{font-family:var(--mono);text-align:right;color:var(--ink-0)}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover{background:var(--bg-3)}
table.tbl tbody tr.sel{background:var(--accent-ghost)}
table.tbl tbody tr.sel td{color:var(--ink-0)}
table.tbl tfoot td{padding:6px 8px;font-weight:640;color:var(--ink-0);background:var(--bg-3);border-top:1px solid var(--line)}
table.tbl input{padding:2px 5px;font-size:11px;border-radius:3px}

/* --- status bar --------------------------------------------------------- */
#status{
  grid-area:status;display:flex;align-items:center;gap:0;padding:0 10px;
  background:var(--bg-2);border-top:1px solid var(--line);
  font-size:11px;color:var(--ink-2);font-family:var(--mono);
  overflow-x:auto;scrollbar-width:none;white-space:nowrap;z-index:20
}
#status::-webkit-scrollbar{display:none}
#status .s{padding:0 10px;position:relative;flex:none}
#status .s + .s::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--line-soft)}
#status .s b{color:var(--ink-0);font-weight:600}
#status .grow{flex:1}
#status .s.ok b{color:var(--ok)} #status .s.warn b{color:var(--warn)} #status .s.bad b{color:var(--bad)}

/* --- modal / dialog ----------------------------------------------------- */
#modalhost{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
#modalhost.open{display:flex}
#modalhost .scrim{position:absolute;inset:0;background:rgba(6,9,13,.62);backdrop-filter:blur(3px)}
.dlg{
  position:relative;background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--shadow-3);max-width:min(880px,94vw);max-height:88vh;
  display:flex;flex-direction:column;min-width:min(420px,92vw)
}
.dlg header{
  display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex:none
}
.dlg header h3{margin:0;font-size:14.5px;font-weight:620}
.dlg header .sub{color:var(--ink-3);font-size:11.5px;margin-left:2px}
.dlg header .x{margin-left:auto}
.dlg .content{padding:16px;overflow-y:auto;min-height:0}
.dlg footer{
  display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;
  border-top:1px solid var(--line);flex:none;background:var(--bg-2);
  border-radius:0 0 var(--r-l) var(--r-l)
}
.dlg footer .left{margin-right:auto}

/* card grid (templates / welcome) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:11px}
.card{
  text-align:left;padding:13px;border-radius:var(--r-m);border:1px solid var(--line);
  background:var(--bg-2);cursor:pointer;transition:all var(--dur);color:inherit
}
.card:hover{border-color:var(--accent-dim);background:var(--bg-3);transform:translateY(-1px)}
.card .ic{width:30px;height:30px;color:var(--accent);margin-bottom:8px}
.card h5{margin:0 0 4px;font-size:12.5px;font-weight:620}
.card p{margin:0;font-size:11px;color:var(--ink-2);line-height:1.5}

/* --- toasts ------------------------------------------------------------- */
#toasts{position:fixed;bottom:calc(var(--status) + 12px);left:50%;transform:translateX(-50%);
  z-index:120;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:9px;padding:8px 15px;border-radius:999px;
  background:var(--bg-3);border:1px solid var(--line);box-shadow:var(--shadow-2);
  font-size:12.5px;color:var(--ink-0);animation:toastIn .2s ease;max-width:min(560px,90vw)
}
.toast.ok{border-color:var(--ok)} .toast.warn{border-color:var(--warn)} .toast.bad{border-color:var(--bad)}
.toast .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--accent)}
.toast.ok .dot{background:var(--ok)} .toast.warn .dot{background:var(--warn)} .toast.bad .dot{background:var(--bad)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* --- explain panel ------------------------------------------------------ */
.explain{
  border-left:2px solid var(--info);background:rgba(127,140,255,.07);
  padding:8px 10px;border-radius:0 var(--r-s) var(--r-s) 0;margin-bottom:9px;font-size:11.5px;
  color:var(--ink-1);line-height:1.6
}
.explain b{color:var(--ink-0)}
.explain .f{
  display:block;font-family:var(--mono);font-size:11px;color:var(--accent);
  background:var(--bg-0);padding:5px 8px;border-radius:var(--r-s);margin:6px 0;
  overflow-x:auto;white-space:pre
}
html[data-theme="light"] .explain .f{background:var(--bg-3)}
.disclaimer{
  border-left:2px solid var(--warn);background:rgba(240,178,60,.08);
  padding:8px 10px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:11px;
  color:var(--ink-1);line-height:1.55;margin-bottom:10px
}
.disclaimer b{color:var(--warn)}
.qmark{
  appearance:none;width:15px;height:15px;border-radius:50%;border:1px solid var(--line);
  background:var(--bg-3);color:var(--ink-2);font-size:9.5px;line-height:1;cursor:pointer;
  padding:0;flex:none;font-weight:700
}
.qmark:hover{border-color:var(--info);color:var(--info)}

/* --- guided tour -------------------------------------------------------- */
#tour{position:fixed;inset:0;z-index:110;display:none;pointer-events:none}
#tour.open{display:block}
#tour .spot{
  position:absolute;border-radius:var(--r-m);border:2px solid var(--accent);
  box-shadow:0 0 0 9999px rgba(6,9,13,.66);transition:all .28s cubic-bezier(.4,0,.2,1);pointer-events:none
}
#tour .bubble{
  position:absolute;max-width:314px;padding:14px 16px;border-radius:var(--r-m);
  background:var(--bg-2);border:1px solid var(--line);box-shadow:var(--shadow-3);
  pointer-events:auto;transition:all .28s cubic-bezier(.4,0,.2,1)
}
#tour .bubble h4{margin:0 0 6px;font-size:13.5px;font-weight:620}
#tour .bubble p{margin:0 0 11px;font-size:12px;color:var(--ink-1);line-height:1.6}
#tour .bubble .nav{display:flex;align-items:center;gap:8px}
#tour .bubble .step{font-size:11px;color:var(--ink-3);font-family:var(--mono);margin-right:auto}
#tour .bubble .optout{
  margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);
  font-size:11px;color:var(--ink-2)
}

/* --- sheet / drafting output -------------------------------------------- */
.dropzone{
  border:1.5px dashed var(--line);border-radius:var(--r-m);padding:24px;text-align:center;
  color:var(--ink-2);font-size:12px;transition:all var(--dur);cursor:pointer
}
.dropzone:hover,.dropzone.hot{border-color:var(--accent);background:var(--accent-ghost);color:var(--ink-0)}
.dropzone svg{width:26px;height:26px;opacity:.5;margin-bottom:7px}

/* --- boot / error screens ----------------------------------------------- */
#boot{
  position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;background:var(--bg-0);
  color:var(--ink-2);font-size:13px;text-align:center;padding:24px
}
#boot.hidden{display:none}
#boot .ring{
  width:32px;height:32px;border-radius:50%;border:2.5px solid var(--bg-4);
  border-top-color:var(--accent);animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
#boot .err{max-width:560px;line-height:1.65;color:var(--ink-1);text-align:left}
#boot .err h3{color:var(--bad);font-size:15px;margin:0 0 8px}
#boot .err code{
  font-family:var(--mono);font-size:11.5px;background:var(--bg-2);padding:1px 5px;
  border-radius:3px;color:var(--warn)
}

/* --- responsive --------------------------------------------------------- */
@media (max-width:1180px){
  :root{--panel:272px}
}
@media (max-width:900px){
  :root{--rail:46px;--panel:min(320px,86vw)}
  #side{
    position:fixed;right:0;top:calc(var(--ribbon) + var(--tabs) + var(--cmd));bottom:var(--status);
    z-index:40;box-shadow:var(--shadow-3);transform:translateX(100%);
    transition:transform .22s cubic-bezier(.4,0,.2,1)
  }
  #side.open{transform:none}
  #app{grid-template-columns:1fr 0}
  #brand .proj{max-width:26vw}
}
@media (max-width:640px){
  :root{--ribbon:36px;--tabs:32px;--cmd:44px;--rail:44px;--status:24px}
  body{font-size:12.5px}
  #brand .logo span{display:none}
  #brand .proj{max-width:34vw}
  /* New, Open and Save are already the first three buttons of the command
     bar, so on a phone the quick bar keeps only what is not repeated there. */
  #q-new,#q-open,#q-save,#q-theme{display:none}
  .tab{padding:0 11px;font-size:12px}
  #app{
    grid-template-rows:var(--ribbon) var(--tabs) var(--cmd) 1fr var(--status);
    grid-template-columns:1fr;
    grid-template-areas:"brand" "tabs" "cmd" "stage" "status"
  }
  .tool{width:40px;height:38px}
  /* the dock becomes a full-width bottom sheet here, so the label column can
     stay wide enough for "Secondaries span" rather than ellipsing it */
  .row{grid-template-columns:112px 1fr}
  .row.unit{grid-template-columns:112px 1fr auto}
  .row.tri{grid-template-columns:112px 1fr 1fr 1fr}
  #vp-tl,#vp-tr,#vp-bl,#vp-br{gap:5px}
  #navcube{width:70px;height:70px}
  #legend{width:158px}
  #copyright{font-size:10.5px;left:9px;bottom:8px}
  .dlg{min-width:0;width:100%}
  .cards{grid-template-columns:1fr 1fr}
}
@media (max-width:420px){
  .cards{grid-template-columns:1fr}
  .chkgrid{grid-template-columns:repeat(2,1fr)}
}
@media (hover:none){
  .tool,.btn{min-height:38px}
  .dof6 button{padding:8px 0}
}

/* --- print -------------------------------------------------------------- */
@media print{
  #brand,#tabs,#ribbon,#rail,#dock,#status,#toasts,.vp-overlay,#tour{display:none!important}
  #app{position:static;display:block}
  #stage{position:static;height:auto}
  body{overflow:visible;background:#fff;color:#000}
  #print-sheet{display:block!important}
}
#print-sheet{display:none}

/* --- construction studio additions --------------------------------------- */

/* material swatches - the same colour coding as the 3D view */
.swatch{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25)}
.swatch.steel{background:#93a3b5} .swatch.concrete{background:#bdbab2}
.swatch.timber{background:#c9a878} .swatch.masonry{background:#b08268}

/* the four part cards - the primary navigation */
.card-sect{border:1px solid var(--line-soft);border-radius:var(--r-m);background:var(--bg-2);
  margin-bottom:9px;overflow:hidden}
.card-sect>summary{padding:9px 11px;cursor:pointer;list-style:none;display:flex;align-items:center;
  gap:8px;background:var(--bg-3);user-select:none;font-size:12px}
.card-sect>summary::-webkit-details-marker{display:none}
.card-sect>summary::before{content:"";width:0;height:0;border-left:4px solid var(--ink-2);
  border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
  transition:transform var(--dur);flex:none}
.card-sect[open]>summary::before{transform:rotate(90deg)}
.card-sect>summary svg{width:15px;height:15px;color:var(--ink-2);flex:none}
.card-sect>summary .t{font-weight:640;color:var(--ink-0);white-space:nowrap}
.card-sect>summary .s{margin-left:auto;color:var(--ink-3);font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52%}
.card-sect.alert{border-color:var(--warn)}
.card-sect.alert>summary{background:rgba(240,178,60,.12)}
.card-sect>.body{padding:10px 11px}

.syshead{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.syshead .sysname{flex:1;min-width:0}
.syshead b{display:block;font-size:12.5px;font-weight:620;color:var(--ink-0)}
.syshead .blurb{display:block;font-size:11px;color:var(--ink-2);line-height:1.5;margin-top:2px}

/* the sizing readout */
.sizing{border-radius:var(--r-m);border:1px solid var(--line);background:var(--bg-0);
  padding:9px 10px;margin:10px 0 4px;border-left-width:3px}
html[data-theme="light"] .sizing{background:var(--bg-3)}
.sizing.ok{border-left-color:var(--ok)}
.sizing.marginal{border-left-color:var(--warn)}
.sizing.over,.sizing.under{border-left-color:var(--bad)}
.sizing .head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.sizing .ttl{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2);font-weight:640}
.sizing .formula{font-family:var(--mono);font-size:12px;color:var(--ink-0);line-height:1.5;word-break:break-word}
.sizing .rule{font-size:11px;color:var(--accent);margin-top:5px;font-family:var(--mono)}
.sizing .advice{font-size:11px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.sizing .foot{font-size:10.5px;color:var(--ink-3);margin-top:6px;line-height:1.5}
.sizing .alts{margin-top:7px;font-size:11px;color:var(--ink-2)}
.chip{padding:1px 7px;border-radius:999px;font-size:10px;font-weight:640;letter-spacing:.2px;
  text-transform:uppercase;margin-left:auto;white-space:nowrap}
.chip.ok{background:rgba(78,201,139,.18);color:var(--ok)}
.chip.marginal{background:rgba(240,178,60,.2);color:var(--warn)}
.chip.over,.chip.under{background:rgba(242,100,90,.2);color:var(--bad)}
.link{background:none;border:0;padding:0 4px;color:var(--accent);cursor:pointer;font:inherit;
  text-decoration:underline}

/* system picker */
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.card.sys .top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.card.sys h5{margin:0;flex:1;font-size:12.5px}
.card.sys .tect{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:999px;padding:1px 6px}
.card.sys.dim{opacity:.5}
.card.sys.on{border-color:var(--accent);background:var(--accent-ghost)}
.card.sys .why{margin-top:7px;font-size:10.5px;color:var(--bad);line-height:1.45}
.card.sys .why.warn{color:var(--warn)}
.spanbar{margin-top:8px}
.spanbar .track{position:relative;height:5px;border-radius:3px;background:var(--bg-4)}
.spanbar .ok{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.55;border-radius:3px}
.spanbar .now{position:absolute;top:-3px;width:2px;height:11px;background:var(--accent);border-radius:1px}
.spanbar .ends{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-3);
  margin-top:3px;font-family:var(--mono)}

/* segmented controls, sliders, chips */
.seg{display:inline-flex;background:var(--bg-0);border:1px solid var(--line);
  border-radius:var(--r-m);overflow:hidden}
html[data-theme="light"] .seg{background:#fff}
.seg button{appearance:none;background:none;border:0;padding:5px 11px;cursor:pointer;
  color:var(--ink-2);font-size:11.5px;white-space:nowrap;transition:all var(--dur)}
.seg button+button{border-left:1px solid var(--line-soft)}
.seg button:hover{background:var(--bg-3);color:var(--ink-0)}
.seg button[aria-pressed="true"]{background:var(--accent-ghost);color:var(--accent);font-weight:600}
.slider{display:flex;align-items:center;gap:7px;min-width:110px}
.slider input[type=range]{flex:1;min-width:56px}
.slider .sval{font-family:var(--mono);font-size:11px;color:var(--ink-1);min-width:38px;text-align:right}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.chip-btn{appearance:none;padding:3px 7px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--bg-0);color:var(--ink-3);cursor:pointer;font-size:10.5px;font-family:var(--mono)}
.chip-btn[aria-pressed="true"]{background:var(--accent-ghost);color:var(--accent);border-color:var(--accent-dim)}
.pair{display:flex;align-items:center;gap:5px}
.pair .x{color:var(--ink-3);font-size:11px}
.presets{display:flex;gap:4px;flex-wrap:wrap}
label.inl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);white-space:nowrap}
label.inl input.tiny{width:54px;padding:3px 5px;font-size:11.5px}
label.inl .u{color:var(--ink-3)}
.hintbox{font-size:11px;color:var(--ink-2);line-height:1.5;max-width:340px}
.seqbar{display:flex;align-items:center;gap:8px;min-width:200px}
.seqbar input[type=range]{width:120px}
.seqlab{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:320px}

/* computed compatibility notes */
.notes{margin-top:4px}
.note{padding:8px 10px;border-radius:var(--r-s);font-size:11px;line-height:1.5;margin-bottom:6px;
  border-left:2px solid var(--info);background:rgba(127,140,255,.08);color:var(--ink-1)}
.note.warn{border-left-color:var(--warn);background:rgba(240,178,60,.1)}
.note.error{border-left-color:var(--bad);background:rgba(242,100,90,.1)}
.orphans{margin:6px 0;padding-left:16px;font-size:11px;color:var(--ink-2);line-height:1.7}

/* element sheet */
.crumb{font-size:11px;color:var(--ink-3);margin-bottom:8px;padding:0 2px}
.elhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.elhead b{font-size:13px}
.elhead span{font-size:11px;color:var(--ink-2)}
.pin{background:var(--accent-ghost);color:var(--accent);border-radius:999px;padding:1px 7px;font-size:10px}
.pin.manual{background:rgba(78,201,139,.18);color:var(--ok)}
.secfacts{display:flex;gap:12px;font-family:var(--mono);font-size:11px;color:var(--ink-2);margin:-2px 0 8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}

/* the build-up layer diagram */
#layer-card{padding:10px;border-top:1px solid var(--line);background:var(--bg-2);flex:none}
#layer-card[hidden]{display:none}
svg.buildup{display:block;color:var(--ink-1);max-height:340px}
svg.buildup text{font-family:var(--sans);fill:currentColor}
svg.buildup text.lab{font-size:8.2px;fill:var(--ink-1)}
svg.buildup text.dim{font-size:8.2px;font-family:var(--mono);fill:var(--ink-2)}
svg.buildup text.ttl{font-size:9.5px;font-weight:640;fill:var(--ink-0)}
svg.buildup text.tot{font-size:8.5px;font-family:var(--mono);fill:var(--ink-2)}
svg.buildup .lyr{cursor:pointer}
svg.buildup .lyr:hover rect{stroke-width:2}
svg.buildup .lyr.on rect{stroke:var(--accent);stroke-width:2.2}
svg.buildup .lyr.struct text.lab{font-weight:640;fill:var(--ink-0)}
svg.buildup .lyr.struct rect{fill-opacity:1}
svg.buildup .sbrk{stroke:var(--accent)}
svg.buildup text.scap{font-size:6.4px;font-weight:700;letter-spacing:.7px;fill:var(--accent)}
#layer-card .within{margin-top:6px;display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--ink-3)}
#layer-card .hint{margin-top:6px;font-size:10px;color:var(--ink-3)}

/* the load path */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:9px;
  font-size:11px;line-height:1.5}
.chain .lnk{padding:2px 7px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg-0);color:var(--ink-1)}
.chain .lnk.surface{border-color:#8fb8e8;color:#8fb8e8}
.chain .lnk.horizontal{border-color:#7fc9a6;color:#7fc9a6}
.chain .lnk.inclined{border-color:#e58b4a;color:#e58b4a}
.chain .lnk.vertical{border-color:#d6453f;color:#d6453f}
.chain .arw{color:var(--ink-3)}
.chip-btn.path-surface[aria-pressed="true"]{border-color:#8fb8e8;color:#8fb8e8;background:rgba(143,184,232,.14)}
.chip-btn.path-horizontal[aria-pressed="true"]{border-color:#7fc9a6;color:#7fc9a6;background:rgba(127,201,166,.14)}
.chip-btn.path-inclined[aria-pressed="true"]{border-color:#e58b4a;color:#e58b4a;background:rgba(229,139,74,.14)}
.chip-btn.path-vertical[aria-pressed="true"]{border-color:#d6453f;color:#d6453f;background:rgba(214,69,63,.14)}
#cmd .stat{font-size:11px;color:var(--ink-2);white-space:nowrap;padding:0 2px}
#cmd .stat b{font-family:var(--mono);font-size:12px;color:var(--ink-0);font-weight:640}
table.loads{font-size:10.5px;width:100%}
table.loads td,table.loads th{padding:3px 7px}
table.loads td.num{font-family:var(--mono)}
table.loads tbody tr:last-child td{font-weight:640;color:var(--ink-0)}

/* a connection's explanation, in the property sheet */
.joint{border:1px solid var(--accent-dim);border-left:3px solid var(--accent);
  border-radius:var(--r-m);background:var(--accent-ghost);padding:9px 11px;margin-bottom:11px}
.joint .jh{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.joint .jh svg{width:14px;height:14px;color:var(--accent)}
.joint .jh b{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--accent)}
.joint p{margin:0;font-size:11.5px;line-height:1.55;color:var(--ink-1)}

/* comparison */
#cmp-panel{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:8;
  background:rgba(20,26,34,.9);border:1px solid var(--line);border-radius:var(--r-m);
  padding:8px;backdrop-filter:blur(8px);max-width:min(520px,92%);box-shadow:var(--shadow-2)}
html[data-theme="light"] #cmp-panel{background:rgba(255,255,255,.94)}
#cmp-panel[hidden]{display:none}
table.cmp{font-size:10.5px}

<div id="boot"><div class="ring"></div><div id="boot-msg">Loading Construction Studio&hellip;</div></div>

<!-- A plain, non-module watchdog. If the module script never runs - which is what
     happens when a school network or a content-security policy blocks the CDN that
     serves three.js - the spinner would otherwise turn for ever. This turns that
     into an explanation and a fix. -->
<script>
window.__csBooted = false;
(function(){
  var shown = false;
  function explain(detail){
    if(shown || window.__csBooted) return;
    shown = true;
    var b = document.getElementById('boot');
    if(!b) return;
    b.innerHTML =
      '<div class="err">' +
      '<h3>The 3D engine could not be loaded</h3>' +
      'Construction Studio loads the three.js library from a content delivery network the first ' +
      'time it runs. Something on this network or page is blocking that request.' +
      '<br><br><b>What usually fixes it</b><br>' +
      '&bull; A school or office firewall blocking <code>cdn.jsdelivr.net</code> &mdash; try another ' +
      'network, or ask for that host to be allowed.<br>' +
      '&bull; A content-security policy on the page hosting this. Putting the app in its own ' +
      '<code>&lt;iframe&gt;</code> avoids the host page policy entirely.<br>' +
      '&bull; To run with no network at all, download three.js r185, put its <code>build/</code> and ' +
      '<code>examples/jsm/</code> folders beside this file, and point the import map at ' +
      '<code>./three/build/three.module.js</code>.' +
      (detail ? '<br><br><code>' + String(detail).slice(0,220) + '</code>' : '') +
      '</div>';
  }
  window.addEventListener('error', function(e){
    var t = e && e.target;
    if(t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) explain(t.src || t.href);
  }, true);
  setTimeout(function(){ explain(''); }, 15000);
})();
</script>

<script type="module">
/* ==========================================================================
   CONSTRUCTION STUDIO
   Build and visualise construction systems in timber, concrete, steel and
   masonry. For architecture students.

   (c) 2026 Karam Al-Obaidi - MIT licensed. See the notice at the top of
   this file for the full text.

   Internal units are metres and millimetres kept apart deliberately:
   geometry is in METRES, every published construction dimension (section
   depths, layer thicknesses, stud centres) is in MILLIMETRES, because that is
   how the books, the catalogues and the students all write them.
   ========================================================================== */

import * as THREE from 'three';
import { OrbitControls }  from 'three/addons/controls/OrbitControls.js';
import { OBJLoader }      from 'three/addons/loaders/OBJLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { LineSegments2 }  from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial }   from 'three/addons/lines/LineMaterial.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* ==========================================================================
   1  UNITS, HELPERS, EVENT BUS, 2D GEOMETRY
   ========================================================================== */
/* ==========================================================================
   3  UNITS
   ========================================================================== */
const U = (() => {
  const CM2 = 1e-4, CM4 = 1e-8, CM3 = 1e-6, MM = 1e-3, MPA = 1e3; // MPa -> kPa

  /** Round to n significant figures, keeping 0 as 0. */
  function sig(v, n = 4){
    if(!isFinite(v) || v === 0) return 0;
    const m = Math.pow(10, n - Math.floor(Math.log10(Math.abs(v))) - 1);
    return Math.round(v * m) / m;
  }
  /** Fixed-decimal string that never shows "-0". */
  function fx(v, d = 2){
    if(!isFinite(v)) return '—';
    const s = v.toFixed(d);
    return s === '-' + (0).toFixed(d) ? (0).toFixed(d) : s;
  }
  /** Compact engineering string: switches to exponent only when needed. */
  function eng(v, d = 2){
    if(!isFinite(v)) return '—';
    const a = Math.abs(v);
    if(a !== 0 && (a < 1e-3 || a >= 1e6)) return v.toExponential(d);
    return fx(v, a >= 100 ? Math.max(0, d - 1) : d);
  }
  /** Parse a user-typed number, tolerating commas, spaces and units. */
  function num(s, fallback = 0){
    if(typeof s === 'number') return isFinite(s) ? s : fallback;
    if(s == null) return fallback;
    const m = String(s).replace(/,/g, '.').match(/-?\d*\.?\d+(?:[eE][-+]?\d+)?/);
    return m ? parseFloat(m[0]) : fallback;
  }
  return Object.freeze({
    CM2, CM4, CM3, MM, MPA, sig, fx, eng, num,
    L:'m', F:'kN', M:'kNm', S:'kPa', Q:'kN/m²', W:'kN/m',
    /** Convert kPa back to MPa for display. */
    toMPa: v => v / 1e3,
    /** Format a length in mm for section labels. */
    mm: v => Math.round(v * 1e3)
  });
})();

/* ==========================================================================
   7  UTIL - tiny helpers shared by everything below
   ========================================================================== */
const Util = (() => {
  let seq = 0;
  const id = p => `${p}${(++seq).toString(36)}${Math.floor(performance.now()*7 % 1296).toString(36)}`;
  const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
  const lerp  = (a,b,t) => a + (b-a)*t;
  const near  = (a,b,t=1e-9) => Math.abs(a-b) <= t;
  const uniq  = a => [...new Set(a)];
  const sum   = a => a.reduce((s,v) => s+v, 0);
  function debounce(fn, ms){
    let t; const f = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
    f.cancel = () => clearTimeout(t); return f;
  }
  /** Deep clone that tolerates browsers without structuredClone. */
  const clone = typeof structuredClone === 'function'
    ? o => structuredClone(o)
    : o => JSON.parse(JSON.stringify(o));
  /** Escape for safe insertion as HTML text. */
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  return { id, clamp, lerp, near, uniq, sum, debounce, clone, esc,
           get seq(){ return seq }, set seq(v){ seq = v } };
})();

/** Minimal synchronous event bus. */
const Bus = (() => {
  const m = new Map();
  return {
    on(k, fn){ (m.get(k) || m.set(k, new Set()).get(k)).add(fn); return () => m.get(k).delete(fn); },
    off(k, fn){ m.get(k)?.delete(fn); },
    emit(k, payload){ m.get(k)?.forEach(fn => { try { fn(payload); } catch(e){ console.error(k, e); } }); }
  };
})();

/* ==========================================================================
   8  GEOM - 2D polygon toolkit used by slabs, takedown and drafting.
       All 2D points are [x, z] plan pairs. Y never appears here.
   ========================================================================== */
const Geom = (() => {
  const EPS = 1e-9;

  const sub = (a,b) => [a[0]-b[0], a[1]-b[1]];
  const dot = (a,b) => a[0]*b[0] + a[1]*b[1];
  const cross = (a,b) => a[0]*b[1] - a[1]*b[0];
  const len = a => Math.hypot(a[0], a[1]);
  const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const norm = a => { const l = len(a) || 1; return [a[0]/l, a[1]/l]; };
  const lerp2 = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];

  /** Signed area; positive when the ring winds counter-clockwise. */
  function signedArea(poly){
    let s = 0;
    for(let i = 0, n = poly.length; i < n; i++){

   --------------------------------------------------------------------------
   Lifted unchanged from the structural app, where it earned its place. Given
   two points and a roll angle it returns the member's local axis triad, and
   the branch for near-vertical members (|ex.y| > 0.999 switches the reference
   from global Y to global Z) is the one line that everything else depends on
   being right. Every extruded profile in the scene is oriented by this.

const Axes = (() => {
  /* --- direction cosines ------------------------------------------------
     The vertical-member branch below is the single most bug-prone line in
     the application. A member within about 2.6 degrees of vertical uses the
     global-Z reference; everything else uses global-Y. Benchmark 12 asserts
     that results are continuous across that switch. */
  function dirCos(pI, pJ, rollDeg, out /* Float64Array(9), row-major */){
    let ex0 = pJ[0]-pI[0], ex1 = pJ[1]-pI[1], ex2 = pJ[2]-pI[2];
    const L = Math.hypot(ex0, ex1, ex2);
    if(L < 1e-12) return 0;
    ex0 /= L; ex1 /= L; ex2 /= L;

    const vertical = Math.abs(ex1) > 0.999;
    const ux = 0, uy = vertical ? 0 : 1, uz = vertical ? 1 : 0;

    // ez = ex x up
    let ez0 = ex1*uz - ex2*uy, ez1 = ex2*ux - ex0*uz, ez2 = ex0*uy - ex1*ux;
    let n = Math.hypot(ez0, ez1, ez2) || 1;
    ez0 /= n; ez1 /= n; ez2 /= n;
    // ey = ez x ex
    let ey0 = ez1*ex2 - ez2*ex1, ey1 = ez2*ex0 - ez0*ex2, ey2 = ez0*ex1 - ez1*ex0;
    n = Math.hypot(ey0, ey1, ey2) || 1;
    ey0 /= n; ey1 /= n; ey2 /= n;

    if(rollDeg){
      const a = rollDeg*Math.PI/180, c = Math.cos(a), s = Math.sin(a);
      const y0 = ey0*c + ez0*s, y1 = ey1*c + ez1*s, y2 = ey2*c + ez2*s;
      const z0 = -ey0*s + ez0*c, z1 = -ey1*s + ez1*c, z2 = -ey2*s + ez2*c;
      ey0 = y0; ey1 = y1; ey2 = y2; ez0 = z0; ez1 = z1; ez2 = z2;
    }
    out[0]=ex0; out[1]=ex1; out[2]=ex2;
    out[3]=ey0; out[4]=ey1; out[5]=ey2;
    out[6]=ez0; out[7]=ez1; out[8]=ez2;
    return L;
  }

})();

    ['HEB 220',220,220,9.5,16.0,91.0,8091,2843,736,258,76.6],
    ['HEB 240',240,240,10.0,17.0,106,11260,3923,938,327,103],
    ['HEB 260',260,260,10.0,17.5,118.4,14920,5135,1148,395,124],
    ['HEB 280',280,280,10.5,18.0,131.4,19270,6595,1376,471,144],
    ['HEB 300',300,300,11.0,19.0,149.1,25170,8563,1678,571,185],
    ['HEB 320',320,300,11.5,20.5,161.3,30820,9239,1926,616,225],
    ['HEB 340',340,300,12.0,21.5,170.9,36660,9690,2156,646,257],
    ['HEB 360',360,300,12.5,22.5,180.6,43190,10140,2400,676,292],
    ['HEB 400',400,300,13.5,24.0,197.8,57680,10820,2884,721,356],
    ['HEB 450',450,300,14.0,26.0,218,79890,11720,3551,781,440],
    ['HEB 500',500,300,14.5,28.0,238.6,107200,12620,4287,842,538],
    ['HEB 550',550,300,15.0,29.0,254.1,136700,13080,4971,872,600],
    ['HEB 600',600,300,15.5,30.0,270,171000,13530,5701,902,667]
  ];

  function rolled(rows, shape){
    return rows.map(([name,h,b,tw,tf,A,Iy,Iz,Wely,Welz,It]) => ({
      id:name.replace(/\s+/g,''), name, family:'steel', shape,
      h:h*U.MM, b:b*U.MM, tw:tw*U.MM, tf:tf*U.MM,
      A:A*U.CM2, Iy:Iy*U.CM4, Iz:Iz*U.CM4, J:It*U.CM4,
      Wely:Wely*U.CM3, Welz:Welz*U.CM3,
      defaultMat:'S275'
    }));
  }

  /** Build a parametric section entry from a props.* result. */
  function make(id, name, family, shape, p, defaultMat, extra){
    return Object.assign({ id, name, family, shape, defaultMat }, p, extra || {});
  }

  const SECTIONS = [];
  SECTIONS.push(...rolled(IPE,'I'), ...rolled(HEA,'I'), ...rolled(HEB,'I'));

  // Square + rectangular hollow sections (hot finished)
  for(const [h,b,t] of [[80,80,4],[100,100,5],[120,120,5],[150,150,6],[200,200,8],
                        [250,250,8],[300,300,10],[150,100,6],[200,100,6],
                        [250,150,8],[300,200,8],[400,200,10]]){
    const id = `SHS${h}x${b}x${t}`, nm = (h===b?`SHS ${h}×${h}×${t}`:`RHS ${h}×${b}×${t}`);
    SECTIONS.push(make(id, nm, 'steel', 'hollow',
      props.rhs(h*U.MM, b*U.MM, t*U.MM), 'S355', { t:t*U.MM }));
  }
  // Circular hollow sections
  for(const [D,t] of [[76.1,3.2],[88.9,4],[114.3,4],[139.7,5],[168.3,6],
                      [219.1,6.3],[273,8],[323.9,8]]){
    SECTIONS.push(make(`CHS${D}x${t}`, `CHS ${D}×${t}`, 'steel', 'pipe',
      props.chs(D*U.MM, t*U.MM), 'S355', { t:t*U.MM }));
  }
  // Reinforced concrete rectangles
  for(const [b,h] of [[200,400],[250,400],[250,500],[300,500],[300,600],
                      [350,700],[400,600],[400,800],[300,300],[400,400],[500,500]]){
    SECTIONS.push(make(`RC${b}x${h}`, `RC ${b}×${h}`, 'concrete', 'rect',
      props.rect(h*U.MM, b*U.MM), 'C30'));
  }
  // Circular concrete columns
  for(const D of [300,400,500,600]){
    SECTIONS.push(make(`RCD${D}`, `RC Ø${D}`, 'concrete', 'round',
      props.circle(D*U.MM), 'C30'));
  }
  // Glulam
  for(const [b,h] of [[100,200],[100,300],[115,400],[140,400],[140,600],
                      [160,600],[200,600],[200,800]]){
    SECTIONS.push(make(`GL${b}x${h}`, `Glulam ${b}×${h}`, 'timber', 'rect',
      props.rect(h*U.MM, b*U.MM), 'GL24'));
  }
  // Sawn timber
  for(const [b,h] of [[47,150],[47,200],[63,200],[75,225],[100,250]]){
    SECTIONS.push(make(`TS${b}x${h}`, `Timber ${b}×${h}`, 'timber', 'rect',
      props.rect(h*U.MM, b*U.MM), 'C24'));
  }
  // CLT panel strips (1 m wide, used as wall / deep beam strips)
  for(const t of [100,140,200]){
    SECTIONS.push(make(`CLT${t}`, `CLT ${t} (per m)`, 'timber', 'rect',
      props.rect(t*U.MM, 1.0), 'CLT'));
  }
  // Masonry wall strips (1 m run)
  for(const t of [100,140,215,300]){
    SECTIONS.push(make(`MW${t}`, `Masonry ${t} (per m)`, 'masonry', 'rect',
      props.rect(t*U.MM, 1.0), 'MAS5'));
  }

  const SEC = Object.fromEntries(SECTIONS.map(s => [s.id, s]));

  /* --- typical slab / deck build-ups ----------------------------------- */
  const DECKS = [
    ['rc150','RC slab 150 mm','C30',0.150],
    ['rc200','RC slab 200 mm','C30',0.200],
    ['rc250','RC slab 250 mm','C30',0.250],
    ['clt140','CLT 140 mm','CLT',0.140],
    ['clt200','CLT 200 mm','CLT',0.200],
    ['deck130','Composite deck 130 mm','C30',0.130]
  ].map(([id,name,mat,t]) => ({ id, name, mat, t }));

  /** Sections offered for a given structural role, ordered by depth. */
  function forRole(role, family){
    return SECTIONS.filter(s => {
      if(family && s.family !== family) return false;
      if(role === 'column') return s.shape !== 'I' || s.id.startsWith('HEB') || s.id.startsWith('HEA');
      return true;
    });
  }

  /* --- section families, indexed by depth ------------------------------
     The sizing engine works by "find me the shallowest section at least this
     deep", so the catalogue is pre-sorted once and binary-searched. Families
     that are made to measure rather than rolled (RC, glulam, sawn timber) are
     synthesised on demand by `synth` below and memoised straight back into
     SEC, so everything downstream - including the profile extruder - handles
     them without knowing the difference. */
  const FAMILY_OF = s =>
    /^IPE/.test(s.id) ? 'IPE' : /^HEA/.test(s.id) ? 'HEA' : /^HEB/.test(s.id) ? 'HEB' :
    /^SHS/.test(s.id) ? 'SHS' : /^CHS/.test(s.id) ? 'CHS' :
    /^RCD/.test(s.id) ? 'RCD' : /^RC/.test(s.id) ? 'RC' :
    /^GL/.test(s.id) ? 'GL' : /^TS/.test(s.id) ? 'SAWN' :
    /^CLT/.test(s.id) ? 'CLT' : /^MW/.test(s.id) ? 'MAS' : 'OTHER';

  const BY_FAMILY = new Map();
  for(const s of SECTIONS){
    const f = FAMILY_OF(s);
    s.family2 = f;
    (BY_FAMILY.get(f) || BY_FAMILY.set(f, []).get(f)).push(s);
  }
  for(const list of BY_FAMILY.values()) list.sort((a,b) => a.h - b.h || a.A - b.A);

  /** Make a rectangular section to order and remember it. */
  function synth(family, h_mm, b_mm, mat){
    const id = `${family}${Math.round(b_mm)}x${Math.round(h_mm)}`;
    if(SEC[id]) return SEC[id];
    const p = props.rect(h_mm*U.MM, b_mm*U.MM);
    const nameFam = { RC:'RC', GL:'Glulam', SAWN:'Timber', MAS:'Masonry' }[family] || family;
    const s = Object.assign({ id, name:`${nameFam} ${Math.round(b_mm)}×${Math.round(h_mm)}`,
      family: family === 'RC' ? 'concrete' : family === 'MAS' ? 'masonry' : 'timber',
      family2: family, shape:'rect', defaultMat:mat, synthetic:true }, p);
    SEC[id] = s; SECTIONS.push(s);
    const list = BY_FAMILY.get(family) || BY_FAMILY.set(family, []).get(family);
    list.push(s); list.sort((a,b) => a.h - b.h || a.A - b.A);
    return s;
  }

  /** Panel "sections" - CLT, hollowcore and the like - are a depth per metre run. */
  function synthPanel(family, t_mm, mat){
    const id = `${family}P${Math.round(t_mm)}`;
    if(SEC[id]) return SEC[id];
    const p = props.rect(t_mm*U.MM, 1.0);
    const nameFam = { CLT:'CLT', HC:'Hollowcore', DT:'Double-tee', RCS:'RC slab' }[family] || family;
    const s = Object.assign({ id, name:`${nameFam} ${Math.round(t_mm)}`,
      family: family === 'CLT' ? 'timber' : 'concrete',
      family2: family, shape:'rect', defaultMat:mat, panel:true, synthetic:true }, p);
    SEC[id] = s; SECTIONS.push(s);
    return s;
  }

  return Object.freeze({
    MATERIALS, MAT, SECTIONS, SEC, DECKS, BY_FAMILY, FAMILY_OF,
    props, betaRect, forRole, synth, synthPanel,
    families: ['steel','concrete','timber','masonry'],
    familyLabel: { steel:'Steel', concrete:'Concrete', timber:'Timber', masonry:'Masonry' },
    familyColour: { steel:0x93a3b5, concrete:0xbdbab2, timber:0xc9a878, masonry:0xb08268 }
  });
})();

    ratio:'A ≈ N / f_d',
    load: c => c.Atrib * Math.max(1, c.storeys) * (c.w || 9),
    area: c => c.N / 2.5e3 * 1e6,                  // kN / kPa = m2, then mm2
    minDim: 215, round: 5,
    fmt:  (c,d,s) => `${U.fx(c.Atrib,1)} m² × ${c.storeys} × ${c.w || 9} kN/m² ` +
                     `= ${Math.round(c.N)} kN  →  ${s ? s.name : '—'}`
  },

  /* --- foundations -------------------------------------------------------- */
  'found.pad':{
    label:'Pad footing', ratio:'A = N / bearing capacity',
    source:'Bearing pressure only. Punching shear and reinforcement are not checked.',
    load: c => c.Atrib * Math.max(1, c.storeys) * (c.w || 11),
    check: c => ({ val:0, lim:1 }),
    depth: c => Math.max(400, Math.sqrt(c.N/(c.qAllow || 150))*1000*0.35),
    extra: c => {
      const B = Math.ceil(Math.sqrt(c.N*1.1/(c.qAllow || 150))/0.05)*0.05;
      return { B:Math.max(0.6, B), L:Math.max(0.6, B) };
    },
    fmt: (c,d,s,x) => `${Math.round(c.N)} kN ÷ ${c.qAllow || 150} kPa = ` +
                      `${U.fx(c.N/(c.qAllow||150),2)} m²  →  ${U.fx(x.B,2)} × ${U.fx(x.L,2)} m pad`
  },
  'found.strip':{
    label:'Strip footing', ratio:'width = load per metre / bearing capacity',
    source:'Continuous footing under a load-bearing wall.',
    depth: () => 300,
    extra: c => ({ B:Math.max(0.45, Math.ceil(((c.wLine || 40)/(c.qAllow || 150))/0.05)*0.05) }),
    fmt: (c,d,s,x) => `${Math.round(c.wLine || 40)} kN/m ÷ ${c.qAllow || 150} kPa = ` +
                      `${U.fx(x.B,2)} m wide strip`
  },
  'found.raft':{
    label:'Raft slab', ratio:'thickness ≈ span/20, minimum 300 mm',
    source:'Ground-bearing raft spreading the whole building load.',
    depth: c => Math.max(300, c.L*1000/20),
    round: 25,
    fmt: (c,d) => `${m(c.L)} ÷ 20 = ${mm(d)} raft (minimum 300 mm)`
  },
  'found.pile':{
    label:'Pile cap', ratio:'cap depth ≈ 2 × pile diameter',
    source:'Pile cap over a group of bored piles.',
    depth: c => Math.max(750, (c.pileDia || 450)*2),
    extra: c => ({ n:Math.max(1, Math.ceil(c.N/(c.pileCap || 600))), dia:c.pileDia || 450 }),
    load: c => c.Atrib * Math.max(1, c.storeys) * (c.w || 11),
    fmt: (c,d,s,x) => `${Math.round(c.N)} kN ÷ ${c.pileCap || 600} kN per pile = ` +
                      `${x.n} pile${x.n>1?'s':''} of ⌀${x.dia} mm`
  }
  };

  /** Typical total design load per storey, kN/m2 (dead + imposed). */
  const LOADING = { residential:9, office:11, retail:12, industrial:14, roof:5 };

  /* --- picking a real section ------------------------------------------- */
  function binFirstGTE(list, key, want){
    let lo = 0, hi = list.length - 1, hit = null;
    while(lo <= hi){
      const m2 = (lo+hi) >> 1;
      if(list[m2][key] >= want){ hit = list[m2]; hi = m2 - 1; } else lo = m2 + 1;
    }
    return hit;
  }

  function pick(rule, depth, c){
    // made-to-measure families are synthesised at the exact size wanted
    if(rule.panel) return LIB.synthPanel(rule.panel, depth, panelMat(rule.panel));
    if(rule.synth){
      const x = rule.extra ? rule.extra(c, depth) : {};
      const b = rule.square ? depth : (x.b || Math.round(depth*0.5/25)*25);
      return LIB.synth(rule.synth, depth, b, synthMat(rule.synth));
    }
    if(!rule.family) return null;
    for(const f of rule.family){
      const list = LIB.BY_FAMILY.get(f);
      if(!list || !list.length) continue;
      const hit = rule.byArea ? binFirstGTE(list, 'A', c.areaWanted)
                              : binFirstGTE(list, 'h', depth/1000);
      if(hit) return hit;
    }
    // nothing deep enough in the catalogue: hand back the deepest and let grade() flag it
    const list = LIB.BY_FAMILY.get(rule.family[0]);
    return list && list.length ? list[list.length-1] : null;
  }
  const panelMat = f => ({ CLT:'CLT', HC:'C40', RCS:'C30', DT:'C40' }[f] || 'C30');
  const synthMat = f => ({ RC:'C30', GL:'GL24', SAWN:'C24', MAS:'MAS10' }[f] || 'C30');

  const nearestUp = (list, v) => list.find(x => x >= v) ?? list[list.length-1];

  /* --- grading ----------------------------------------------------------- */
  const COPY = {
    ok:       'Comfortably within the normal range for this system.',
    marginal: 'Buildable, but stretched. Expect deeper members, more material, or a tighter grid.',
    over:     'Beyond what this system normally does.',
    under:    'This system is heavier than the span needs — something lighter would do.'
  };

  function grade(rule, c, depth, sec){
    if(rule.check){
      const { val, lim } = rule.check(c);
      if(!lim) return 'ok';
      return val <= lim*0.85 ? 'ok' : val <= lim ? 'marginal' : 'over';
    }
    const s = rule.span;
    if(!s) return 'ok';
    const L = c.L ?? c.ln ?? c.h ?? 0;
    if(L < s.min) return 'under';
    if(L > s.max) return 'over';
    if(L < s.ok[0] || L > s.ok[1]) return 'marginal';
    if(!rule.assembly && sec && !sec.panel && sec.h*1000 < depth*0.95) return 'marginal';
    return 'ok';
  }

  /* --- the entry point ---------------------------------------------------- */
  function size(ruleId, c){
    const rule = R[ruleId];
    if(!rule) return { ruleId, depth:0, status:'ok', formula:'—', rule:'' };
    c = Object.assign({ storeys:1, w:LOADING.office }, c);

    if(rule.load) c.N = rule.load(c);
    if(rule.area) c.areaWanted = rule.area(c)*1e-6;        // mm2 -> m2

    let depth = rule.depth ? rule.depth(c) : 0;
    if(rule.area && !rule.depth) depth = Math.sqrt(rule.area(c));   // square column side, mm
    if(rule.list)       depth = nearestUp(rule.list, depth);
    else if(rule.round) depth = Math.ceil(depth/rule.round)*rule.round;
    if(rule.minDim)     depth = Math.max(depth, rule.minDim);

    const extra = rule.extra ? rule.extra(c, depth) : {};
    // an assembly depth (a truss, a raft) is not the depth of any one member,
    // so it must not be used to look a section up
    const sec   = rule.assembly ? null : pick(rule, depth, Object.assign({}, c, extra));
    const status = grade(rule, c, depth, sec);

    return Object.assign({
      ruleId, depth, N:c.N, section:sec, sectionId:sec ? sec.id : null,
      rule:rule.ratio || '', label:rule.label, source:rule.source, note:rule.note,
      status, advice:COPY[status],
      formula: rule.fmt ? rule.fmt(c, depth, sec, extra) : mm(depth)
    }, extra);
  }

  /** Sections a couple of sizes either side, for the "or try…" row. */
  function nearby(ruleId, sec, n = 1){
    const rule = R[ruleId];
    if(!rule || !sec || !rule.family) return [];
    const list = LIB.BY_FAMILY.get(sec.family2);
    if(!list) return [];
    const i = list.indexOf(sec);
    return [list[i-n], list[i+n]].filter(Boolean);
  }

  return { R, LOADING, size, nearby, pick, grade, COPY };
})();

/** Total build-up thickness in mm, ignoring layers that sit inside another. */
function buildUpTotal(key, over){
  const B = BUILDUPS[key]; if(!B) return 0;
  return B.layers.reduce((s, l) => s + (l.within ? 0 : ((over && over[l.k]) ?? l.t)), 0);
}
/** The structural layers only. */
const buildUpStruct = key => (BUILDUPS[key]?.layers || []).filter(l => l.struct);

  timber:0xc9a878, concrete:0xbdbab2, steel:0x93a3b5, masonry:0xb08268,
  insul:0xf0d98a, board:0xe2e4e6, metal:0xa8b4c0, void:0x000000
};

/* ==========================================================================
   6  MODEL - the whole building is four choices and a grid
   ==========================================================================
   The document is deliberately tiny. Everything you can see in the viewport
   is derived from it; nothing generated is ever stored. That is what makes
   save files small, undo cheap, and "change one parameter and watch the rest
   adapt" possible at all.
   ========================================================================== */
const DOC_VERSION = 1;
/* Ching's four parts, with the ground floor separated out. It behaves nothing
   like an upper floor - it sits on the ground rather than spanning, and the
   choice between a ground-bearing slab and a suspended one is one of the first
   a student has to make - so it earns its own slot. */
const PARTS = ['foundation','groundFloor','vertical','floor','roof'];
const PART_LABEL = { foundation:'Foundation', groundFloor:'Ground floor',
                     vertical:'Wall & Structure', floor:'Floor', roof:'Roof' };

const Model = (() => {

  function emptyDoc(name = 'Untitled building'){
    return {
      format:'construction-studio', version:DOC_VERSION, app:'1.0.1',
      savedAt:new Date().toISOString(),
      meta:{ name, author:'', notes:'' },
      grid:{ bx:3, bz:3, sx:7.5, sz:7.5 },
      levels:{ storeys:3, height:3.9, ground:0 },
      use:'office',
      soil:{ qAllow:150 },
      slots:{
        foundation:{ sys:'foundation.concrete.pad',  p:{} },
        groundFloor:{ sys:'ground.concrete.slab',    p:{} },
        vertical:  { sys:'vertical.steel.moment',   p:{} },
        floor:     { sys:'floor.steel.composite',    p:{} },
        roof:      { sys:'roof.steel.deck',          p:{} }
      },
      perLevel:{},              // { L2: { floor:{ sys:'floor.timber.clt' } } }
      edits:{},                 // { address: { sectionId, mat, del } }
      manual:[],                // elements the student drew: never regenerated
      underlays:[]
    };
  }

  /* --- the grid -----------------------------------------------------------
     Built fresh on every generation. Cheap, and it means no stale cached
     coordinates can ever survive a parameter change. */
  function makeGrid(g){
    const xs = [], zs = [];
    for(let i = 0; i <= g.bx; i++) xs.push(U.sig(i*g.sx, 8));
    for(let j = 0; j <= g.bz; j++) zs.push(U.sig(j*g.sz, 8));
    const labX = i => String.fromCharCode(65 + (i % 26));
    const labZ = j => String(j + 1);
    const W = xs[xs.length-1], D = zs[zs.length-1];

    return {
      xs, zs, labX, labZ, W, D,
      nx:xs.length, nz:zs.length, bx:g.bx, bz:g.bz, sx:g.sx, sz:g.sz,
      outline:Geom.rect(0, 0, W, D),
      area:W*D,
      /** Longest bay in a direction — what a one-way system must span. */
      maxStep:d => d === 'x' ? g.sx : g.sz,
      /** The short direction, which is where a one-way system should span. */
      shortDir: g.sx <= g.sz ? 'x' : 'z',
      node:(i,j) => [xs[i], zs[j]],
      /** Corner label like "B2". */
      ref:(i,j) => labX(i) + labZ(j),
      /** Every grid node. */
      forEachNode(fn){ for(let i = 0; i < xs.length; i++) for(let j = 0; j < zs.length; j++) fn([xs[i],zs[j]], i, j); },
      /** Every bay, as a rectangle. */
      forEachBay(fn){
        for(let i = 0; i < xs.length-1; i++) for(let j = 0; j < zs.length-1; j++)
          fn({ x0:xs[i], x1:xs[i+1], z0:zs[j], z1:zs[j+1],
               w:xs[i+1]-xs[i], d:zs[j+1]-zs[j],
               poly:Geom.rect(xs[i], zs[j], xs[i+1], zs[j+1]),
               mid:[(xs[i]+xs[i+1])/2, (zs[j]+zs[j+1])/2] }, i, j);
      },
      /** Every beam-length segment along grid lines, in one direction. */
      forEachSpan(dir, fn){
        if(dir === 'x'){
          for(let j = 0; j < zs.length; j++) for(let i = 0; i < xs.length-1; i++)
            fn([xs[i], zs[j]], [xs[i+1], zs[j]], i, j);
        } else {
          for(let i = 0; i < xs.length; i++) for(let j = 0; j < zs.length-1; j++)
            fn([xs[i], zs[j]], [xs[i], zs[j+1]], i, j);
        }
      },
      /** The perimeter, as wall-length segments between grid nodes. */
      perimeterSegs(){
        const out = [];
        for(let i = 0; i < xs.length-1; i++){
          out.push({ a:[xs[i],0],   b:[xs[i+1],0],   side:'S', i, j:0 });
          out.push({ a:[xs[i+1],D], b:[xs[i],D],     side:'N', i, j:g.bz });
        }
        for(let j = 0; j < zs.length-1; j++){
          out.push({ a:[W,zs[j]],   b:[W,zs[j+1]],   side:'E', i:g.bx, j });
          out.push({ a:[0,zs[j+1]], b:[0,zs[j]],     side:'W', i:0, j });
        }
        return out;
      },
      /** Tributary area of the grid node (i,j) — the classic bay-midpoint rule. */
      tribArea(i, j){
        const dx = ((xs[i]-(xs[i-1] ?? xs[i]))/2) + (((xs[i+1] ?? xs[i])-xs[i])/2);
        const dz = ((zs[j]-(zs[j-1] ?? zs[j]))/2) + (((zs[j+1] ?? zs[j])-zs[j])/2);
        return Math.max(dx*dz, 0.5);
      }
    };
  }

  /** Levels, bottom-up. Level 0 is the ground; the last one is the roof. */
  function makeLevels(L){
    const out = [];
    for(let i = 0; i <= L.storeys; i++)
      out.push({ id:i === 0 ? 'L0' : (i === L.storeys ? 'RF' : 'L' + i),
                 idx:i, name:i === 0 ? 'Ground' : (i === L.storeys ? 'Roof' : 'Level ' + i),
                 y:U.sig(L.ground + i*L.height, 8), storey:L.height,
                 isGround:i === 0, isRoof:i === L.storeys });
    return out;
  }

  /**
   * Fills in any slot a document is missing. Templates, older saved files and
   * anything built by hand all come through here, so adding a part to PARTS
   * can never again leave a document half-populated.
   */
  function fillSlots(doc){
    const base = emptyDoc();
    doc.slots = doc.slots || {};
    for(const part of PARTS) if(!doc.slots[part]) doc.slots[part] = base.slots[part];
    return doc;
  }

  /* --- (de)serialisation ------------------------------------------------- */
  /* `generator` is a fixed string, deliberately. `savedAt` is the one field
     allowed to move between two otherwise identical saves; adding a second
     clock here would make every file differ for no reason. It says which tool
     wrote the file - it claims nothing over the building, which is the
     student's, and it is separate from meta.author, which is theirs to fill. */
  const GENERATOR = 'Construction Studio - © Karam Al-Obaidi - MIT licensed';

  const serialize = doc => Object.assign(Util.clone(doc),
    { savedAt:new Date().toISOString(), version:DOC_VERSION, generator:GENERATOR });

  function deserialize(raw){
    const doc = typeof raw === 'string' ? JSON.parse(raw) : Util.clone(raw);
    if(doc.format !== 'construction-studio')
      throw new Error('That file is not a Construction Studio building.');
    if(doc.version > DOC_VERSION)
      throw new Error(`Saved by a newer version of Construction Studio (v${doc.version}).`);
    const base = emptyDoc();
    doc.grid   = Object.assign({}, base.grid, doc.grid);
    doc.levels = Object.assign({}, base.levels, doc.levels);
    doc.soil   = Object.assign({}, base.soil, doc.soil);
    doc.slots  = Object.assign({}, base.slots, doc.slots);
    doc.perLevel = doc.perLevel || {};
    doc.edits  = doc.edits || {};
    doc.manual = doc.manual || [];
    doc.underlays = doc.underlays || [];
    // older files predate the transform, and a file written by hand may omit
    // any of it; every import is placeable, so every import gets the numbers
    for(const u of doc.underlays){
      const T = u.transform || (u.transform = {});
      for(const [k, v] of Object.entries({ x:0, y:0, z:0, rot:0, s:1 }))
        if(typeof T[k] !== 'number') T[k] = v;
    }
    return doc;
  }

  /* Section and material lookups. Anything that asks for one it does not
     recognise gets a sensible default rather than a crash - a missing section
     should not take the whole viewport down. */
  const sec = id => LIB.SEC[id] || LIB.SECTIONS[0];
  const mat = id => LIB.MAT[id] || LIB.MATERIALS[0];

  return { emptyDoc, fillSlots, makeGrid, makeLevels, serialize, deserialize, sec, mat,
           PARTS, PART_LABEL, DOC_VERSION };
})();

/* ==========================================================================
   7  STORE - document, selection, snapshot undo
   ==========================================================================
   Undo is a whole-document snapshot rather than a command pair. The document
   is a few kilobytes of parameters, so cloning it is free, and every mutation
   - change a system, drag a slider, edit one beam, import a plan - is
   correctly undoable with no per-operation inverse to get wrong.
   Underlay images live outside the snapshot; otherwise a 3 MB plan would be
   cloned forty times over.
   ========================================================================== */
const Store = (() => {
  let doc = Model.emptyDoc();
  let selection = new Set();
  const assets = new Map();
  const past = [], future = [];
  const LIMIT = 40;
  let coalesce = null, dirty = false;

  const strip = d => Util.clone({ ...d, underlays:d.underlays.map(u => ({ ...u, data:null })) });
  const restore = d => { for(const u of d.underlays) if(assets.has(u.id)) u.data = assets.get(u.id); return d; };

  const api = {
    get doc(){ return doc },
    get selection(){ return selection },
    get assets(){ return assets },
    get isDirty(){ return dirty },

    checkpoint(label){
      past.push({ label, snap:strip(doc) });
      if(past.length > LIMIT) past.shift();
      future.length = 0; coalesce = null;
    },
    /** One undo step for a whole gesture — a slider drag, a gizmo move. */
    begin(tag){ if(coalesce !== tag){ this.checkpoint(tag); coalesce = tag; } },
    end(){ coalesce = null; },

    touch(what = 'model'){ dirty = true; Bus.emit('doc:changed', what); },
    markClean(){ dirty = false; Bus.emit('doc:clean'); },

    canUndo:() => past.length > 0,
    canRedo:() => future.length > 0,
    undoLabel:() => past.length ? past[past.length-1].label : null,

    undo(){
      if(!past.length) return false;
      const e = past.pop();
      future.push({ label:e.label, snap:strip(doc) });
      doc = restore(e.snap); selection.clear(); dirty = true;
      Bus.emit('doc:changed', 'undo'); Bus.emit('selection', selection);
      return true;
    },
    redo(){
      if(!future.length) return false;
      const e = future.pop();
      past.push({ label:e.label, snap:strip(doc) });
      doc = restore(e.snap); selection.clear(); dirty = true;
      Bus.emit('doc:changed', 'redo'); Bus.emit('selection', selection);
      return true;
    },

    load(newDoc){
      past.length = 0; future.length = 0; assets.clear();
      doc = Model.fillSlots(newDoc); selection.clear(); dirty = false;
      Bus.emit('doc:loaded', doc); Bus.emit('doc:changed', 'load');
    },

    select(ids, mode = 'replace'){
      const list = Array.isArray(ids) ? ids : ids ? [ids] : [];
      if(mode === 'replace'){ selection.clear(); list.forEach(i => selection.add(i)); }
      else if(mode === 'add') list.forEach(i => selection.add(i));
      else if(mode === 'toggle') list.forEach(i => selection.has(i) ? selection.delete(i) : selection.add(i));
      Bus.emit('selection', selection);
    },
    clearSelection(){ selection.clear(); Bus.emit('selection', selection); },

    /** Read the parameters for a slot, with any per-level override folded in. */
    slot(part, levelId){
      const base = doc.slots[part] || { sys:null, p:{} };
      const over = levelId && doc.perLevel[levelId] && doc.perLevel[levelId][part];
      if(!over) return base;
      return { sys:over.sys || base.sys, p:Object.assign({}, base.p, over.p) };
    }
  };
  return api;
})();

/* ==========================================================================
   8  SYSTEMS - the catalogue
   ==========================================================================
   Four slots make a building: foundation, vertical, floor, roof. Ching's
   taxonomy calls the second one "wall", but in a steel-framed building the
   wall is cladding hung off columns and the columns would have nowhere to
   live - so the slot is VERTICAL, labelled "Wall & Structure", and it owns
   everything that stands up.

   Composition needs no special cases because each system declares only two
   things about how it joins the others:

       provides : 'lines' | 'points'          what a vertical system holds up with
       bears    : 'lines' | 'points' | 'either'   what a horizontal system needs

   A masonry wall provides lines; timber joists bear on either; they compose.
   A composite steel floor bears on points, so on masonry walls the app says
   so - and that message is computed, not written out twenty times.

   Every build() emits PLANS, never geometry. A wall's 216 studs are one plan
   with a count and a step vector, which is why regeneration stays instant.
   ========================================================================== */

/* --- plan helpers, shared by every system ------------------------------- */
const P3 = (p2, y) => [p2[0], y, p2[1]];

function mem(ctx, role, a, b, sec, mat, o){
  ctx.out(Object.assign({
    kind:'member', role, a, b, roll:0,
    sectionId:sec && sec.id ? sec.id : sec, mat,
    layer:ctx.layer, level:ctx.level.id
  }, o));
}
function runOf(ctx, role, a, b, count, step, sec, mat, o){
  if(count < 1) return;
  ctx.out(Object.assign({
    kind:'run', role, a, b, count, step,
    sectionId:sec && sec.id ? sec.id : sec, mat, roll:0,
    layer:ctx.layer, level:ctx.level.id
  }, o));
}
function panel(ctx, role, poly, y, thk, mat, o){
  ctx.out(Object.assign({ kind:'panel', role, poly, y, thk, mat,
    layer:ctx.layer, level:ctx.level.id }, o));
}
function wallOf(ctx, role, a, b, y, h, thk, buildUp, mat, o){
  ctx.out(Object.assign({ kind:'wall', role, a, b, y, h, thk, buildUp, mat,
    layer:ctx.layer, level:ctx.level.id }, o));
}

/** Spread n repeats evenly across a span, excluding the two ends. */
function interior(n, from, to){
  const out = [];
  for(let i = 1; i <= n; i++) out.push(from + (to-from)*i/(n+1));
  return out;
}
/** How many members at `spacing` fit across `width`, excluding the ends. */
const countAt = (width, spacing) => Math.max(0, Math.round(width/spacing) - 1);

const SYSTEMS = {};
const def = s => { SYSTEMS[s.id] = s; return s; };

/**
 * One-way systems span the SHORT direction by default, because that is what a
 * designer would do. "Auto" keeps that link live as the grid changes, rather
 * than silently freezing whichever direction happened to be short at the time.
 */
const SPAN_DIR = [{ value:'auto', label:'Auto' },
                  { value:'x',    label:'X' },
                  { value:'z',    label:'Z' }];

/* ==========================================================================

   ========================================================================== */

def({
  id:'foundation.concrete.pad', part:'foundation', material:'concrete',
  label:'Pad foundations', tectonic:'solid',
  blurb:'An isolated pad under each column, sized to spread its load over the ground.',
  needs:'points',
  span:{ min:0, ok:[0,99], max:99 },
  params:[
    { k:'depth', label:'Pad depth', type:'num', unit:'m', def:0.5, min:0.3, max:1.5, step:0.05 },
    { k:'below', label:'Founding depth', type:'num', unit:'m', def:1.0, min:0.5, max:3, step:0.1 }
  ],
  sizing:{ pad:'found.pad' }, layer:0, seq:0,
  build(ctx){
    const { grid, p, size, base, M, storeys } = ctx;
    const pts = base.points.length ? base.points
              : grid.outline.map((q,i) => ({ p:q, i, j:0 }));
    for(const pt of pts){
      const z = size('found.pad', { Atrib:pt.trib || grid.tribArea(pt.i, pt.j),
                                    storeys, w:SIZING.LOADING[M.use], qAllow:M.soil.qAllow });
      const B = z.B || 1.2;
      ctx.out({ kind:'volume', role:'pad', layer:0, level:'L0',
        poly:Geom.rect(pt.p[0]-B/2, pt.p[1]-B/2, pt.p[0]+B/2, pt.p[1]+B/2),
        y:-p.below - p.depth, h:p.depth, mat:'C30',
        addr:ctx.A('pad', pt.i, pt.j), meta:z,
        label:`${U.fx(B,2)} × ${U.fx(B,2)} m pad` });
    }
    // Only when Gen's own `needs` check stays quiet - that is, the building really
    // does stand on columns, but has some load-bearing walls too. If it stands on
    // walls, Gen already says so and this would just repeat it.
    if(base.lines.length && base.kind === 'points') ctx.note('info',
      'There are load-bearing walls here too, and they need a strip footing under them.');
  }
});

def({
  id:'foundation.masonry.strip', part:'foundation', material:'concrete',
  label:'Strip footings', tectonic:'solid',
  blurb:'A continuous footing following every load-bearing wall.',
  needs:'lines',
  params:[
    { k:'depth', label:'Footing depth', type:'num', unit:'m', def:0.3, min:0.2, max:0.8, step:0.05 },
    { k:'below', label:'Founding depth', type:'num', unit:'m', def:0.9, min:0.45, max:2.5, step:0.05 }
  ],
  sizing:{ strip:'found.strip' }, layer:0, seq:0,
  build(ctx){
    const { p, size, base, M } = ctx;
    const wLine = 12 * Math.max(1, ctx.storeys);      // kN/m, rough wall line load
    const z = size('found.strip', { wLine, qAllow:M.soil.qAllow });
    const B = z.B || 0.6;
    base.lines.forEach((ln, i) => {
      const n = Geom.normalOf(ln.a, ln.b);
      const poly = [
        [ln.a[0]+n[0]*B/2, ln.a[1]+n[1]*B/2], [ln.b[0]+n[0]*B/2, ln.b[1]+n[1]*B/2],
        [ln.b[0]-n[0]*B/2, ln.b[1]-n[1]*B/2], [ln.a[0]-n[0]*B/2, ln.a[1]-n[1]*B/2]];
      ctx.out({ kind:'volume', role:'strip', layer:0, level:'L0', poly,
        y:-p.below - p.depth, h:p.depth, mat:'C30',
        addr:ctx.A('strip', i), meta:z, label:`${U.fx(B,2)} m wide strip` });
    });
    // No note here when there are no walls to follow: Gen already emits one from
    // this system's declarative `needs`, and two near-identical warnings for the
    // same condition read as a bug.
  }
});

def({

                                     w:SIZING.LOADING[M.use], pileDia:p.dia });
      const cap = Math.max(1.2, 0.9 + (z.n-1)*0.6);
      ctx.out({ kind:'volume', role:'cap', layer:0, level:'L0',
        poly:Geom.rect(pt.p[0]-cap/2, pt.p[1]-cap/2, pt.p[0]+cap/2, pt.p[1]+cap/2),
        y:-1.2 - z.depth/1000, h:z.depth/1000, mat:'C30',
        addr:ctx.A('cap', pt.i, pt.j), meta:z, label:`${z.n}-pile cap` });
      const d = p.dia/1000, off = z.n > 1 ? 0.45 : 0;
      for(let k = 0; k < z.n; k++){
