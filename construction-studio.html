/* ==========================================================================
   26  BOOT - DOM, input, startup
   ========================================================================== */
(function boot(){
  window.__csBooted = true;
  const D = UI.dom;
  Object.assign(D, {
    app:$('#app'), boot:$('#boot'), stage:$('#stage'), gl:$('#gl'), labels:$('#labels'),
    tabs:$('#tabs'), ribbon:$('#cmd'), dock:$('#dock'), layerHost:$('#layer-card'),
    modal:$('#modalhost'), toasts:$('#toasts'), filepick:$('#filepick'),
    projName:$('#proj-name'), qUndo:$('#q-undo'), qRedo:$('#q-redo'),
    stCount:$('#st-count'), stDetail:$('#st-detail'), stEdits:$('#st-edits'),
    stMs:$('#st-ms'), cmpTable:$('#cmp-table'), hint:$('#hint')
  });

  const prefs = IO.prefs();
  document.documentElement.dataset.theme = prefs.theme ||
    (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  if(prefs.view) Object.assign(View.state, prefs.view);

  try { Render.init(D.gl, D.stage, D.labels); }
  catch(e){
    D.boot.innerHTML = `<div class="err"><h3>This browser cannot run the 3D view</h3>` +
      `Construction Studio needs WebGL. Try a recent Chrome, Firefox, Edge or Safari and check ` +
      `that hardware acceleration is on.<br><br><code>${Util.esc(e.message)}</code></div>`;
    return;
  }
  Render._rebuildHook = () => App.rebuild();
  Render.setCamera(View.state.camera);

  /* --- chrome wiring ---------------------------------------------------- */
  $$('#tabs .tab').forEach(b => b.onclick = () => { App.tab = b.dataset.tab; });
  $('#q-new').onclick   = () => App.newBuilding();
  $('#q-open').onclick  = () => IO.openFile();
  $('#q-save').onclick  = () => IO.saveFile();
  $('#q-png').onclick   = () => Draft.sheetDialog();
  $('#q-help').onclick  = () => Tour.start();
  $('#q-theme').onclick = () => App.toggleTheme();
  D.qUndo.onclick = () => Store.undo();
  D.qRedo.onclick = () => Store.redo();
  D.projName.oninput = () => { Store.doc.meta.name = D.projName.value; IO.autosave(); };
  $('#q-dock').onclick = () => $('#side').classList.toggle('open');

  $$('#seg-detail-vp button').forEach(b => b.onclick = () => View.set('detail', b.dataset.v));
  $$('#seg-style-vp button').forEach(b => b.onclick = () => View.set('style', b.dataset.v));
  $$('#navcube button').forEach(b => b.onclick = () => {
    const v = b.dataset.view;
    if(v === 'fit') Render.fit(); else Render.standardView(v);
  });
  for(const k of ['explode','open']){
    const sl = $('#vp-' + k), out = $(`#vp-${k}-val`);
    sl.oninput = e => {
      App.dragging = true;
      View.set(k, parseFloat(e.target.value));
      out.textContent = `${Math.round(e.target.value*100)}%`;
    };
    sl.onchange = () => { App.dragging = false; };
  }

  /* --- pointer ----------------------------------------------------------- */
  let down = null, moved = false;
  D.gl.addEventListener('pointerdown', ev => {
    if(ev.button !== 0) return;
    // an armed tool owns the pointer outright - see App.setTool
    if(App.tool){ ev.preventDefault(); D.gl.setPointerCapture(ev.pointerId);
                  App.tool.down && App.tool.down(ev); return; }
    down = { x:ev.clientX, y:ev.clientY, t:performance.now() }; moved = false;
  });
  D.gl.addEventListener('pointermove', ev => {
    if(App.tool){ App.tool.move && App.tool.move(ev); return; }
    if(down && Math.hypot(ev.clientX-down.x, ev.clientY-down.y) > 4) moved = true;
  });
  D.gl.addEventListener('pointerup', ev => {
    if(App.tool){ App.tool.up && App.tool.up(ev); return; }
    const click = down && !moved && (performance.now() - down.t) < 700;
    down = null;
    if(!click) return;
    const hit = Pick.at(ev);
    if(hit){
      Store.select([hit.addr], ev.shiftKey ? 'add' : 'replace');
      Dock.mode = 'element';
      const pl = Realize.planFor(hit.addr);
      if(pl) UI.dom.hint.textContent = `${pl.label || pl.role} · ${hit.addr}`;
    } else {
      Store.clearSelection();
      Dock.mode = 'building';
      LayerDiagram.hide();
      UI.dom.hint.textContent = '';
    }
  });
  D.gl.addEventListener('dblclick', () => { if(!App.tool) Render.fit(); });
  // Escape puts the pointer back where it belongs
  window.addEventListener('keydown', ev => {
    if(ev.key === 'Escape' && App.tool && !UI.isModalOpen()) App.setTool(null);
  });

  /* --- drag and drop ------------------------------------------------------ */
  ['dragover','dragenter'].forEach(t => D.stage.addEventListener(t, e => {
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }));
  D.stage.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0]; if(!f) return;
    const n = f.name.toLowerCase(), r = new FileReader();
    if(/\.json$/.test(n)){
      r.onload = () => { try { Store.load(Model.deserialize(r.result)); UI.toast('Building opened.', 'ok'); }
                         catch(err){ UI.toast(err.message, 'bad', 7000); } };
      r.readAsText(f);
    } else if(/\.obj$/.test(n)){
      r.onload = () => {
        const o = new OBJLoader().parse(r.result);
        o.traverse(x => { if(x.isMesh) x.material = new THREE.MeshStandardMaterial({
          color:0x6f7c8c, transparent:true, opacity:0.28, side:THREE.DoubleSide, depthWrite:false }); });
        Render.groups.context.add(o); Render.fit(); UI.toast('OBJ loaded as context.', 'ok'); };
      r.readAsText(f);
    } else if(/\.dxf$/.test(n)){
      UI.toast('Use Context → DXF plan so you can map the layers.', 'info', 5000);
    } else if(/^image\//.test(f.type)){
      UI.toast('Use Context → Plan image so it can be scaled.', 'info', 5000);
    }
  });

  /* --- keyboard ----------------------------------------------------------- */
  addEventListener('keydown', ev => {
    const tag = (ev.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
    const mod = ev.ctrlKey || ev.metaKey;
    if(ev.key === 'Escape'){
      if(UI.isModalOpen()) return UI.close();
      if(Compare.on) return Compare.close();
      Store.clearSelection(); Dock.mode = 'building'; LayerDiagram.hide();
      return;
    }
    if(typing) return;
    if(mod && ev.key.toLowerCase() === 'z' && !ev.shiftKey){ ev.preventDefault(); Store.undo(); return; }
    if(mod && (ev.key.toLowerCase() === 'y' || (ev.key.toLowerCase() === 'z' && ev.shiftKey))){
      ev.preventDefault(); Store.redo(); return; }
    if(mod && ev.key.toLowerCase() === 's'){ ev.preventDefault(); IO.saveFile(); return; }
    if(mod && ev.key.toLowerCase() === 'o'){ ev.preventDefault(); IO.openFile(); return; }
    const k = ev.key.toLowerCase();
    if(k === '1') View.set('detail','diagram');
    else if(k === '2') View.set('detail','members');
    else if(k === '3') View.set('detail','full');
    else if(k === 'f') Render.fit();
    else if(k === 'e') View.set('explode', View.state.explode > 0.5 ? 0 : 1);
    else if(k === 'x'){ View.set('section', { on:!View.state.section.on }); App.refreshChrome(); }
    else if(k === ' '){ ev.preventDefault(); Seq.playing ? Seq.stop() : Seq.play(); App.refreshChrome(); }
  });

  /* --- resize and visibility ---------------------------------------------- */
  new ResizeObserver(Util.debounce(() => {
    Render.resize();
    Render.scene.traverse(o => { if(o.material && o.material.isLineMaterial)
      o.material.resolution.set(D.stage.clientWidth, D.stage.clientHeight); });
  }, 60)).observe(D.stage);
  addEventListener('resize', Util.debounce(() => Render.resize(), 80));
  new IntersectionObserver(es => Render.setOnScreen(es[0].isIntersecting), { threshold:0 }).observe(D.stage);
  document.addEventListener('visibilitychange',
    () => Render.setOnScreen(document.visibilityState === 'visible'));

  /* --- bus ---------------------------------------------------------------- */
  Bus.on('doc:changed', () => { App.rebuildSoon(); IO.autosave(); });
  Bus.on('doc:loaded', () => { Dock.mode = 'building'; LayerDiagram.hide();
                               App.rebuild({ fit:true }); });
  Bus.on('selection', () => { App.highlightSelection(); Dock.render(); });
  Bus.on('view', () => App.refreshChrome());
  Bus.on('view:rebuild', () => App.rebuild());
  Bus.on('toast', p => UI.toast(p.msg, p.kind || 'info', p.ms));
  Bus.on('gl:lost', () => UI.toast('Graphics context lost — rebuilding the view…', 'warn', 5000));
  Bus.on('gl:restored', () => UI.toast('Graphics restored.', 'ok'));
  Bus.on('seq', s => { const l = $('#seq-label');
    if(l) l.textContent = s.at == null ? `${s.steps.length} steps`
      : `${s.at+1}/${s.steps.length}  ${(s.step || {}).title || ''}` +
        ((s.step && s.step.note) ? `  —  ${s.step.note}` : ''); });
  /* Picking a band out of the layer drawing. Two things can draw a layer: a
     wall, which is built as a real stack of layers and so has a `~layer`
     sub-address, or a member whose role the layer names (joists, purlins, a
     slab). A layer that is neither - a raised access floor, a suspended ceiling -
     is real construction this app does not model, and saying so is better than
     a toast claiming something happened. */
  Bus.on('layer:pick', ({ key, sub, label }) => {
    const walls = Gen.plans.filter(p => p.buildUp === key && p.kind === 'wall');
    let want = walls.map(p => p.addr + '~' + sub);

    if(!want.length){
      const B = BUILDUPS[key];
      const L = B && B.layers.find(l => l.k === sub);
      const mine = new Set(Object.values(SYSTEMS)
        .filter(x => x.buildUp === key).map(x => x.id));
      if(L && L.role)
        want = Gen.plans.filter(p => mine.has(p.system) && p.role === L.role).map(p => p.addr);
    }

    if(!want.length){
      UI.toast(`${label || sub} is part of the drawing only — this app does not ` +
               `model it in 3D.`, 'warn', 4000);
      Realize.highlight([]);
      return;
    }
    Realize.highlight(want, 0xf0b23c);
    UI.toast(`${want.length} element${want.length>1?'s':''} — ${label || sub}.`, 'ok', 2500);
  });
  Bus.on('compare', c => {
    const t = $('#cmp-panel');
    if(!t) return;
    t.hidden = !c.on;
    if(c.on){ t.textContent = ''; const tb = Compare.table(); if(tb) t.appendChild(tb); }
  });
  Bus.on('realized', () => { /* stats picked up by refreshChrome */ });

  // the comparison view takes over drawing when it is open
  Render.renderHook = () => Compare.render();

  /* --- start --------------------------------------------------------------- */
  const params = new URLSearchParams(location.search);
  const restored = IO.restore ? (() => { try { return IO.restore(); } catch(e){ return null; } })() : null;
  let doc = null;
  try { doc = restored && restored.format === 'construction-studio' ? restored : null; } catch(e){}
  if(!doc) doc = App.TEMPLATES.find(t => t.id === 'office').make();

  Store.load(doc);
  D.app.hidden = false;
  D.boot.classList.add('hidden');
  Render.resize();
  App.rebuild({ fit:true });

  // Every launch, unless the reader has said otherwise. ?tour=1 overrides even
  // that, so a link in a lecture handout always opens it.
  // ?diag=1 for a fault that only happens on some machines; costs nothing
  // otherwise, and it holds the tour back rather than opening underneath it
  const diagWanted = params.get('diag') === '1';
  if(!diagWanted && (params.get('tour') === '1' || Tour.onLaunch))
    setTimeout(() => Tour.start(), 800);
  if(diagWanted) setTimeout(() => App.diagnostics(), 900);
  addEventListener('beforeunload', e => { if(Store.isDirty){ e.preventDefault(); e.returnValue = ''; } });
  window.ConstructionStudio = { Store, Model, Gen, Realize, View, SYSTEMS, SIZING, BUILDUPS,
                                LIB, App, Render, Seq, Compare, Dock, LayerDiagram, Pick,
                                Draft, Import, IO, UI, Tour, Loads, LoadPath, Connect };
})();
</script>
</body>
</html>
