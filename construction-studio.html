    camera.position.copy(ctr).add(dirv.multiplyScalar(dist));
    /* A starting point only - updateDepthRange fits both cameras properly on
       every frame. What matters here is that it is not absurd to begin with. */
    persp.near = Math.max(0.05, dist - modelDiag);
    persp.far = dist + modelDiag*1.5;
    persp.updateProjectionMatrix();
    orthoZoom = modelDiag*pad*0.5;
    fitOrtho();
    controls.update();
    fitOrthoTo(box, pad*0.78);
    invalidate();
  }
  function standardView(which){
    const box = bounds(), ctr = box.getCenter(new THREE.Vector3());
    const d = Math.max(box.getSize(new THREE.Vector3()).length(), 4)*1.1;
    // 'axo' is the true 30/30 architectural axonometric
    const V = { top:[0,1,0.001], front:[0,0.001,1], back:[0,0.001,-1],
                left:[-1,0.001,0], right:[1,0.001,0], iso:[0.75,0.6,0.95],
                axo:[1,0.8165,1], ne:[1,0.7,1], nw:[-1,0.7,1], se:[1,0.7,-1] };
    const v = V[which] || V.iso;
    controls.target.copy(ctr);
    camera.position.copy(ctr).add(new THREE.Vector3(...v).normalize().multiplyScalar(d));
    camera.up.set(0,1,0);
    orthoZoom = d*0.42; fitOrtho();
    camera.updateProjectionMatrix(); controls.update();
    fitOrthoTo(box, 1.12);
    updateDepthRange();
    invalidate();
  }

  /* --- labels --------------------------------------------------------------
     CSS2D labels are DOM nodes, so a model with a few hundred members will
     happily produce a few thousand of them and bury itself. Every label
     therefore carries a priority, and after each render a budgeting pass keeps
     the most important ones that do not collide in screen space and hides the
     rest. Zooming in reveals more, which is the behaviour people expect. */
  const LBL_PRIORITY = { grid:10, dim:9, tag:6, val:7, node:3, '':5 };
  const LBL_CAP = 64;
  const _lblV = new THREE.Vector3();

  function label(text, pos, cls, pri){
    const e = document.createElement('div');
    e.className = 'lbl ' + (cls || '');
    e.textContent = text;
    const o = new CSS2DObject(e);
    o.position.copy(pos);
    o.center.set(0.5, 0.5);
    o.userData.pri = pri != null ? pri : (LBL_PRIORITY[cls] ?? 5);
    return o;
  }

  /** Set `display` only when it actually differs - a redundant write still
      dirties style and forces a recalculation. Every change is stamped, so
      the dwell rule below can see how long a label has held its state. */
  const setShown = (o, on) => {
    const v = on ? '' : 'none';
    if(o.element.style.display === v) return;
    o.element.style.display = v;
    o.userData.tFlip = performance.now();
  };
  const isShown = o => o.element.style.display !== 'none';

  /* Labels are monospace at a known size, so their box can be computed from
     the text without touching the DOM. One measurement per class, taken from
     a real element the first time that class appears, keeps it honest if the
     stylesheet changes; everything after that is arithmetic. */
  const _lblBox = new Map();
  function boxOf(o){
    const cls = o.element.className.replace('lbl', '').trim() || '_';
    let m = _lblBox.get(cls);
    if(!m){
      const r = o.element.getBoundingClientRect();
      // an element that has never been shown measures zero; fall back to the
      // stylesheet's own numbers until one of its class is on screen
      m = r.width > 0 && o.element.textContent.length
        ? { c:(r.width - 12)/o.element.textContent.length, pad:12, h:r.height }
        : { c:6.3, pad:12, h:17 };
      if(r.width > 0) _lblBox.set(cls, m);
    }
    return { w:Math.max(20, o.element.textContent.length*m.c + m.pad), h:m.h };
  }

  /* How much of `a` is covered by `b`, as a fraction of a's own area. */
  function overlapFrac(a, b){
    const ox = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
    const oy = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
    if(ox <= 0 || oy <= 0) return 0;
    return (ox*oy) / Math.max(1, (a.x1-a.x0)*(a.y1-a.y0));
  }

  /* A label that appears and disappears ten times a second is worse than one
     that is simply absent, so three rules keep the decision still:

     - labels are compared as the RECTANGLES they actually occupy, not by which
       cell of a coarse grid their centre lands in. Two labels a few pixels
       apart used to fall either side of a cell boundary and take turns winning
       it, which is precisely what "A" and "Ground +0.00" were doing;
     - the test has a dead band. A label already on screen has to be buried
       (SUPPRESS) before it goes; one that is hidden has to be nearly clear
       (REVEAL) before it comes back. Between the two nothing changes, so a
       label drifting past its neighbour cannot oscillate;
     - and nothing may change state twice inside DWELL_MS, whatever the camera
       does in between. */
  const SUPPRESS = 0.42, REVEAL = 0.12, DWELL_MS = 450;

  function budgetLabels(){
    const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
    const now = performance.now();
    const items = [];
    // Every label in the app is created by Build.refsFor and lives in groups.ref,
    // so there is no reason to walk the whole scene graph twice a frame.
    (groups.ref || scene).traverse(o => {
      if(!o.isCSS2DObject) return;
      let p = o.parent, shown = true;
      while(p){ if(!p.visible){ shown = false; break; } p = p.parent; }
      if(!shown){ setShown(o, false); return; }
      o.getWorldPosition(_lblV);
      const d = _lblV.distanceTo(camera.position);
      _lblV.project(camera);
      if(_lblV.z < -1 || _lblV.z > 1 || Math.abs(_lblV.x) > 1.25 || Math.abs(_lblV.y) > 1.25){
        setShown(o, false); return;
      }
      const b = boxOf(o);
      const x = (_lblV.x*0.5 + 0.5)*w, y = (-_lblV.y*0.5 + 0.5)*h;
      items.push({ o, d, pri:o.userData.pri || 5,
                   x0:x - b.w/2, x1:x + b.w/2, y0:y - b.h/2, y1:y + b.h/2 });
    });
    // most important first, nearest first within a priority
    items.sort((a, b) => b.pri - a.pri || a.d - b.d);

    const kept = [];
    let shown = 0;
    for(const it of items){
      let cover = 0;
      for(const k of kept){ cover += overlapFrac(it, k); if(cover >= 1) break; }
      const on = isShown(it.o);
      const held = now - (it.o.userData.tFlip || 0) < DWELL_MS;
      // over budget is the one verdict nothing argues with
      const want = shown < LBL_CAP && (held ? on : (on ? cover < SUPPRESS : cover <= REVEAL));
      setShown(it.o, want);
      if(want){ kept.push(it); shown++; }
    }
  }

  /* --- member transform ---------------------------------------------------- */
  const _lam = new Float64Array(9);
  function memberMatrix(pI, pJ, roll, L){
    FEM.dirCos(pI, pJ, roll || 0, _lam);
    const m = new THREE.Matrix4();
    m.set(
      _lam[0]*L, _lam[3], _lam[6], pI[0],
      _lam[1]*L, _lam[4], _lam[7], pI[1],
      _lam[2]*L, _lam[5], _lam[8], pI[2],
      0, 0, 0, 1
    );
    return m;
  }

  return { get scene(){return scene}, get camera(){return camera},
           get controls(){return controls}, get renderer(){return renderer},
           get groups(){return groups}, get canvas(){return canvas},
           get modelDiag(){return modelDiag},
           init, resize, start, stop, invalidate, setOnScreen, renderNow,
           fit, standardView, bounds, label, budgetLabels, clearGroup, disposeCaches,
           applyTheme, updateDepthRange, fitShadow, fitGround, glInfo, depthProbe,
           set groundVisible(v){ groundVisible = v;
             const g = groups.env && groups.env.getObjectByName('groundgrid');
             if(g) g.visible = v; },
           get diag(){ return diag },
           forceShadowRefit(){ _shKey = ''; fitShadow(); },
           get aspectScale(){ return aspectScale },
           set aspectScale(v){ aspectScale = v || 1; resize(); },
           set renderHook(fn){ renderHook = fn; }, get renderHook(){ return renderHook },
           profileGeometry, sectionShape, material, familyColour, C, pickables,
           get camMode(){ return camMode }, setCamera,
           _rebuildHook:null,
           rebuildAll(){ this._rebuildHook && this._rebuildHook(); } };
})();

/* ==========================================================================
   11  REALIZE - plans become geometry
   ==========================================================================
   Everything that repeats is MERGED, not instanced. A wall's 216 studs share
   one cached unit geometry stamped 216 times into a single BufferGeometry:
   one draw call, and unlike InstancedMesh the result is still frustum-culled.
   (Measured evidence is that instancing is often slower than plain meshes
   below a few thousand objects, and its instances are never culled.)

   Merging costs one thing, and it has to be paid for up front: a raycast
   returns one hit on one mesh, so picking a single stud needs the mesh to
   remember which triangles belong to which address. That is what `ranges` is
   for, and it is built for free while stamping.
   ========================================================================== */
const Realize = (() => {

  const GEO = new Map();          // cache key -> BufferGeometry (unit or absolute)
  const MAT = new Map();          // family|style|layer -> Material
  const EDGE = new Map();
  let groups = [];
  let byAddr = new Map();
  let lastStats = {};

  const V = new THREE.Vector3();
  const M4 = new THREE.Matrix4();
  const NM = new THREE.Matrix3();

  /* --- cached primitives -------------------------------------------------- */
  function unitProfile(sectionId){
    const k = 'p:' + sectionId;
    if(GEO.has(k)) return GEO.get(k);
    const g = Render.profileGeometry(sectionId, false).clone();
    if(!g.attributes.normal) g.computeVertexNormals();
    const idx = g.index ? g : g.toNonIndexed();
    GEO.set(k, idx);
    return idx;
  }
  function unitBox(){
    const k = 'box';
    if(GEO.has(k)) return GEO.get(k);
    const g = new THREE.BoxGeometry(1, 1, 1);
    g.translate(0.5, 0, 0);             // runs 0..1 along +x, like a profile
    GEO.set(k, g);
    return g;
  }
  function prismGeo(poly, thk, key){
    const k = 'v:' + key;
    if(GEO.has(k)) return GEO.get(k);
    const shape = new THREE.Shape(poly.map(p => new THREE.Vector2(p[0], p[1])));
    const g = new THREE.ExtrudeGeometry(shape, { depth:thk, bevelEnabled:false });
    g.rotateX(Math.PI/2);               // shape x,y -> world x,z ; depth -> -y
    g.computeVertexNormals();
    GEO.set(k, g);
    return g;
  }

  /* --- materials ----------------------------------------------------------
     Keyed by layer as well as family and style, because the section box needs
     a separate clipping-plane set per exploded layer. Roughly forty materials
     in total, which is nothing. */
  function material(fam, style, layer, opts = {}){
    // The section box is part of the key because it decides `side` below, and a
    // material cached with the wrong one would survive the toggle.
    const cut = View.state.section.on;
    const key = `${fam}|${style}|${layer}|${cut ? 'cut' : ''}|${opts.tag || ''}` +
                `|${Render.diag.polyOffset ? 'po' + opts.wallIndex : ''}`;
    if(MAT.has(key)) return MAT.get(key);
    const colour = LAYER_MAT[fam] ?? Render.C[fam] ?? 0xb8bcc2;
    // Everything here is a closed box, so back faces are never seen and culling
    // them halves the rasterisation - and in the translucent styles, which write
    // no depth and so get no early-z rejection at all, it halves the shading too.
    // A section cut is the exception: with back faces gone, a sliced solid is a
    // hole rather than a hollow shell, and there is no cap pass to fill it.
    const base = { color:colour, side:cut ? THREE.DoubleSide : THREE.FrontSide };
    let m;
    if(style === 'wireframe'){
      m = new THREE.MeshBasicMaterial(Object.assign({}, base,
        { transparent:true, opacity:0.04, depthWrite:false }));
    } else if(style === 'xray'){
      // Lambert, not Standard: at 18% opacity over heavy overdraw a full PBR
      // shader costs a great deal and shows nothing for it.
      m = new THREE.MeshLambertMaterial(Object.assign({}, base,
        { transparent:true, opacity:0.18, depthWrite:false }));
    } else if(style === 'realistic'){
      m = new THREE.MeshStandardMaterial(Object.assign({}, base,
        { roughness:fam === 'steel' ? 0.45 : 0.85, metalness:fam === 'steel' ? 0.35 : 0.02 }));
    } else {
      m = new THREE.MeshLambertMaterial(Object.assign({}, base, { emissive:colour, emissiveIntensity:0.14 }));
    }
    /* The edge overlay is generated FROM these faces, so every line it draws is
       exactly coplanar with the face it outlines. Which of the two a pixel gets
       is then decided by rasterisation rounding, and it changes as the camera
       moves - a dark line that stipples and crawls. Pushing the faces back by a
       fraction of a depth unit settles it: the line is simply in front. */
    if(style === 'shaded' || style === 'realistic'){
      m.polygonOffset = true;
      m.polygonOffsetFactor = 1;
      m.polygonOffsetUnits = 1;
    }
    /* Diagnostic switch: push each leaf of a build-up apart in the depth
       buffer by its position in the stack, so neighbouring leaves cannot tie
       however coarse the buffer is. If this clears the fault, the fault is
       surfaces tying; if it does not, it is not. */
    if(Render.diag.polyOffset && opts.wallIndex != null){
      m.polygonOffset = true;
      m.polygonOffsetFactor = 1 + opts.wallIndex*2;
      m.polygonOffsetUnits = 1 + opts.wallIndex*4;
    }
    if(opts.ghost){ m.transparent = true; m.opacity = 0.12; m.depthWrite = false; }
    m.clippingPlanes = View.clipFor(layer);
    m.clipShadows = true;
    MAT.set(key, m);
    return m;
  }
  function edgeMaterial(layer){
    const key = 'e' + layer;
    if(MAT.has(key)) return MAT.get(key);
    const m = new THREE.LineBasicMaterial({ color:Render.C.edge, transparent:true, opacity:0.55 });
    m.clippingPlanes = View.clipFor(layer);
    MAT.set(key, m);
    return m;
  }

  /* --- the batch ---------------------------------------------------------- */
  class Batch {
    constructor(key, layer, fam){
      this.key = key; this.layer = layer; this.fam = fam;
      this.items = [];                 // { geo, m4, addr, count, step }
      this.verts = 0; this.tris = 0;
    }
    add(geo, m4, addr, extra){
      const nv = geo.attributes.position.count;
      const nt = (geo.index ? geo.index.count : nv)/3;
      const n = (extra && extra.count) || 1;
      this.items.push({ geo, m4, addr, count:n, step:extra && extra.step, triPer:nt });
      this.verts += nv*n; this.tris += nt*n;
    }
    merge(){
      if(!this.items.length) return null;
      const pos = new Float32Array(this.verts*3);
      const nor = new Float32Array(this.verts*3);
      const idx = (this.verts > 65535 ? new Uint32Array(this.tris*3) : new Uint16Array(this.tris*3));
      const ranges = [];
      let vo = 0, io = 0, tri = 0;

      for(const it of this.items){
        const p = it.geo.attributes.position, nAttr = it.geo.attributes.normal;
        const gi = it.geo.index;
        const nvert = p.count, ntri = it.triPer;
        const tri0 = tri;
        for(let c = 0; c < it.count; c++){
          M4.copy(it.m4);
          if(c && it.step) M4.premultiply(
            new THREE.Matrix4().makeTranslation(it.step[0]*c, it.step[1]*c, it.step[2]*c));
          NM.getNormalMatrix(M4);
          const base = vo/3;
          for(let i = 0; i < nvert; i++){
            V.fromBufferAttribute(p, i).applyMatrix4(M4);
            pos[vo] = V.x; pos[vo+1] = V.y; pos[vo+2] = V.z;
            if(nAttr){
              V.fromBufferAttribute(nAttr, i).applyMatrix3(NM).normalize();
              nor[vo] = V.x; nor[vo+1] = V.y; nor[vo+2] = V.z;
            }
            vo += 3;
          }
          if(gi) for(let i = 0; i < gi.count; i++) idx[io++] = base + gi.getX(i);
          else   for(let i = 0; i < nvert; i++)   idx[io++] = base + i;
          tri += ntri;
        }
        ranges.push({ addr:it.addr, tri0, triN:tri - tri0, count:it.count, triPer:ntri });
      }

      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('normal',   new THREE.BufferAttribute(nor, 3));
      g.setIndex(new THREE.BufferAttribute(idx, 1));
      g.computeBoundingSphere();
      return { geometry:g, ranges };
    }
  }

  /* --- turn one plan into batch entries ------------------------------------ */
  /** `onlySub` narrows a layered wall to a single build-up layer, which is how
      the layer diagram picks one band out of the model. */
  function feed(batch, pl, detail, onlySub){
    const sec = pl.sectionId ? Model.sec(pl.sectionId) : null;

    if(pl.kind === 'member' || pl.kind === 'run'){
      const L = Math.hypot(pl.b[0]-pl.a[0], pl.b[1]-pl.a[1], pl.b[2]-pl.a[2]);
      if(L < 1e-6) return;
      let geo;
      if(detail === 'diagram' || !sec){
        geo = unitBox();
        const t = Math.max(Render.modelDiag*0.004, 0.05);
        const m = memberMatrix(pl.a, pl.b, pl.roll, L);
        m.multiply(new THREE.Matrix4().makeScale(1, t, t));
        batch.add(geo, m, pl.addr, pl.kind === 'run' ? pl : null);
        return;
      }
      geo = unitProfile(sec.id);
      batch.add(geo, memberMatrix(pl.a, pl.b, pl.roll, L), pl.addr,
                pl.kind === 'run' ? pl : null);
      return;
    }

    if(pl.kind === 'panel' || pl.kind === 'volume'){
      const thk = Math.max(pl.h ?? pl.thk ?? 0.1, 0.005);
      const key = `${pl.addr}|${thk.toFixed(4)}|${pl.poly.length}|` +
                  pl.poly.map(q => q[0].toFixed(2)+','+q[1].toFixed(2)).join(';');
      const geo = prismGeo(pl.poly, thk, key);
      batch.add(geo, new THREE.Matrix4().makeTranslation(0, pl.y + thk, 0), pl.addr);
      return;
    }

    if(pl.kind === 'wallLayer'){
      const L = Geom.dist(pl.a, pl.b);
      if(L < 1e-6) return;
      const ang = Math.atan2(pl.b[1]-pl.a[1], pl.b[0]-pl.a[0]);
      const cx = (pl.a[0]+pl.b[0])/2 + pl.normal[0]*pl.off;
      const cz = (pl.a[1]+pl.b[1])/2 + pl.normal[1]*pl.off;
      const m = new THREE.Matrix4()
        .makeTranslation(cx, pl.y + pl.h/2, cz)
        .multiply(new THREE.Matrix4().makeRotationY(-ang))
        .multiply(new THREE.Matrix4().makeScale(L, pl.h, Math.max(pl.thk, 0.002)));
      batch.add(box111(), m, pl.addr);
      return;
    }

    if(pl.kind === 'wall'){
      const L = Geom.dist(pl.a, pl.b);
      if(L < 1e-6) return;
      // Asking for one layer forces the layered path, so a band can be picked out
      // of the model at any level of detail, not only Full assembly.
      const layers = ((detail === 'full' || onlySub) && pl.buildUp && BUILDUPS[pl.buildUp])
        ? BUILDUPS[pl.buildUp].layers.filter(l => !l.within) : null;
      const n = Geom.normalOf(pl.a, pl.b);
      const ang = Math.atan2(pl.b[1]-pl.a[1], pl.b[0]-pl.a[0]);
      const mk = (t, off, k) => {
        const cx = (pl.a[0]+pl.b[0])/2 + n[0]*off, cz = (pl.a[1]+pl.b[1])/2 + n[1]*off;
        const m = new THREE.Matrix4()
          .makeTranslation(cx, pl.y + pl.h/2, cz)
          .multiply(new THREE.Matrix4().makeRotationY(-ang))
          .multiply(new THREE.Matrix4().makeScale(L, pl.h, t));
        batch.add(box111(), m, k);
      };
      if(!layers){ mk(pl.thk, 0, pl.addr); return; }
      const over = pl.over || {};
      const total = layers.reduce((s,l) => s + ((over[l.k] ?? l.t)), 0)/1000;
      let run = total/2;                       // outside-in, as above
      for(const l of layers){
        const t = (over[l.k] ?? l.t)/1000;
        if(!onlySub || onlySub === l.k) mk(t, run - t/2, pl.addr + '~' + l.k);
        run -= t;
      }
      return;
    }

    if(pl.kind === 'pitchedPanel'){
      const oh = pl.overhang || 0, run = pl.d/2 + oh;
      const slope = Math.hypot(run, pl.rise), phi = Math.atan2(pl.rise, run);
      for(const side of [0,1]){
        // Side 0 runs from the eaves at z = -oh up to the ridge at z = d/2, so it
        // climbs with +z; side 1 falls again. makeRotationX(t) sends the local +Z
        // axis to (0, -sin t, cos t), so the climbing slope needs the NEGATIVE
        // angle and the falling one the positive - the opposite of what reads
        // naturally, and getting it backwards crosses the two panes in an X.
        const m = new THREE.Matrix4();
        const cz = pl.d/2 + (side ? 1 : -1)*(pl.d/4 + oh/2);
        // Sit the covering on top of the rafters: offset along the true slope
        // normal, not vertically, or the panel sinks into the ridge.
        const off = pl.thk/2;
        m.makeTranslation(pl.w/2,
                          pl.y + pl.rise/2 + off*Math.cos(phi),
                          cz + (side ? 1 : -1)*off*Math.sin(phi))
         .multiply(new THREE.Matrix4().makeRotationX(side ? phi : -phi))
         .multiply(new THREE.Matrix4().makeScale(pl.w, pl.thk, slope));
        batch.add(box111(), m, pl.addr + (side ? '~b' : '~a'));
      }
      return;
    }
  }
  function box111(){
    if(GEO.has('b111')) return GEO.get('b111');
    const g = new THREE.BoxGeometry(1,1,1);
    GEO.set('b111', g);
    return g;
  }

  /**
   * At Full assembly a wall is a real stack of layers. Drawn as one object they
   * can only move together, so the exploded wall detail - the drawing that
   * separates cladding from cavity from insulation from lining - is impossible.
   * Expanding the stack here, before batching, gives every layer its own object,
   * its own place in the explode, and its own material colour, so the 3D wall
   * and the layer diagram finally agree on more than thickness.
   */
  function expandWalls(plans, detail){
    if(detail !== 'full') return plans;
    const out = [];
    for(const pl of plans){
      const B = pl.kind === 'wall' && pl.buildUp && BUILDUPS[pl.buildUp];
      if(!B){ out.push(pl); continue; }
      const layers = B.layers.filter(l => !l.within);
      if(!layers.length){ out.push(pl); continue; }
      const over = pl.over || {};
      const total = layers.reduce((sum, l) => sum + (over[l.k] ?? l.t), 0)/1000;
      // Geom.normalOf points away from the building, and a wall build-up is
      // written outside-in, so the FIRST layer belongs at the far positive end
      // of the normal and the stack works inward from there. Getting this
      // backwards builds the wall inside out - plasterboard weathering the rain.
      const n = Geom.normalOf(pl.a, pl.b);
      let run = total/2;
      layers.forEach((l, i) => {
        const t = (over[l.k] ?? l.t)/1000;
        out.push(Object.assign({}, pl, {
          kind:'wallLayer', sub:l.k, subIndex:i, subCount:layers.length,
          subMat:l.mat, thk:t, off:run - t/2, normal:n,
          addr:pl.addr + '~' + l.k, label:l.label
        }));
        run -= t;
      });
    }
    return out;
  }

  /* --- build the whole scene ----------------------------------------------- */
  function build(plans, detail, style){
    const t0 = performance.now();
    const host = Render.groups.build;
    Render.clearGroup(host);
    groups = []; byAddr = new Map();

    // one batch per (part, level, role, material family) - keeps draw calls low
    // while leaving every group independently hideable and explodable
    const batches = new Map();
    for(const pl of expandWalls(plans, detail)){
      if(pl.hidden) continue;
      const fam = famOf(pl);
      const layer = pl.layer ?? 3;
      // Walls are keyed by which way they face - and layered walls also by which
      // layer - because both the Open control and the explode move them along
      // their own outward normal, and objects in one batch can only move together.
      const nrm = pl.kind === 'wallLayer' ? pl.normal
                : pl.kind === 'wall' ? Geom.normalOf(pl.a, pl.b) : null;
      const w = nrm
        ? `|${pl.sub || ''}|${nrm[0].toFixed(2)},${nrm[1].toFixed(2)}` : '';
      const key = `${pl.part}|${pl.level}|${pl.role}|${fam}|${layer}${w}`;
      let b = batches.get(key);
      if(!b){ b = new Batch(key, layer, fam); b.part = pl.part; b.role = pl.role;
              b.level = pl.level;
              if(nrm) b.wall = { i:pl.subIndex ?? 0, n:pl.subCount ?? 1,
                                 nx:nrm[0], nz:nrm[1] };
              batches.set(key, b); }
      feed(b, pl, detail);
      byAddr.set(pl.addr, pl);
    }

    let tris = 0;
    for(const b of batches.values()){
      const m = b.merge();
      if(!m) continue;
      // a build-up leaf knows where it sits in the stack; the diagnostics use it
      const wi = b.wall ? b.wall.i : null;
      if(Render.diag.outerOnly && wi != null && wi !== 0) continue;
      const mesh = new THREE.Mesh(m.geometry, material(b.fam, style, b.layer, { wallIndex:wi }));
      mesh.userData = { batch:true, ranges:m.ranges, layer:b.layer, part:b.part,
                        role:b.role, level:b.level, fam:b.fam, wall:b.wall };
      mesh.userData.home = new THREE.Vector3(0,0,0);
      mesh.castShadow = mesh.receiveShadow = (style === 'realistic');
      host.add(mesh);
      groups.push(mesh);
      tris += m.geometry.index.count/3;

      if(!Render.diag.noEdges && (style === 'shaded' || style === 'wireframe' || style === 'xray')){
        const eg = new THREE.EdgesGeometry(m.geometry, 20);
        const el = new THREE.LineSegments(eg, edgeMaterial(b.layer));
        el.userData = { edges:true, layer:b.layer, part:b.part, role:b.role,
                        level:b.level, wall:b.wall };
        el.userData.home = new THREE.Vector3(0,0,0);
        host.add(el);
        groups.push(el);
      }
    }
    lastStats = { batches:batches.size, meshes:groups.length, tris:Math.round(tris),
                  ms:performance.now() - t0 };
    Bus.emit('realized', lastStats);
    return lastStats;
  }

  function famOf(pl){
    if(pl.kind === 'wallLayer') return pl.subMat || 'board';
    if(pl.role === 'cladding' || pl.role === 'cover') return 'board';
    const m = LIB.MAT[pl.mat];
    return m ? m.family : 'steel';
  }

  /* --- picking -------------------------------------------------------------
     A raycast lands on one merged mesh and gives a face index. The ranges
     table turns that back into an address; inside a run every repeat has the
     same triangle count, so it collapses to one integer division. */
  function resolve(mesh, faceIndex){
    const R = mesh.userData.ranges;
    if(!R) return null;
    let lo = 0, hi = R.length - 1;
    while(lo <= hi){
      const m = (lo+hi) >> 1, r = R[m];
      if(faceIndex < r.tri0) hi = m - 1;
      else if(faceIndex >= r.tri0 + r.triN) lo = m + 1;
      else {
        if(r.count > 1){
          const i = Math.floor((faceIndex - r.tri0)/r.triPer);
          return r.addr + '#' + i;
        }
        return r.addr;
      }
    }
    return null;
  }

  /** The plan behind an address, ignoring any #repeat or ~layer suffix. */
  function planFor(address){
    if(!address) return null;
    const base = address.split('#')[0].split('~')[0];
    return byAddr.get(base) || byAddr.get(address) || null;
  }

  /** One overlay mesh for a highlighted element, since a merged mesh cannot
      have a material on part of itself. */
  function highlight(addresses, colour = 0x4da3ff){
    const g = Render.groups.overlay;
    Render.clearGroup(g);
    if(!addresses || !addresses.length) return;
    const b = new Batch('hl', 0, 'sel');
    for(const a of addresses){
      const pl = planFor(a);
      if(!pl) continue;
      const one = Object.assign({}, pl);
      const rep = a.includes('#') ? parseInt(a.split('#')[1], 10) : null;
      if(rep != null && pl.kind === 'run'){
        one.kind = 'member'; one.count = 1;
        one.a = [pl.a[0]+pl.step[0]*rep, pl.a[1]+pl.step[1]*rep, pl.a[2]+pl.step[2]*rep];
        one.b = [pl.b[0]+pl.step[0]*rep, pl.b[1]+pl.step[1]*rep, pl.b[2]+pl.step[2]*rep];
      }
      const sub = a.includes('~') ? a.split('~')[1] : null;
      feed(b, one, View.state.detail, sub);
    }
    const m = b.merge();
    if(!m) return;
    const mat = new THREE.MeshBasicMaterial({ color:colour, transparent:true, opacity:0.55,
      depthTest:false, side:THREE.DoubleSide });
    const mesh = new THREE.Mesh(m.geometry, mat);
    mesh.renderOrder = 999;
    mesh.userData = { overlay:true };
    g.add(mesh);
    Render.invalidate();
  }

  function disposeCaches(){
    for(const g of GEO.values()) g.dispose?.();
    for(const m of MAT.values()) m.dispose?.();
    GEO.clear(); MAT.clear(); EDGE.clear();
  }

  return { build, resolve, planFor, highlight, disposeCaches, material,
           get groups(){ return groups }, get stats(){ return lastStats },
           get byAddr(){ return byAddr } };
})();

/* ==========================================================================
   12  VIEW - explode, styles, layers, section box
   ==========================================================================
   Layer index is the spine of all of it:

       0 ground and foundations      4 floor build-up
       1 ground floor                5 roof structure
       2 vertical structure          6 roof covering
       3 floor structure

   Explode offsets each layer along +Y and nothing else. Radial explosion is
   what 3D software does by default and it is wrong for a building: the
   technique students are taught puts every layer on one shared vertical axis
   at even spacing, in the order it gets built.

   View state is saved with the file but kept OUT of undo. Nobody wants
   Ctrl+Z to move the explode slider back.
   ========================================================================== */
const View = (() => {

  const LAYERS = [
    { i:0, name:'Foundations',      short:'Fdn' },
    { i:1, name:'Ground floor',     short:'GF'  },
    { i:2, name:'Walls & structure',short:'Wall'},
    { i:3, name:'Floor structure',  short:'Flr' },
    { i:4, name:'Floor build-up',   short:'F/u' },
    { i:5, name:'Roof structure',   short:'Roof'},
    { i:6, name:'Roof covering',    short:'Cvr' }
  ];

  const state = {
    detail:'members',                 // diagram | members | full
    style:'shaded',                   // shaded | realistic | wireframe | xray
    explode:0,                        // 0..1
    open:0,                           // 0..1  swings the enclosure aside
    explodeGap:1.4,                   // metres between layers when fully exploded
    wallGap:0.5,                      // metres between the layers WITHIN a wall
    layers:Object.fromEntries(LAYERS.map(l => [l.i, true])),
    parts:{ foundation:true, vertical:true, floor:true, roof:true },
    section:{ on:false, x:[0,1], y:[0,1], z:[0,1], cap:true },
    labels:{ grid:true, level:true, tag:true, size:true },
    camera:'ortho'
  };

  /* --- per-layer clipping planes ------------------------------------------
     A single global section box would slice an exploded model in the wrong
     place, because each layer has been lifted by a different amount. So each
     layer gets its own six planes, shifted by that layer's explode offset.
     This is why `layer` is part of the material cache key. */
  const CLIP = [];
  let bbox = new THREE.Box3(new THREE.Vector3(-1,-1,-1), new THREE.Vector3(1,1,1));

  for(let l = 0; l < 7; l++)
    CLIP.push([0,1,2,3,4,5].map(() => new THREE.Plane(new THREE.Vector3(0,1,0), 1e6)));

  const clipFor = layer => state.section.on ? CLIP[Util.clamp(layer|0, 0, 6)] : null;

  function setBounds(box){ bbox = box.clone(); updateClip(); }

  function updateClip(){
    const s = state.section;
    const min = bbox.min, max = bbox.max;
    const pad = 0.001;
    for(let l = 0; l < 7; l++){
      const dy = l*state.explodeGap*state.explode;
      const P = CLIP[l];
      const x0 = min.x + (max.x-min.x)*s.x[0], x1 = min.x + (max.x-min.x)*s.x[1];
      const y0 = min.y + (max.y-min.y)*s.y[0] + dy, y1 = min.y + (max.y-min.y)*s.y[1] + dy;
      const z0 = min.z + (max.z-min.z)*s.z[0], z1 = min.z + (max.z-min.z)*s.z[1];
      P[0].set(new THREE.Vector3( 1,0,0), -x0 + pad);
      P[1].set(new THREE.Vector3(-1,0,0),  x1 + pad);
      P[2].set(new THREE.Vector3(0, 1,0), -y0 + pad);
      P[3].set(new THREE.Vector3(0,-1,0),  y1 + pad);
      P[4].set(new THREE.Vector3(0,0, 1), -z0 + pad);
      P[5].set(new THREE.Vector3(0,0,-1),  z1 + pad);
    }
  }

  /** Re-point every live material at the current plane set. */
  function refreshClipping(){
    updateClip();
    Render.scene.traverse(o => {
      if(!o.material) return;
      const l = o.userData && o.userData.layer;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for(const m of mats){
        m.clippingPlanes = (l == null) ? null : clipFor(l);
        m.needsUpdate = true;
      }
    });
  }

  /* --- explode ------------------------------------------------------------- */
  /**
   * Explode lifts each layer up its shared vertical axis. Open swings the
   * enclosure aside along each wall's own outward normal, so the structure and
   * floors inside can be seen without hiding anything - which is what you
   * actually want when the question is "what is behind that wall?".
   *
   * Both move `object.position` only, never vertices, so returning either
   * slider to zero puts the building back exactly where it was.
   */
  function applyExplode(){
    const f = state.explode, gap = state.explodeGap, wgap = state.wallGap;
    // Wide enough to clear the building it came off, whatever the building's size.
    const sz = bbox.getSize(new THREE.Vector3());
    const swing = Math.max(1.5, Math.min(sz.x, sz.z)*0.45)*state.open;
    // Sideways movement is suppressed while the section box is cutting: the clip
    // planes are per layer and cannot follow each leaf, so a cut through a wall
    // that had moved would be a cut in the wrong place.
    const sideways = !state.section.on;
    // The load diagram carries the same layer and wall stamps as the elements it
    // describes, so opening the walls takes their load band with them and the
    // column sleeves stay on the frame now visible behind.
    const moving = Realize.groups.concat(Render.groups.loads.children);
    for(const o of moving){
      const l = o.userData.layer ?? 3;
      const w = o.userData.wall;
      let x = 0, z = 0;
      if(w && sideways){
        // layer 0 is the outside face, so it is the one that flies furthest out
        const d = ((w.n - 1)/2 - w.i)*wgap*f + swing;
        x = w.nx*d; z = w.nz*d;
      }
      o.position.set(x, l*gap*f, z);
    }
    // grid and level references stay put; underlays and context do too
    if(state.section.on) refreshClipping();
    Render.updateDepthRange();   // the model just moved outside its old bounds
    Render.invalidate();
  }

  /* --- visibility ---------------------------------------------------------- */
  function applyVisibility(){
    for(const o of Realize.groups){
      const l = o.userData.layer ?? 3;
      const p = o.userData.part;
      o.visible = (state.layers[l] !== false) && (!p || state.parts[p] !== false);
    }
    Render.invalidate();
  }

  function isolate(layer){
    for(const l of LAYERS) state.layers[l.i] = (layer == null) || l.i === layer;
    applyVisibility();
    Bus.emit('view', state);
  }
  function isolatePart(part){
    for(const k in state.parts) state.parts[k] = (part == null) || k === part;
    applyVisibility();
    Bus.emit('view', state);
  }

  /* --- the single mutation point -------------------------------------------
     Everything that changes the view goes through here, so the couplings
     (explode moving the clip planes, style needing a rebuild) live in exactly
     one place. */
  function set(key, val){
    const before = Util.clone({ detail:state.detail, style:state.style });
    if(key === 'detail'){ state.detail = val; Bus.emit('view:rebuild'); }
    else if(key === 'style'){ state.style = val; Realize.disposeCaches(); Bus.emit('view:rebuild'); }
    else if(key === 'explode'){ state.explode = Util.clamp(val, 0, 1); applyExplode(); }
    else if(key === 'open'){ state.open = Util.clamp(val, 0, 1); applyExplode(); }
    else if(key === 'camera'){ state.camera = val; Render.setCamera(val); }
    else if(key === 'section'){
      // Turning the box on or off changes which side of every face is drawn, so
      // the materials have to be rebuilt. Dragging the three extent sliders does
      // not, and must stay on the cheap path - it fires continuously.
      const toggled = val && val.on !== undefined && val.on !== state.section.on;
      Object.assign(state.section, val);
      if(toggled){ Realize.disposeCaches(); Bus.emit('view:rebuild'); }
      else { refreshClipping(); Render.invalidate(); }
    }
    else if(key === 'layer'){ state.layers[val.i] = val.on; applyVisibility(); }
    else if(key === 'part'){ state.parts[val.k] = val.on; applyVisibility(); }
    else if(key === 'labels'){ Object.assign(state.labels, val); Bus.emit('view:rebuild'); }
    Bus.emit('view', state);
    IO.prefs({ view:{ detail:state.detail, style:state.style, camera:state.camera } });
  }

  /** Lights and shadows follow the display style. */
  function applyStyle(){
    const sun = Render.groups.env.userData.sun;
    const real = state.style === 'realistic';
    if(sun){ sun.castShadow = real; sun.intensity = real ? 2.2 : 1.5; }
    Render.renderer.shadowMap.enabled = real;
    if(real) Render.forceShadowRefit();   // the map is only fitted while it is used
    Render.renderer.toneMapping = real ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
    Render.renderer.toneMappingExposure = real ? 1.05 : 1;
    // through Render, so the choice survives the ground being re-laid when the
    // building changes size
    Render.groundVisible = state.style !== 'realistic';
  }

  return { LAYERS, state, CLIP, set, clipFor, setBounds, updateClip, refreshClipping,
           applyExplode, applyVisibility, applyStyle, isolate, isolatePart };
})();
/* ==========================================================================
   13  UI - DOM helpers, widgets, modals, toasts
   ========================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function el(tag, props, kids){
  const n = document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v == null) continue;
    if(k === 'class') n.className = v;
    else if(k === 'html') n.innerHTML = v;
    else if(k === 'text') n.textContent = v;
    else if(k === 'style' && typeof v === 'object') Object.assign(n.style, v);
    else if(k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if(k === 'data') for(const [dk,dv] of Object.entries(v)) n.dataset[dk] = dv;
    else if(v === true) n.setAttribute(k, '');
    else if(v !== false) n.setAttribute(k, v);
  }
  for(const c of [].concat(kids || [])){
    if(c == null || c === false) continue;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
}
const icon = (id, cls) => {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 24 24');
  if(cls) svg.setAttribute('class', cls);
  const use = document.createElementNS('http://www.w3.org/2000/svg','use');
  use.setAttribute('href', '#' + id);
  svg.appendChild(use);
  return svg;
};

const UI = (() => {
  const dom = {};
  let ribbonTab = 'model', dockPane = 'props';

  /* --- toasts --------------------------------------------------------- */
  function toast(msg, kind = 'info', ms = 3600){
    const t = el('div', { class:`toast ${kind}` }, [el('span',{class:'dot'}), msg]);
    dom.toasts.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(6px)';
                       setTimeout(() => t.remove(), 220); }, ms);
    return t;
  }

  /* --- modal ---------------------------------------------------------- */
  let modalEsc = null;
  function modal({ title, sub, body, footer, wide, onClose }){
    close();
    const dlg = el('div', { class:'dlg', style:wide ? { minWidth:'min(760px,94vw)' } : null }, [
      el('header', {}, [
        el('h3', { text:title }),
        sub ? el('span', { class:'sub', text:sub }) : null,
        el('button', { class:'btn icon x', title:'Close', onclick:close }, [icon('i-close')])
      ]),
      el('div', { class:'content' }, body),
      footer ? el('footer', {}, footer) : null
    ]);
    dom.modal.appendChild(dlg);
    dom.modal.classList.add('open');
    modalEsc = onClose || null;
    dom.modal.querySelector('.scrim').onclick = close;
    const first = dlg.querySelector('input,select,button.primary');
    first && first.focus();
    return { dlg, close };
  }
  function close(){
    dom.modal.classList.remove('open');
    [...dom.modal.children].forEach(c => { if(!c.classList.contains('scrim')) c.remove(); });
    if(modalEsc){ const f = modalEsc; modalEsc = null; f(); }
  }
  const isModalOpen = () => dom.modal.classList.contains('open');

  /* --- small form controls -------------------------------------------- */
  // `unit` sits inline after the control ("3.0 m"); `hint` is a note on its own
  // line beneath. A unit dropped onto its own line reads as a stray label.
  const row = (label, ctrl, unit, hint) => el('div',
    { class:'row' + (unit ? ' unit' : '') },
    [el('label', { text:label }), ctrl,
     unit ? el('span', { class:'u', text:unit }) : null,
     hint ? el('div', { class:'hint', text:hint }) : null].filter(Boolean));
  const rowWide = (ctrl) => el('div', { class:'row wide' }, [ctrl]);

  function num(value, onchange, attrs){
    return el('input', Object.assign({ type:'number', value:String(value ?? 0),
      oninput:e => onchange(U.num(e.target.value, 0), e) }, attrs || {}));
  }
  function text(value, onchange, attrs){
    return el('input', Object.assign({ type:'text', value:value ?? '',
      oninput:e => onchange(e.target.value, e) }, attrs || {}));
  }
  function select(options, value, onchange, attrs){
    const s = el('select', Object.assign({ onchange:e => onchange(e.target.value, e) }, attrs || {}));
    for(const o of options){
      const v = typeof o === 'string' ? o : o.value;
      const t = typeof o === 'string' ? o : o.label;
      s.appendChild(el('option', { value:v, selected:String(v) === String(value) }, [t]));
    }
    s.value = value;
    return s;
  }
  function check(label, value, onchange){
    return el('label', { class:'chk' }, [
      el('input', { type:'checkbox', checked:!!value,
        onchange:e => onchange(e.target.checked, e) }), label]);
  }
  function section(title, badge, kids, open = true){
    return el('details', { class:'sect', open }, [
      el('summary', {}, [title, badge ? el('span',{class:'badge',text:badge}) : null].filter(Boolean)),
      el('div', { class:'body' }, kids)
    ]);
  }
  function explain(html){ return el('div', { class:'explain', html }); }
  function disclaimer(html){ return el('div', { class:'disclaimer', html }); }
  function empty(msg){
    return el('div', { class:'empty' }, [icon('i-empty'), el('div',{html:msg})]);
  }

  /* --- table ----------------------------------------------------------- */
  function table(cols, rows, { onRow, selected, footer, sortable = true } = {}){
    let sortKey = null, sortDir = 1;
    const wrap = el('div', { class:'tbl-wrap' });
    const t = el('table', { class:'tbl' });
    const thead = el('thead'), tr = el('tr');
    cols.forEach((c, i) => {
      const th = el('th', { class:sortable ? 'sortable' : '', text:c.label,
        title:c.title || c.label });
      if(sortable) th.onclick = () => {
        if(sortKey === i){ sortDir = -sortDir; } else { sortKey = i; sortDir = 1; }
        draw();
      };
      tr.appendChild(th);
    });
    thead.appendChild(tr); t.appendChild(thead);
    const tbody = el('tbody'); t.appendChild(tbody);
    if(footer){
      const tf = el('tfoot'), ftr = el('tr');
      footer.forEach(f => ftr.appendChild(el('td', { class:f.num ? 'num' : '', text:f.text })));
      tf.appendChild(ftr); t.appendChild(tf);
    }
    function draw(){
      tbody.textContent = '';
      let data = rows.slice();
      if(sortKey != null){
        const c = cols[sortKey];
        data.sort((a,b) => {
          const va = c.value ? c.value(a) : a[c.key], vb = c.value ? c.value(b) : b[c.key];
          return (typeof va === 'number' ? va-vb : String(va).localeCompare(String(vb)))*sortDir;
        });
      }
      for(const r of data){
        const trr = el('tr', { class:selected && selected(r) ? 'sel' : '' });
        for(const c of cols){
          const v = c.render ? c.render(r) : (c.value ? c.value(r) : r[c.key]);
          const td = el('td', { class:c.num ? 'num' : '' });
          if(v instanceof Node) td.appendChild(v); else td.textContent = v ?? '';
          trr.appendChild(td);
        }
        if(onRow) trr.onclick = e => onRow(r, e);
        tbody.appendChild(trr);
      }
    }
    draw();
    wrap.appendChild(t);
    wrap.refresh = draw;
    return wrap;
  }

  /* Comment lines above the header say where the numbers came from, so a sheet
     that has been emailed on still carries its provenance. `#` is the usual
     convention; note that Excel does not skip these - it imports them as rows
     in column A, which is the price of keeping them in the file. */
  function csv(cols, rows, name){
    const doc = Store.doc;
    const note = [
      '# Construction Studio - © Karam Al-Obaidi',
      `# ${doc?.meta?.name || 'Untitled Project'}`,
      `# Exported ${new Date().toISOString().slice(0,10)}`,
      '# Sizing is by span rule of thumb, for learning and early design - not analysis.'
    ].join('\n');
    const head = cols.map(c => `"${c.label}"`).join(',');
    const body = rows.map(r => cols.map(c => {
      const v = c.value ? c.value(r) : r[c.key];
      return typeof v === 'number' ? U.sig(v, 6) : `"${String(v ?? '').replace(/"/g,'""')}"`;
    }).join(',')).join('\n');
    IO.download(new Blob([note + '\n' + head + '\n' + body], { type:'text/csv' }), name);
  }

  /** The green / amber / red chip beside a sizing readout. */
  const statusChip = s => el('span', { class:`chip ${s}`,
    text:{ ok:'ok', marginal:'marginal', over:'too far', under:'over-specified' }[s] || s });

  /** A segmented control - the app uses these instead of dropdowns wherever
      there are three or four choices, because they show all the options. */
  function seg(options, value, onchange, attrs){
    const wrap = el('div', Object.assign({ class:'seg' }, attrs || {}));
    for(const o of options){
      const v = typeof o === 'object' ? o.value : o;
      const t = typeof o === 'object' ? o.label : String(o);
      wrap.appendChild(el('button', { type:'button', 'aria-pressed':String(String(v) === String(value)),
        onclick:e => {
          [...wrap.children].forEach(c => c.setAttribute('aria-pressed','false'));
          e.currentTarget.setAttribute('aria-pressed','true');
          onchange(v);
        } }, [t]));
    }
    return wrap;
  }

  /** A labelled slider that reports as it moves and checkpoints once. */
  function slider(value, min, max, step, onInput, fmt){
    const out = el('span', { class:'sval', text:fmt ? fmt(value) : String(value) });
    const inp = el('input', { type:'range', min, max, step, value:String(value),
      oninput:e => { const v = parseFloat(e.target.value);
                     out.textContent = fmt ? fmt(v) : String(v); onInput(v); } });
    return el('div', { class:'slider' }, [inp, out]);
  }

  return { dom, toast, modal, close, isModalOpen, row, rowWide, num, text, select,
           check, section, explain, disclaimer, empty, table, csv, statusChip, seg, slider,
           get ribbonTab(){ return ribbonTab }, set ribbonTab(v){ ribbonTab = v },
           get dockPane(){ return dockPane }, set dockPane(v){ dockPane = v } };
})();
/* ==========================================================================
   14  IO - save, open, autosave, downloads
   ========================================================================== */
const IO = (() => {
  const KEY = 'construction-studio:autosave';
  const SETTINGS = 'construction-studio:prefs';

  function download(blob, name){
    const url = URL.createObjectURL(blob);
    const a = el('a', { href:url, download:name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  const slug = s => String(s || 'project').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48) || 'project';

  function saveFile(){
    const doc = Store.doc;
    doc.meta.name = UI.dom.projName.value || doc.meta.name;
    const json = JSON.stringify(Model.serialize(doc), null, 1);
    download(new Blob([json], { type:'application/json' }), `${slug(doc.meta.name)}.building.json`);
    Store.markClean();
    UI.toast('Project saved to your downloads folder.', 'ok');
  }

  function openFile(){
    pickFile('.json,.building.json,application/json', (text) => {
      try {
        const doc = Model.deserialize(text);
        Store.load(doc);
        Import.drawUnderlays();          // reference geometry survives a reopen
        UI.toast(`Opened “${doc.meta.name}”.`, 'ok');
      } catch(e){
        UI.toast(`Could not open that file — ${e.message}`, 'bad', 7000);
      }
    });
  }

  /** Read a file the user picks. `as` is 'text' | 'dataURL' | 'arrayBuffer'. */
  function pickFile(accept, cb, as = 'text'){
    const inp = UI.dom.filepick;
    inp.value = '';
    inp.accept = accept;
    inp.onchange = () => {
      const f = inp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => cb(r.result, f);
      r.onerror = () => UI.toast('Could not read that file.', 'bad');
      if(as === 'dataURL') r.readAsDataURL(f);
      else if(as === 'arrayBuffer') r.readAsArrayBuffer(f);
      else r.readAsText(f);
    };
    inp.click();
  }

  /* --- autosave -----------------------------------------------------------
     Underlays can be megabytes of base64, so they are stored separately and
     dropped first when the quota bites. */
  const autosave = Util.debounce(() => {
    try {
      const doc = Model.serialize(Store.doc);
      const light = { ...doc, underlays: doc.underlays.map(u => ({ ...u, data:null })) };
      localStorage.setItem(KEY, JSON.stringify(light));
    } catch(e){
      if(e && /quota/i.test(e.name || e.message || ''))
        UI.toast('The model is too large for browser autosave — use File → Save.', 'warn', 6000);
    }
  }, 1500);

  function restore(){
    try {
      const raw = localStorage.getItem(KEY);
      if(!raw) return null;
      return Model.deserialize(raw);
    } catch(e){ return null; }
  }
  function clearAutosave(){ try { localStorage.removeItem(KEY); } catch(e){} }

  function prefs(patch){
    try {
      const cur = JSON.parse(localStorage.getItem(SETTINGS) || '{}');
      if(patch){ Object.assign(cur, patch); localStorage.setItem(SETTINGS, JSON.stringify(cur)); }
      return cur;
    } catch(e){ return {}; }
  }

  return { download, saveFile, openFile, pickFile, autosave, restore, clearAutosave, prefs, slug };
})();

/* ==========================================================================
   15  EXPORT - PNG with labels, title block and the credit line
   ========================================================================== */
const Draft = (() => {

  /* --- PNG export ---------------------------------------------------------
     CSS2D labels are DOM elements, not canvas pixels, so a naive toDataURL
     silently drops every one of them. The export therefore renders the WebGL
     canvas at 2x, draws it onto a 2D canvas, then re-draws each visible label
     by projecting its world position through the export camera. Text drawn
     this way is also sharper than any DOM rasterisation. */
  /**
   * Renders the viewport at `scale`, adds the labels, title block and the
   * copyright, and downloads it. Pass `returnDataURL` to get the finished
   * sheet back as a promise instead - what the verification harness uses.
   */
  function exportPNG({ scale = 2, titleBlock = true, withLabels = true,
                       returnDataURL = false } = {}){
    const doc = Store.doc;
    const r = Render.renderer, cam = Render.camera, cv = Render.canvas;
    const w0 = cv.clientWidth, h0 = cv.clientHeight;
    const W = Math.min(Math.round(w0*scale), 6000), H = Math.min(Math.round(h0*scale), 6000);

    // Both dimensions scale together, so the aspect ratio is unchanged and the
    // orthographic frustum needs no adjustment. Only the perspective camera
    // carries an `aspect` at all - setting it on the ortho one would do nothing
    // but leave a stray property behind.
    const setAspect = a => { if(cam.isPerspectiveCamera){ cam.aspect = a; cam.updateProjectionMatrix(); } };

    // render at the export size, read back in the same synchronous block
    r.setSize(W, H, false);
    setAspect(W/H);
    Render.scene.traverse(o => { if(o.material && o.material.isLineMaterial) o.material.resolution.set(W,H); });
    r.render(Render.scene, cam);
    const src = new Image();
    const url = cv.toDataURL('image/png');

    // restore immediately
    r.setSize(w0, h0, false);
    setAspect(w0/h0);
    Render.scene.traverse(o => { if(o.material && o.material.isLineMaterial) o.material.resolution.set(w0,h0); });
    Render.invalidate();

    let settle;
    const done = new Promise(res => { settle = res; });
    src.onload = () => {
      const pad = titleBlock ? Math.round(H*0.075) : 0;
      const out = document.createElement('canvas');
      out.width = W; out.height = H + pad;
      const c = out.getContext('2d');
      const dark = document.documentElement.dataset.theme !== 'light';
      c.fillStyle = dark ? '#141820' : '#e7ebf1';
      c.fillRect(0,0,W,H);
      c.drawImage(src, 0, 0, W, H);

      if(withLabels) drawLabels(c, W, H, scale);

      if(titleBlock){
        // drawLabels centres its text; without resetting, the title block would
        // be centred on x = pad*0.35 and its left half would fall off the canvas.
        c.textAlign = 'left';
        c.fillStyle = dark ? '#1f242d' : '#ffffff';
        c.fillRect(0, H, W, pad);
        c.strokeStyle = dark ? '#39424f' : '#c8d1dc';
        c.lineWidth = Math.max(1, scale);
        c.beginPath(); c.moveTo(0, H+0.5*c.lineWidth); c.lineTo(W, H+0.5*c.lineWidth); c.stroke();

        const fs = Math.round(pad*0.28);
        c.textBaseline = 'middle';
        c.fillStyle = dark ? '#eef2f7' : '#141a22';
        c.font = `600 ${fs}px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif`;
        c.fillText(doc.meta.name || 'Untitled Project', pad*0.35, H + pad*0.34);

        c.font = `${Math.round(fs*0.72)}px ui-sans-serif, system-ui, sans-serif`;
        c.fillStyle = dark ? '#b6c0cd' : '#3d4757';
        const bits = [
          new Date().toLocaleDateString(),
          App.describeBuilding(),
          View.state.detail === 'full' ? 'full assembly'
            : View.state.detail === 'diagram' ? 'diagram' : 'members',
          View.state.explode > 0.01 ? `exploded ×${U.fx(View.state.explode,2)}` : null,
          'Construction Studio'
        ].filter(Boolean);
        c.fillText(bits.join('   ·   '), pad*0.35, H + pad*0.68);

        // the copyright, bottom left of the sheet, always
        c.textAlign = 'right';
        c.font = `600 ${Math.round(fs*0.85)}px ui-sans-serif, system-ui, sans-serif`;
        c.fillStyle = dark ? '#eef2f7' : '#141a22';
        c.fillText('© Karam Al-Obaidi', W - pad*0.35, H + pad*0.5);
        c.textAlign = 'left';
      }

      // and on the image itself, mirroring the on-screen badge
      const fs2 = Math.round(Math.max(12*scale, H*0.018));
      c.font = `600 ${fs2}px ui-sans-serif, system-ui, sans-serif`;
      c.fillStyle = dark ? 'rgba(238,242,247,.92)' : 'rgba(20,26,34,.92)';
      c.shadowColor = dark ? 'rgba(0,0,0,.6)' : 'rgba(255,255,255,.8)';
      c.shadowBlur = 4*scale;
      c.fillText('© Karam Al-Obaidi', fs2, H - fs2);
      c.shadowBlur = 0;

      if(returnDataURL){ settle(out.toDataURL('image/png')); return; }
      out.toBlob(b => {
        IO.download(b, `${IO.slug(doc.meta.name)}.png`);
        UI.toast('Image exported with labels, legend and title block.', 'ok');
        settle(null);
      }, 'image/png');
    };
    src.src = url;
    return done;
  }

  function drawLabels(c, W, H, scale){
    c.save();                       // this routine changes font, baseline and align
    const cam = Render.camera;
    const v = new THREE.Vector3();
    const fs = Math.round(10.5*scale);
    c.font = `${fs}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    c.textBaseline = 'middle';
    c.textAlign = 'center';
    const dark = document.documentElement.dataset.theme !== 'light';
    Render.scene.traverse(o => {
      if(!o.isCSS2DObject || !o.visible) return;
      let p = o.parent; while(p){ if(!p.visible) return; p = p.parent; }
      o.getWorldPosition(v);
      const d = v.clone().project(cam);
      if(d.z < -1 || d.z > 1) return;
      const x = (d.x*0.5+0.5)*W, y = (-d.y*0.5+0.5)*H;
      const txt = o.element.textContent || '';
      if(!txt) return;
      const cls = o.element.className;
      const w = c.measureText(txt).width;
      c.fillStyle = dark ? 'rgba(10,14,20,.74)' : 'rgba(255,255,255,.88)';
      c.fillRect(x - w/2 - 3*scale, y - fs*0.75, w + 6*scale, fs*1.5);
      c.fillStyle = /grid/.test(cls) ? '#4da3ff' : /val/.test(cls) ? '#f0b23c'
                  : /tag/.test(cls) ? '#4ec98b' : /node/.test(cls) ? '#7f8cff'
                  : (dark ? '#eef2f7' : '#141a22');
      c.fillText(txt, x, y);
    });
    c.restore();
  }

  /* --- printable sheet ------------------------------------------------------ */
  function sheetDialog(){
    const doc = Store.doc;
    let scale = 2, labels = true, block = true;
    UI.modal({
      title:'Export drawing', sub:'PNG with title block',
      body:[
        UI.explain('The export re-draws every label and the legend into the image. ' +
          'CSS labels live in the DOM, not the WebGL canvas, so without this step they would vanish.'),
        UI.row('Resolution', UI.select([
          { value:'1', label:'1× — screen size' },
          { value:'2', label:'2× — presentation (recommended)' },
          { value:'3', label:'3× — print' }], '2', v => { scale = +v; })),
        UI.rowWide(UI.check('Include labels and dimensions', true, v => { labels = v; })),
        UI.rowWide(UI.check('Include title block', true, v => { block = v; })),
        UI.explain(`Title block: <b>${Util.esc(doc.meta.name)}</b> · ${new Date().toLocaleDateString()} · ` +
                   `© Karam Al-Obaidi` +
                   '<br><br>The small credit in the corner of the image itself is always drawn, ' +
                   'whatever you tick here. The building is yours — the credit says which tool ' +
                   'drew it and claims nothing over your work.')
      ],
      footer:[
        el('button', { class:'btn ghost', onclick:UI.close }, ['Cancel']),
        el('button', { class:'btn primary', onclick:() => { UI.close();
          exportPNG({ scale, withLabels:labels, titleBlock:block }); } }, ['Export PNG'])
      ]
    });
  }

  return { exportPNG, sheetDialog };
})();
/* ==========================================================================
   16  IMPORT - DXF plans, OBJ context, image underlays
   ========================================================================== */
const Import = (() => {

  function pick(kind){
    if(kind === 'dxf')   return IO.pickFile('.dxf,text/plain', dxf);
    if(kind === 'obj')   return IO.pickFile('.obj,text/plain', obj);
    if(kind === 'image') return IO.pickFile('image/*', image, 'dataURL');
  }

  /* --- DXF ----------------------------------------------------------------
     We do not want to RENDER the DXF, we want to read it. A minimal reader
     over the tagged pairs pulls LINE and LWPOLYLINE entities with their layer
     names, which is exactly what a floor plan carries. The user then chooses
     whether each layer becomes grid lines, member centrelines, or a traced
     underlay. That is the plan-to-model workflow students actually want. */
  function parseDXF(text){
    const lines = text.split(/\r\n|\r|\n/);
    const ents = [];
    let i = 0;
    // Jump to ENTITIES. A DXF is a stream of (group code, value) pairs, and
    // "ENTITIES" is the VALUE half of the pair `2 / ENTITIES` - so step past it
    // to land on the next group code. Starting on the wrong half reads every
    // code as a value and finds nothing.
    while(i < lines.length && !(lines[i].trim() === 'ENTITIES')) i++;
    i++;
    let cur = null;
    const flush = () => { if(cur && cur.pts.length >= 2) ents.push(cur); cur = null; };
    for(; i < lines.length - 1; i += 2){
      const code = lines[i].trim(), val = (lines[i+1] ?? '').trim();
      if(code === '0'){
        flush();
        if(val === 'ENDSEC') break;
        if(val === 'LINE' || val === 'LWPOLYLINE' || val === 'POLYLINE')
          cur = { type:val, layer:'0', pts:[], closed:false, _x:null, _y:null };
        continue;
      }
      if(!cur) continue;
      if(code === '8'){ cur.layer = val; continue; }
      if(cur.type === 'LINE'){
        if(code === '10') cur._x0 = parseFloat(val);
        else if(code === '20') cur._y0 = parseFloat(val);
        else if(code === '11') cur._x1 = parseFloat(val);
        else if(code === '21'){
          cur._y1 = parseFloat(val);
          cur.pts = [[cur._x0, cur._y0], [cur._x1, cur._y1]];
        }
        continue;
      }
      // LWPOLYLINE / POLYLINE vertices
      if(code === '10'){ cur._x = parseFloat(val); }
      else if(code === '20'){
        cur._y = parseFloat(val);
        if(cur._x != null && isFinite(cur._x) && isFinite(cur._y)) cur.pts.push([cur._x, cur._y]);
        cur._x = null;
      }
      else if(code === '70'){ cur.closed = (parseInt(val,10) & 1) === 1; }
    }
    flush();
    return ents.filter(e => e.pts.every(p => isFinite(p[0]) && isFinite(p[1])));
  }

  function dxf(text, file){
    let ents;
    try { ents = parseDXF(text); }
    catch(e){ return UI.toast('That DXF could not be read.', 'bad'); }
    if(!ents.length) return UI.toast('No LINE or POLYLINE entities were found in that DXF.', 'warn', 6000);

    const layers = [...new Set(ents.map(e => e.layer))].sort();
    const assign = {};
    for(const l of layers) assign[l] = /grid|axis/i.test(l) ? 'grid' : 'underlay';
    let unit = 0.001;      // DXF plans are usually in millimetres

    UI.modal({
      title:'Import DXF plan', sub:file?.name, wide:true,
      body:[
        UI.explain(`Found <b>${ents.length}</b> lines across <b>${layers.length}</b> layers. ` +
          'Choose what each layer becomes. A layer set to <i>grid lines</i> is measured and ' +
          'the building rebuilt on that spacing; anything set to <i>underlay</i> is drawn ' +
          'as reference geometry to trace over.'),
        UI.row('Drawing units', UI.select([
          { value:'0.001', label:'Millimetres' },
          { value:'0.01',  label:'Centimetres' },
          { value:'1',     label:'Metres' },
          { value:'0.3048',label:'Feet' }], '0.001', v => { unit = +v; })),
        el('div', { class:'tbl-wrap', style:'max-height:44vh' },
          [el('table', { class:'tbl' }, [
            el('thead', {}, [el('tr', {}, [
              el('th',{text:'Layer'}), el('th',{text:'Lines'}), el('th',{text:'Becomes'})])]),
            el('tbody', {}, layers.map(l => el('tr', {}, [
              el('td',{text:l}),
              el('td',{class:'num',text:String(ents.filter(e => e.layer === l).length)}),
              el('td',{}, [UI.select(
                [{value:'underlay',label:'Underlay (trace over)'},
                 {value:'grid',label:'Grid lines'},
                 {value:'skip',label:'Ignore'}], assign[l], v => { assign[l] = v; })])
            ])))
          ])])
      ],
      footer:[
        el('button',{class:'btn ghost',onclick:UI.close},['Cancel']),
        el('button',{class:'btn primary',onclick:() => { UI.close(); applyDXF(ents, assign, unit, file); }},
          ['Import'])
      ]
    });
  }

  /**
   * The grid in this app is parametric - bays and spacings, not a list of
   * lines - so a DXF grid layer is MEASURED rather than copied: the lines are
   * sorted along each axis and their spacing read off. Everything else becomes
   * reference line work on the ground plane, to trace over.
   */
  function applyDXF(ents, assign, unit, file){
    const doc = Store.doc;
    Store.begin('Import DXF');
    const gridPts = { x:[], z:[] };
    const under = [];

    for(const e of ents){
      const role = assign[e.layer];
      if(role === 'skip') continue;
      const pts = e.pts.map(p => [p[0]*unit, p[1]*unit]);
      if(role === 'grid'){
        for(let i = 0; i < pts.length-1; i++){
          const a = pts[i], b = pts[i+1];
          const dx = Math.abs(b[0]-a[0]), dz = Math.abs(b[1]-a[1]);
          if(Math.max(dx, dz) < 0.5) continue;            // too short to be a grid line
          // a line running mostly in Z marks a position on X, and vice versa
          if(dz > dx) gridPts.x.push((a[0]+b[0])/2);
          else        gridPts.z.push((a[1]+b[1])/2);
        }
      } else {
        under.push(pts);
      }
    }

    const read = vals => {
      if(vals.length < 2) return null;
      const v = [...vals].sort((p, q) => p - q);
      const keep = [v[0]];
      for(const x of v) if(x - keep[keep.length-1] > 0.4) keep.push(x);   // merge duplicates
      if(keep.length < 2) return null;
      const steps = [];
      for(let i = 1; i < keep.length; i++) steps.push(keep[i] - keep[i-1]);
      // the average spacing, which is what a student would read off the drawing
      const mean = steps.reduce((a, x) => a + x, 0)/steps.length;
      return { bays:Util.clamp(keep.length - 1, 1, 10), step:U.sig(Util.clamp(mean, 1.8, 30), 3) };
    };
    const gx = read(gridPts.x), gz = read(gridPts.z);
    if(gx){ doc.grid.bx = gx.bays; doc.grid.sx = gx.step; }
    if(gz){ doc.grid.bz = gz.bays; doc.grid.sz = gz.step; }

    if(under.length){
      /* Store the drawing about its own centre and put the centre in the
         transform. Rotating then turns the plan on the spot instead of
         swinging it around the model origin, and scaling grows it in place. */
      let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
      for(const l of under) for(const q of l){
        if(q[0] < x0) x0 = q[0]; if(q[0] > x1) x1 = q[0];
        if(q[1] < z0) z0 = q[1]; if(q[1] > z1) z1 = q[1];
      }
      const cx = (x0 + x1)/2, cz = (z0 + z1)/2;
      const id = Util.id('UL');
      doc.underlays.push({ id, kind:'dxf', opacity:0.6, data:null,
        label:(file && file.name) || 'plan.dxf',
        transform:{ x:cx, y:0, z:cz, rot:0, s:1, w:x1 - x0, h:z1 - z0 } });
      Store.assets.set(id, { lines:under, cx, cz });
    }
    Store.touch('import');
    drawUnderlays();
    Render.fit();

    const bits = [];
    if(gx || gz) bits.push(`grid set to ${doc.grid.bx} × ${doc.grid.bz} bays at ` +
                           `${U.fx(doc.grid.sx,2)} × ${U.fx(doc.grid.sz,2)} m`);
    if(under.length) bits.push(`${under.length} reference lines`);
    UI.toast(bits.length ? 'Imported ' + bits.join(', ') + '.'
                         : 'Nothing in that DXF could be used.', bits.length ? 'ok' : 'warn', 6000);
  }

  /* --- placing what was imported -------------------------------------------
     A plan never lands where it should first time. The DXF was drawn about
     some origin of its own, the photograph has no scale at all, and the OBJ
     of the neighbouring block was modelled in millimetres facing the wrong
     way. So everything imported carries the same five numbers - where it is,
     how high, which way round, and how big - and the same controls change
     them.

     The geometry is built about its OWN centre and the transform lives on a
     wrapper above it. That is what makes a rotation turn the drawing rather
     than swing it around the model origin, and a scale grow it where it
     stands rather than slide it away from you. */
  /* Fills in whatever is missing WITHOUT replacing the object. Handing back a
     fresh object each call would be the same bug twice over: a drag captures
     the transform when the gesture starts, so swapping it underneath means
     every move after the first writes to something nothing is reading. */
  const XF_DEF = { x:0, y:0, z:0, rot:0, s:1 };
  const XF = u => {
    const T = u.transform || (u.transform = {});
    for(const k in XF_DEF) if(typeof T[k] !== 'number') T[k] = XF_DEF[k];
    return T;
  };

  function applyXf(obj, u){
    const T = XF(u);
    // a hair above its level, so a plan never fights the slab it lies on
    obj.position.set(T.x || 0, (T.y || 0) + 0.004, T.z || 0);
    obj.rotation.set(0, (T.rot || 0)*Math.PI/180, 0);
    obj.scale.setScalar(T.s || 1);
    obj.updateMatrixWorld(true);
  }

  const groupFor = id =>
    Render.groups.underlay.getObjectByName('underlay:' + id) ||
    Render.groups.context.getObjectByName('underlay:' + id);

  const wrap = (u, obj, into) => {
    const g = new THREE.Group();
    g.name = 'underlay:' + u.id;
    g.userData = { kind:'underlay', id:u.id };
    g.add(obj);
    applyXf(g, u);
    into.add(g);
    return g;
  };

  /** Re-applies one item's transform in place. No rebuild: dragging a plan
      across the model should not reparse it sixty times a second. */
  function refresh(id){
    const u = Store.doc.underlays.find(x => x.id === id);
    const g = u && groupFor(id);
    if(g) applyXf(g, u);
    Render.invalidate();
  }

  /** Sets one item's opacity without touching the others. */
  function setOpacity(id, v){
    const u = Store.doc.underlays.find(x => x.id === id);
    if(u) u.opacity = v;
    const g = groupFor(id);
    if(g) g.traverse(o => { if(o.material) o.material.opacity = u.kind === 'obj' ? v*0.45 : v; });
    Render.invalidate();
  }

  /**
   * Redraws every stored underlay into its group. Called after an import and
   * again on load, so reference geometry survives a reopened file.
   */
  function drawUnderlays(){
    Render.clearGroup(Render.groups.underlay, true);
    Render.clearGroup(Render.groups.context, true);
    for(const u of Store.doc.underlays){
      const a = Store.assets.get(u.id);
      if(!a) continue;
      if(u.kind === 'dxf' && a.lines)          drawLines(u, a);
      else if(u.kind === 'image' && a.dataURL) placeImage(u, a.dataURL);
      else if(u.kind === 'obj' && a.text)      placeObj(u, a);
    }
    Render.invalidate();
  }

  function drawLines(u, a){
    const pts = [];
    const cx = a.cx || 0, cz = a.cz || 0;
    for(const line of a.lines)
      for(let i = 0; i < line.length-1; i++)
        pts.push(line[i][0] - cx, 0, line[i][1] - cz,
                 line[i+1][0] - cx, 0, line[i+1][1] - cz);
    if(!pts.length) return;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    wrap(u, new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
      color:0x6f8cb5, transparent:true, opacity:u.opacity ?? 0.6 })),
      Render.groups.underlay);
  }

  /* --- OBJ ------------------------------------------------------------------ */
  function placeObj(u, a){
    let root;
    try { root = new OBJLoader().parse(a.text); } catch(e){ return; }
    const mat = new THREE.MeshStandardMaterial({
      color:0x6f7c8c, transparent:true, opacity:(u.opacity ?? 0.28), roughness:0.95,
      metalness:0, side:THREE.DoubleSide, depthWrite:false });
    root.traverse(o => { if(o.isMesh){ o.material = mat; o.userData = { kind:'context' }; } });

    // normalise a model that was clearly built in other units, then stand it
    // on the ground about its own centre so the transform above behaves
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    let k = 1;
    if(size.length() > 5000) k = 0.001;
    else if(size.length() < 2) k = 1000;
    const c = box.getCenter(new THREE.Vector3());
    root.scale.setScalar(k);
    root.position.set(-c.x*k, -box.min.y*k, -c.z*k);
    a.k = k;
    wrap(u, root, Render.groups.context);
  }

  function obj(text, file){
    try { new OBJLoader().parse(text); }
    catch(e){ return UI.toast('That OBJ could not be parsed.', 'bad'); }
    Store.begin('Import OBJ');
    const id = Util.id('UL');
    Store.doc.underlays.push({ id, kind:'obj', opacity:0.28, data:null,
      label:(file && file.name) || 'model.obj',
      transform:{ x:0, y:0, z:0, rot:0, s:1 } });
    Store.assets.set(id, { text });
    Store.touch('import');
    drawUnderlays();
    Render.fit();
    const a = Store.assets.get(id);
    UI.toast(`Loaded ${(file && file.name) || 'model'} as ghosted context geometry` +
             (a && a.k !== 1 ? ` (scaled ×${a.k})` : '') +
             '. Move and size it from the Imports panel.', 'ok', 6000);
  }

  /* --- image underlay -------------------------------------------------------
     A plan image is laid on the ground and then scaled, either by hand or by
     clicking two points whose real separation the student types in. */
  function placeImage(u, dataURL, then){
    new THREE.TextureLoader().load(dataURL, t => {
      const T = XF(u);
      if(!T.w){ const ar = t.image.width/t.image.height; T.w = 20; T.h = 20/ar; }
      const geo = new THREE.PlaneGeometry(T.w, T.h);
      geo.rotateX(-Math.PI/2);
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
        map:t, transparent:true, opacity:u.opacity ?? 0.65,
        depthWrite:false, side:THREE.DoubleSide }));
      const g = wrap(u, mesh, Render.groups.underlay);
      Render.invalidate();
      then && then(g);
    });
  }

  function image(dataURL, file){
    Store.begin('Import image');
    const id = Util.id('UL');
    // Underlays lie on the ground plane: it is the one datum every building
    // in this app shares, and a plan is traced from the ground up.
    const u = { id, kind:'image', opacity:0.65, data:null,
                label:(file && file.name) || 'plan image',
                transform:{ w:0, h:0, y:0, x:0, z:0, rot:0, s:1 } };
    Store.doc.underlays.push(u);
    Store.assets.set(id, { dataURL });
    Store.touch('import');
    placeImage(u, dataURL, () => calibrate(id));
  }

  function remove(id){
    Store.begin('Remove import');
    const i = Store.doc.underlays.findIndex(x => x.id === id);
    if(i >= 0) Store.doc.underlays.splice(i, 1);
    Store.assets.delete(id);
    Store.touch('import');
    drawUnderlays();
    Dock.render();
  }

  /* --- moving it by hand ----------------------------------------------------
     The panel below has a field for every number, which is how you place
     something exactly. This is how you place it quickly: pick the thing up
     and put it down. The pointer is taken off the camera for the duration -
     see App.setTool - so a drag cannot mean orbit and move at the same time. */
  function moveTool(id){
    const u = Store.doc.underlays.find(x => x.id === id);
    const g = u && groupFor(id);
    if(!g) return;
    const T = XF(u);
    let from = null, base = null, live = false;
    App.setTool({
      cursor:'move',
      hint:`Drag ${u.label || 'the import'} into place — Esc to stop`,
      down(ev){
        from = Pick.onGround(ev, T.y || 0);
        base = { x:T.x || 0, z:T.z || 0 };
        if(from){ live = true; Store.begin('Move import'); }
      },
      move(ev){
        if(!live) return;
        const p = Pick.onGround(ev, T.y || 0);
        if(!p) return;
        T.x = U.sig(base.x + (p.x - from.x), 6);
        T.z = U.sig(base.z + (p.z - from.z), 6);
        applyXf(g, u);
        Render.invalidate();
      },
      up(){
        if(!live) return;
        live = false;
        Store.touch('import');
        Dock.render();
      },
      cancel(){ live = false; }
    });
  }

  /**
   * Two-point scaling. Click two things whose real separation you know and
   * the image is resized so that they are that far apart.
   *
   * This used to listen for a `viewport:click` event that nothing ever sent,
   * so the dialog offered a calibration that could not happen. It is a tool
   * now, like moving is.
   */
  const pending = { real:6 };
  function calibrate(id){
    const u = Store.doc.underlays.find(x => x.id === id);
    if(!u) return;
    UI.modal({
      title:'Scale the plan', sub:'two-point calibration',
      body:[
        UI.explain('Click <b>two points</b> in the model space whose real distance you know — ' +
          'a grid spacing or a known wall length — then type that distance. ' +
          'The image is rescaled to match.'),
        UI.row('Known distance', UI.num(pending.real, v => { pending.real = v; }, { step:0.1 }), 'm')
      ],
      footer:[
        el('button',{class:'btn ghost',onclick:UI.close},['Skip — size it by hand']),
        el('button',{class:'btn primary',onclick:() => { UI.close(); startPick(id); }},
          ['Pick two points'])
      ]
    });
  }

  function startPick(id){
    const u = Store.doc.underlays.find(x => x.id === id);
    const g = u && groupFor(id);
    if(!g) return;
    const T = XF(u);
    const pts = [];
    UI.toast('Click the first point…', 'ok', 4000);
    App.setTool({
      cursor:'crosshair',
      hint:'Click two points a known distance apart — Esc to stop',
      up(ev){
        const p = Pick.onGround(ev, T.y || 0);
        if(!p) return;
        pts.push(p);
        if(pts.length === 1) return UI.toast('Now the second point…', 'ok', 4000);
        App.setTool(null);
        const d = pts[0].distanceTo(pts[1]);
        if(d < 1e-6) return UI.toast('Those two points are the same.', 'warn');
        const k = pending.real / d;
        Store.begin('Scale import');
        T.s = U.sig((T.s || 1) * k, 6);
        // scale about the midpoint of what was measured, so the two points
        // stay where they were pointed at
        const c = pts[0].clone().add(pts[1]).multiplyScalar(0.5);
        T.x = U.sig((T.x - c.x)*k + c.x, 6);
        T.z = U.sig((T.z - c.z)*k + c.z, 6);
        applyXf(g, u);
        Store.touch('import');
        Dock.render();
        UI.toast(`Scaled by ×${U.fx(k,3)} — those two points are now ` +
                 `${U.fx(pending.real,2)} m apart.`, 'ok', 6000);
      }
    });
  }

  /* --- the panel ------------------------------------------------------------
     One card, one row per import, every number editable. It only appears when
     something has been imported, so it costs nothing until it is wanted. */
  const KIND = { dxf:'DXF plan', image:'Plan image', obj:'OBJ model' };

  function card(){
    const list = Store.doc.underlays || [];
    if(!list.length) return null;
    const body = el('div', { class:'body' });
    body.appendChild(el('div', { class:'note info', html:
      'Imported drawings are references, not building parts. Move, turn and ' +
      'size them to sit under what you are modelling.' }));

    for(const u of list){
      const T = XF(u);
      const set = (k, v) => { Store.begin('Place import'); T[k] = v;
                              refresh(u.id); Store.touch('import'); };
      const item = el('div', { class:'imp' });
      item.appendChild(el('div', { class:'imphead' }, [
        el('b', { text:u.label || KIND[u.kind] || 'Import' }),
        el('span', { class:'blurb', text:KIND[u.kind] || u.kind }),
        el('button', { class:'btn ghost sm', title:'Drag it into place',
          onclick:() => moveTool(u.id) }, ['Move']),
