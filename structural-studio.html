        UI.row('Material', UI.select(LIB.MATERIALS.filter(m => m.family !== 'steel')
          .map(m => ({value:m.id,label:m.name})), o.materialId,
          v => commit('Material', () => multi(objs,'materialId',v)))),
        UI.row('Span mode', UI.select(
          [{value:'auto',label:'Automatic'},{value:'oneWay',label:'One-way'},{value:'twoWay',label:'Two-way'}],
          o.spanMode, v => commit('Span', () => multi(objs,'spanMode',v))))
      ]),
      UI.section('Loading', `${U.fx(press.dead,2)} + ${U.fx(press.live,2)} kN/m²`, [
        UI.row('Occupancy', UI.select(LIB.IMPOSED.map(c => ({value:c.id,label:c.name})), o.category,
          v => commit('Occupancy', () => { const c = LIB.IMPOSED.find(x => x.id === v);
            multi(objs,'category',v); multi(objs,'imposed',c.q); Panels.props(doc); }))),
        UI.row('Imposed qk', UI.num(o.imposed, v => commit('Imposed', () => multi(objs,'imposed',v)),
          { step:0.5 }), 'kN/m²'),
        UI.row('Superimposed', UI.select(LIB.SDL.map(c => ({value:String(c.q),label:`${c.name} — ${c.q}`})),
          String(o.sdl), v => commit('SDL', () => { multi(objs,'sdl',U.num(v)); Panels.props(doc); }))),
        UI.row('SDL value', UI.num(o.sdl, v => commit('SDL', () => multi(objs,'sdl',v)), { step:0.1 }), 'kN/m²'),
        UI.explain(`Self weight = thickness × density = ${U.fx(o.thickness,3)} × ` +
          `${U.fx(Model.mat(o.materialId).density,1)} = <b>${U.fx(press.selfWeight,2)} kN/m²</b>. ` +
          `Total permanent load G = ${U.fx(press.dead,2)} kN/m².`),
        el('div',{class:'row wide'},[el('button',{class:'btn ghost sm',
          onclick:() => App.runTakedown()},['Run the load takedown'])])
      ])
    ]);
  }

  function wallProps(doc, objs){
    const o = objs[0];
    return UI.section('Wall', null, [
      UI.row('Height', UI.num(o.height, v => commit('Height', () => multi(objs,'height',v)), {step:0.1}), 'm'),
      UI.row('Thickness', UI.num(o.thickness, v => commit('Thickness', () => multi(objs,'thickness',v)), {step:0.005}), 'm'),
      UI.row('Material', UI.select(LIB.MATERIALS.map(m => ({value:m.id,label:m.name})), o.materialId,
        v => commit('Material', () => multi(objs,'materialId',v)))),
      UI.row('Role', UI.select(['loadbearing','shear','partition'], o.role,
        v => commit('Role', () => multi(objs,'role',v))))
    ]);
  }

  function footingProps(doc, objs){
    const o = objs[0];
    return el('div', {}, [
      UI.section('Pad footing', `${U.fx(o.B,2)} × ${U.fx(o.L,2)} m`, [
        UI.row('B', UI.num(o.B, v => commit('Footing', () => { o.B = v; o.auto = false; }), {step:0.05}), 'm'),
        UI.row('L', UI.num(o.L, v => commit('Footing', () => { o.L = v; o.auto = false; }), {step:0.05}), 'm'),
        UI.row('Depth', UI.num(o.D, v => commit('Footing', () => { o.D = v; o.auto = false; }), {step:0.05}), 'm'),
        UI.row('Bearing q', UI.num(o.qAllow, v => commit('Footing', () => { o.qAllow = v; }), {step:10}), 'kPa'),
        UI.row('N (service)', el('input',{type:'text',readonly:true,value:`${U.fx(o.N_sls,1)} kN`})),
        UI.row('Utilisation', UI.utilChip(o.N_sls/Math.max(o.qAllow*o.B*o.L,1e-9))),
        UI.explain(`Required area = N / q<sub>allow</sub> = ${U.fx(o.N_sls,0)} / ${U.fx(o.qAllow,0)} = ` +
          `<b>${U.fx(o.N_sls/o.qAllow,2)} m²</b>, plus 10% for the footing's own weight.`),
        UI.disclaimer('<b>Bearing pressure only.</b> Punching shear, sliding, overturning and reinforcement are not checked.')
      ])
    ]);
  }

  function levelProps(doc, objs){
    const o = objs[0];
    return UI.section('Level', null, [
      UI.row('Name', UI.text(o.name, v => commit('Level', () => { o.name = v; }))),
      UI.row('Elevation', UI.num(o.elevation, v => commit('Level', () => { o.elevation = v; }), {step:0.1}), 'm')
    ]);
  }
  function gridProps(doc, objs){
    const o = objs[0];
    return UI.section('Grid line', null, [
      UI.row('Label', UI.text(o.label, v => commit('Grid', () => { o.label = v; }))),
      UI.row('Axis', UI.select(['X','Z','free'], o.axis, v => commit('Grid', () => { o.axis = v; })))
    ]);
  }

  /* --- tool options when nothing is selected --------------------------- */
  function toolOptions(doc){
    const t = Tools.current(), o = Tools.opts;
    const kids = [UI.explain(`<b>${t.label || 'Select'}</b><br>${t.hint || ''}`)];
    if(['beam','brace'].includes(Tools.active)){
      kids.push(UI.row('Section', sectionPicker(o.sectionId, v => {
        o.sectionId = v; o.materialId = Model.sec(v).defaultMat; Panels.props(doc); })));
      kids.push(UI.row('Material', UI.select(LIB.MATERIALS.map(m => ({value:m.id,label:m.name})),
        o.materialId, v => { o.materialId = v; })));
      kids.push(UI.rowWide(UI.check('Chain — keep drawing from the last point', o.chain, v => { o.chain = v; })));
    }
    if(Tools.active === 'column'){
      kids.push(UI.row('Section', sectionPicker(o.colSection, v => { o.colSection = v; Panels.props(doc); })));
      kids.push(UI.row('Height', UI.num(o.columnHeight, v => { o.columnHeight = v; }, {step:0.1}), 'm (when no level above)'));
    }
    if(Tools.active === 'support'){
      kids.push(UI.row('Type', UI.select(Object.keys(Model.SUPPORTS), o.supportPreset,
        v => { o.supportPreset = v; })));
    }
    if(Tools.active === 'load'){
      kids.push(UI.row('Case', UI.select(doc.loads.cases.map(c => ({value:c.id,label:c.name})),
        o.loadCase || doc.loads.cases[0]?.id, v => { o.loadCase = v; })));
      kids.push(UI.row('Kind', UI.select(
        [{value:'udl',label:'Uniform line load'},{value:'point',label:'Point load'}],
        o.loadKind, v => { o.loadKind = v; })));
      kids.push(UI.row('Value', UI.num(o.loadValue, v => { o.loadValue = v; }, {step:1}), 'kN or kN/m, −Y is down'));
    }
    kids.push(UI.rowWide(el('div', { style:'display:flex;gap:5px;flex-wrap:wrap' },
      Object.entries(Snap.state).map(([k,v]) => el('button', {
        class:'btn ghost sm', 'aria-pressed':String(v),
        onclick:e => { Snap.state[k] = !Snap.state[k];
                       e.currentTarget.setAttribute('aria-pressed', String(Snap.state[k])); }
      }, [k])))));
    return UI.section('Tool', t.label || 'Select', kids);
  }

  function projectSection(doc){
    const v = Model.validate(doc);
    return el('div', {}, [
      UI.section('Model', `${doc.analytical.nodes.length} nodes`, [
        UI.row('Members', el('input',{type:'text',readonly:true,value:String(doc.physical.members.length)})),
        UI.row('Slabs', el('input',{type:'text',readonly:true,value:String(doc.physical.slabs.length)})),
        UI.row('Degrees of freedom', el('input',{type:'text',readonly:true,value:String(v.nDof)})),
        v.errors.length ? el('div',{class:'disclaimer',html:
          '<b>Model errors</b><br>' + v.errors.slice(0,4).map(e => Util.esc(e.msg)).join('<br>')}) : null,
        v.warnings.length ? el('div',{class:'explain',html:
          '<b>Warnings</b><br>' + v.warnings.slice(0,4).map(e => Util.esc(e.msg)).join('<br>')}) : null
      ].filter(Boolean)),
      UI.section('Settings', null, [
        UI.row('Grid snap', UI.num(doc.settings.gridSnap, v2 => { doc.settings.gridSnap = v2; }, {step:0.05}), 'm'),
        UI.row('Merge tolerance', UI.num(doc.settings.mergeTol, v2 => { doc.settings.mergeTol = v2; }, {step:0.001}), 'm'),
        UI.row('Deflection limit', UI.num(doc.settings.deflLimit, v2 => { doc.settings.deflLimit = v2; }, {step:10}), 'span / n'),
        UI.row('Soil bearing', UI.num(doc.settings.qAllowSoil, v2 => { doc.settings.qAllowSoil = v2; }, {step:10}), 'kPa')
      ], false)
    ]);
  }

  /* ------------------------------------------------------------------ data */
  let dataTab = 'nodes';
  function data(doc){
    const host = UI.dom.paneData; host.textContent = '';
    const tabs = ['nodes','members','slabs','loads','combos'];
    host.appendChild(el('div', { style:'display:flex;gap:4px;margin-bottom:9px;flex-wrap:wrap' },
      tabs.map(t => el('button', { class:'btn ghost sm', 'aria-pressed':String(dataTab === t),
        onclick:() => { dataTab = t; data(doc); } }, [t]))));

    const N = doc.analytical.nodes, M = doc.analytical.members;
    const sel = id => Store.selection.has(id);
    const pick = r => Store.select([r.id]);

    if(dataTab === 'nodes'){
      host.appendChild(UI.table([
        { label:'#', value:r => r.tag || r.id.slice(-4) },
        { label:'X', num:true, value:r => U.fx(r.p[0],3) },
        { label:'Y', num:true, value:r => U.fx(r.p[1],3) },
        { label:'Z', num:true, value:r => U.fx(r.p[2],3) },
        { label:'Support', value:r => r.support.some(v=>v)
            ? Model.DOF_NAMES.filter((_,i) => r.support[i]).join(' ') : '—' }
      ], N, { onRow:pick, selected:r => sel(r.id) }));
    } else if(dataTab === 'members'){
      host.appendChild(UI.table([
        { label:'#', value:r => r.id.slice(-4) },
        { label:'Role', key:'role' },
        { label:'Section', value:r => Model.sec(r.sectionId).name },
        { label:'Material', value:r => Model.mat(r.materialId).name },
        { label:'L', num:true, value:r => {
            const a = Model.byId(N,r.i), b = Model.byId(N,r.j);
            return a&&b ? U.fx(Math.hypot(a.p[0]-b.p[0],a.p[1]-b.p[1],a.p[2]-b.p[2]),2) : '—'; } }
      ], M, { onRow:pick, selected:r => sel(r.id) }));
    } else if(dataTab === 'slabs'){
      const press = LoadGen.slabPressures(doc);
      host.appendChild(UI.table([
        { label:'#', value:r => r.id.slice(-4) },
        { label:'Level', value:r => (Model.byId(doc.levels,r.levelId)||{}).name || '—' },
        { label:'Area', num:true, value:r => U.fx(Geom.area(r.boundary),1) },
        { label:'t', num:true, value:r => U.fx(r.thickness,3) },
        { label:'G', num:true, value:r => U.fx(press.get(r.id).dead,2) },
        { label:'Q', num:true, value:r => U.fx(press.get(r.id).live,2) }
      ], doc.physical.slabs, { onRow:pick, selected:r => sel(r.id) }));
    } else if(dataTab === 'loads'){
      const rows = [
        ...doc.loads.member.map(l => ({ ...l, what:'member', target:l.memberId,
          value:`${U.fx(l.w1,2)}${l.w2!=null&&l.w2!==l.w1?` → ${U.fx(l.w2,2)}`:''} kN/m` })),
        ...doc.loads.nodal.map(l => ({ ...l, what:'node', target:l.nodeId,
          value:`${U.fx(Math.hypot(l.Fx||0,l.Fy||0,l.Fz||0),2)} kN` }))
      ];
      host.appendChild(UI.table([
        { label:'Type', key:'what' },
        { label:'Case', value:r => (Model.byId(doc.loads.cases,r.caseId)||{}).name || '—' },
        { label:'Target', value:r => String(r.target||'').slice(-4) },
        { label:'Kind', value:r => r.kind || 'point' },
        { label:'Value', key:'value', num:true },
        { label:'Source', key:'source' }
      ], rows, {}));
    } else {
      host.appendChild(UI.table([
        { label:'Combination', key:'name' },
        { label:'State', key:'limitState' },
        { label:'Terms', value:r => r.terms.map(t => {
            const c = Model.byId(doc.loads.cases, t.caseId);
            return `${U.fx(t.factor,2)}·${c?c.name.split(' ')[0]:'?'}`; }).join(' + ') }
      ], doc.loads.combos, {
        onRow:r => { doc.loads.activeCombo = r.id; App.recombine(); },
        selected:r => r.id === doc.loads.activeCombo }));
    }
  }

  /* --------------------------------------------------------------- results */
  function results(doc){
    const host = UI.dom.paneResults; host.textContent = '';
    const res = Results.res, comb = Results.comb;
    if(!res || !comb){
      host.appendChild(UI.empty(
        'Nothing solved yet.<br>Use <b>Analyse → Solve</b>, or press <kbd>F5</kbd>.'));
      if(Results.lastError)
        host.appendChild(el('div',{class:'disclaimer',html:'<b>Last attempt failed</b><br>' +
          Results.lastError.slice(0,5).map(e => Util.esc(e.msg)).join('<br>')}));
      return;
    }
    const eq = Results.equilibrium;
    const cb = Results.activeCombo(doc);
    let dmax = 0, mmax = 0, nmax = 0;
    for(const d of Results.diagrams){ if(!d) continue;
      dmax = Math.max(dmax, d.maxAbs.d); mmax = Math.max(mmax, d.maxAbs.Mz); nmax = Math.max(nmax, d.maxAbs.N); }

    host.appendChild(UI.section('Summary', cb?.name, [
      UI.row('Solve time', el('input',{type:'text',readonly:true,value:`${U.fx(res.solveMs,1)} ms`})),
      UI.row('Degrees of freedom', el('input',{type:'text',readonly:true,value:`${res.nFree} free of ${res.nDof}`})),
      UI.row('Max deflection', el('input',{type:'text',readonly:true,value:`${U.fx(dmax*1000,2)} mm`})),
      UI.row('Max moment', el('input',{type:'text',readonly:true,value:`${U.fx(mmax,1)} kNm`})),
      UI.row('Max axial', el('input',{type:'text',readonly:true,value:`${U.fx(nmax,1)} kN`})),
      eq ? el('div', { class:eq.ok ? 'explain' : 'disclaimer', html:
        `<b>Vertical equilibrium ${eq.ok ? 'checks out' : 'FAILS'}</b><span class="f">` +
        `applied   ${U.fx(eq.totalApplied,2)} kN\n` +
        `reactions ${U.fx(-eq.totalReaction,2)} kN\n` +
        `residual  ${U.eng(eq.F[1],2)} kN</span>` +
        `This runs on every solve, so a broken load path shows up immediately.` }) : null
    ].filter(Boolean)));

    host.appendChild(UI.section('Reactions', null, [
      UI.table([
        { label:'Node', value:r => r.tag },
        { label:'Fx', num:true, value:r => U.fx(r.Fx,1) },
        { label:'Fy', num:true, value:r => U.fx(r.Fy,1) },
        { label:'Fz', num:true, value:r => U.fx(r.Fz,1) }
      ], res.ctx.nodes.map((n,i) => ({
          id:n.id, tag:n.tag || n.id.slice(-4),
          Fx:comb.R[i*6], Fy:comb.R[i*6+1], Fz:comb.R[i*6+2],
          any:n.support.some(v => v)
        })).filter(r => r.any),
        { onRow:r => Store.select([r.id]),
          footer:[{text:'Total'},{text:'',num:true},
                  {text:U.fx(res.ctx.nodes.reduce((s,n,i)=>s+comb.R[i*6+1],0),1),num:true},
                  {text:'',num:true}] })
    ]));

    if(Results.checks) host.appendChild(UI.section('Utilisation', `${Results.checks.length} members`, [
      UI.disclaimer('<b>Educational check.</b> Elastic section capacity and a deflection limit only — ' +
        'no buckling, lateral-torsional buckling or connection design. Not a code-compliant design.'),
      UI.table([
        { label:'Member', value:r => r.id.slice(-4) },
        { label:'Section', value:r => Model.sec(r.sectionId).name },
        { label:'N', num:true, value:r => U.fx(r.N,1) },
        { label:'M', num:true, value:r => U.fx(r.Mz,1) },
        { label:'Util', num:true, render:r => UI.utilChip(r.utilMax) },
        { label:'Governs', key:'governs' }
      ], Results.checks.slice(0, 200), { onRow:r => Store.select([r.id]) })
    ]));

    if(Results.takedown) host.appendChild(takedownSection(doc));
  }

  function takedownSection(doc){
    const td = Results.takedown;
    const res = Results.res, comb = Results.comb;
    const rows = td.stacks.map(s => {
      const f = td.footings.find(x => x.stackId === s.id);
      let fea = null;
      if(res && comb && s.baseNodeId){
        const i = res.ctx.nodeIdx.get(s.baseNodeId);
        if(i != null) fea = comb.R[i*6+1];
      }
      return { id:s.id, hand:s.N_sls, fea:fea == null ? null : Math.abs(fea),
               diff: fea == null ? null : (Math.abs(fea) - s.N_sls)/Math.max(s.N_sls,1e-9)*100,
               B:f?f.B:0, nodeId:s.baseNodeId };
    });
    return UI.section('Load takedown', `${td.stacks.length} column stacks`, [
      UI.explain('The <b>hand</b> column is the tributary-area takedown; the <b>FEA</b> column is ' +
        'the solved base reaction. They rarely agree exactly — continuity over supports moves load ' +
        'towards the stiffer columns. Seeing by how much is the point.'),
      UI.table([
        { label:'Stack', key:'id' },
        { label:'Hand', num:true, value:r => U.fx(r.hand,0) },
        { label:'FEA', num:true, value:r => r.fea == null ? '—' : U.fx(r.fea,0) },
        { label:'Δ%', num:true, value:r => r.diff == null ? '—' : U.fx(r.diff,1) },
        { label:'Footing', num:true, value:r => `${U.fx(r.B,2)} m` }
      ], rows, { onRow:r => { App.highlightStack(r.id); if(r.nodeId) Store.select([r.nodeId]); } }),
      el('div',{class:'row wide'},[el('button',{class:'btn ghost sm',
        onclick:() => UI.csv([
          {label:'Stack',key:'id'},{label:'Hand kN',key:'hand'},
          {label:'FEA kN',key:'fea'},{label:'Footing B m',key:'B'}], rows, 'takedown.csv')},
        ['Export CSV'])])
    ]);
  }

  /* ------------------------------------------------------------- schedules */
  function schedules(doc){
    const host = UI.dom.paneSched; host.textContent = '';
    const N = new Map(doc.analytical.nodes.map(n => [n.id, n]));

    // member schedule grouped by section
    const bySec = new Map();
    for(const m of doc.analytical.members){
      const a = N.get(m.i), b = N.get(m.j); if(!a || !b) continue;
      const L = Math.hypot(a.p[0]-b.p[0], a.p[1]-b.p[1], a.p[2]-b.p[2]);
      const k = m.sectionId;
      const e = bySec.get(k) || { sectionId:k, name:Model.sec(k).name, role:m.role,
                                  materialId:m.materialId, count:0, length:0, mass:0 };
      e.count++; e.length += L;
      e.mass += Model.sec(k).A * Model.mat(m.materialId).density * L / 9.80665 * 1000;
      bySec.set(k, e);
    }
    const secRows = [...bySec.values()].sort((a,b) => b.length - a.length);
    host.appendChild(UI.section('Member schedule', `${doc.analytical.members.length} members`, [
      UI.table([
        { label:'Section', key:'name' },
        { label:'Material', value:r => Model.mat(r.materialId).name },
        { label:'No.', num:true, key:'count' },
        { label:'Total m', num:true, value:r => U.fx(r.length,1) },
        { label:'Mass kg', num:true, value:r => U.fx(r.mass,0) }
      ], secRows, { footer:[
        {text:'Total'},{text:''},
        {text:String(Util.sum(secRows.map(r => r.count))), num:true},
        {text:U.fx(Util.sum(secRows.map(r => r.length)),1), num:true},
        {text:U.fx(Util.sum(secRows.map(r => r.mass)),0), num:true}] }),
      el('div',{class:'row wide'},[el('button',{class:'btn ghost sm',
        onclick:() => UI.csv([{label:'Section',key:'name'},{label:'Count',key:'count'},
          {label:'Length m',key:'length'},{label:'Mass kg',key:'mass'}], secRows, 'members.csv')},
        ['Export CSV'])])
    ]));

    // material quantities
    const byFam = new Map();
    for(const r of secRows){
      const fam = Model.mat(r.materialId).family;
      const e = byFam.get(fam) || { fam, volume:0, mass:0 };
      e.volume += Model.sec(r.sectionId).A * r.length;
      e.mass += r.mass;
      byFam.set(fam, e);
    }
    for(const s of doc.physical.slabs){
      const fam = Model.mat(s.materialId).family;
      const e = byFam.get(fam) || { fam, volume:0, mass:0 };
      const v = Geom.area(s.boundary)*s.thickness;
      e.volume += v; e.mass += v*Model.mat(s.materialId).density/9.80665*1000;
      byFam.set(fam, e);
    }
    host.appendChild(UI.section('Quantities', null, [
      UI.table([
        { label:'Material', value:r => LIB.familyLabel[r.fam] || r.fam },
        { label:'Volume m³', num:true, value:r => U.fx(r.volume,2) },
        { label:'Mass t', num:true, value:r => U.fx(r.mass/1000,2) }
      ], [...byFam.values()], {})
    ]));

    // footing schedule
    const td = Results.takedown;
    const fRows = td ? td.footings : doc.physical.footings.map(f => ({
      stackId:f.id, B:f.B, L:f.L, D:f.D, N_sls:f.N_sls, util:f.util }));
    host.appendChild(UI.section('Footings', `${fRows.length}`, [
      fRows.length ? UI.table([
        { label:'Mark', value:r => r.stackId },
        { label:'B × L', value:r => `${U.fx(r.B,2)} × ${U.fx(r.L,2)}` },
        { label:'D', num:true, value:r => U.fx(r.D,2) },
        { label:'N kN', num:true, value:r => U.fx(r.N_sls,0) },
        { label:'Util', num:true, render:r => UI.utilChip(r.util || 0) }
      ], fRows, {}) : UI.empty('Run the load takedown to size the foundations.')
    ]));
  }

  return { refreshAll, props, data, results, schedules, sectionPicker };
})();

/* ==========================================================================
   28  IO - save, open, autosave, downloads
   ========================================================================== */
const IO = (() => {
  const KEY = 'structural-studio:autosave';
  const SETTINGS = 'structural-studio:prefs';

  function download(blob, name){
    const url = URL.createObjectURL(blob);
    const a = el('a', { href:url, download:name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  const slug = s => String(s || 'project').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48) || 'project';

  function saveFile(){
    const doc = Store.doc;
    doc.meta.name = UI.dom.projName.value || doc.meta.name;
    const json = JSON.stringify(Model.serialize(doc), null, 1);
    download(new Blob([json], { type:'application/json' }), `${slug(doc.meta.name)}.ssproj.json`);
    Store.markClean();
    UI.toast('Project saved to your downloads folder.', 'ok');
  }

  function openFile(){
    pickFile('.json,.ssproj.json,application/json', (text) => {
      try {
        const doc = Model.deserialize(text);
        Store.load(doc);
        UI.toast(`Opened “${doc.meta.name}”.`, 'ok');
      } catch(e){
        UI.toast(`Could not open that file — ${e.message}`, 'bad', 7000);
      }
    });
  }

  /** Read a file the user picks. `as` is 'text' | 'dataURL' | 'arrayBuffer'. */
  function pickFile(accept, cb, as = 'text'){
    const inp = UI.dom.filepick;
    inp.value = '';
    inp.accept = accept;
    inp.onchange = () => {
      const f = inp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => cb(r.result, f);
      r.onerror = () => UI.toast('Could not read that file.', 'bad');
      if(as === 'dataURL') r.readAsDataURL(f);
      else if(as === 'arrayBuffer') r.readAsArrayBuffer(f);
      else r.readAsText(f);
    };
    inp.click();
  }

  /* --- autosave -----------------------------------------------------------
     Underlays can be megabytes of base64, so they are stored separately and
     dropped first when the quota bites. */
  const autosave = Util.debounce(() => {
    try {
      const doc = Model.serialize(Store.doc);
      const light = { ...doc, underlays: doc.underlays.map(u => ({ ...u, data:null })) };
      localStorage.setItem(KEY, JSON.stringify(light));
    } catch(e){
      if(e && /quota/i.test(e.name || e.message || ''))
        UI.toast('The model is too large for browser autosave — use File → Save.', 'warn', 6000);
    }
  }, 1500);

  function restore(){
    try {
      const raw = localStorage.getItem(KEY);
      if(!raw) return null;
      return Model.deserialize(raw);
    } catch(e){ return null; }
  }
  function clearAutosave(){ try { localStorage.removeItem(KEY); } catch(e){} }

  function prefs(patch){
    try {
      const cur = JSON.parse(localStorage.getItem(SETTINGS) || '{}');
      if(patch){ Object.assign(cur, patch); localStorage.setItem(SETTINGS, JSON.stringify(cur)); }
      return cur;
    } catch(e){ return {}; }
  }

  return { download, saveFile, openFile, pickFile, autosave, restore, clearAutosave, prefs, slug };
})();

/* ==========================================================================
   29  DRAFT - orthographic views, sheets, PNG export
   ========================================================================== */
const Draft = (() => {
  let mode = '3d';
  let ortho = null;

  function setView(which){
    const doc = Store.doc;
    mode = which;
    if(which === '3d'){ Render.standardView('iso'); UI.toast('3D view', 'ok', 1400); return; }
    if(which === 'plan'){
      Render.standardView('top');
      UI.toast(`Plan — ${(Model.byId(doc.levels, doc.views.activeLevel)||{}).name || 'all levels'}`, 'ok', 1800);
    }
    if(which === 'elevation'){ Render.standardView('front'); UI.toast('Elevation looking north', 'ok', 1600); }
    if(which === 'section'){ Render.standardView('front'); UI.toast('Section — set the cut in the View tab', 'ok', 2200); }
    App.refreshChrome();
  }

  /* --- PNG export ---------------------------------------------------------
     CSS2D labels are DOM elements, not canvas pixels, so a naive toDataURL
     silently drops every one of them. The export therefore renders the WebGL
     canvas at 2x, draws it onto a 2D canvas, then re-draws each visible label
     by projecting its world position through the export camera. Text drawn
     this way is also sharper than any DOM rasterisation. */
  function exportPNG({ scale = 2, titleBlock = true, withLabels = true } = {}){
    const doc = Store.doc;
    const r = Render.renderer, cam = Render.camera, cv = Render.canvas;
    const w0 = cv.clientWidth, h0 = cv.clientHeight;
    const W = Math.min(Math.round(w0*scale), 6000), H = Math.min(Math.round(h0*scale), 6000);

    // render at the export size, read back in the same synchronous block
    r.setSize(W, H, false);
    cam.aspect = W/H; cam.updateProjectionMatrix();
    Render.scene.traverse(o => { if(o.material && o.material.isLineMaterial) o.material.resolution.set(W,H); });
    r.render(Render.scene, cam);
    const src = new Image();
    const url = cv.toDataURL('image/png');

    // restore immediately
    r.setSize(w0, h0, false);
    cam.aspect = w0/h0; cam.updateProjectionMatrix();
    Render.scene.traverse(o => { if(o.material && o.material.isLineMaterial) o.material.resolution.set(w0,h0); });
    Render.invalidate();

    src.onload = () => {
      const pad = titleBlock ? Math.round(H*0.075) : 0;
      const out = document.createElement('canvas');
      out.width = W; out.height = H + pad;
      const c = out.getContext('2d');
      const dark = document.documentElement.dataset.theme !== 'light';
      c.fillStyle = dark ? '#141820' : '#e7ebf1';
      c.fillRect(0,0,W,H);
      c.drawImage(src, 0, 0, W, H);

      if(withLabels) drawLabels(c, W, H, scale);

      // legend
      if(App.legendState) drawLegend(c, W, H, App.legendState, scale);

      if(titleBlock){
        c.fillStyle = dark ? '#1f242d' : '#ffffff';
        c.fillRect(0, H, W, pad);
        c.strokeStyle = dark ? '#39424f' : '#c8d1dc';
        c.lineWidth = Math.max(1, scale);
        c.beginPath(); c.moveTo(0, H+0.5*c.lineWidth); c.lineTo(W, H+0.5*c.lineWidth); c.stroke();

        const fs = Math.round(pad*0.28);
        c.textBaseline = 'middle';
        c.fillStyle = dark ? '#eef2f7' : '#141a22';
        c.font = `600 ${fs}px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif`;
        c.fillText(doc.meta.name || 'Untitled Project', pad*0.35, H + pad*0.34);

        c.font = `${Math.round(fs*0.72)}px ui-sans-serif, system-ui, sans-serif`;
        c.fillStyle = dark ? '#b6c0cd' : '#3d4757';
        const cb = Results.activeCombo(doc);
        const bits = [
          new Date().toLocaleDateString(),
          mode === '3d' ? '3D view' : mode,
          doc.views.resultMode !== 'none' ? `${Viz.MODES[doc.views.resultMode]?.label || ''}` : null,
          cb ? cb.name : null,
          doc.views.resultMode !== 'none' ? `deformation ×${U.fx(Results.scale,0)}` : null,
          'Structural Studio'
        ].filter(Boolean);
        c.fillText(bits.join('   ·   '), pad*0.35, H + pad*0.68);

        // the copyright, bottom left of the sheet, always
        c.textAlign = 'right';
        c.font = `600 ${Math.round(fs*0.85)}px ui-sans-serif, system-ui, sans-serif`;
        c.fillStyle = dark ? '#eef2f7' : '#141a22';
        c.fillText('© Karam Al-Obaidi', W - pad*0.35, H + pad*0.5);
        c.textAlign = 'left';
      }

      // and on the image itself, mirroring the on-screen badge
      const fs2 = Math.round(Math.max(12*scale, H*0.018));
      c.font = `600 ${fs2}px ui-sans-serif, system-ui, sans-serif`;
      c.fillStyle = dark ? 'rgba(238,242,247,.92)' : 'rgba(20,26,34,.92)';
      c.shadowColor = dark ? 'rgba(0,0,0,.6)' : 'rgba(255,255,255,.8)';
      c.shadowBlur = 4*scale;
      c.fillText('© Karam Al-Obaidi', fs2, H - fs2);
      c.shadowBlur = 0;

      out.toBlob(b => {
        IO.download(b, `${IO.slug(doc.meta.name)}-${mode}.png`);
        UI.toast('Image exported with labels, legend and title block.', 'ok');
      }, 'image/png');
    };
    src.src = url;
  }

  function drawLabels(c, W, H, scale){
    const cam = Render.camera;
    const v = new THREE.Vector3();
    const fs = Math.round(10.5*scale);
    c.font = `${fs}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    c.textBaseline = 'middle';
    c.textAlign = 'center';
    const dark = document.documentElement.dataset.theme !== 'light';
    Render.scene.traverse(o => {
      if(!o.isCSS2DObject || !o.visible) return;
      let p = o.parent; while(p){ if(!p.visible) return; p = p.parent; }
      o.getWorldPosition(v);
      const d = v.clone().project(cam);
      if(d.z < -1 || d.z > 1) return;
      const x = (d.x*0.5+0.5)*W, y = (-d.y*0.5+0.5)*H;
      const txt = o.element.textContent || '';
      if(!txt) return;
      const cls = o.element.className;
      const w = c.measureText(txt).width;
      c.fillStyle = dark ? 'rgba(10,14,20,.74)' : 'rgba(255,255,255,.88)';
      c.fillRect(x - w/2 - 3*scale, y - fs*0.75, w + 6*scale, fs*1.5);
      c.fillStyle = /grid/.test(cls) ? '#4da3ff' : /val/.test(cls) ? '#f0b23c'
                  : /tag/.test(cls) ? '#4ec98b' : /node/.test(cls) ? '#7f8cff'
                  : (dark ? '#eef2f7' : '#141a22');
      c.fillText(txt, x, y);
    });
  }

  function drawLegend(c, W, H, st, scale){
    const w = 210*scale, h = 74*scale, x = W - w - 16*scale, y = H - h - 16*scale;
    const dark = document.documentElement.dataset.theme !== 'light';
    c.fillStyle = dark ? 'rgba(20,26,34,.86)' : 'rgba(255,255,255,.92)';
    c.strokeStyle = dark ? '#39424f' : '#c8d1dc';
    c.lineWidth = scale;
    c.beginPath(); c.roundRect(x, y, w, h, 7*scale); c.fill(); c.stroke();

    c.fillStyle = dark ? '#eef2f7' : '#141a22';
    c.font = `600 ${Math.round(11*scale)}px ui-sans-serif, system-ui, sans-serif`;
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.fillText(st.label, x + 10*scale, y + 18*scale);

    const gx = x + 10*scale, gy = y + 26*scale, gw = w - 20*scale, gh = 11*scale;
    const grad = c.createLinearGradient(gx, 0, gx+gw, 0);
    for(let i = 0; i <= 12; i++){
      const col = Render.ramp(st.ramp, i/12);
      grad.addColorStop(i/12, `rgb(${col.map(Math.round).join(',')})`);
    }
    c.fillStyle = grad; c.fillRect(gx, gy, gw, gh);
    c.strokeRect(gx, gy, gw, gh);

    c.font = `${Math.round(9.5*scale)}px ui-monospace, monospace`;
    c.fillStyle = dark ? '#b6c0cd' : '#3d4757';
    c.fillText(U.eng(st.lo,2), gx, gy + gh + 13*scale);
    c.textAlign = 'right';
    c.fillText(U.eng(st.hi,2), gx + gw, gy + gh + 13*scale);
    c.textAlign = 'center';
    c.fillText(st.unit, gx + gw/2, gy + gh + 26*scale);
    c.textAlign = 'left';
  }

  /* --- printable sheet ------------------------------------------------------ */
  function sheetDialog(){
    const doc = Store.doc;
    let scale = 2, labels = true, block = true;
    UI.modal({
      title:'Export drawing', sub:'PNG with title block',
      body:[
        UI.explain('The export re-draws every label and the legend into the image. ' +
          'CSS labels live in the DOM, not the WebGL canvas, so without this step they would vanish.'),
        UI.row('Resolution', UI.select([
          { value:'1', label:'1× — screen size' },
          { value:'2', label:'2× — presentation (recommended)' },
          { value:'3', label:'3× — print' }], '2', v => { scale = +v; })),
        UI.rowWide(UI.check('Include labels and dimensions', true, v => { labels = v; })),
        UI.rowWide(UI.check('Include title block and copyright', true, v => { block = v; })),
        UI.explain(`Title block: <b>${Util.esc(doc.meta.name)}</b> · ${new Date().toLocaleDateString()} · ` +
                   `© Karam Al-Obaidi`)
      ],
      footer:[
        el('button', { class:'btn ghost', onclick:UI.close }, ['Cancel']),
        el('button', { class:'btn primary', onclick:() => { UI.close();
          exportPNG({ scale, withLabels:labels, titleBlock:block }); } }, ['Export PNG'])
      ]
    });
  }

  return { setView, exportPNG, sheetDialog, get mode(){ return mode } };
})();

/* ==========================================================================
   30  IMPORT - DXF plans, OBJ massing, image underlays, IFC (lazy)
   ========================================================================== */
const Import = (() => {

  function pick(kind){
    if(kind === 'dxf')   return IO.pickFile('.dxf,text/plain', dxf);
    if(kind === 'obj')   return IO.pickFile('.obj,text/plain', obj);
    if(kind === 'image') return IO.pickFile('image/*', image, 'dataURL');
    if(kind === 'ifc')   return ifcDialog();
  }

  /* --- DXF ----------------------------------------------------------------
     We do not want to RENDER the DXF, we want to read it. A minimal reader
     over the tagged pairs pulls LINE and LWPOLYLINE entities with their layer
     names, which is exactly what a floor plan carries. The user then chooses
     whether each layer becomes grid lines, member centrelines, or a traced
     underlay. That is the plan-to-model workflow students actually want. */
  function parseDXF(text){
    const lines = text.split(/\r\n|\r|\n/);
    const ents = [];
    let i = 0;
    // jump to ENTITIES
    while(i < lines.length && !(lines[i].trim() === 'ENTITIES')) i++;
    let cur = null;
    const flush = () => { if(cur && cur.pts.length >= 2) ents.push(cur); cur = null; };
    for(; i < lines.length - 1; i += 2){
      const code = lines[i].trim(), val = (lines[i+1] ?? '').trim();
      if(code === '0'){
        flush();
        if(val === 'ENDSEC') break;
        if(val === 'LINE' || val === 'LWPOLYLINE' || val === 'POLYLINE')
          cur = { type:val, layer:'0', pts:[], closed:false, _x:null, _y:null };
        continue;
      }
      if(!cur) continue;
      if(code === '8'){ cur.layer = val; continue; }
      if(cur.type === 'LINE'){
        if(code === '10') cur._x0 = parseFloat(val);
        else if(code === '20') cur._y0 = parseFloat(val);
        else if(code === '11') cur._x1 = parseFloat(val);
        else if(code === '21'){
          cur._y1 = parseFloat(val);
          cur.pts = [[cur._x0, cur._y0], [cur._x1, cur._y1]];
        }
        continue;
      }
      // LWPOLYLINE / POLYLINE vertices
      if(code === '10'){ cur._x = parseFloat(val); }
      else if(code === '20'){
        cur._y = parseFloat(val);
        if(cur._x != null && isFinite(cur._x) && isFinite(cur._y)) cur.pts.push([cur._x, cur._y]);
        cur._x = null;
      }
      else if(code === '70'){ cur.closed = (parseInt(val,10) & 1) === 1; }
    }
    flush();
    return ents.filter(e => e.pts.every(p => isFinite(p[0]) && isFinite(p[1])));
  }

  function dxf(text, file){
    let ents;
    try { ents = parseDXF(text); }
    catch(e){ return UI.toast('That DXF could not be read.', 'bad'); }
    if(!ents.length) return UI.toast('No LINE or POLYLINE entities were found in that DXF.', 'warn', 6000);

    const layers = [...new Set(ents.map(e => e.layer))].sort();
    const assign = {};
    for(const l of layers) assign[l] = /grid|axis/i.test(l) ? 'grid'
                                     : /col|column/i.test(l) ? 'column'
                                     : /beam|struct/i.test(l) ? 'beam' : 'underlay';
    let unit = 0.001;      // DXF plans are usually in millimetres

    UI.modal({
      title:'Import DXF plan', sub:file?.name, wide:true,
      body:[
        UI.explain(`Found <b>${ents.length}</b> lines across <b>${layers.length}</b> layers. ` +
          'Choose what each layer becomes. Anything set to <i>underlay</i> is drawn as ' +
          'traceable reference geometry only.'),
        UI.row('Drawing units', UI.select([
          { value:'0.001', label:'Millimetres' },
          { value:'0.01',  label:'Centimetres' },
          { value:'1',     label:'Metres' },
          { value:'0.3048',label:'Feet' }], '0.001', v => { unit = +v; })),
        el('div', { class:'tbl-wrap', style:'max-height:44vh' },
          [el('table', { class:'tbl' }, [
            el('thead', {}, [el('tr', {}, [
              el('th',{text:'Layer'}), el('th',{text:'Lines'}), el('th',{text:'Becomes'})])]),
            el('tbody', {}, layers.map(l => el('tr', {}, [
              el('td',{text:l}),
              el('td',{class:'num',text:String(ents.filter(e => e.layer === l).length)}),
              el('td',{}, [UI.select(
                [{value:'underlay',label:'Underlay (trace over)'},
                 {value:'grid',label:'Grid lines'},
                 {value:'beam',label:'Beams'},
                 {value:'column',label:'Column points'},
                 {value:'skip',label:'Ignore'}], assign[l], v => { assign[l] = v; })])
            ])))
          ])])
      ],
      footer:[
        el('button',{class:'btn ghost',onclick:UI.close},['Cancel']),
        el('button',{class:'btn primary',onclick:() => { UI.close(); applyDXF(ents, assign, unit); }},
          ['Import'])
      ]
    });
  }

  function applyDXF(ents, assign, unit){
    const doc = Store.doc;
    Store.checkpoint('Import DXF');
    const y = Tools.activeY(doc);
    let nGrid = 0, nBeam = 0, nCol = 0, nRef = 0;
    const under = [];

    for(const e of ents){
      const role = assign[e.layer];
      if(role === 'skip') continue;
      const pts = e.pts.map(p => [p[0]*unit, p[1]*unit]);
      if(role === 'grid'){
        for(let i = 0; i < pts.length-1; i++){
          const a = pts[i], b = pts[i+1];
          const axis = Math.abs(b[0]-a[0]) < Math.abs(b[1]-a[1]) ? 'X' : 'Z';
          const n = doc.grids.filter(g => g.axis === axis).length;
          doc.grids.push(Model.mk.grid(
            axis === 'X' ? String.fromCharCode(65 + (n % 26)) : String(n+1), a, b, axis));
          nGrid++;
        }
      } else if(role === 'beam'){
        for(let i = 0; i < pts.length-1; i++){
          const a = pts[i], b = pts[i+1];
          if(Geom.dist(a,b) < 0.2) continue;
          doc.physical.members.push(Model.mk.member({
            role:'beam', sectionId:Tools.opts.sectionId, materialId:Tools.opts.materialId,
            start:[a[0], y, a[1]], end:[b[0], y, b[1]], levelId:doc.views.activeLevel }));
          nBeam++;
        }
      } else if(role === 'column'){
        const c = Geom.centroid(pts.length > 2 ? pts : [...pts, pts[0]]);
        const below = doc.levels.filter(l => l.elevation < y - 1e-6)
                                .sort((a,b) => b.elevation - a.elevation)[0];
        const y0 = below ? below.elevation : y - 3.5;
        doc.physical.members.push(Model.mk.member({
          role:'column', sectionId:Tools.opts.colSection,
          materialId:Model.sec(Tools.opts.colSection).defaultMat,
          start:[c[0], y0, c[1]], end:[c[0], y, c[1]], levelId:doc.views.activeLevel }));
        nCol++;
      } else {
        under.push(pts); nRef++;
      }
    }

    if(under.length){
      const id = Util.id('UL');
      doc.underlays.push({ id, kind:'dxf', levelId:doc.views.activeLevel,
                           transform:{ y }, opacity:0.6, data:null });
      Store.assets.set(id, { lines:under, y });
    }
    Store.touch('import');
    App.rebuild();
    Render.fit();
    UI.toast(`Imported ${nGrid} grid lines, ${nBeam} beams, ${nCol} columns and ${nRef} reference lines.`,
      'ok', 6000);
  }

  /* --- OBJ ------------------------------------------------------------------ */
  function obj(text, file){
    let root;
    try { root = new OBJLoader().parse(text); }
    catch(e){ return UI.toast('That OBJ could not be parsed.', 'bad'); }
    const doc = Store.doc;
    const g = Render.groups.context;
    const mat = new THREE.MeshStandardMaterial({
      color:0x6f7c8c, transparent:true, opacity:0.28, roughness:0.95,
      metalness:0, side:THREE.DoubleSide, depthWrite:false });
    root.traverse(o => { if(o.isMesh){ o.material = mat; o.userData = { kind:'context' }; } });

    // normalise into a sensible size if the model is wildly scaled
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    let k = 1;
    if(size.length() > 5000) k = 0.001;
    else if(size.length() < 2) k = 1000;
    root.scale.setScalar(k);
    root.position.y -= box.min.y*k;
    root.name = 'objContext';
    g.add(root);
    Render.invalidate(); Render.fit();
    UI.toast(`Loaded ${file?.name || 'model'} as ghosted context geometry` +
             (k !== 1 ? ` (scaled ×${k})` : '') + '.', 'ok', 5000);
  }

  /* --- image underlay -------------------------------------------------------
     A plan image is placed on the active level and then scaled by clicking two
     points whose real separation the student types in. */
  function image(dataURL, file){
    const doc = Store.doc;
    const id = Util.id('UL');
    const y = Tools.activeY(doc);
    const tex = new THREE.TextureLoader().load(dataURL, t => {
      const ar = t.image.width / t.image.height;
      const w = 20, h = w/ar;
      const geo = new THREE.PlaneGeometry(w, h);
      geo.rotateX(-Math.PI/2);
      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
        map:t, transparent:true, opacity:0.65, depthWrite:false, side:THREE.DoubleSide }));
      mesh.position.y = y + 0.004;
      mesh.name = 'underlay:' + id;
      mesh.userData = { kind:'underlay', id };
      Render.groups.underlay.add(mesh);
      doc.underlays.push({ id, kind:'image', levelId:doc.views.activeLevel,
                           transform:{ w, h, y, x:0, z:0, rot:0 }, opacity:0.65, data:null });
      Store.assets.set(id, { dataURL });
      Render.invalidate();
      calibrate(id, mesh);
    });
  }

  function calibrate(id, mesh){
    UI.modal({
      title:'Scale the plan', sub:'two-point calibration',
      body:[
        UI.explain('Click <b>two points</b> in the model space whose real distance you know — ' +
          'a grid spacing or a known wall length — then type that distance. ' +
          'The image is rescaled to match.'),
        UI.row('Known distance', UI.num(6, v => { pending.real = v; }, { step:0.1 }), 'm')
      ],
      footer:[
        el('button',{class:'btn ghost',onclick:UI.close},['Skip — scale by hand later']),
        el('button',{class:'btn primary',onclick:() => { UI.close(); startPick(id, mesh); }},
          ['Pick two points'])
      ]
    });
  }
  const pending = { real:6 };
  function startPick(id, mesh){
    const pts = [];
    Tools.set('select');
    UI.toast('Click the first point…', 'ok', 4000);
    const off = Bus.on('viewport:click', p => {
      pts.push(p.clone());
      if(pts.length === 1){ UI.toast('Now the second point…', 'ok', 4000); return; }
      off();
      const d = pts[0].distanceTo(pts[1]);
      if(d < 1e-6) return UI.toast('Those two points are the same.', 'warn');
      const k = pending.real / d;
      mesh.scale.multiplyScalar(k);
      const c = pts[0].clone().add(pts[1]).multiplyScalar(0.5);
      mesh.position.x = (mesh.position.x - c.x)*k + c.x;
      mesh.position.z = (mesh.position.z - c.z)*k + c.z;
      Render.invalidate();
      UI.toast(`Scaled by ×${U.fx(k,3)} — the image now measures ${U.fx(pending.real,2)} m across those points.`,
        'ok', 6000);
    });
  }

  /* --- IFC ------------------------------------------------------------------
     web-ifc is a multi-megabyte WebAssembly bundle. Inlining it would multiply
     the size of this file several times over for a feature most students will
     never touch, so it is fetched on demand, with consent, and fails cleanly
     when the network or a content policy blocks it. Everything else in the app
     keeps working offline once three.js is cached. */
  function ifcDialog(){
    UI.modal({
      title:'Import IFC', sub:'downloads about 3 MB on first use',
      body:[
        UI.explain('IFC reading needs the <b>web-ifc</b> WebAssembly engine, which is not part of ' +
          'this file. It will be fetched from a CDN the first time you use it.'),
        UI.disclaimer('<b>Requires an internet connection.</b> On a school network that blocks CDNs, ' +
          'or behind a strict content-security policy, this will fail — everything else in ' +
          'Structural Studio will keep working. IFC comes in as <b>reference geometry plus storey ' +
          'levels</b>; it is not converted into an analysable frame.')
      ],
      footer:[
        el('button',{class:'btn ghost',onclick:UI.close},['Cancel']),
        el('button',{class:'btn primary',onclick:() => { UI.close(); loadIFC(); }},
          ['Continue'])
      ]
    });
  }

  let ifcApi = null;
  async function ensureIFC(){
    if(ifcApi) return ifcApi;
    const base = 'https://cdn.jsdelivr.net/npm/web-ifc@0.0.57/';
    const mod = await import(/* @vite-ignore */ base + 'web-ifc-api.js');
    const api = new mod.IfcAPI();
    api.SetWasmPath(base);
    await api.Init();
    ifcApi = api;
    return api;
  }

  function loadIFC(){
    IO.pickFile('.ifc', async (buf, file) => {
      const t = UI.toast('Fetching the IFC engine…', 'info', 30000);
      let api;
      try { api = await ensureIFC(); }
      catch(e){
        t.remove();
        return UI.toast('Could not load the IFC engine — the CDN may be blocked on this network. ' +
          'Everything else still works.', 'bad', 9000);
      }
      try {
        const id = api.OpenModel(new Uint8Array(buf));
        const doc = Store.doc;
        Store.checkpoint('Import IFC');

        // storeys become levels
        let added = 0;
        try {
          const st = api.GetLineIDsWithType(id, 3124254112 /* IFCBUILDINGSTOREY */);
          for(let i = 0; i < st.size(); i++){
            const p = api.GetLine(id, st.get(i));
            const e = (p.Elevation && p.Elevation.value) || 0;
            const nm = (p.Name && p.Name.value) || `Storey ${i+1}`;
            if(!doc.levels.some(l => Math.abs(l.elevation - e/1000) < 0.05)){
              doc.levels.push(Model.mk.level(nm, e > 100 ? e/1000 : e));
              added++;
            }
          }
        } catch(e){ /* storeys are optional */ }

        // geometry as ghosted context
        const grp = new THREE.Group(); grp.name = 'ifcContext';
        const mat = new THREE.MeshStandardMaterial({ color:0x6f7c8c, transparent:true,
          opacity:0.3, roughness:0.95, side:THREE.DoubleSide, depthWrite:false });
        let tris = 0;
        api.StreamAllMeshes(id, (mesh) => {
          if(tris > 2_000_000) return;
          for(let i = 0; i < mesh.geometries.size(); i++){
            const pg = mesh.geometries.get(i);
            const g = api.GetGeometry(id, pg.geometryExpressID);
            const verts = api.GetVertexArray(g.GetVertexData(), g.GetVertexDataSize());
            const idx = api.GetIndexArray(g.GetIndexData(), g.GetIndexDataSize());
            const pos = new Float32Array(verts.length/2*3);
            for(let v = 0, o = 0; v < verts.length; v += 6, o += 3){
              pos[o] = verts[v]; pos[o+1] = verts[v+1]; pos[o+2] = verts[v+2];
            }
            const bg = new THREE.BufferGeometry();
            bg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            bg.setIndex(new THREE.BufferAttribute(new Uint32Array(idx), 1));
            bg.computeVertexNormals();
            const m = new THREE.Mesh(bg, mat);
            m.applyMatrix4(new THREE.Matrix4().fromArray(pg.flatTransformation));
            m.userData = { kind:'context' };
            grp.add(m);
            tris += idx.length/3;
          }
        });
        // IFC is Z-up; three.js is Y-up
        grp.rotation.x = -Math.PI/2;
        Render.groups.context.add(grp);
        api.CloseModel(id);
        t.remove();
        Store.touch('import');
        App.rebuild(); Render.fit();
        UI.toast(`Imported ${file?.name || 'IFC'} — ${added} storeys and ` +
          `${U.fx(tris/1000,0)}k triangles of reference geometry.`, 'ok', 7000);
      } catch(e){
        t.remove();
        UI.toast(`That IFC could not be read — ${e.message}`, 'bad', 8000);
      }
    }, 'arrayBuffer');
  }

  return { pick, parseDXF, applyDXF };
})();

/* ==========================================================================
   31  SELFTEST - the solver, checked against closed-form solutions
   ==========================================================================
   This ships inside the application deliberately. A student (or a tutor) can
   prove the analysis is honest without taking anybody's word for it, and the
   suite still runs after the file has been uploaded to a web server, where no
   test harness could reach.
   ========================================================================== */
const SelfTest = (() => {

  const FX = Model.SUPPORTS.fixed, FR = Model.SUPPORTS.free, PIN = Model.SUPPORTS.pinned;
  const SSa = [1,1,1,1,0,0], SSb = [0,1,1,0,0,0], PLANAR = [0,0,1,1,1,0];

  function blank(){
    const d = Model.emptyDoc('benchmark');
    d.loads.cases = [ Model.mk.loadCase('Test','DEAD',{ selfWeight:false }) ];
    return d;
  }
  const CID = d => d.loads.cases[0].id;
  const node = (d,p,s) => { const n = Model.mk.node(p, s ? { support:s.slice() } : {});
                            d.analytical.nodes.push(n); return n; };
  const mem = (d,i,j,o) => { const m = Model.mk.amember(i.id, j.id,
                               Object.assign({ sectionId:'IPE300', materialId:'S275' }, o));
                             d.analytical.members.push(m); return m; };
  const ml = (d,m,o) => d.loads.member.push(Model.mk.memberLoad(
                          Object.assign({ caseId:CID(d), memberId:m.id }, o)));
  const nl = (d,n,o) => d.loads.nodal.push(Model.mk.nodalLoad(
                          Object.assign({ caseId:CID(d), nodeId:n.id }, o)));
  function run1(d){
    const res = Solver.run(d);
    if(!res.ok) return null;
    return { res, d, c:Solver.combine(res, Model.mk.combo('u',[{ caseId:CID(d), factor:1 }])) };
  }
  const dsp = (r,n,k) => r.c.u[r.res.ctx.nodeIdx.get(n.id)*6 + k];
  const rct = (r,n,k) => r.c.R[r.res.ctx.nodeIdx.get(n.id)*6 + k];
  const mf  = (r,m) => { const i = r.res.memberOrder.indexOf(m.id);
                         return r.c.mf.subarray(i*12, i*12+12); };
  const dia = (r,m) => Solver.diagram(r.res, r.res.memberOrder.indexOf(m.id), r.c,
                         r.d.loads.member.filter(l => l.memberId === m.id), 21);

  function build(){
    const S = LIB.SEC['IPE300'], M = LIB.MAT['S275'], HEB = LIB.SEC['HEB300'];
    const EIs = M.E*S.Iy, EA = M.E*S.A, GJ = M.G*S.J;
    const EIh = M.E*HEB.Iy, EIw = M.E*HEB.Iz;
    // a deliberately rigid member for the "rigid beam" portal cases
    LIB.SEC['__RIGID'] = { id:'__RIGID', name:'Rigid', family:'steel', shape:'rect',
      A:1, Iy:10, Iz:10, J:10, Wely:1, Welz:1, h:0.3, b:0.3, defaultMat:'S275' };

    const T = [];
    const add = (name, quantity, unit, fn, want, tol = 0.5) =>
      T.push({ name, quantity, unit, fn, want, tol });

    add('Simply supported beam, UDL', 'midspan deflection', 'm', () => {
      const d = blank(), a = node(d,[0,0,0],SSa), b = node(d,[6,0,0],SSb);
      const m = mem(d,a,b); ml(d,m,{ kind:'udl', dir:'GY', w1:-10 });
      return Math.abs(dia(run1(d), m).dy[10]);
    }, 5*10*6**4/(384*EIs));

    add('Simply supported beam, UDL', 'midspan moment wL²/8', 'kNm', () => {
      const d = blank(), a = node(d,[0,0,0],SSa), b = node(d,[6,0,0],SSb);
      const m = mem(d,a,b); ml(d,m,{ kind:'udl', dir:'GY', w1:-10 });
      return dia(run1(d), m).Mz[10];
    }, 45);

    add('Simply supported beam, UDL', 'end reaction wL/2', 'kN', () => {
      const d = blank(), a = node(d,[0,0,0],SSa), b = node(d,[6,0,0],SSb);
      const m = mem(d,a,b); ml(d,m,{ kind:'udl', dir:'GY', w1:-10 });
      return rct(run1(d), a, 1);
    }, 30);

    add('Cantilever, tip point load', 'tip deflection PL³/3EI', 'm', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[3,0,0],FR);
      mem(d,a,b); nl(d,b,{ Fy:-10 });
      return Math.abs(dsp(run1(d), b, 1));
    }, 10*27/(3*EIs));

    add('Cantilever, tip point load', 'tip rotation PL²/2EI', 'rad', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[3,0,0],FR);
      mem(d,a,b); nl(d,b,{ Fy:-10 });
      return Math.abs(dsp(run1(d), b, 5));
    }, 10*9/(2*EIs));

    add('Cantilever, UDL', 'tip deflection wL⁴/8EI', 'm', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[3,0,0],FR);
      const m = mem(d,a,b); ml(d,m,{ kind:'udl', dir:'GY', w1:-10 });
      return Math.abs(dsp(run1(d), b, 1));
    }, 10*81/(8*EIs));

    add('Fixed–fixed beam, UDL', 'end moment wL²/12', 'kNm', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[6,0,0],FX);
      const m = mem(d,a,b); ml(d,m,{ kind:'udl', dir:'GY', w1:-10 });
      return Math.abs(dia(run1(d), m).Mz[0]);
    }, 30);

    add('Fixed–fixed beam, UDL', 'midspan moment wL²/24', 'kNm', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[6,0,0],FX);
      const m = mem(d,a,b); ml(d,m,{ kind:'udl', dir:'GY', w1:-10 });
      return Math.abs(dia(run1(d), m).Mz[10]);
    }, 15);

    add('Fixed–fixed beam, UDL', 'midspan deflection wL⁴/384EI', 'm', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[6,0,0],FX);
      const m = mem(d,a,b); ml(d,m,{ kind:'udl', dir:'GY', w1:-10 });
      return Math.abs(dia(run1(d), m).dy[10]);
    }, 10*6**4/(384*EIs));

    add('Propped cantilever, UDL', 'prop reaction 3wL/8', 'kN', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[6,0,0],SSb);
      const m = mem(d,a,b); ml(d,m,{ kind:'udl', dir:'GY', w1:-10 });
      return rct(run1(d), b, 1);
    }, 22.5);

    add('Member end release', 'fixed-end moment wL²/8', 'kNm', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[6,0,0],FX);
      const m = mem(d,a,b,{ relJ:[0,0,0,0,0,1] }); ml(d,m,{ kind:'udl', dir:'GY', w1:-10 });
      return Math.abs(mf(run1(d), m)[5]);
    }, 45);

    add('Axial bar', 'extension PL/EA', 'm', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[4,0,0],FR);
      mem(d,a,b); nl(d,b,{ Fx:100 });
      return dsp(run1(d), b, 0);
    }, 100*4/EA);

    add('Torsion', 'twist TL/GJ', 'rad', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[4,0,0],FR);
      mem(d,a,b); nl(d,b,{ Mx:5 });
      return dsp(run1(d), b, 3);
    }, 5*4/GJ);

    add('Portal, pinned bases, rigid beam', 'sway Hh³/6EI', 'm', () => {
      const d = blank();
      const a = node(d,[0,0,0],[1,1,1,0,1,0]), b = node(d,[0,4,0],PLANAR),
            c = node(d,[6,4,0],PLANAR), e = node(d,[6,0,0],[1,1,1,0,1,0]);
      mem(d,a,b,{ sectionId:'HEB300', roll:90 });
      mem(d,e,c,{ sectionId:'HEB300', roll:90 });
      mem(d,b,c,{ sectionId:'__RIGID' });
      nl(d,b,{ Fx:10 });
      return dsp(run1(d), b, 0);
    }, 10*64/(6*EIh), 1.5);

    add('Portal, fixed bases, rigid beam', 'sway Hh³/24EI', 'm', () => {
      const d = blank();
      const a = node(d,[0,0,0],FX), b = node(d,[0,4,0],PLANAR),
            c = node(d,[6,4,0],PLANAR), e = node(d,[6,0,0],FX);
      mem(d,a,b,{ sectionId:'HEB300', roll:90 });
      mem(d,e,c,{ sectionId:'HEB300', roll:90 });
      mem(d,b,c,{ sectionId:'__RIGID' });
      nl(d,b,{ Fx:10 });
      return dsp(run1(d), b, 0);
    }, 10*64/(24*EIh), 1.5);

    add('Vertical column, load in Z', 'strong-axis deflection', 'm', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[0,4,0],FR);
      mem(d,a,b,{ sectionId:'HEB300' }); nl(d,b,{ Fz:10 });
      return Math.abs(dsp(run1(d), b, 2));
    }, 10*64/(3*EIh));

    add('Vertical column, load in X', 'weak-axis deflection', 'm', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[0,4,0],FR);
      mem(d,a,b,{ sectionId:'HEB300' }); nl(d,b,{ Fx:10 });
      return Math.abs(dsp(run1(d), b, 0));
    }, 10*64/(3*EIw));

    add('Section axis mapping', 'weak/strong ratio = Iy/Iz', '–', () => {
      const mk = k => { const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[0,4,0],FR);
        mem(d,a,b,{ sectionId:'HEB300' }); nl(d,b, k === 0 ? { Fx:10 } : { Fz:10 });
        return Math.abs(dsp(run1(d), b, k)); };
      return mk(0)/mk(2);
    }, LIB.SEC['HEB300'].Iy/LIB.SEC['HEB300'].Iz);

    add('Rotation of 90°', 'swaps strong and weak axes', 'm', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[0,4,0],FR);
      mem(d,a,b,{ sectionId:'HEB300', roll:90 }); nl(d,b,{ Fx:10 });
      return Math.abs(dsp(run1(d), b, 0));
    }, 10*64/(3*EIh));

    add('Near-vertical branch', 'continuity across |ex·Y| = 0.999', 'm', () => {
      const run = t => { const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[t,4,0],FR);
        mem(d,a,b,{ sectionId:'SHS200x200x8' }); nl(d,b,{ Fz:10 });
        return Math.abs(dsp(run1(d), b, 2)); };
      return run(0.181)/run(0.177);
    }, 1.0, 1.5);

    add('Rigid end offset', 'base moment P·e', 'kNm', () => {
      const d = blank(), a = node(d,[0,0,0],FX), b = node(d,[4,-0.5,0],FR);
      const m = mem(d,a,b,{ sectionId:'HEB300', offJ:[0,0.5,0] });
      nl(d,b,{ Fx:100 });
      return Math.abs(mf(run1(d), m)[5]);
    }, 50, 1.0);

    add('Load combination', 'superposition equals a single case', 'kNm', () => {
      const d = blank();
      d.loads.cases.push(Model.mk.loadCase('Q','LIVE',{ selfWeight:false }));
      const G = d.loads.cases[0].id, Q = d.loads.cases[1].id;
      const a = node(d,[0,0,0],FX), b = node(d,[6,0,0],FX), m = mem(d,a,b);
      d.loads.member.push(Model.mk.memberLoad({ caseId:G, memberId:m.id, kind:'udl', dir:'GY', w1:-10 }));
      d.loads.member.push(Model.mk.memberLoad({ caseId:Q, memberId:m.id, kind:'udl', dir:'GY', w1:-5 }));
      const res = Solver.run(d);
      const sup = Solver.combine(res, Model.mk.combo('c',
        [{ caseId:G, factor:1.35 }, { caseId:Q, factor:1.5 }]));
      return Math.abs(sup.mf[5]);
    }, (10*1.35 + 5*1.5)*36/12);

    add('Global equilibrium', 'applied load equals total reaction', 'kN', () => {
      const d = blank();
      const a = node(d,[0,0,0],FX), b = node(d,[6,0,0],FX),
            c = node(d,[6,4,0],FR), e = node(d,[6,4,5],FR);
      const m1 = mem(d,a,b), m2 = mem(d,b,c,{ sectionId:'HEB300' }), m3 = mem(d,c,e);
      ml(d,m1,{ kind:'udl', dir:'GY', w1:-12 });
      ml(d,m3,{ kind:'udl', dir:'GY', w1:-8 });
      nl(d,e,{ Fx:25, Fz:-9 });
      const r = run1(d), eq = Solver.checkEquilibrium(r.res, r.c);
      return -eq.totalReaction;
    }, -(12*6 + 8*5));

    add('3D grillage', 'four fixed beams share a central load', 'kN', () => {
      const d = blank();
      const c = node(d,[0,0,0],FR);
      const ns = [node(d,[6,0,0],FX), node(d,[-6,0,0],FX),
                  node(d,[0,0,6],FX), node(d,[0,0,-6],FX)];
      ns.forEach(q => mem(d,c,q,{ sectionId:'HEB300' }));
      nl(d,c,{ Fy:-50 });
      const r = run1(d);
      return ns.reduce((s,q) => s + rct(r,q,1), 0);
    }, 50);

    add('Two-way slab takedown', 'distributed load equals q × A', 'kN', () => {
      const d = Model.emptyDoc('td');
      const G = Model.mk.loadCase('G','DEAD',{ selfWeight:false });
      d.loads.cases = [G];
      const L0 = Model.mk.level('Ground',0), L1 = Model.mk.level('L1',4);
      d.levels = [L0,L1];
      const corners = [[0,0],[6,0],[6,6],[0,6]], N = [];
      for(const [x,z] of corners){
        N.push(node(d,[x,0,z],FX)); N.push(node(d,[x,4,z]));
      }
      for(let i = 0; i < 4; i++) mem(d, N[i*2], N[i*2+1], { sectionId:'HEB300', role:'column' });
      for(let i = 0; i < 4; i++) mem(d, N[i*2+1], N[((i+1)%4)*2+1], { sectionId:'IPE400' });
      d.physical.slabs.push(Model.mk.slab({ levelId:L1.id,
        boundary:corners.map(c => c.slice()), thickness:0.2, materialId:'C30',
        imposed:0, sdl:1.5 }));
      const td = Takedown.run(d, { deadCaseId:G.id, apply:true });
      const rec = [...td.perSlab.values()][0];
      return rec.totalDead;
    }, (0.2*25 + 1.5)*36);

    add('Two-way triangle', 'true total q·Lx²/4, not w_eq × L', 'kN', () => {
      const d = Model.emptyDoc('td2');
      const G = Model.mk.loadCase('G','DEAD',{ selfWeight:false });
      d.loads.cases = [G];
      const L1 = Model.mk.level('L1',0); d.levels = [L1];
      const corners = [[0,0],[6,0],[6,6],[0,6]], N = [];
      for(const [x,z] of corners) N.push(node(d,[x,0,z],FX));
      for(let i = 0; i < 4; i++) mem(d, N[i], N[(i+1)%4], { sectionId:'IPE400' });
      d.physical.slabs.push(Model.mk.slab({ levelId:L1.id,
        boundary:corners.map(c => c.slice()), thickness:0.2, materialId:'C30',
        imposed:0, sdl:1.5 }));
      const td = Takedown.run(d, { deadCaseId:G.id });
      const rec = [...td.perSlab.values()][0];
      const tri = rec.subs[0].contribs.find(c => c.kind === 'triangle');
      return tri ? tri.totalDead : 0;
    }, (0.2*25 + 1.5)*36/4);

    add('Column tributary area', 'interior column takes a full bay', 'm²', () => {
      const b = Geom.ccw([[0,0],[12,0],[12,12],[0,12]]);
      const pts = [[0,0],[6,0],[12,0],[0,6],[6,6],[12,6],[0,12],[6,12],[12,12]];
      const cell = Takedown.voronoiCell(b, pts, 4);
      return cell ? Geom.area(cell) : 0;
    }, 36);

    return T;
  }

  function execute(){
    const T = build();
    const out = [];
    for(const t of T){
      let got = NaN, err = null;
      try { got = t.fn(); } catch(e){ err = e.message; }
      const rel = t.want === 0 ? Math.abs(got) : Math.abs((got - t.want)/t.want)*100;
      out.push(Object.assign({}, t, { got, err,
        rel, pass: err == null && isFinite(got) && rel <= t.tol }));
    }
    delete LIB.SEC['__RIGID'];
    return out;
  }

  function show(){
    const rows = execute();
    const pass = rows.filter(r => r.pass).length;
    const body = [
      el('div', { class:'test-sum' }, [
        el('span', { class:`big ${pass === rows.length ? 'p' : 'f'}`, text:`${pass}/${rows.length}` }),
        el('span', { html: pass === rows.length
          ? 'Every benchmark matches its closed-form solution.'
          : '<b>Some benchmarks disagree with theory.</b> Treat results with caution.' })
      ]),
      UI.explain('Each row solves a textbook problem with this application\'s own solver and ' +
        'compares the answer with the hand formula. Tolerance is the figure in the last column.'),
      el('div', {}, [
        el('div', { class:'test-row head' }, [
          el('span',{class:'st',text:''}), el('span',{class:'nm',text:'Problem / quantity'}),
          el('span',{class:'num',text:'Computed'}), el('span',{class:'num',text:'Theory'}),
          el('span',{class:'err',text:'Error'})]),
        ...rows.map(r => el('div', { class:'test-row' }, [
          el('span', { class:`st ${r.pass?'p':'f'}`, text:r.pass ? '✓' : '✕' }),
          el('span', { class:'nm', title:`${r.name} — ${r.quantity}`,
                       html:`${Util.esc(r.name)}<br><span style="color:var(--ink-3)">${Util.esc(r.quantity)}</span>` }),
          el('span', { class:'num', text:isFinite(r.got) ? U.eng(r.got,4) : '—' }),
          el('span', { class:'num', text:U.eng(r.want,4) }),
          el('span', { class:'err', text:r.err ? 'error' : `${U.fx(r.rel,3)} %` })
        ]))
      ])
    ];
    UI.modal({
      title:'Solver verification', sub:`${rows.length} benchmarks against closed-form solutions`,
      wide:true, body,
      footer:[
        el('span', { class:'left hint',
          text:'Open any time with Ctrl+Shift+T, or add ?selftest=1 to the address.' }),
        el('button', { class:'btn primary', onclick:UI.close }, ['Close'])
      ]
    });
    return rows;
  }

  return { build, execute, show };
})();

/* ==========================================================================
   32  TOUR - the dismissible first-run walkthrough
   ========================================================================== */
const Tour = (() => {
  const steps = [
    { sel:'#rail', title:'The tool rail',
      text:'Draw columns, beams, braces, slabs and walls here. Every tool tells you what to do next in the bar at the bottom of the screen, and <kbd>Esc</kbd> always takes you back to Select.' },
    { sel:'#tabs', title:'Model, Load, Analyse, Draft',
      text:'The ribbon follows the workflow left to right. Start in <b>Model</b> — the quickest way in is <b>Generate building</b>, which gives you a complete frame to experiment with.' },
    { sel:'#seg-model', title:'Physical and analytical',
      text:'Real members with real cross-sections, or the stick-and-node model the analysis actually solves. As in Revit, the analytical model is <b>independent</b> — it is rebuilt only when you ask.' },
    { sel:'.tab[data-tab="load"]', title:'Loads follow the code',
      text:'Occupancy loads come from EN 1991-1-1, and the <b>load takedown</b> traces gravity from slab to beam to column to footing — with the tributary areas drawn so you can see them.' },
    { sel:'.tab[data-tab="analyse"]', title:'Solve and read',
      text:'A real 3D frame analysis by the direct stiffness method. Then colour the model by displacement, force, moment or utilisation, and read the diagrams member by member.' },
    { sel:'#vp-br', title:'Legend and scale',
      text:'The legend gives the range and units of whatever is on screen. Deformed shapes are exaggerated — the factor is always printed, because a deflected shape without its scale teaches the wrong thing.' },
    { sel:'#copyright', title:'Export your work',
      text:'<b>File → Export image</b> writes a PNG with the labels, the legend and a title block. Everything you export carries the credit line.' }
  ];
  let i = 0, host, spot, bubble;

  function start(){
    host = $('#tour'); spot = host.querySelector('.spot'); bubble = host.querySelector('.bubble');
    i = 0; host.classList.add('open'); render();
    IO.prefs({ tourSeen:true });
  }
  function stop(){ host.classList.remove('open'); }

  function render(){
    const s = steps[i];
    const t = $(s.sel);
    const r = t ? t.getBoundingClientRect() : { left:innerWidth/2-120, top:innerHeight/2-60, width:240, height:120 };
    const pad = 6;
    spot.style.left = (r.left-pad)+'px'; spot.style.top = (r.top-pad)+'px';
    spot.style.width = (r.width+pad*2)+'px'; spot.style.height = (r.height+pad*2)+'px';

    bubble.textContent = '';
    bubble.append(
      el('h4', { text:s.title }),
      el('p', { html:s.text }),
      el('div', { class:'nav' }, [
        el('span', { class:'step', text:`${i+1} / ${steps.length}` }),
        el('button', { class:'btn ghost sm', onclick:stop }, ['Skip']),
        i > 0 ? el('button', { class:'btn ghost sm', onclick:() => { i--; render(); } }, ['Back']) : null,
        el('button', { class:'btn primary sm',
          onclick:() => { if(i === steps.length-1) stop(); else { i++; render(); } } },
          [i === steps.length-1 ? 'Start modelling' : 'Next'])
      ].filter(Boolean))
    );
    // place the bubble clear of the highlighted element
    const bw = 320, bh = 190;
    let bx = r.left + r.width + 16, by = r.top;
    if(bx + bw > innerWidth - 12) bx = Math.max(12, r.left - bw - 16);
    if(bx < 12) bx = Math.min(innerWidth - bw - 12, Math.max(12, r.left));
    if(by + bh > innerHeight - 12) by = Math.max(12, innerHeight - bh - 12);
    bubble.style.left = bx+'px'; bubble.style.top = by+'px';
  }

  return { start, stop, get seen(){ return !!IO.prefs().tourSeen } };
})();

/* ==========================================================================
   33  APP - wiring, commands, dialogs, input
   ========================================================================== */
const App = (() => {
  let overlays = { reactions:false, diagrams:false, loadpath:false };
  let diagramKind = 'moment';
  let highlightedStack = null;
  let legendState = null;
  let pendingRebuild = null;

  /* ------------------------------------------------------------- rebuild */
  function rebuild(){
    const doc = Store.doc;
    const mode = doc.views.modelMode, style = doc.views.style;

    Render.groups.physical.visible   = mode !== 'analytical';
    Render.groups.analytical.visible = mode !== 'physical';

    Build.refs(doc);
    if(mode !== 'analytical') Build.physical(doc, mode === 'both' ? 'ghost' : style);
    else Render.clearGroup(Render.groups.physical);
    if(mode !== 'physical') Build.analytical(doc, { ghost:mode === 'both' && false });
    else Render.clearGroup(Render.groups.analytical);

    // Load glyphs are hidden while a result map is on: the two overlays use
    // the same screen space and the result is unreadable together.
    const cb = Results.activeCombo(doc);
    const showLoads = doc.views.show.loads &&
                      (doc.views.resultMode === 'none' || doc.views.resultMode == null);
    if(showLoads) Build.loads(doc, cb ? cb.terms.map(t => t.caseId) : null);
    else Render.clearGroup(Render.groups.loads);

    drawResults();
    drawSelection();
    Render.invalidate();
    refreshChrome();
  }
  const rebuildSoon = Util.debounce(rebuild, 40);

  function drawResults(){
    const doc = Store.doc;
    Render.clearGroup(Render.groups.result);
    legendState = null;
    const res = Results.res, comb = Results.comb;
    if(!res || !comb){ updateLegend(null); return; }

    const scale = Results.scale;
    const mode = doc.views.resultMode;
    if(mode && mode !== 'none'){
      legendState = Viz.colourMap(doc, res, comb, Results.diagrams, mode, Results.checks, scale);
    } else if(overlays.diagrams || overlays.reactions){
      Viz.deformed(doc, res, comb, Results.diagrams, scale);
    }
    if(overlays.diagrams){
      const only = Store.selection.size
        ? new Set([...Store.selection].map(id => {
            const m = Model.byId(doc.physical.members, id);
            return m ? m.analyticalId : id; }))
        : null;
      Viz.diagramRibbons(doc, res, Results.diagrams, diagramKind, only, scale);
    }
    if(overlays.reactions) Viz.reactions(doc, res, comb);
    if(overlays.loadpath && Results.takedown)
      Viz.takedown(doc, Results.takedown, highlightedStack);
    else Render.clearGroup(Render.groups.takedown);
    updateLegend(legendState);
  }

  function updateLegend(st){
    const box = UI.dom.legend, pill = UI.dom.pillScale;
    if(!st){ box.hidden = true; pill.hidden = true; return; }
    box.hidden = false;
    UI.dom.legendTitle.textContent = st.label;
    UI.dom.legendRamp.style.background = Render.rampCss(st.ramp);
    UI.dom.legendMin.textContent = U.eng(st.lo, 2);
    UI.dom.legendMid.textContent = U.eng((st.lo + st.hi)/2, 2);
    UI.dom.legendMax.textContent = U.eng(st.hi, 2);
    UI.dom.legendUnit.textContent = st.unit;
    pill.hidden = false;
    UI.dom.scaleVal.textContent = `${U.fx(Results.scale, 0)}×`;
  }

  function drawSelection(){
    const g = Render.groups.overlay; Render.clearGroup(g);
    const doc = Store.doc;
    if(!Store.selection.size) return;
    const pos = [];
    const N = new Map(doc.analytical.nodes.map(n => [n.id, n]));
    for(const id of Store.selection){
      const r = Store.resolve(id); if(!r) continue;
      if(r.type === 'member'){
        pos.push(...r.obj.start, ...r.obj.end);
      } else if(r.type === 'amember'){
        const a = N.get(r.obj.i), b = N.get(r.obj.j);
        if(a && b) pos.push(...a.p, ...b.p);
      } else if(r.type === 'node'){
        const s = Math.max(Render.modelDiag*0.012, 0.1), p = r.obj.p;
        pos.push(p[0]-s,p[1],p[2], p[0]+s,p[1],p[2]);
        pos.push(p[0],p[1]-s,p[2], p[0],p[1]+s,p[2]);
        pos.push(p[0],p[1],p[2]-s, p[0],p[1],p[2]+s);
      } else if(r.type === 'slab'){
        const lv = Model.byId(doc.levels, r.obj.levelId), y = lv ? lv.elevation : 0;
        const B = r.obj.boundary;
        for(let i = 0; i < B.length; i++){
          const a = B[i], b = B[(i+1)%B.length];
          pos.push(a[0], y, a[1], b[0], y, b[1]);
        }
      }
    }
    if(pos.length) g.add(Build.segs(pos, Render.C.sel, 4.2, { transparent:true, opacity:0.95 }));
  }

  /* ------------------------------------------------------------- chrome */
  function refreshChrome(){
    const doc = Store.doc;
    Ribbon.build(UI.ribbonTab, doc);
    $$('#tabs .tab').forEach(b => b.setAttribute('aria-selected',
      String(b.dataset.tab === UI.ribbonTab)));
    $$('#seg-model button').forEach(b => b.setAttribute('aria-pressed',
      String(b.dataset.mode === doc.views.modelMode)));
    $$('#seg-style button').forEach(b => b.setAttribute('aria-pressed',
      String(b.dataset.style === doc.views.style)));
    $$('#rail .tool').forEach(b => b.setAttribute('aria-pressed',
      String(b.dataset.tool === Tools.active)));

    const lv = Model.byId(doc.levels, doc.views.activeLevel) || doc.levels[0];
    UI.dom.lvlName.textContent = lv ? lv.name : '—';
    UI.dom.projName.value = doc.meta.name;

    const nDof = doc.analytical.nodes.length*6;
    UI.dom.stTool.textContent = Tools.current().label || 'Select';
    UI.dom.stCounts.textContent =
      `${doc.analytical.nodes.length} nodes · ${doc.analytical.members.length} members · ${doc.physical.slabs.length} slabs`;
    UI.dom.stDof.textContent = `${nDof} DOF`;
    const res = Results.res;
    UI.dom.stSolve.className = 's ' + (res ? 'ok' : Results.lastError ? 'bad' : '');
    UI.dom.stSolve.innerHTML = res
      ? `solved in <b>${U.fx(res.solveMs,0)} ms</b>`
      : Results.lastError ? '<b>model error</b>' : 'not solved';

    UI.dom.qUndo.disabled = !Store.canUndo();
    UI.dom.qRedo.disabled = !Store.canRedo();

    const hint = Tools.current().hint;
    UI.dom.toolHint.innerHTML = hint || '';
    UI.dom.toolHint.style.display = (Tools.active !== 'select' && hint) ? 'block' : 'none';

    Panels.refreshAll();
  }

  /* ------------------------------------------------------------- commands */
  function solve(){
    const doc = Store.doc;
    const t = UI.toast('Solving…', 'info', 20000);
    setTimeout(() => {
      const r = Results.solve(doc);
      t.remove();
      if(!r){
        const errs = Results.lastError || [];
        UI.modal({ title:'The model cannot be solved', sub:`${errs.length} problem${errs.length>1?'s':''}`,
          body:[
            UI.disclaimer('<b>Fix these before solving.</b> Each one is a real modelling issue, not a numerical hiccup.'),
            el('ul', { style:'margin:0;padding-left:18px;line-height:1.7' },
              errs.slice(0,12).map(e => el('li', { html:Util.esc(e.msg) })))
          ],
          footer:[el('button',{class:'btn primary',onclick:UI.close},['Close'])] });
        refreshChrome();
        return;
      }
      if(doc.views.resultMode === 'none') doc.views.resultMode = 'disp';
      const eq = Results.equilibrium;
      if(eq && !eq.ok)
        UI.toast('Warning: the model does not satisfy global equilibrium. Check the load path.', 'bad', 9000);
      else
        UI.toast(`Solved ${r.nFree} free degrees of freedom in ${U.fx(r.solveMs,0)} ms.`, 'ok');
      rebuild();
    }, 30);
  }

  function recombine(){ Results.recombine(Store.doc); rebuild(); }
  function setResultMode(m){ Store.doc.views.resultMode = m; if(!Results.res && m !== 'none') solve(); else rebuild(); }
  function toggleOverlay(k){
    overlays[k] = !overlays[k];
    if(k === 'loadpath' && overlays.loadpath && !Results.takedown) runTakedown();
    rebuild();
    UI.toast(`${k} ${overlays[k] ? 'on' : 'off'}`, 'ok', 1400);
  }
  function toggleLabel(k){
    const L = Store.doc.views.show.labels;
    L[k] = !L[k]; rebuild();
  }
  function setDeformSlider(v){
    // logarithmic 0.1x .. 2000x with 50 = auto
    const doc = Store.doc;
    if(v === 50){ doc.views.deformScale = 'auto'; }
    else doc.views.deformScale = Math.pow(10, (v-50)/25) * (Results.res
      ? Viz.autoScale(Math.max(...Results.diagrams.map(d => d ? d.maxAbs.d : 0), 1e-12)) : 1);
    Results.scale = doc.views.deformScale === 'auto'
      ? Viz.autoScale(Math.max(...Results.diagrams.map(d => d ? d.maxAbs.d : 0), 1e-12))
      : Number(doc.views.deformScale);
    drawResults(); Render.invalidate();
  }
  function highlightStack(id){ highlightedStack = id; overlays.loadpath = true; drawResults(); Render.invalidate(); }

    const doc = Store.doc;

    Store.touch('regen');
    Results.clear();
    UI.toast(`Analytical model rebuilt — ${rep.created} members, ${doc.analytical.nodes.length} nodes` +
      (rep.kept ? `, ${rep.kept} hand-edited members kept` : '') + '.', 'ok', 5000);

  }
  function splitMembers(){

  function checkModel(){
    const v = Model.validate(Store.doc);
    if(!v.errors.length && !v.warnings.length)
      return UI.toast('The model checks out — no errors and no warnings.', 'ok', 5000);
    UI.modal({ title:'Model check', sub:`${v.errors.length} errors · ${v.warnings.length} warnings`,
      body:[
        v.errors.length ? el('div',{class:'disclaimer',html:'<b>Errors — these stop the analysis</b><br>' +
          v.errors.map(e => Util.esc(e.msg)).join('<br>')}) : null,

        el('div',{class:'explain',html:`Degrees of freedom: <b>${v.nDof}</b>. The in-browser solver ` +
          `handles up to ${Store.doc.settings.dofCap}; above about ${Store.doc.settings.dofWarn} it takes a moment.`})
      ].filter(Boolean),
