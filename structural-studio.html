  function applySelfWeight(){
    const doc = Store.doc;
    const G = doc.loads.cases.find(c => c.type === 'DEAD');
    if(!G) return UI.toast('Create a dead load case first.', 'warn');
    Store.checkpoint('Self weight');
    const n = LoadGen.selfWeight(doc, G.id).length;
    Store.touch('loads');
    UI.toast(`Self weight applied to ${n} members.`, 'ok');
  }

  function runTakedown(){
    const doc = Store.doc;
    Store.checkpoint('Load takedown');
    const td = Results.runTakedown(doc, { apply:true });
    Store.touch('takedown');
    overlays.loadpath = true;
    rebuild();
    const w = td.warnings.length, u = td.unsupported.length;
    UI.toast(`Takedown complete — ${td.stacks.length} column stacks, ` +
      `${U.fx(td.totals.dead,0)} kN dead and ${U.fx(td.totals.live,0)} kN imposed distributed` +
      (u ? `. ${u} slab edge${u>1?'s have':' has'} no supporting beam (shown in red).` : '.'),
      u || w ? 'warn' : 'ok', 8000);
  }

  function sizeFootings(){
    const doc = Store.doc;
    const td = Results.takedown || Results.runTakedown(doc);
    Store.checkpoint('Size footings');
    doc.physical.footings = [];
    for(const f of td.footings){
      if(!f.nodeId) continue;
      doc.physical.footings.push(Model.mk.footing({
        nodeId:f.nodeId, type:'pad', B:f.B, L:f.L, D:f.D,
        N_sls:f.N_sls, N_uls:f.N_uls, qAllow:f.qAllow, util:f.util, auto:true }));
    }
    Store.touch('footings');
    UI.toast(`Sized ${doc.physical.footings.length} pad footings at ${doc.settings.qAllowSoil} kPa bearing.`, 'ok', 5000);
  }

  function suggestSection(amId){
    const doc = Store.doc;
    const m = Model.byId(doc.analytical.members, amId);
    const chk = Results.checks && Results.checks.find(c => c.id === amId);
    if(!m || !chk) return UI.toast('Solve the model first.', 'warn');
    const e = Results.res.memberOrder.indexOf(amId);
    const ext = Solver.memberExtremes(Results.res, Results.comb)[e];
    const s = Design.suggest(doc, m, ext, Results.diagrams[e]);
    if(!s) return UI.toast('No section in this family passes — try a different material or a shorter span.', 'warn', 6000);
    if(s.id === m.sectionId) return UI.toast(`${s.name} is already the lightest section that works.`, 'ok', 5000);
    UI.modal({ title:'Suggested section', sub:Model.sec(m.sectionId).name + ' → ' + s.name,
      body:[
        UI.explain(`The lightest section in the same family that satisfies both the stress check and ` +
          `the span/${doc.settings.deflLimit} deflection limit for the forces in this member.`),
        UI.row('Current', el('input',{type:'text',readonly:true,
          value:`${Model.sec(m.sectionId).name} — utilisation ${U.fx(chk.utilMax,2)}`})),
        UI.row('Suggested', el('input',{type:'text',readonly:true,
          value:`${s.name} — ${U.fx(s.A*1e4,1)} cm², Iy ${U.eng(s.Iy*1e8,0)} cm⁴`}))
      ],
      footer:[
        el('button',{class:'btn ghost',onclick:UI.close},['Keep current']),
        el('button',{class:'btn primary',onclick:() => {
          Store.checkpoint('Apply suggested section');
          m.sectionId = s.id;
          const pm = m.physicalRef && Model.byId(doc.physical.members, m.physicalRef.id);
          if(pm) pm.sectionId = s.id;
          UI.close(); Store.touch('section'); solve();
        }},[`Use ${s.name}`])
      ] });
  }

  function libraryDialog(which){
    const isSec = which === 'sections';
    UI.modal({ title:isSec ? 'Section library' : 'Material library',
      sub:isSec ? 'EN 10365 rolled sections plus parametric families' : 'characteristic properties',
      wide:true, body:[
        UI.explain(isSec
          ? 'Rolled steel values are tabulated from EN 10365. Concrete, timber and masonry sections ' +
            'are computed from their dimensions, so you can see where every number comes from. ' +
            '<b>Iy is the strong axis</b> throughout.'
          : 'E and G in MPa, density in kN/m³. The design strength used by the utilisation check is ' +
            'f<sub>d</sub> = f<sub>k</sub> / γ<sub>M</sub>.'),
        isSec ? UI.table([
          { label:'Section', key:'name' },
          { label:'Family', value:r => LIB.familyLabel[r.family] },
          { label:'h mm', num:true, value:r => U.mm(r.h) },
          { label:'b mm', num:true, value:r => U.mm(r.b) },
          { label:'A cm²', num:true, value:r => U.fx(r.A*1e4,1) },
          { label:'Iy cm⁴', num:true, value:r => U.fx(r.Iy*1e8,0) },
          { label:'Iz cm⁴', num:true, value:r => U.fx(r.Iz*1e8,0) },
          { label:'Wely cm³', num:true, value:r => U.fx(r.Wely*1e6,0) }
        ], LIB.SECTIONS, {}) : UI.table([
          { label:'Material', key:'name' },
          { label:'Family', value:r => LIB.familyLabel[r.family] },
          { label:'E MPa', num:true, value:r => U.fx(U.toMPa(r.E),0) },
          { label:'G MPa', num:true, value:r => U.fx(U.toMPa(r.G),0) },
          { label:'ρ kN/m³', num:true, value:r => U.fx(r.density,1) },
          { label:'f MPa', num:true, value:r => U.fx(U.toMPa(r.fy),0) },
          { label:'γM', num:true, value:r => U.fx(r.gammaM,2) }
        ], LIB.MATERIALS, {})
      ],
      footer:[
        el('button',{class:'btn ghost',onclick:() => UI.csv(
          isSec ? [{label:'Section',key:'name'},{label:'A m2',key:'A'},{label:'Iy m4',key:'Iy'},
                   {label:'Iz m4',key:'Iz'},{label:'J m4',key:'J'}]
                : [{label:'Material',key:'name'},{label:'E kPa',key:'E'},{label:'density',key:'density'}],
          isSec ? LIB.SECTIONS : LIB.MATERIALS, `${which}.csv`)},['Export CSV']),
        el('button',{class:'btn primary',onclick:UI.close},['Close'])
      ] });
  }

  function showSchedule(which){
    UI.dockPane = 'sched';
    $$('.dock-tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.pane === 'sched')));
    $$('.dock-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-sched'));
    UI.dom.dock.classList.add('open');
    Panels.schedules(Store.doc);
    UI.toast(`Showing the ${which} schedule in the side panel.`, 'ok', 2600);
  }

  function showHelp(){
    UI.modal({ title:'Conventions and scope', sub:'read this before trusting a number', wide:true, body:[
      UI.section('Units', null, [UI.explain(
        'Everything internal is metre, kilonewton and second. Lengths <b>m</b>, forces <b>kN</b>, ' +
        'moments <b>kNm</b>, stresses <b>kPa</b> (shown as MPa), areas <b>m²</b>, second moments <b>m⁴</b>. ' +
        'Section catalogues are entered in mm and cm and converted once.')]),
      UI.section('Sign convention', null, [UI.explain(
        'Local <b>x</b> runs from the start node to the end node. Local <b>y</b> and <b>z</b> follow the ' +
        'up-vector rule: for a horizontal member local y is global up; for a member within 2.6° of vertical ' +
        'the reference switches to global Z, so an unrotated column\'s local y points along global Z.' +
        '<span class="f">N(x)  = −f₀ − ∫wx        tension positive\n' +
        'Vy(x) =  f₁ + ∫wy\n' +
        'Mz(x) = −f₅ + f₁·x + ∫(x−s)wy   SAGGING POSITIVE</span>' +
        'Moment diagrams are drawn on the <b>tension face</b>.')]),
      UI.section('Axis naming', null, [UI.explain(
        'The section library follows Eurocode: <b>Iy is the strong axis</b>, Iz the weak one. ' +
        'The frame element wants the opposite mapping, and the swap happens in exactly one function. ' +
        'The verification suite asserts the resulting stiffness ratio numerically, because getting ' +
        'this backwards produces answers that look perfectly plausible and are three times wrong.')]),
      UI.section('What the analysis does', null, [UI.explain(
        'A linear-elastic, small-displacement 3D frame analysis by the direct stiffness method: ' +
        '12-degree-of-freedom beam elements, static condensation for end releases, rigid end offsets, ' +
        'partitioned solution of K·u = F, and a dense LDLᵀ factorisation. Each load case is solved once ' +
        'and combinations are formed by superposition.')]),
      UI.section('What it does NOT do', null, [UI.disclaimer(
        '<b>Out of scope, deliberately.</b> No second-order or P-delta effects, no buckling or ' +
        'lateral-torsional buckling, no tension-only bracing, no plate or shell elements, no modal or ' +
        'time-history analysis, no cracked-section or creep behaviour, no connection or reinforcement ' +
        'design, no code compliance checking. Slabs are load-collecting surfaces, not finite elements. ' +
        'The utilisation check is an elastic stress ratio plus a deflection limit — useful for learning, ' +
        'not for building anything.')]),
      UI.section('Load takedown', null, [UI.explain(
        'Two-way panels are split on 45° yield lines: short beams take triangles, long beams trapezoids. ' +
        'The analysis receives the <b>true</b> load shapes. The textbook equivalent UDL ' +
        '(w<sub>eq</sub> = q·Lx/3) is a bending-moment equivalence, not a load equivalence — using it ' +
        'directly would put about a third too much load into the frame. It is reported for hand-checking ' +
        'only, and every solve verifies that the reactions equal the applied load.')]),
      UI.section('Verify it yourself', null, [
        UI.explain('The application carries its own benchmark suite and will run it on demand.'),
        el('div',{class:'row wide'},[el('button',{class:'btn primary',
          onclick:() => { UI.close(); SelfTest.show(); }},['Run the verification suite'])])])
    ], footer:[el('button',{class:'btn primary',onclick:UI.close},['Close'])] });
  }

  function toggleTheme(){
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    IO.prefs({ theme:next });
    Render.disposeCaches();
    rebuild();
  }

  return {
    rebuild, rebuildSoon, drawResults, drawSelection, refreshChrome, updateLegend,
    solve, recombine, setResultMode, toggleOverlay, toggleLabel, setDeformSlider,
    highlightStack, regenerate, mergeNodes, splitMembers, selectAll, checkModel,
    applySelfWeight, runTakedown, sizeFootings, suggestSection,
    newProject, showTemplates, showWizard, levelsDialog, loadCasesDialog,
    combosDialog, slabLoadDialog, windDialog, seismicDialog, libraryDialog,
    showSchedule, showHelp, toggleTheme,
    get legendState(){ return legendState },
    get overlays(){ return overlays },
    set diagramKind(v){ diagramKind = v }
  };
})();

/* ==========================================================================
   34  BOOT - DOM wiring, input handling, startup
   ========================================================================== */
(function boot(){
  window.__ssBooted = true;

  /* --- cache the DOM ---------------------------------------------------- */
  const D = UI.dom;
  Object.assign(D, {
    app:$('#app'), boot:$('#boot'), bootMsg:$('#boot-msg'),
    stage:$('#stage'), gl:$('#gl'), labels:$('#labels'),
    ribbon:$('#ribbon'), tabs:$('#tabs'), rail:$('#rail'), dock:$('#dock'),
    paneProps:$('#pane-props'), paneData:$('#pane-data'),
    paneResults:$('#pane-results'), paneSched:$('#pane-sched'),
    modal:$('#modalhost'), toasts:$('#toasts'), filepick:$('#filepick'),
    projName:$('#proj-name'), lvlName:$('#lvl-name'),
    stTool:$('#st-tool'), stCounts:$('#st-counts'), stDof:$('#st-dof'),
    stSolve:$('#st-solve'), stCoord:$('#st-coord'),
    qUndo:$('#q-undo'), qRedo:$('#q-redo'),
    legend:$('#legend'), legendTitle:$('#legend-title'), legendRamp:$('#legend-ramp'),
    legendMin:$('#legend-min'), legendMid:$('#legend-mid'), legendMax:$('#legend-max'),
    legendUnit:$('#legend-unit'), pillScale:$('#pill-scale'), scaleVal:$('#scale-val'),
    toolHint:$('#toolhint'), snapHint:$('#snaphint'), marquee:$('#marquee')
  });

  function fail(html){
    D.boot.innerHTML = '';
    D.boot.appendChild(el('div', { class:'err', html }));
    D.boot.classList.remove('hidden');
  }

  /* --- theme ------------------------------------------------------------ */
  const prefs = IO.prefs();
  document.documentElement.dataset.theme = prefs.theme ||
    (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');

  /* --- renderer --------------------------------------------------------- */
  try {
    Render.init(D.gl, D.stage, D.labels);
  } catch(e){
    return fail(`<h3>This browser cannot run the 3D view</h3>` +
      `Structural Studio needs WebGL. Try a recent Chrome, Firefox, Edge or Safari, ` +
      `and check that hardware acceleration is enabled.<br><br><code>${Util.esc(e.message)}</code>`);
  }
  Render._rebuildHook = () => App.rebuild();

  /* --- the tool rail ---------------------------------------------------- */
  for(const id of Tools.list()){
    const t = Tools.get(id);
    D.rail.appendChild(el('button', {
      class:'tool', 'data-tool':id, 'aria-pressed':String(Tools.active === id),
      title:`${t.label}  (${t.key})`,
      onclick:() => { Tools.set(id); App.refreshChrome(); }
    }, [icon(t.icon), t.key ? el('span',{class:'kbd',text:t.key}) : null].filter(Boolean)));
    if(id === 'select' || id === 'brace' || id === 'footing')
      D.rail.appendChild(el('div',{class:'rail-sep'}));
  }

  /* --- ribbon tabs ------------------------------------------------------ */
  $$('#tabs .tab').forEach(b => b.onclick = () => {
    UI.ribbonTab = b.dataset.tab; App.refreshChrome();
  });

  /* --- dock tabs -------------------------------------------------------- */
  $$('.dock-tabs button').forEach(b => b.onclick = () => {
    UI.dockPane = b.dataset.pane;
    $$('.dock-tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    $$('.dock-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + b.dataset.pane));
  });
  $('#q-dock').onclick = () => D.dock.classList.toggle('open');

  /* --- viewport overlays ------------------------------------------------ */
  $$('#seg-model button').forEach(b => b.onclick = () => {
    Store.doc.views.modelMode = b.dataset.mode; App.rebuild();
  });
  $$('#seg-style button').forEach(b => b.onclick = () => {
    Store.doc.views.style = b.dataset.style; Render.disposeCaches(); App.rebuild();
  });
  $$('#navcube button').forEach(b => b.onclick = () => {
    const v = b.dataset.view;
    if(v === 'fit') Render.fit(); else Render.standardView(v);
  });

  /* --- quick bar -------------------------------------------------------- */
  D.qUndo.onclick = () => { if(Store.undo()) UI.toast('Undo', 'ok', 1200); };
  D.qRedo.onclick = () => { if(Store.redo()) UI.toast('Redo', 'ok', 1200); };
  $('#q-theme').onclick = () => App.toggleTheme();
  $('#q-help').onclick = () => App.showHelp();
  D.projName.oninput = () => { Store.doc.meta.name = D.projName.value; IO.autosave(); };

  /* --- pointer input ---------------------------------------------------- */
  let down = null, moved = false, marqueeOn = false;

  D.gl.addEventListener('pointerdown', ev => {
    if(ev.button !== 0) return;
    down = { x:ev.clientX, y:ev.clientY, t:performance.now() };
    moved = false;
  });

  D.gl.addEventListener('pointermove', ev => {
    const doc = Store.doc;
    if(down && Math.hypot(ev.clientX-down.x, ev.clientY-down.y) > 4) moved = true;

    const y = Tools.activeY(doc);
    const snap = (Tools.active !== 'select') ? Snap.resolve(ev, doc, y) : null;
    if(snap){
      D.snapHint.style.display = 'block';
      D.snapHint.style.left = (ev.clientX - D.stage.getBoundingClientRect().left) + 'px';
      D.snapHint.style.top  = (ev.clientY - D.stage.getBoundingClientRect().top) + 'px';
      D.snapHint.textContent = snap.type;
      D.stCoord.textContent =
        `X ${U.fx(snap.p.x,3)}  Y ${U.fx(snap.p.y,3)}  Z ${U.fx(snap.p.z,3)}`;
      Tools.current().onPointerMove?.(ev, doc, snap);
    } else {
      D.snapHint.style.display = 'none';
      const p = Pick.onPlane(ev, y);
      if(p) D.stCoord.textContent = `X ${U.fx(p.x,2)}  Y ${U.fx(p.y,2)}  Z ${U.fx(p.z,2)}`;
    }
  });

  D.gl.addEventListener('pointerup', ev => {
    const doc = Store.doc;
    const wasClick = down && !moved && (performance.now() - down.t) < 700;
    down = null;
    if(!wasClick) return;
    const y = Tools.activeY(doc);
    const snap = (Tools.active !== 'select') ? Snap.resolve(ev, doc, y) : null;
    const p = snap ? snap.p : Pick.onPlane(ev, y);
    if(p) Bus.emit('viewport:click', p);
    Tools.current().onPointerDown?.(ev, doc, snap);
  });

  D.gl.addEventListener('dblclick', () => Render.fit());
  D.gl.addEventListener('contextmenu', ev => {
    ev.preventDefault();
    if(Tools.active !== 'select'){ Tools.set('select'); App.refreshChrome(); }
  });

  /* --- drag and drop ---------------------------------------------------- */
  ['dragover','dragenter'].forEach(t => D.stage.addEventListener(t, e => {
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }));
  D.stage.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0]; if(!f) return;
    const n = f.name.toLowerCase();
    const r = new FileReader();
    if(/\.json$/.test(n)){
      r.onload = () => { try { Store.load(Model.deserialize(r.result));
        UI.toast('Project opened.', 'ok'); } catch(err){ UI.toast(err.message,'bad',7000); } };
      r.readAsText(f);
    } else if(/\.dxf$/.test(n)){
      r.onload = () => Import.pick && Import.applyDXF
        ? (() => { const ents = Import.parseDXF(r.result);
                   UI.toast(`Dropped DXF with ${ents.length} lines — use File → Import for layer options.`,'ok',5000); })()
        : null;
      r.readAsText(f);
    } else if(/\.obj$/.test(n)){
      r.onload = () => { const o = new OBJLoader().parse(r.result);
        o.traverse(x => { if(x.isMesh) x.material = new THREE.MeshStandardMaterial({
          color:0x6f7c8c, transparent:true, opacity:0.28, side:THREE.DoubleSide, depthWrite:false }); });
        Render.groups.context.add(o); Render.fit();
        UI.toast('OBJ loaded as context geometry.', 'ok'); };
      r.readAsText(f);
    } else if(/^image\//.test(f.type)){
      UI.toast('Use File → Import → Image so the plan can be scaled correctly.', 'info', 5000);
    }
  });

  /* --- keyboard --------------------------------------------------------- */
  addEventListener('keydown', ev => {
    const tag = (ev.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
    const mod = ev.ctrlKey || ev.metaKey;

    if(ev.key === 'Escape'){
      if(UI.isModalOpen()) return UI.close();
      if(Tools.current().onEscape?.()) return;
      if(Tools.active !== 'select'){ Tools.set('select'); App.refreshChrome(); return; }
      Store.clearSelection();
      return;
    }
    if(typing) return;

    if(mod && ev.key.toLowerCase() === 'z' && !ev.shiftKey){ ev.preventDefault(); Store.undo(); return; }
    if(mod && (ev.key.toLowerCase() === 'y' || (ev.key.toLowerCase() === 'z' && ev.shiftKey))){
      ev.preventDefault(); Store.redo(); return; }
    if(mod && ev.key.toLowerCase() === 's'){ ev.preventDefault(); IO.saveFile(); return; }
    if(mod && ev.key.toLowerCase() === 'o'){ ev.preventDefault(); IO.openFile(); return; }
    if(mod && ev.key.toLowerCase() === 'a'){ ev.preventDefault(); App.selectAll(); return; }
    if(mod && ev.shiftKey && ev.key.toLowerCase() === 't'){ ev.preventDefault(); SelfTest.show(); return; }

    if(ev.key === 'F5' || (ev.key === 'Enter' && mod)){ ev.preventDefault(); App.solve(); return; }
    if(ev.key === 'Delete' || ev.key === 'Backspace'){
      const n = Store.deleteSelection();
      if(n) UI.toast(`Deleted ${n} object${n>1?'s':''}.`, 'ok', 1600);
      return;
    }
    if(Tools.current().onKey?.(ev, Store.doc)) return;

    const k = ev.key.toUpperCase();
    for(const id of Tools.list()){
      if(Tools.get(id).key === k){ Tools.set(id); App.refreshChrome(); return; }
    }
    if(k === 'F') Render.fit();
  });

  /* --- resize and visibility -------------------------------------------- */
  const ro = new ResizeObserver(Util.debounce(() => Render.resize(), 60));
  ro.observe(D.stage);
  addEventListener('resize', Util.debounce(() => Render.resize(), 80));

  // Pause the render loop when the iframe scrolls out of view. A WordPress page
  // is long, and an always-rendering embed will flatten a laptop battery.
  const io = new IntersectionObserver(es => Render.setOnScreen(es[0].isIntersecting), { threshold:0 });
  io.observe(D.stage);
  document.addEventListener('visibilitychange',
    () => Render.setOnScreen(document.visibilityState === 'visible'));

  /* --- bus wiring -------------------------------------------------------- */
  Bus.on('doc:changed', () => { App.rebuildSoon(); IO.autosave(); });
  Bus.on('doc:loaded', () => {
    Results.clear();
    App.rebuild();
    Render.fit();
  });
  Bus.on('selection', () => { App.drawSelection(); App.drawResults();
                              Render.invalidate(); Panels.props(Store.doc); });
  Bus.on('tool', () => App.refreshChrome());
  Bus.on('toast', p => UI.toast(p.msg, p.kind || 'info', p.ms));
  Bus.on('solve:done', () => App.refreshChrome());
  Bus.on('gl:lost', () => UI.toast('The graphics context was lost — rebuilding the view…', 'warn', 5000));
  Bus.on('gl:restored', () => UI.toast('Graphics restored.', 'ok'));
  Bus.on('preview', p => {
    const g = Render.groups.overlay;
    // the preview lives alongside the selection highlight
    const old = g.getObjectByName('preview'); if(old) g.remove(old);
    if(p){
      let pos = [];
      if(p.kind === 'line' || p.kind === 'measure') pos = [p.a.x,p.a.y,p.a.z, p.b.x,p.b.y,p.b.z];
      else if(p.kind === 'poly'){
        for(let i = 0; i < p.pts.length-1; i++)
          pos.push(p.pts[i].x,p.pts[i].y,p.pts[i].z, p.pts[i+1].x,p.pts[i+1].y,p.pts[i+1].z);
        const last = p.pts[p.pts.length-1];
        pos.push(last.x,last.y,last.z, p.next.x,p.next.y,p.next.z);
        pos.push(p.next.x,p.next.y,p.next.z, p.pts[0].x,p.pts[0].y,p.pts[0].z);
      }
      if(pos.length){
        const l = Build.segs(pos, p.kind === 'measure' ? 0xf0b23c : Render.C.sel, 2.4,
          { transparent:true, opacity:0.9 });
        l.name = 'preview';
        g.add(l);
        if(p.kind === 'measure' || p.kind === 'line'){
          const mid = p.a.clone().add(p.b).multiplyScalar(0.5);
          const lbl = Render.label(`${U.fx(p.a.distanceTo(p.b),3)} m`, mid, 'dim');
          lbl.name = 'previewLabel';
          const oldL = g.getObjectByName('previewLabel'); if(oldL) g.remove(oldL);
          g.add(lbl);
        }
      }
    } else {
      const oldL = g.getObjectByName('previewLabel'); if(oldL) g.remove(oldL);
    }
    Render.invalidate();
  });

  /* --- start ------------------------------------------------------------- */
  const params = new URLSearchParams(location.search);

  function begin(doc, msg){
    Store.load(doc);
    D.app.hidden = false;
    D.boot.classList.add('hidden');
    Render.resize();
    App.rebuild();
    Render.fit();
    if(msg) UI.toast(msg, 'ok', 5000);
    if(params.get('selftest') === '1') setTimeout(() => SelfTest.show(), 500);
    else if(!Tour.seen) setTimeout(() => Tour.start(), 900);
  }

  const restored = IO.restore();
  if(restored && (restored.physical.members.length || restored.analytical.nodes.length)){
    begin(restored, `Restored “${restored.meta.name}” from your last session.`);
  } else {
    const doc = Wizard.TEMPLATES.find(t => t.id === 'office').build();
    begin(doc, 'Welcome — this is a worked example. Press Solve, or use File → Templates.');
    setTimeout(() => { if(!UI.isModalOpen()) App.solve(); }, 400);
  }

  addEventListener('beforeunload', e => {
    if(Store.isDirty){ e.preventDefault(); e.returnValue = ''; }
  });

  window.StructuralStudio = { Store, Model, Solver, FEM, Takedown, LIB, Results, SelfTest, App, Render };
})();
</script>
