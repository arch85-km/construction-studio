      const ang = Math.atan2(w.p1[1]-w.p0[1], w.p1[0]-w.p0[0]);
      mesh.position.set((w.p0[0]+w.p1[0])/2, y + w.height/2, (w.p0[1]+w.p1[1])/2);
      mesh.rotation.y = -ang;
      mesh.userData = { kind:'wall', id:w.id };
      mesh.castShadow = mesh.receiveShadow = (style === 'realistic');
      g.add(mesh);
    }

    for(const f of doc.physical.footings){
      const n = Model.byId(doc.analytical.nodes, f.nodeId);
      const p = n ? n.p : [0,0,0];
      const geo = new THREE.BoxGeometry(f.B, f.D, f.L || f.B);
      const mat = Render.material(`ftg:${style}`, styleOpts(style, 0xb8b4aa, true));
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(p[0], p[1] - f.D/2, p[2]);
      mesh.userData = { kind:'footing', id:f.id };
      mesh.receiveShadow = (style === 'realistic');
      g.add(mesh);
    }
  }

  function styleOpts(style, colour, isPanel){
    switch(style){
      // 'ghost' is what the Physical + Analytical overlay uses: solid enough
      // to read the real cross-sections, transparent enough that the stick
      // model reads through it. Offsets and justifications become visible,
      // which is the whole point of keeping the two models apart.
      case 'ghost':     return { color:colour, transparent:true, opacity:0.30,
                                 depthWrite:false, roughness:0.9, metalness:0,
                                 polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 };
      case 'wireframe': return { color:colour, transparent:true, opacity:0.06,
                                 depthWrite:false, roughness:1, metalness:0 };
      case 'realistic': return { color:colour, roughness:0.55, metalness:0.25,
                                 transparent:isPanel, opacity:isPanel?0.96:1 };
      case 'xray':      return { color:colour, transparent:true, opacity:0.16,
                                 depthWrite:false, side:THREE.DoubleSide,
                                 roughness:1, metalness:0 };
      default:          return { color:colour, roughness:0.82, metalness:0.04,
                                 flatShading:false, transparent:isPanel, opacity:isPanel?0.9:1 };
    }
  }

  /* --- analytical model ---------------------------------------------------- */
  function analytical(doc, opts = {}){
    const g = G().analytical; Render.clearGroup(g);
    const N = new Map(doc.analytical.nodes.map(n => [n.id, n]));
    const ghost = opts.ghost;

    const byRole = { beam:[], column:[], brace:[] };
    for(const m of doc.analytical.members){
      if(m.active === false) continue;
      const a = N.get(m.i), b = N.get(m.j);
      if(!a || !b) continue;
      (byRole[m.role] || byRole.beam).push(
        a.p[0], a.p[1], a.p[2], b.p[0], b.p[1], b.p[2]);
    }
    const COL = { beam:0x9fb2c8, column:0x7f8cff, brace:0x4ec98b };
    for(const k of Object.keys(byRole)){
      if(!byRole[k].length) continue;
      const l = segs(byRole[k], COL[k], ghost ? 1.6 : 2.6,
        ghost ? { transparent:true, opacity:0.55 } : {});
      l.userData = { kind:'amemberBatch', role:k };
      g.add(l);
    }

    // nodes
    const ng = new THREE.SphereGeometry(1, 10, 8);
    const nm = Render.material('node', { color:Render.C.node, roughness:0.4, metalness:0.1 });
    const r = Math.max(Render.modelDiag*0.0045, 0.035);
    for(const n of doc.analytical.nodes){
      const s = new THREE.Mesh(ng, nm);
      s.position.set(n.p[0], n.p[1], n.p[2]);
      s.scale.setScalar(r);
      s.userData = { kind:'node', id:n.id };
      g.add(s);
      if(doc.views.show.labels.node)
        g.add(Render.label(n.tag || n.id.slice(-4), V(n.p[0], n.p[1]+r*3, n.p[2]), 'node'));
    }

    // supports
    if(doc.views.show.supports){
      const sz = Math.max(Render.modelDiag*0.016, 0.14);
      for(const n of doc.analytical.nodes){
        if(!n.support.some(v => v)) continue;
        g.add(supportGlyph(n, sz));
      }
    }
    // release markers
    const rr = r*0.85;
    const rg = new THREE.SphereGeometry(1, 8, 6);
    const rm = Render.material('release', { color:0xf0b23c, roughness:0.5 });
    for(const m of doc.analytical.members){
      const a = N.get(m.i), b = N.get(m.j);
      if(!a || !b) continue;
      const L = Math.hypot(b.p[0]-a.p[0], b.p[1]-a.p[1], b.p[2]-a.p[2]) || 1;
      const off = Math.min(L*0.08, 0.4);
      const dir = [(b.p[0]-a.p[0])/L, (b.p[1]-a.p[1])/L, (b.p[2]-a.p[2])/L];
      if(m.relI.some(v => v)){
        const s = new THREE.Mesh(rg, rm);
        s.position.set(a.p[0]+dir[0]*off, a.p[1]+dir[1]*off, a.p[2]+dir[2]*off);
        s.scale.setScalar(rr); g.add(s);
      }
      if(m.relJ.some(v => v)){
        const s = new THREE.Mesh(rg, rm);
        s.position.set(b.p[0]-dir[0]*off, b.p[1]-dir[1]*off, b.p[2]-dir[2]*off);
        s.scale.setScalar(rr); g.add(s);
      }
    }
    // rigid offsets, drawn as short stubs so the association is visible
    const stub = [];
    for(const m of doc.analytical.members){
      const a = N.get(m.i), b = N.get(m.j);
      if(!a || !b) continue;
      if(m.offI.some(v => Math.abs(v) > 1e-9))
        stub.push(a.p[0], a.p[1], a.p[2], a.p[0]+m.offI[0], a.p[1]+m.offI[1], a.p[2]+m.offI[2]);
      if(m.offJ.some(v => Math.abs(v) > 1e-9))
        stub.push(b.p[0], b.p[1], b.p[2], b.p[0]+m.offJ[0], b.p[1]+m.offJ[1], b.p[2]+m.offJ[2]);
    }
    if(stub.length) g.add(segs(stub, 0xf2645a, 2.2, {}));
  }

  function supportGlyph(n, sz){
    const grp = new THREE.Group();
    grp.position.set(n.p[0], n.p[1], n.p[2]);
    const s = n.support;
    const fixedT = s[0] && s[1] && s[2];
    const fixedR = s[3] && s[4] && s[5];
    const mat = Render.material('sup', { color:Render.C.support, roughness:0.6 });
    if(fixedT && fixedR){
      const b = new THREE.Mesh(new THREE.BoxGeometry(sz*1.7, sz*0.5, sz*1.7), mat);
      b.position.y = -sz*0.25; grp.add(b);
    } else if(fixedT){
      const c = new THREE.Mesh(new THREE.ConeGeometry(sz*0.85, sz*1.25, 4), mat);
      c.position.y = -sz*0.62; c.rotation.y = Math.PI/4; grp.add(c);
    } else {
      const c = new THREE.Mesh(new THREE.ConeGeometry(sz*0.7, sz, 4), mat);
      c.position.y = -sz*0.5; c.rotation.y = Math.PI/4; grp.add(c);
      const r1 = new THREE.Mesh(new THREE.SphereGeometry(sz*0.22, 8, 6), mat);
      r1.position.set(-sz*0.4, -sz*1.18, 0); grp.add(r1);
      const r2 = r1.clone(); r2.position.x = sz*0.4; grp.add(r2);
    }
    grp.userData = { kind:'support', id:n.id };
    return grp;
  }

  /* --- load glyphs ---------------------------------------------------------- */
  function loads(doc, activeCases){
    const g = G().loads; Render.clearGroup(g);
    if(!doc.views.show.loads) return;
    const N = new Map(doc.analytical.nodes.map(n => [n.id, n]));
    const M = new Map(doc.analytical.members.map(m => [m.id, m]));
    const act = activeCases ? new Set(activeCases) : null;
    const scale = Math.max(Render.modelDiag*0.03, 0.25);

    // scale point loads relative to the biggest one
    let maxF = 1e-9, maxW = 1e-9;
    for(const l of doc.loads.nodal){ if(act && !act.has(l.caseId)) continue;
      maxF = Math.max(maxF, Math.hypot(l.Fx||0, l.Fy||0, l.Fz||0)); }
    for(const l of doc.loads.member){ if(act && !act.has(l.caseId)) continue;
      maxW = Math.max(maxW, Math.abs(l.w1||0), Math.abs(l.w2||0)); }

    const arrows = [];
    for(const l of doc.loads.nodal){
      if(act && !act.has(l.caseId)) continue;
      const n = N.get(l.nodeId); if(!n) continue;
      const f = new THREE.Vector3(l.Fx||0, l.Fy||0, l.Fz||0);
      const mag = f.length(); if(mag < 1e-9) continue;
      const len = scale*2.2*Math.max(0.3, mag/maxF);
      const dir = f.clone().normalize();
      const tail = new THREE.Vector3(n.p[0], n.p[1], n.p[2]).sub(dir.clone().multiplyScalar(len));
      arrows.push(tail.x, tail.y, tail.z, n.p[0], n.p[1], n.p[2]);
      const head = new THREE.Mesh(
        new THREE.ConeGeometry(scale*0.16, scale*0.42, 8),
        Render.material('loadArrow', { color:Render.C.load, roughness:0.5 }));
      head.position.set(n.p[0], n.p[1], n.p[2]).sub(dir.clone().multiplyScalar(scale*0.2));
      head.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
      g.add(head);
      if(doc.views.show.labels.load)
        g.add(Render.label(`${U.fx(mag,1)} kN`, tail, 'val'));
    }
    if(arrows.length) g.add(segs(arrows, Render.C.load, 2.0, {}));

    // distributed loads: a ribbon standing off the member
    const bars = [];
    for(const l of doc.loads.member){
      if(act && !act.has(l.caseId)) continue;
      const m = M.get(l.memberId); if(!m) continue;
      const a = N.get(m.i), b = N.get(m.j); if(!a || !b) continue;
      const L = Math.hypot(b.p[0]-a.p[0], b.p[1]-a.p[1], b.p[2]-a.p[2]); if(L < 1e-9) continue;
      const t0 = (l.a||0)/L, t1 = (l.b == null ? L : l.b)/L;
      const off = new THREE.Vector3(0, 1, 0);
      const h1 = scale*1.5*Math.abs(l.w1||0)/maxW, h2 = scale*1.5*Math.abs((l.w2 ?? l.w1)||0)/maxW;
      const P = t => new THREE.Vector3(
        a.p[0] + (b.p[0]-a.p[0])*t, a.p[1] + (b.p[1]-a.p[1])*t, a.p[2] + (b.p[2]-a.p[2])*t);
      const p0 = P(t0), p1 = P(t1);
      const q0 = p0.clone().addScaledVector(off, h1), q1 = p1.clone().addScaledVector(off, h2);
      bars.push(q0.x,q0.y,q0.z, q1.x,q1.y,q1.z);
      bars.push(p0.x,p0.y,p0.z, q0.x,q0.y,q0.z);
      bars.push(p1.x,p1.y,p1.z, q1.x,q1.y,q1.z);
      const n = Math.max(2, Math.round((t1-t0)*8));
      for(let i = 1; i < n; i++){
        const t = t0 + (t1-t0)*i/n, p = P(t);
        const h = h1 + (h2-h1)*(i/n);
        const q = p.clone().addScaledVector(off, h);
        bars.push(p.x,p.y,p.z, q.x,q.y,q.z);
      }
      if(doc.views.show.labels.load && Math.abs(l.w1||0) > 1e-6)
        g.add(Render.label(`${U.fx(Math.abs(l.w1),1)} kN/m`,
          P((t0+t1)/2).addScaledVector(off, Math.max(h1,h2)+scale*0.25), 'val'));
    }
    if(bars.length) g.add(segs(bars, Render.C.load, 1.5, { transparent:true, opacity:0.8 }));

    // area loads on slabs
    for(const s of doc.physical.slabs){
      const lv = Model.byId(doc.levels, s.levelId); if(!lv) continue;
      const c = Geom.centroid(s.boundary);
      if(doc.views.show.labels.load){
        const p = LoadGen.slabPressures(doc).get(s.id);
        g.add(Render.label(`G ${U.fx(p.dead,2)} · Q ${U.fx(p.live,2)} kN/m²`,
          V(c[0], lv.elevation + 0.4, c[1]), 'val'));
      }
    }
  }

  return { refs, physical, analytical, loads, supportGlyph, segs, fatLine,
           lineMat, styleOpts, V };
})();

/* ==========================================================================
   19  VIZ - deformed shape, colour maps, diagrams, reactions, load path
   ========================================================================== */
const Viz = (() => {
  const V = Build.V;
  const MODES = {
    none:   { label:'None' },
    disp:   { label:'Displacement', unit:'mm', ramp:'magnitude', key:'d' },
    axial:  { label:'Axial force',  unit:'kN',  ramp:'signed',    key:'N' },
    shear:  { label:'Shear force',  unit:'kN',  ramp:'magnitude', key:'V' },
    moment: { label:'Bending moment', unit:'kNm', ramp:'magnitude', key:'M' },
    util:   { label:'Utilisation',  unit:'ratio', ramp:'util',     key:'U' }
  };

  /** Auto exaggeration so the biggest displacement reads as ~4% of the model. */
  function autoScale(maxDisp){
    if(!(maxDisp > 1e-12)) return 1;
    return Util.clamp((Render.modelDiag*0.04)/maxDisp, 1, 5000);
  }

  function clearAll(){
    Render.clearGroup(Render.groups.result);
    Render.clearGroup(Render.groups.takedown);
  }

  /* --- deformed shape ------------------------------------------------------ */
  function deformed(doc, res, comb, diagrams, scale){
    const g = Render.groups.result;
    const pts = [];
    for(let e = 0; e < res.nMembers; e++){
      const d = diagrams[e]; if(!d) continue;
      const op = res.elemOps[e], lam = op.el.lam;
      const a = res.ctx.nodes[op.el.ia].p, L = op.el.L;
      const ex = [lam[0], lam[1], lam[2]], ey = [lam[3], lam[4], lam[5]], ez = [lam[6], lam[7], lam[8]];
      const n = d.x.length;
      let px, py, pz;
      for(let s = 0; s < n; s++){
        const x = d.x[s], dy = d.dy[s]*scale, dz = d.dz[s]*scale;
        // axial stretch is negligible visually; ignore it for the curve
        const X = a[0] + ex[0]*x + ey[0]*dy + ez[0]*dz;
        const Y = a[1] + ex[1]*x + ey[1]*dy + ez[1]*dz;
        const Z = a[2] + ex[2]*x + ey[2]*dy + ez[2]*dz;
        if(s > 0) pts.push(px, py, pz, X, Y, Z);
        px = X; py = Y; pz = Z;
      }
    }
    if(pts.length) g.add(Build.segs(pts, Render.C.deform, 2.6, {}));
  }

  /* --- colour-mapped members ------------------------------------------------ */
  function colourMap(doc, res, comb, diagrams, mode, checks, scale){
    const g = Render.groups.result;
    const spec = MODES[mode]; if(!spec || mode === 'none') return null;

    // per-member scalar, and the range
    const vals = new Float64Array(res.nMembers);
    let lo = Infinity, hi = -Infinity;
    for(let e = 0; e < res.nMembers; e++){
      const d = diagrams[e];
      let v = 0;
      if(mode === 'disp')   v = d ? d.maxAbs.d*1000 : 0;
      else if(mode === 'axial'){
        const f = comb.mf.subarray(e*12, e*12+12);
        v = Math.abs(-f[0]) > Math.abs(f[6]) ? -f[0] : f[6];
      }
      else if(mode === 'shear')  v = d ? Math.max(d.maxAbs.Vy, d.maxAbs.Vz) : 0;
      else if(mode === 'moment') v = d ? Math.max(d.maxAbs.Mz, d.maxAbs.My) : 0;
      else if(mode === 'util'){
        const c = checks && checks.find(x => x.id === res.memberOrder[e]);
        v = c ? c.utilMax : 0;
      }
      vals[e] = v;
      if(v < lo) lo = v; if(v > hi) hi = v;
    }
    if(!isFinite(lo)) { lo = 0; hi = 1; }
    if(mode === 'axial'){ const m = Math.max(Math.abs(lo), Math.abs(hi)) || 1; lo = -m; hi = m; }
    else if(mode === 'util'){ lo = 0; hi = Math.max(hi, 1); }
    // Magnitude quantities always start the ramp at zero. Otherwise a model
    // whose members all carry a similar force collapses the legend to a
    // single number and the colours become meaningless.
    else lo = Math.min(0, lo);
    if(hi - lo < 1e-9) hi = lo + Math.max(Math.abs(lo)*0.01, 1);

    // draw each member as its own coloured fat line along the deformed curve
    const buckets = new Map();
    for(let e = 0; e < res.nMembers; e++){
      const t = (vals[e]-lo)/(hi-lo);
      const bi = Math.round(Util.clamp(t,0,1)*31);
      (buckets.get(bi) || buckets.set(bi, []).get(bi)).push(e);
    }
    for(const [bi, list] of buckets){
      const pos = [];
      for(const e of list){
        const d = diagrams[e]; if(!d) continue;
        const op = res.elemOps[e], lam = op.el.lam, a = res.ctx.nodes[op.el.ia].p;
        const ex = [lam[0],lam[1],lam[2]], ey = [lam[3],lam[4],lam[5]], ez = [lam[6],lam[7],lam[8]];
        let px,py,pz;
        for(let s = 0; s < d.x.length; s++){
          const x = d.x[s], dy = d.dy[s]*scale, dz = d.dz[s]*scale;
          const X = a[0]+ex[0]*x+ey[0]*dy+ez[0]*dz;
          const Y = a[1]+ex[1]*x+ey[1]*dy+ez[1]*dz;
          const Z = a[2]+ex[2]*x+ey[2]*dy+ez[2]*dz;
          if(s > 0) pos.push(px,py,pz, X,Y,Z);
          px=X;py=Y;pz=Z;
        }
      }
      if(pos.length) g.add(Build.segs(pos, Render.rampHex(spec.ramp, bi/31), 5.0, {}));
    }
    return { lo, hi, unit:spec.unit, label:spec.label, ramp:spec.ramp };
  }

  /* --- N / V / M diagram ribbons ------------------------------------------- */
  function diagramRibbons(doc, res, diagrams, which, onlyIds, scale){
    const g = Render.groups.result;
    const key = which === 'moment' ? 'Mz' : which === 'shear' ? 'Vy' : 'N';
    let peak = 1e-9;
    for(const d of diagrams){ if(d) peak = Math.max(peak, d.maxAbs[key] || 0); }
    if(peak < 1e-9) return;
    const amp = Math.max(Render.modelDiag*0.05, 0.2)/peak;
    const pos = [], fillPos = [];
    for(let e = 0; e < res.nMembers; e++){
      const d = diagrams[e]; if(!d) continue;
      if(onlyIds && !onlyIds.has(res.memberOrder[e])) continue;
      const op = res.elemOps[e], lam = op.el.lam, a = res.ctx.nodes[op.el.ia].p;
      const ex = [lam[0],lam[1],lam[2]], ey = [lam[3],lam[4],lam[5]];
      // moment is drawn on the tension face: plot -M along local y
      const sgn = (which === 'moment') ? -1 : 1;
      let px,py,pz;
      for(let s = 0; s < d.x.length; s++){
        const x = d.x[s], v = sgn*d[key][s]*amp;
        const bx = a[0]+ex[0]*x, by = a[1]+ex[1]*x, bz = a[2]+ex[2]*x;
        const X = bx+ey[0]*v, Y = by+ey[1]*v, Z = bz+ey[2]*v;
        if(s > 0) pos.push(px,py,pz, X,Y,Z);
        if(s % 2 === 0) fillPos.push(bx,by,bz, X,Y,Z);
        px=X;py=Y;pz=Z;
      }
    }
    if(fillPos.length) g.add(Build.segs(fillPos, 0x4da3ff, 1.0, { transparent:true, opacity:0.35 }));
    if(pos.length)     g.add(Build.segs(pos, 0x4da3ff, 2.4, {}));
  }

  /* --- reactions ------------------------------------------------------------ */
  function reactions(doc, res, comb){
    const g = Render.groups.result;
    const nodes = res.ctx.nodes;
    let maxR = 1e-9;
    for(let i = 0; i < nodes.length; i++)
      maxR = Math.max(maxR, Math.hypot(comb.R[i*6], comb.R[i*6+1], comb.R[i*6+2]));
    const scale = Math.max(Render.modelDiag*0.05, 0.3);
    const lines = [];
    for(let i = 0; i < nodes.length; i++){
      const n = nodes[i];
      const f = new THREE.Vector3(comb.R[i*6], comb.R[i*6+1], comb.R[i*6+2]);
      const mag = f.length(); if(mag < 1e-6) continue;
      const len = scale*2.0*Math.max(0.25, mag/maxR);
      const dir = f.clone().normalize();
      const tip = new THREE.Vector3(n.p[0], n.p[1], n.p[2]);
      const tail = tip.clone().sub(dir.clone().multiplyScalar(len));
      lines.push(tail.x,tail.y,tail.z, tip.x,tip.y,tip.z);
      const head = new THREE.Mesh(new THREE.ConeGeometry(scale*0.14, scale*0.36, 8),
        Render.material('reac', { color:0x4ec98b, roughness:0.5 }));
      head.position.copy(tip).sub(dir.clone().multiplyScalar(scale*0.18));
      head.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
      g.add(head);
      if(doc.views.show.labels.result)
        g.add(Render.label(`${U.fx(mag,1)} kN`, tail, 'tag'));
    }
    if(lines.length) g.add(Build.segs(lines, 0x4ec98b, 2.2, {}));
  }

  /* --- load path / takedown visualisation ----------------------------------- */
  function takedown(doc, td, highlightStack){
    const g = Render.groups.takedown; Render.clearGroup(g);
    if(!td) return;

    // Tributary polygons, tinted per receiving beam. Drawn for the ACTIVE
    // LEVEL only: a four-storey building has a few hundred of these and
    // showing them all at once turns the model into wallpaper. Highlighting a
    // column stack switches to that stack's cells on every floor instead.
    const activeLevel = doc.views.activeLevel;
    let i = 0;
    for(const [slabId, rec] of td.perSlab){
      const slab = Model.byId(doc.physical.slabs, slabId);
      const lv = slab && Model.byId(doc.levels, slab.levelId);
      if(!lv) continue;
      if(!highlightStack && activeLevel && slab.levelId !== activeLevel) continue;
      if(highlightStack) continue;
      for(const sub of rec.subs){
        for(const c of sub.contribs){
          if(!c.poly || c.poly.length < 3) continue;
          const shape = new THREE.Shape(c.poly.map(p => new THREE.Vector2(p[0], p[1])));
          const geo = new THREE.ShapeGeometry(shape);
          geo.rotateX(Math.PI/2);
          const hue = (i++ % 6)/6;
          const col = new THREE.Color().setHSL(0.55 + hue*0.28, 0.55, 0.55);
          const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
            color:col, transparent:true, opacity:0.24, side:THREE.DoubleSide, depthWrite:false }));
          mesh.position.y = lv.elevation + 0.012;
          g.add(mesh);
          const outline = [];
          for(let k = 0; k < c.poly.length; k++){
            const a = c.poly[k], b = c.poly[(k+1)%c.poly.length];
            outline.push(a[0], lv.elevation+0.014, a[1], b[0], lv.elevation+0.014, b[1]);
          }
          g.add(Build.segs(outline, col.getHex(), 1.4, { transparent:true, opacity:0.9 }));
          // only label a polygon that is big enough to read
          if(Geom.area(c.poly) > 1.0){
            const ctr = Geom.centroid(c.poly);
            g.add(Render.label(`${c.kind} · ${U.fx(c.totalDead + c.totalLive,1)} kN`,
              V(ctr[0], lv.elevation+0.12, ctr[1]), 'tag', 4));
          }
        }
      }
    }

    // unsupported edges are drawn in red - a genuine modelling error
    const bad = [];
    for(const u of td.unsupported){
      const slab = Model.byId(doc.physical.slabs, u.slabId);
      const lv = slab && Model.byId(doc.levels, slab.levelId); if(!lv) continue;
      bad.push(u.edge[0][0], lv.elevation+0.02, u.edge[0][1],
               u.edge[1][0], lv.elevation+0.02, u.edge[1][1]);
    }
    if(bad.length) g.add(Build.segs(bad, 0xf2645a, 3.0, { dashed:false }));

    // the column stacks with their running totals. Without a highlight only
    // the foundation total is labelled, so the picture stays readable.
    for(const st of td.stacks){
      const on = highlightStack === st.id;
      for(const lv of st.levels){
        if(lv.poly && lv.poly.length >= 3 && highlightStack === st.id){
          const shape = new THREE.Shape(lv.poly.map(p => new THREE.Vector2(p[0], p[1])));
          const geo = new THREE.ShapeGeometry(shape); geo.rotateX(Math.PI/2);
          const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
            color:0xf0b23c, transparent:true, opacity:0.34,
            side:THREE.DoubleSide, depthWrite:false }));
          mesh.position.y = lv.elevation + 0.02;
          g.add(mesh);
        }
        if(on)
          g.add(Render.label(`${U.fx(lv.cumDead + lv.cumLive,0)} kN`,
            V(st.plan[0], lv.elevation + 0.25, st.plan[1]), 'val', 9));
      }
      const f = td.footings.find(x => x.stackId === st.id);
      if(f)
        g.add(Render.label(`${U.fx(f.B,2)}×${U.fx(f.L,2)} m · ${U.fx(f.N_sls,0)} kN`,
          V(st.plan[0], -0.35, st.plan[1]), on ? 'val' : 'tag', on ? 9 : 5));
    }
  }

  return { MODES, autoScale, clearAll, deformed, colourMap,
           diagramRibbons, reactions, takedown };
})();

/* ==========================================================================
   20  ANALYTICAL - regenerate the analytical model from the physical one
   ==========================================================================
   As in Revit 2023 and later, the analytical model is INDEPENDENT: it is
   only rebuilt when the user asks. Members the user has edited by hand keep
   their edits; they are reported rather than silently overwritten.
   ========================================================================== */
const Analytical = (() => {

  function key(p, tol){
    const q = 1/Math.max(tol, 1e-6);
    return `${Math.round(p[0]*q)}|${Math.round(p[1]*q)}|${Math.round(p[2]*q)}`;
  }

  /** Where the analytical line sits inside the physical solid. */
  function justify(p, sec, just, lam){
    if(!just || just === 'centroid') return p.slice();
    const ey = [lam[3], lam[4], lam[5]], ez = [lam[6], lam[7], lam[8]];
    const h = sec.h || 0, b = sec.b || 0;
    let dy = 0, dz = 0;
    if(just === 'top')    dy = -h/2;
    if(just === 'bottom') dy =  h/2;
    if(just === 'left')   dz =  b/2;
    if(just === 'right')  dz = -b/2;
    return [p[0] + ey[0]*dy + ez[0]*dz,
            p[1] + ey[1]*dy + ez[1]*dz,
            p[2] + ey[2]*dy + ez[2]*dz];
  }

  function regenerate(doc, { keepManual = true } = {}){
    const tol = doc.settings.mergeTol || 0.005;
    const oldNodes = doc.analytical.nodes;
    const oldMem = new Map(doc.analytical.members.map(m => [m.id, m]));
    const manual = keepManual
      ? doc.analytical.members.filter(m => m.physicalRef == null || m.assoc === 'manual')
      : [];

    const nodes = [], index = new Map();
    // keep supports and springs that the user assigned, matched by position
    const prior = new Map(oldNodes.map(n => [key(n.p, tol), n]));

    function nodeAt(p){
      const k = key(p, tol);
      if(index.has(k)) return index.get(k);
      const was = prior.get(k);
      const n = Model.mk.node(p, was ? { support:was.support.slice(),
                                         spring:was.spring, tag:was.tag,
                                         id:was.id } : {});
      nodes.push(n); index.set(k, n);
      return n;
    }

    const members = [];
    const lam = new Float64Array(9);
    const report = { created:0, merged:0, kept:manual.length, skipped:[] };

    for(const pm of doc.physical.members){
      const sec = Model.sec(pm.sectionId);
      const L0 = Math.hypot(pm.end[0]-pm.start[0], pm.end[1]-pm.start[1], pm.end[2]-pm.start[2]);
      if(L0 < 1e-6){ report.skipped.push(pm.id); continue; }
      FEM.dirCos(pm.start, pm.end, pm.roll || 0, lam);
      const a = nodeAt(justify(pm.start, sec, pm.justification, lam));
      const b = nodeAt(justify(pm.end,   sec, pm.justification, lam));
      if(a === b){ report.skipped.push(pm.id); continue; }
      const prev = pm.analyticalId ? oldMem.get(pm.analyticalId) : null;
      const am = Model.mk.amember(a.id, b.id, {
        id: prev ? prev.id : undefined,
        sectionId:pm.sectionId, materialId:pm.materialId, roll:pm.roll || 0,
        relI:(prev && prev.assoc === 'manual' ? prev.relI : pm.relI).slice(),
        relJ:(prev && prev.assoc === 'manual' ? prev.relJ : pm.relJ).slice(),
        offI:pm.offsetStart.slice(), offJ:pm.offsetEnd.slice(),
        role:pm.role, physicalRef:{ type:'member', id:pm.id },
        active: pm.analysisClass !== 'ignore'
      });
      pm.analyticalId = am.id;
      members.push(am); report.created++;
    }

    // analytical panels mirror the slabs, as load collectors only
    const panels = doc.physical.slabs.map(s => Model.mk.panel({
      levelId:s.levelId, boundary:s.boundary.map(p => p.slice()),
      thickness:s.thickness, materialId:s.materialId,
      physicalRef:{ type:'slab', id:s.id }
    }));

    for(const m of manual){
      if(!nodes.find(n => n.id === m.i) || !nodes.find(n => n.id === m.j)) continue;
      members.push(m);
    }
    report.merged = Math.max(0, doc.physical.members.length*2 - nodes.length);

    doc.analytical.nodes = nodes;
    doc.analytical.members = members;
    doc.analytical.panels = panels;
    doc.analytical.links = doc.analytical.links.filter(l =>
      nodes.some(n => n.id === l.master) && nodes.some(n => n.id === l.slave));
    return report;
  }

  /** Merge nodes closer than a tolerance and repoint the members. */
  function mergeNodes(doc, tol){
    tol = tol || doc.settings.mergeTol || 0.005;
    const keep = [], remap = new Map();
    for(const n of doc.analytical.nodes){
      const hit = keep.find(k => Math.hypot(k.p[0]-n.p[0], k.p[1]-n.p[1], k.p[2]-n.p[2]) < tol);
      if(hit){
        remap.set(n.id, hit.id);
        for(let d = 0; d < 6; d++) if(n.support[d]) hit.support[d] = 1;
      } else keep.push(n);
    }
    if(!remap.size) return 0;
    for(const m of doc.analytical.members){
      if(remap.has(m.i)) m.i = remap.get(m.i);
      if(remap.has(m.j)) m.j = remap.get(m.j);
    }
    for(const l of doc.loads.nodal) if(remap.has(l.nodeId)) l.nodeId = remap.get(l.nodeId);
    doc.analytical.nodes = keep;
    doc.analytical.members = doc.analytical.members.filter(m => m.i !== m.j);
    return remap.size;
  }

  /** Split members where another member crosses them at an interior point. */
  function splitAtIntersections(doc, tol = 0.01){
    let count = 0;
    const N = new Map(doc.analytical.nodes.map(n => [n.id, n]));
    for(const n of doc.analytical.nodes){
      const add = [];
      for(const m of doc.analytical.members){
        const a = N.get(m.i), b = N.get(m.j);
        if(!a || !b || a === n || b === n) continue;
        const ab = [b.p[0]-a.p[0], b.p[1]-a.p[1], b.p[2]-a.p[2]];
        const L2 = ab[0]**2 + ab[1]**2 + ab[2]**2; if(L2 < 1e-12) continue;
        const t = ((n.p[0]-a.p[0])*ab[0] + (n.p[1]-a.p[1])*ab[1] + (n.p[2]-a.p[2])*ab[2])/L2;
        if(t < 1e-4 || t > 1-1e-4) continue;
        const q = [a.p[0]+ab[0]*t, a.p[1]+ab[1]*t, a.p[2]+ab[2]*t];
        if(Math.hypot(q[0]-n.p[0], q[1]-n.p[1], q[2]-n.p[2]) > tol) continue;
        add.push({ m, t });
      }
      for(const { m } of add){
        const j0 = m.j;
        const nm = Model.mk.amember(n.id, j0, Object.assign({}, m, {
          id:undefined, i:n.id, j:j0, relI:Model.RELEASES.rigid.slice(), offI:[0,0,0] }));
        m.j = n.id; m.relJ = Model.RELEASES.rigid.slice(); m.offJ = [0,0,0];
        doc.analytical.members.push(nm);
        count++;
      }
    }
    return count;
  }

  return { regenerate, mergeNodes, splitAtIntersections, justify };
})();

/* ==========================================================================
   21  RESULTS - solve orchestration and the cached result state
   ========================================================================== */
const Results = (() => {
  let res = null, comb = null, diagrams = [], checks = null, td = null;
  let equilibrium = null, lastError = null, scale = 1;

  function clear(){
    res = comb = null; diagrams = []; checks = null; equilibrium = null;
    Viz.clearAll(); Bus.emit('results:cleared');
  }

  function activeCombo(doc){
    const list = doc.loads.combos;
    if(!list.length) return null;
    return list.find(c => c.id === doc.loads.activeCombo) || list[0];
  }

  function solve(doc){
    lastError = null;
    const v = Model.validate(doc);
    if(v.errors.length){ lastError = v.errors; clear(); Bus.emit('solve:failed', v.errors); return null; }

    const r = Solver.run(doc);
    if(!r.ok){ lastError = r.errors; clear(); Bus.emit('solve:failed', r.errors, r); return null; }

    res = r;
    if(!doc.loads.combos.length) doc.loads.combos = LoadGen.standardCombos(doc.loads.cases);
    const cb = activeCombo(doc) || Model.mk.combo('unfactored',
      doc.loads.cases.map(c => ({ caseId:c.id, factor:1 })));
    comb = Solver.combine(res, cb);

    const byMember = new Map();
    for(const l of doc.loads.member) (byMember.get(l.memberId) || byMember.set(l.memberId, []).get(l.memberId)).push(l);
    // scale each member's loads by the combination factors so the diagrams
    // match the combined end forces
    const factor = new Map(cb.terms.map(t => [t.caseId, t.factor]));
    diagrams = [];
    for(let e = 0; e < res.nMembers; e++){
      const id = res.memberOrder[e];
      const raw = byMember.get(id) || [];
      const scaled = raw.map(l => {
        const f = factor.get(l.caseId) || 0;
        return f === 1 ? l : Object.assign({}, l, { w1:(l.w1||0)*f, w2:(l.w2||0)*f });
      }).filter(l => (l.w1 || l.w2));
      diagrams.push(Solver.diagram(res, e, comb, scaled, 21));
    }
    checks = Design.runAll(doc, res, comb, i => diagrams[i]);
    equilibrium = Solver.checkEquilibrium(res, comb);
    scale = doc.views.deformScale === 'auto'
      ? Viz.autoScale(Math.max(...diagrams.map(d => d ? d.maxAbs.d : 0), 1e-12))
      : Number(doc.views.deformScale) || 1;

    Bus.emit('solve:done', { res, comb, checks, equilibrium });
    return res;
  }

  function recombine(doc){
    if(!res) return null;
    const cb = activeCombo(doc);
    if(!cb) return null;
    comb = Solver.combine(res, cb);
    const byMember = new Map();
    for(const l of doc.loads.member) (byMember.get(l.memberId) || byMember.set(l.memberId, []).get(l.memberId)).push(l);
    const factor = new Map(cb.terms.map(t => [t.caseId, t.factor]));
    diagrams = [];
    for(let e = 0; e < res.nMembers; e++){
      const raw = byMember.get(res.memberOrder[e]) || [];
      const scaled = raw.map(l => {
        const f = factor.get(l.caseId) || 0;
        return f === 1 ? l : Object.assign({}, l, { w1:(l.w1||0)*f, w2:(l.w2||0)*f });
      }).filter(l => (l.w1 || l.w2));
      diagrams.push(Solver.diagram(res, e, comb, scaled, 21));
    }
    checks = Design.runAll(doc, res, comb, i => diagrams[i]);
    equilibrium = Solver.checkEquilibrium(res, comb);
    Bus.emit('solve:done', { res, comb, checks, equilibrium });
    return comb;
  }

  function runTakedown(doc, { apply = false } = {}){
    const dead = doc.loads.cases.find(c => c.type === 'DEAD');
    const live = doc.loads.cases.find(c => c.type === 'LIVE');
    td = Takedown.run(doc, { deadCaseId:dead?.id, liveCaseId:live?.id, apply });
    Bus.emit('takedown:done', td);
    return td;
  }

  /** Per-case breakdown of one member's axial force, for the properties panel. */
  function caseBreakdown(memberId, comboObj){
    if(!res) return [];
    const e = res.memberOrder.indexOf(memberId);
    if(e < 0) return [];
    const out = [];
    for(const t of (comboObj ? comboObj.terms : [])){
      const c = res.perCase[t.caseId]; if(!c) continue;
      out.push({ caseId:t.caseId, factor:t.factor,
                 N:-c.mf[e*12], Mz:c.mf[e*12+5], contribution:t.factor*(-c.mf[e*12]) });
    }
    return out;
  }

  return {
    get res(){ return res }, get comb(){ return comb }, get diagrams(){ return diagrams },
    get checks(){ return checks }, get takedown(){ return td },
    get equilibrium(){ return equilibrium }, get lastError(){ return lastError },
    get scale(){ return scale }, set scale(v){ scale = v },
    solve, recombine, clear, runTakedown, activeCombo, caseBreakdown
  };
})();

const Wizard = (() => {

  const DEFAULTS = {
    baysX:3, baysZ:2, spanX:6, spanZ:6, storeys:3, storeyH:3.5,
    material:'steel', colSection:'HEB300', beamSection:'IPE400',
    slabThickness:0.20, category:'B-off', braced:false, pinnedBase:false
  };

  const PRESETS = {
    steel:   { col:'HEB300', beam:'IPE400', slab:0.13, slabMat:'C30' },
    concrete:{ col:'RC400x400', beam:'RC300x600', slab:0.20, slabMat:'C30' },
    timber:  { col:'GL200x600', beam:'GL200x600', slab:0.14, slabMat:'CLT' },
    masonry: { col:'MW300', beam:'RC300x600', slab:0.20, slabMat:'C30' }
  };

  function generate(opts = {}){
    const o = Object.assign({}, DEFAULTS, opts);
    const pre = PRESETS[o.material] || PRESETS.steel;
    const colSec = o.colSection || pre.col, beamSec = o.beamSection || pre.beam;
    const doc = Model.emptyDoc(o.name || 'Generated building');

    // levels
    for(let s = 0; s <= o.storeys; s++)
      doc.levels.push(Model.mk.level(s === 0 ? 'Ground' : `Level ${s}`, s*o.storeyH));

    // grids
    const nx = o.baysX + 1, nz = o.baysZ + 1;
    const X = Array.from({length:nx}, (_,i) => i*o.spanX);
    const Z = Array.from({length:nz}, (_,i) => i*o.spanZ);
    const Lz = Z[nz-1], Lx = X[nx-1];
    X.forEach((x,i) => doc.grids.push(Model.mk.grid(
      String.fromCharCode(65+i), [x,-1.5], [x,Lz+1.5], 'X')));
    Z.forEach((z,i) => doc.grids.push(Model.mk.grid(
      String(i+1), [-1.5,z], [Lx+1.5,z], 'Z')));

    const M = doc.physical.members;
    // columns
    for(let s = 0; s < o.storeys; s++)
      for(const x of X) for(const z of Z)
        M.push(Model.mk.member({ role:'column', sectionId:colSec,
          materialId:Model.sec(colSec).defaultMat,
          start:[x, s*o.storeyH, z], end:[x, (s+1)*o.storeyH, z],
          levelId:doc.levels[s+1].id,
          // a column's local y is global Z by convention, so rolling the
          // frame-direction columns puts their strong axis where it works
          roll: 0 }));
    // beams
    for(let s = 1; s <= o.storeys; s++){
      const y = s*o.storeyH;
      for(const z of Z) for(let i = 0; i < nx-1; i++)
        M.push(Model.mk.member({ role:'beam', sectionId:beamSec,
          materialId:Model.sec(beamSec).defaultMat,
          start:[X[i], y, z], end:[X[i+1], y, z], levelId:doc.levels[s].id }));
      for(const x of X) for(let i = 0; i < nz-1; i++)
        M.push(Model.mk.member({ role:'beam', sectionId:beamSec,
          materialId:Model.sec(beamSec).defaultMat,
          start:[x, y, Z[i]], end:[x, y, Z[i+1]], levelId:doc.levels[s].id }));
    }
    // bracing in the end bays, both directions
    if(o.braced){
      const bs = o.material === 'steel' ? 'SHS150x150x6' : colSec;
      for(let s = 0; s < o.storeys; s++){

        M.push(Model.mk.member({ role:'brace', sectionId:bs, materialId:'S355',
          start:[X[0], y0, Z[0]], end:[X[1], y1, Z[0]], levelId:doc.levels[s+1].id }));
        M.push(Model.mk.member({ role:'brace', sectionId:bs, materialId:'S355',
          start:[X[0], y0, Z[0]], end:[X[0], y1, Z[1]], levelId:doc.levels[s+1].id }));
      }
    }
    // slabs, one per bay so the takedown has real panels to work with
    for(let s = 1; s <= o.storeys; s++)
      for(let i = 0; i < nx-1; i++) for(let j = 0; j < nz-1; j++)
        doc.physical.slabs.push(Model.mk.slab({
          levelId:doc.levels[s].id,
          boundary:[[X[i],Z[j]],[X[i+1],Z[j]],[X[i+1],Z[j+1]],[X[i],Z[j+1]]],
          thickness:o.slabThickness || pre.slab, materialId:pre.slabMat,
          category:o.category, sdl:1.5,
          imposed:(LIB.IMPOSED.find(x => x.id === o.category) || { q:3 }).q
        }));

    Analytical.regenerate(doc);
    // supports at the base
    const base = o.pinnedBase ? Model.SUPPORTS.pinned : Model.SUPPORTS.fixed;
    for(const n of doc.analytical.nodes)
      if(Math.abs(n.p[1]) < 1e-6) n.support = base.slice();

    setupLoads(doc);
    doc.views.activeLevel = doc.levels[Math.min(1, doc.levels.length-1)].id;
    return doc;
  }

  /** Standard load cases, self weight, takedown and the Eurocode combinations. */
  function setupLoads(doc){
    if(!doc.loads.cases.length){
      doc.loads.cases = [
        Model.mk.loadCase('G — Dead', 'DEAD', { selfWeight:true }),
        Model.mk.loadCase('Q — Imposed', 'LIVE'),
        Model.mk.loadCase('W — Wind', 'WIND'),
        Model.mk.loadCase('S — Snow', 'SNOW')

    }
    const G = doc.loads.cases.find(c => c.type === 'DEAD');
    const Q = doc.loads.cases.find(c => c.type === 'LIVE');
    if(G) LoadGen.selfWeight(doc, G.id);
    Takedown.run(doc, { deadCaseId:G?.id, liveCaseId:Q?.id, apply:true });
    doc.loads.combos = LoadGen.standardCombos(doc.loads.cases);
    doc.loads.activeCombo = doc.loads.combos[0]?.id || null;

        const M = doc.physical.members;
        M.push(Model.mk.member({ role:'column', sectionId:'HEB300', materialId:'S355',
          start:[0,0,0], end:[0,6,0], roll:90 }));
        M.push(Model.mk.member({ role:'column', sectionId:'HEB300', materialId:'S355',
          start:[18,0,0], end:[18,6,0], roll:90 }));
        M.push(Model.mk.member({ role:'beam', sectionId:'IPE500', materialId:'S355',
          start:[0,6,0], end:[9,7.5,0] }));
        M.push(Model.mk.member({ role:'beam', sectionId:'IPE500', materialId:'S355',
          start:[9,7.5,0], end:[18,6,0] }));
        Analytical.regenerate(doc);
        for(const n of doc.analytical.nodes){
          if(Math.abs(n.p[1]) < 1e-6) n.support = Model.SUPPORTS.pinned.slice();
          else n.support = [0,0,1,1,1,0];          // hold the frame in its plane
        }
        setupLoads(doc);
        const G = doc.loads.cases[0], Q = doc.loads.cases[1];
        for(const m of doc.analytical.members){
          if(m.role !== 'beam') continue;
          doc.loads.member.push(Model.mk.memberLoad({ caseId:G.id, memberId:m.id,
            kind:'udl', dir:'GY', w1:-4.5 }));
          doc.loads.member.push(Model.mk.memberLoad({ caseId:Q.id, memberId:m.id,
            kind:'udl', dir:'GY', w1:-1.8 }));
        }
        return doc;
      }},
    { id:'office', name:'4-storey office frame', icon:'i-column',
      desc:'3 × 2 bays at 6 m, steel frame with composite slabs and office loading.',
      build(){ return generate({ name:'4-storey office frame', storeys:4, baysX:3, baysZ:2,
                                 material:'steel', category:'B-off', braced:true }); }},
    { id:'rc', name:'Concrete flat-slab building', icon:'i-slab',
      desc:'3 storeys of reinforced concrete, 7.2 m grid, residential loading.',
      build(){ return generate({ name:'Concrete building', storeys:3, baysX:3, baysZ:3,
                                 spanX:7.2, spanZ:7.2, material:'concrete', category:'A-res' }); }},
    { id:'timber', name:'Timber frame', icon:'i-brace',
      desc:'Two storeys of glulam with CLT decks on a 5 m grid.',
      build(){ return generate({ name:'Timber frame', storeys:2, baysX:3, baysZ:2,
                                 spanX:5, spanZ:5, material:'timber', category:'A-res' }); }},
    { id:'truss', name:'Roof truss', icon:'i-brace',
      desc:'A 16 m pin-jointed truss — every member carries axial force only.',

        const doc = Model.emptyDoc('Roof truss');

            start:bot[i], end:bot[i+1] }));
          M.push(Model.mk.member({ role:'beam', sectionId:S, materialId:'S355',

          M.push(Model.mk.member({ role:'brace', sectionId:'SHS80x80x4', materialId:'S355',

          M.push(Model.mk.member({ role:'brace', sectionId:'SHS80x80x4', materialId:'S355',
            start:bot[i], end:top[i+1] }));

  return { DEFAULTS, PRESETS, TEMPLATES, generate, setupLoads };

/* ==========================================================================
   23  PICK + SNAP
   ========================================================================== */
const Pick = (() => {
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();

  function coarse(){ return window.matchMedia('(pointer:coarse)').matches; }
  function setRay(ev){
    const r = Render.canvas.getBoundingClientRect();
    ndc.x = ((ev.clientX - r.left)/r.width)*2 - 1;
    ndc.y = -((ev.clientY - r.top)/r.height)*2 + 1;
    ray.setFromCamera(ndc, Render.camera);
    ray.params.Line.threshold = Render.modelDiag*(coarse() ? 0.012 : 0.006);
    ray.params.Points.threshold = ray.params.Line.threshold;
    return ray;
  }
  /** First entity under the pointer, honouring the model mode. */
  function at(ev, doc){
    setRay(ev);
    const targets = [];
    if(doc.views.modelMode !== 'analytical') targets.push(Render.groups.physical);
    if(doc.views.modelMode !== 'physical')   targets.push(Render.groups.analytical);
    const hits = ray.intersectObjects(targets, true);
    for(const h of hits){
      let o = h.object;
      while(o && !o.userData?.kind) o = o.parent;
      if(o && o.userData.id && o.userData.kind !== 'edge')
        return { kind:o.userData.kind, id:o.userData.id, point:h.point, distance:h.distance };
    }
    return null;
  }
  /** Point where the ray meets a horizontal plane at height y. */
  function onPlane(ev, y){
    setRay(ev);
    const plane = new THREE.Plane(new THREE.Vector3(0,1,0), -y);
    const out = new THREE.Vector3();
    return ray.ray.intersectPlane(plane, out) ? out : null;
  }
  return { at, onPlane, setRay, coarse, get ray(){ return ray } };
})();

const Snap = (() => {
  const state = { grid:true, node:true, mid:true, member:true, ortho:false };
  let last = null;

  /** Resolve a pointer event to a world point, reporting what it snapped to. */
  function resolve(ev, doc, y){
    const raw = Pick.onPlane(ev, y);
    if(!raw) return null;
    const tolWorld = Render.modelDiag*(Pick.coarse() ? 0.022 : 0.012);
    let best = { p:raw, type:'free', ref:null, d:Infinity };

    const consider = (p, type, ref) => {
      const d = Math.hypot(p[0]-raw.x, p[1]-raw.y, p[2]-raw.z);
      if(d < tolWorld && d < best.d) best = { p:new THREE.Vector3(p[0],p[1],p[2]), type, ref, d };
    };

    if(state.node)
      for(const n of doc.analytical.nodes) consider(n.p, 'node', { type:'node', id:n.id });

    if(state.grid){
      const gx = doc.grids.filter(g => g.axis === 'X'), gz = doc.grids.filter(g => g.axis === 'Z');
      for(const a of gx) for(const b of gz){
        const p = Geom.lineLine(a.p0, Geom.sub(a.p1, a.p0), b.p0, Geom.sub(b.p1, b.p0));
        if(p) consider([p[0], y, p[1]], 'grid', null);
      }
      for(const g of doc.grids){
        const t = Geom.paramOnSeg([raw.x, raw.z], g.p0, g.p1);
        const p = Geom.lerp2(g.p0, g.p1, t);
        consider([p[0], y, p[1]], 'gridline', { type:'grid', id:g.id });
      }
    }

    if(state.mid || state.member){
      const N = new Map(doc.analytical.nodes.map(n => [n.id, n]));
      for(const m of doc.analytical.members){
        const a = N.get(m.i), b = N.get(m.j); if(!a || !b) continue;
        if(state.mid) consider([(a.p[0]+b.p[0])/2,(a.p[1]+b.p[1])/2,(a.p[2]+b.p[2])/2],
                               'midpoint', { type:'amember', id:m.id });
        if(state.member){
          const ab = [b.p[0]-a.p[0], b.p[1]-a.p[1], b.p[2]-a.p[2]];
          const L2 = ab[0]**2+ab[1]**2+ab[2]**2 || 1;
          let t = ((raw.x-a.p[0])*ab[0] + (raw.y-a.p[1])*ab[1] + (raw.z-a.p[2])*ab[2])/L2;
          t = Util.clamp(t, 0, 1);
          consider([a.p[0]+ab[0]*t, a.p[1]+ab[1]*t, a.p[2]+ab[2]*t],
                   'on member', { type:'amember', id:m.id });
        }
      }
    }

    if(best.type === 'free'){
      const s = doc.settings.gridSnap || 0.25;
      best.p = new THREE.Vector3(Math.round(raw.x/s)*s, y, Math.round(raw.z/s)*s);
      best.type = `grid ${s} m`;
    }
    if(state.ortho && last){
      const dx = Math.abs(best.p.x - last.x), dz = Math.abs(best.p.z - last.z);
      if(dx > dz) best.p.z = last.z; else best.p.x = last.x;
      best.type += ' · ortho';
    }
    return best;
  }
  const setLast = p => { last = p ? p.clone() : null; };
  return { state, resolve, setLast, get last(){ return last } };
})();

/* ==========================================================================
   24  TOOLS - the modelling state machine
   ========================================================================== */
const Tools = (() => {
  const defs = new Map();
  let active = 'select';
  let opts = {
    sectionId:'IPE400', materialId:'S275', role:'beam',
    colSection:'HEB300', columnHeight:3.5, chain:true,
    supportPreset:'fixed', loadCase:null, loadValue:-10, loadKind:'udl'
  };

  function def(id, o){ defs.set(id, Object.assign({ id, hint:'', cursor:'default' }, o)); }
  const get = id => defs.get(id);
  const current = () => defs.get(active) || defs.get('select');

  function set(id){
    if(!defs.has(id)) id = 'select';
    if(active === id) return;
    current().onDeactivate?.();
    active = id;
    Snap.setLast(null);
    current().onActivate?.();
    Bus.emit('tool', active);
  }

  function activeY(doc){
    const L = Model.byId(doc.levels, doc.views.activeLevel) || doc.levels[0];
    return L ? L.elevation : 0;
  }

  /* --- select ------------------------------------------------------------- */
  def('select', {
    icon:'i-select', label:'Select', key:'S',
    hint:'Click to select · <kbd>Shift</kbd> add · <kbd>Ctrl</kbd> toggle · drag a box · <kbd>Del</kbd> delete',
    onPointerDown(ev, doc){
      const hit = Pick.at(ev, doc);
      const mode = ev.shiftKey ? 'add' : ev.ctrlKey || ev.metaKey ? 'toggle' : 'replace';
      Store.select(hit ? [hit.id] : [], hit ? mode : 'replace');
      return true;
    }
  });

  /* --- draw a beam / brace ------------------------------------------------- */
  const drawLine = (id, role, label, icon, key) => def(id, {
    icon, label, key, role,
    hint:`Pick the start point, then the end point. <kbd>Esc</kbd> cancels.`,
    state:{ pts:[] },
    onActivate(){ this.state.pts = []; },
    onDeactivate(){ this.state.pts = []; Bus.emit('preview', null); },
    onPointerMove(ev, doc, snap){
      if(this.state.pts.length === 1 && snap)
        Bus.emit('preview', { kind:'line', a:this.state.pts[0], b:snap.p });
    },
    onPointerDown(ev, doc, snap){
      if(!snap) return true;
      this.state.pts.push(snap.p.clone());
      Snap.setLast(snap.p);
      if(this.state.pts.length === 2){
        const [a, b] = this.state.pts;
        if(a.distanceTo(b) > 1e-4){
          Store.checkpoint(`Draw ${label.toLowerCase()}`);
          doc.physical.members.push(Model.mk.member({
            role, sectionId:opts.sectionId, materialId:opts.materialId,
            start:[a.x,a.y,a.z], end:[b.x,b.y,b.z], levelId:doc.views.activeLevel }));
          Store.touch('draw');
        }
        this.state.pts = opts.chain ? [b.clone()] : [];
        Bus.emit('preview', null);
      }
      return true;
    },
    onEscape(){ if(this.state.pts.length){ this.state.pts = []; Bus.emit('preview', null); return true; } return false; }
  });
  drawLine('beam',  'beam',  'Beam',  'i-beam',  'B');
  drawLine('brace', 'brace', 'Brace', 'i-brace', 'R');

  /* --- column ------------------------------------------------------------- */
  def('column', {
    icon:'i-column', label:'Column', key:'C', role:'column',
    hint:'Click a point to raise a column from the active level to the one above.',
    onPointerDown(ev, doc, snap){
      if(!snap) return true;
      const y0 = activeY(doc);
      const above = doc.levels.filter(l => l.elevation > y0 + 1e-6)
                              .sort((a,b) => a.elevation - b.elevation)[0];
      const h = above ? above.elevation - y0 : opts.columnHeight;
      Store.checkpoint('Draw column');
      doc.physical.members.push(Model.mk.member({
        role:'column', sectionId:opts.colSection,
        materialId:Model.sec(opts.colSection).defaultMat,
        start:[snap.p.x, y0, snap.p.z], end:[snap.p.x, y0+h, snap.p.z],
        levelId:above ? above.id : doc.views.activeLevel }));
      Store.touch('draw');
      return true;
    }
  });

  /* --- slab --------------------------------------------------------------- */
  def('slab', {
    icon:'i-slab', label:'Slab', key:'A',
    hint:'Click the corners of the slab. <kbd>Enter</kbd> closes it, <kbd>Esc</kbd> cancels.',
    state:{ pts:[] },
    onActivate(){ this.state.pts = []; },
    onDeactivate(){ this.state.pts = []; Bus.emit('preview', null); },
    onPointerMove(ev, doc, snap){
      if(this.state.pts.length && snap)
        Bus.emit('preview', { kind:'poly', pts:this.state.pts, next:snap.p });
    },
    onPointerDown(ev, doc, snap){
      if(!snap) return true;
      this.state.pts.push(snap.p.clone());
      Snap.setLast(snap.p);
      return true;
    },
    onKey(ev, doc){
      if(ev.key !== 'Enter' || this.state.pts.length < 3) return false;
      Store.checkpoint('Draw slab');
      const cat = LIB.IMPOSED.find(c => c.id === 'B-off');
      doc.physical.slabs.push(Model.mk.slab({
        levelId:doc.views.activeLevel,
        boundary:this.state.pts.map(p => [p.x, p.z]),
        thickness:0.2, materialId:'C30', category:cat.id, imposed:cat.q, sdl:1.5 }));
      this.state.pts = []; Bus.emit('preview', null);
      Store.touch('draw');
      return true;
    },
    onEscape(){ if(this.state.pts.length){ this.state.pts = []; Bus.emit('preview', null); return true; } return false; }
  });

  /* --- wall --------------------------------------------------------------- */
  def('wall', {
    icon:'i-wall', label:'Wall', key:'W',
    hint:'Pick the start and end of a load-bearing wall.',
    state:{ pts:[] },
    onActivate(){ this.state.pts = []; },
    onPointerMove(ev, doc, snap){
      if(this.state.pts.length === 1 && snap)
        Bus.emit('preview', { kind:'line', a:this.state.pts[0], b:snap.p });
    },
    onPointerDown(ev, doc, snap){
      if(!snap) return true;
      this.state.pts.push(snap.p.clone());
      if(this.state.pts.length === 2){
        const [a,b] = this.state.pts;
        const y0 = activeY(doc);
        const above = doc.levels.filter(l => l.elevation > y0+1e-6).sort((p,q)=>p.elevation-q.elevation)[0];
        Store.checkpoint('Draw wall');
        doc.physical.walls.push(Model.mk.wall({
          levelId:doc.views.activeLevel, p0:[a.x,a.z], p1:[b.x,b.z],
          height:above ? above.elevation - y0 : 3.0,
          thickness:0.215, materialId:'MAS5', role:'loadbearing' }));
        this.state.pts = []; Bus.emit('preview', null);
        Store.touch('draw');
      }
      return true;
    },
    onEscape(){ if(this.state.pts.length){ this.state.pts = []; return true; } return false; }
  });

  /* --- support ------------------------------------------------------------- */
  def('support', {
    icon:'i-support', label:'Support', key:'P',
    hint:'Click a node to apply the support type chosen in the panel.',
    onPointerDown(ev, doc){
      const hit = Pick.at(ev, doc);
      if(!hit) return true;
      let node = hit.kind === 'node' ? Model.byId(doc.analytical.nodes, hit.id) : null;
      if(!node){
        // nearest node to the click point
        let bd = Infinity;
        for(const n of doc.analytical.nodes){
          const d = Math.hypot(n.p[0]-hit.point.x, n.p[1]-hit.point.y, n.p[2]-hit.point.z);
          if(d < bd){ bd = d; node = n; }
        }
        if(bd > Render.modelDiag*0.04) return true;
      }
      Store.checkpoint('Assign support');
      node.support = (Model.SUPPORTS[opts.supportPreset] || Model.SUPPORTS.fixed).slice();
      Store.touch('support');
      Store.select([node.id]);
      return true;
    }
  });

  /* --- load ---------------------------------------------------------------- */
  def('load', {
    icon:'i-load', label:'Load', key:'Q',
    hint:'Click a member for a line load, or a node for a point load.',
    onPointerDown(ev, doc){
      const hit = Pick.at(ev, doc);
      if(!hit) return true;
      const caseId = opts.loadCase || doc.loads.cases[0]?.id;
      if(!caseId){ Bus.emit('toast', { msg:'Create a load case first.', kind:'warn' }); return true; }
      Store.checkpoint('Add load');
      if(hit.kind === 'node'){
        doc.loads.nodal.push(Model.mk.nodalLoad({ caseId, nodeId:hit.id, Fy:opts.loadValue }));
      } else {
        const am = hit.kind === 'amember' ? hit.id
          : (Model.byId(doc.physical.members, hit.id) || {}).analyticalId;
        if(am) doc.loads.member.push(Model.mk.memberLoad({
          caseId, memberId:am, kind:opts.loadKind, dir:'GY', w1:opts.loadValue }));
      }
      Store.touch('load');
      return true;
    }
  });

  /* --- measure -------------------------------------------------------------- */
  def('measure', {
    icon:'i-measure', label:'Measure', key:'M',
    hint:'Pick two points to measure the distance between them.',
    state:{ pts:[] },
    onActivate(){ this.state.pts = []; },
    onPointerMove(ev, doc, snap){
      if(this.state.pts.length === 1 && snap)
        Bus.emit('preview', { kind:'measure', a:this.state.pts[0], b:snap.p });
    },
    onPointerDown(ev, doc, snap){
      if(!snap) return true;
      this.state.pts.push(snap.p.clone());
      if(this.state.pts.length === 2){
        const [a,b] = this.state.pts;
        Bus.emit('toast', { msg:`Distance ${U.fx(a.distanceTo(b),3)} m  ·  ΔX ${U.fx(b.x-a.x,3)}  ΔY ${U.fx(b.y-a.y,3)}  ΔZ ${U.fx(b.z-a.z,3)}`, kind:'ok', ms:6000 });
        this.state.pts = [a.clone()];
      }
      return true;
    },
    onEscape(){ this.state.pts = []; Bus.emit('preview', null); return true; }
  });

  /* --- grid + level --------------------------------------------------------- */
  def('grid', {
    icon:'i-grid', label:'Grid line', key:'G',
    hint:'Pick two points to lay a grid line.',
    state:{ pts:[] },
    onActivate(){ this.state.pts = []; },
    onPointerMove(ev, doc, snap){
      if(this.state.pts.length === 1 && snap)
        Bus.emit('preview', { kind:'line', a:this.state.pts[0], b:snap.p });
    },
    onPointerDown(ev, doc, snap){
      if(!snap) return true;
      this.state.pts.push(snap.p.clone());
      if(this.state.pts.length === 2){
        const [a,b] = this.state.pts;
        const axis = Math.abs(b.x-a.x) < Math.abs(b.z-a.z) ? 'X' : 'Z';
        const n = doc.grids.filter(g => g.axis === axis).length;
        Store.checkpoint('Add grid line');
        doc.grids.push(Model.mk.grid(
          axis === 'X' ? String.fromCharCode(65+n) : String(n+1),
          [a.x,a.z], [b.x,b.z], axis));
        this.state.pts = []; Bus.emit('preview', null);
        Store.touch('grid');
      }
      return true;
    },
    onEscape(){ this.state.pts = []; Bus.emit('preview', null); return true; }
  });

  def('footing', {
    icon:'i-footing', label:'Footing', key:'F',
    hint:'Click a supported node to place a pad footing sized from the load takedown.',
    onPointerDown(ev, doc){
      const hit = Pick.at(ev, doc);
      if(!hit) return true;
      const node = Model.byId(doc.analytical.nodes, hit.kind === 'node' ? hit.id : '');
      if(!node){ Bus.emit('toast', { msg:'Click an analytical node at the base of a column.', kind:'warn' }); return true; }
      const td = Results.takedown;
      const st = td && td.stacks.find(s => s.baseNodeId === node.id);
      const N = st ? st.N_sls : 500;
      const f = Takedown.sizeFooting(N, doc.settings.qAllowSoil, 0.4);
      Store.checkpoint('Place footing');
      doc.physical.footings = doc.physical.footings.filter(x => x.nodeId !== node.id);
      doc.physical.footings.push(Model.mk.footing(Object.assign({ nodeId:node.id,
        N_sls:N, N_uls:st ? st.N_uls : N*1.4, qAllow:doc.settings.qAllowSoil }, f)));
      Store.touch('footing');
      return true;
    }
  });

  const list = () => ['select','grid','column','beam','brace','slab','wall',
                      'footing','support','load','measure'];

  return { def, get, set, list, current, get active(){ return active },
           get opts(){ return opts }, set opts(v){ opts = v }, activeY };
})();

/* ==========================================================================
   25  UI - DOM helpers, chrome, ribbon, status, modals, toasts
   ========================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function el(tag, props, kids){
  const n = document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v == null) continue;
    if(k === 'class') n.className = v;
    else if(k === 'html') n.innerHTML = v;
    else if(k === 'text') n.textContent = v;
    else if(k === 'style' && typeof v === 'object') Object.assign(n.style, v);
    else if(k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if(k === 'data') for(const [dk,dv] of Object.entries(v)) n.dataset[dk] = dv;
    else if(v === true) n.setAttribute(k, '');
    else if(v !== false) n.setAttribute(k, v);
  }
  for(const c of [].concat(kids || [])){
    if(c == null || c === false) continue;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
}
const icon = (id, cls) => {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 24 24');
  if(cls) svg.setAttribute('class', cls);
  const use = document.createElementNS('http://www.w3.org/2000/svg','use');
  use.setAttribute('href', '#' + id);
  svg.appendChild(use);
  return svg;
};

const UI = (() => {
  const dom = {};
  let ribbonTab = 'model', dockPane = 'props';

  /* --- toasts --------------------------------------------------------- */
  function toast(msg, kind = 'info', ms = 3600){
    const t = el('div', { class:`toast ${kind}` }, [el('span',{class:'dot'}), msg]);
    dom.toasts.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(6px)';
                       setTimeout(() => t.remove(), 220); }, ms);
    return t;
  }

  /* --- modal ---------------------------------------------------------- */
  let modalEsc = null;
  function modal({ title, sub, body, footer, wide, onClose }){
    close();
    const dlg = el('div', { class:'dlg', style:wide ? { minWidth:'min(760px,94vw)' } : null }, [
      el('header', {}, [
        el('h3', { text:title }),
        sub ? el('span', { class:'sub', text:sub }) : null,
        el('button', { class:'btn icon x', title:'Close', onclick:close }, [icon('i-close')])
      ]),
      el('div', { class:'content' }, body),
      footer ? el('footer', {}, footer) : null
    ]);
    dom.modal.appendChild(dlg);
    dom.modal.classList.add('open');
    modalEsc = onClose || null;
    dom.modal.querySelector('.scrim').onclick = close;
    const first = dlg.querySelector('input,select,button.primary');
    first && first.focus();
    return { dlg, close };
  }
  function close(){
    dom.modal.classList.remove('open');
    [...dom.modal.children].forEach(c => { if(!c.classList.contains('scrim')) c.remove(); });
    if(modalEsc){ const f = modalEsc; modalEsc = null; f(); }
  }
  const isModalOpen = () => dom.modal.classList.contains('open');

  /* --- small form controls -------------------------------------------- */
  const row = (label, ctrl, hint) => el('div', { class:'row' },
    [el('label', { text:label }), ctrl, hint ? el('div',{class:'hint',text:hint}) : null].filter(Boolean));
  const rowWide = (ctrl) => el('div', { class:'row wide' }, [ctrl]);

  function num(value, onchange, attrs){
    return el('input', Object.assign({ type:'number', value:String(value ?? 0),
      oninput:e => onchange(U.num(e.target.value, 0), e) }, attrs || {}));
  }
  function text(value, onchange, attrs){
    return el('input', Object.assign({ type:'text', value:value ?? '',
      oninput:e => onchange(e.target.value, e) }, attrs || {}));
  }
  function select(options, value, onchange, attrs){
    const s = el('select', Object.assign({ onchange:e => onchange(e.target.value, e) }, attrs || {}));
    for(const o of options){
      const v = typeof o === 'string' ? o : o.value;
      const t = typeof o === 'string' ? o : o.label;
      s.appendChild(el('option', { value:v, selected:String(v) === String(value) }, [t]));
    }
    s.value = value;
    return s;
  }
  function check(label, value, onchange){
    return el('label', { class:'chk' }, [
      el('input', { type:'checkbox', checked:!!value,
        onchange:e => onchange(e.target.checked, e) }), label]);
  }
  function section(title, badge, kids, open = true){
    return el('details', { class:'sect', open }, [
      el('summary', {}, [title, badge ? el('span',{class:'badge',text:badge}) : null].filter(Boolean)),
      el('div', { class:'body' }, kids)
    ]);
  }
  function explain(html){ return el('div', { class:'explain', html }); }
  function disclaimer(html){ return el('div', { class:'disclaimer', html }); }
  function empty(msg){
    return el('div', { class:'empty' }, [icon('i-empty'), el('div',{html:msg})]);
  }

  /* --- 6-DOF toggle grid (supports and releases) ----------------------- */
  function dof6(values, onchange, labels){
    const names = labels || Model.DOF_NAMES;
    const wrap = el('div', { class:'dof6' });
    names.forEach((nm, i) => {
      const b = el('button', { type:'button', 'aria-pressed':String(!!values[i]), text:nm,
        onclick:() => { values[i] = values[i] ? 0 : 1;
                        b.setAttribute('aria-pressed', String(!!values[i])); onchange(values); } });
      wrap.appendChild(b);
    });
    return wrap;
  }

  /* --- table ----------------------------------------------------------- */
  function table(cols, rows, { onRow, selected, footer, sortable = true } = {}){
    let sortKey = null, sortDir = 1;
    const wrap = el('div', { class:'tbl-wrap' });
    const t = el('table', { class:'tbl' });
    const thead = el('thead'), tr = el('tr');
    cols.forEach((c, i) => {
      const th = el('th', { class:sortable ? 'sortable' : '', text:c.label,
        title:c.title || c.label });
      if(sortable) th.onclick = () => {
        if(sortKey === i){ sortDir = -sortDir; } else { sortKey = i; sortDir = 1; }
        draw();
      };
      tr.appendChild(th);
    });
    thead.appendChild(tr); t.appendChild(thead);
    const tbody = el('tbody'); t.appendChild(tbody);
    if(footer){
      const tf = el('tfoot'), ftr = el('tr');
      footer.forEach(f => ftr.appendChild(el('td', { class:f.num ? 'num' : '', text:f.text })));
      tf.appendChild(ftr); t.appendChild(tf);
    }
    function draw(){
      tbody.textContent = '';
      let data = rows.slice();
      if(sortKey != null){
        const c = cols[sortKey];
        data.sort((a,b) => {
          const va = c.value ? c.value(a) : a[c.key], vb = c.value ? c.value(b) : b[c.key];
          return (typeof va === 'number' ? va-vb : String(va).localeCompare(String(vb)))*sortDir;
        });
      }
      for(const r of data){
        const trr = el('tr', { class:selected && selected(r) ? 'sel' : '' });
        for(const c of cols){
          const v = c.render ? c.render(r) : (c.value ? c.value(r) : r[c.key]);
          const td = el('td', { class:c.num ? 'num' : '' });
          if(v instanceof Node) td.appendChild(v); else td.textContent = v ?? '';
          trr.appendChild(td);
        }
        if(onRow) trr.onclick = e => onRow(r, e);
        tbody.appendChild(trr);
      }
    }
    draw();
    wrap.appendChild(t);
    wrap.refresh = draw;
    return wrap;
  }

  function csv(cols, rows, name){
    const head = cols.map(c => `"${c.label}"`).join(',');
    const body = rows.map(r => cols.map(c => {
      const v = c.value ? c.value(r) : r[c.key];
      return typeof v === 'number' ? U.sig(v, 6) : `"${String(v ?? '').replace(/"/g,'""')}"`;
    }).join(',')).join('\n');
    IO.download(new Blob([head + '\n' + body], { type:'text/csv' }), name);
  }

  const utilChip = u => {
    const c = u <= 0.85 ? 'ok' : u <= 1 ? 'warn' : 'bad';
    return el('span', { class:`util ${c}`, text:U.fx(u,2) });
  };

  return { dom, toast, modal, close, isModalOpen, row, rowWide, num, text, select,
           check, section, explain, disclaimer, empty, dof6, table, csv, utilChip,
           get ribbonTab(){ return ribbonTab }, set ribbonTab(v){ ribbonTab = v },
           get dockPane(){ return dockPane }, set dockPane(v){ dockPane = v } };
})();

      grp('Apply', [

      ]),

      grp('Combination', [combos]),

        btn('Utilisation', 'i-eye', () => App.setResultMode('util')),

  function draft(doc){

      ]),
      grp('Annotate', [
        btn('Dimensions', 'i-measure', () => App.toggleLabel('dim')),
        btn('Member tags', 'i-doc', () => App.toggleLabel('section')),
        btn('Node numbers', 'i-select', () => App.toggleLabel('node')),
        btn('Grid bubbles', 'i-grid', () => App.toggleLabel('grid'))
      ]),
      grp('Schedules', [
        btn('Members', 'i-table', () => App.showSchedule('members')),
        btn('Quantities', 'i-table', () => App.showSchedule('quantities')),
        btn('Footings', 'i-table', () => App.showSchedule('footings'))
      ]),
      grp('Output', [
        btn('Export image', 'i-camera', () => Draft.exportPNG()),
        btn('Drawing sheet', 'i-doc', () => Draft.sheetDialog())
      ])
    ];
  }

  /* ---------------- View ---------------- */
  function view(doc){
    const s = doc.views.show;
    const t = (label, ic, key) => el('button', {
      class:'btn', 'aria-pressed':String(!!s[key]), title:label,
      onclick:e => { s[key] = !s[key]; e.currentTarget.setAttribute('aria-pressed', String(s[key]));
                     App.rebuild(); } }, [icon(ic), label]);
    return [
      grp('Show', [
        t('Grids','i-grid','grids'), t('Levels','i-level','levels'),
        t('Loads','i-load','loads'), t('Supports','i-support','supports')
      ]),
      grp('Standard views', [
        btn('Top', 'i-eye', () => Render.standardView('top')),
        btn('Front', 'i-eye', () => Render.standardView('front')),
        btn('Iso', 'i-eye', () => Render.standardView('iso')),
        btn('Fit', 'i-eye', () => Render.fit())
      ]),
      grp('Deformation', [
        el('input', { type:'range', min:'0', max:'100', value:'50', style:'width:120px',
          oninput:e => App.setDeformSlider(+e.target.value) })
      ]),
      grp('Appearance', [
        btn('Theme', 'i-theme', () => App.toggleTheme()),
        btn('Reload renderer', 'i-solve', () => { Render.rebuildAll(); UI.toast('Renderer rebuilt.','ok'); })
      ])
    ];
  }

  return { build, btn, grp };
})();

/* ==========================================================================
   27  PANELS - properties, data tables, results, schedules
   ========================================================================== */
const Panels = (() => {

  function refreshAll(){
    const doc = Store.doc;
    props(doc); data(doc); results(doc); schedules(doc);
  }

  /* ------------------------------------------------------------------ props */
  function props(doc){
    const host = UI.dom.paneProps; host.textContent = '';
    const sel = Store.selected();

    if(!sel.length){ host.appendChild(toolOptions(doc)); host.appendChild(projectSection(doc)); return; }

    const kinds = Util.uniq(sel.map(s => s.type));
    if(kinds.length > 1){
      host.appendChild(UI.section('Selection', `${sel.length} objects`, [
        UI.empty(`A mixed selection of <b>${sel.length}</b> objects.<br>Select one type to edit its properties.`)
      ]));
      return;
    }
    const type = kinds[0], objs = sel.map(s => s.obj);
    host.appendChild(({
      member: memberProps, slab: slabProps, wall: wallProps, footing: footingProps,
      node: nodeProps, amember: amemberProps, level: levelProps, grid: gridProps
    }[type] || (() => UI.empty('No editable properties.')))(doc, objs));

    if(type === 'member' || type === 'amember') host.appendChild(memberResults(doc, objs));
  }

  const commit = (label, fn) => { Store.checkpoint(label); fn(); Store.touch('props'); };
  const multi = (objs, key, val) => objs.forEach(o => { o[key] = val; });
  const same  = (objs, key) => objs.every(o => o[key] === objs[0][key]) ? objs[0][key] : '';

  function sectionPicker(value, onchange, family){
    const groups = {};
    for(const s of LIB.SECTIONS){
      if(family && s.family !== family) continue;
      (groups[s.family] || (groups[s.family] = [])).push(s);
    }
    const sel = el('select', { onchange:e => onchange(e.target.value) });
    for(const [fam, list] of Object.entries(groups)){
      const og = el('optgroup', { label:LIB.familyLabel[fam] || fam });
      for(const s of list) og.appendChild(el('option', { value:s.id, selected:s.id === value }, [s.name]));
      sel.appendChild(og);
    }
    sel.value = value;
    return sel;
  }

  function sectionFacts(sec){
    return el('div', { class:'explain', html:
      `<b>${sec.name}</b> — derived section properties<span class="f">` +
      `A    = ${U.eng(sec.A*1e4,1)} cm²\n` +
      `Iy   = ${U.eng(sec.Iy*1e8,0)} cm⁴   (strong)\n` +
      `Iz   = ${U.eng(sec.Iz*1e8,0)} cm⁴   (weak)\n` +
      `Wel,y= ${U.eng(sec.Wely*1e6,0)} cm³\n` +
      `It   = ${U.eng(sec.J*1e8,1)} cm⁴` +
      `</span>Depth ${U.mm(sec.h)} mm · width ${U.mm(sec.b)} mm` });
  }

  function memberProps(doc, objs){
    const o = objs[0], sec = Model.sec(o.sectionId), mat = Model.mat(o.materialId);
    const L = Math.hypot(o.end[0]-o.start[0], o.end[1]-o.start[1], o.end[2]-o.start[2]);
    const isCol = o.role === 'column';
    return el('div', {}, [
      UI.section('Identity', objs.length > 1 ? `${objs.length} selected` : o.id.slice(-5), [
        UI.row('Tag', UI.text(same(objs,'tag'), v => commit('Tag', () => multi(objs,'tag',v)))),
        UI.row('Role', UI.select(['beam','column','brace','girder','joist'], o.role,
          v => commit('Role', () => multi(objs,'role',v)))),
        UI.row('Length', el('input', { type:'text', value:`${U.fx(L,3)} m`, readonly:true }))
      ]),
      UI.section('Section & material', null, [
        UI.row('Section', sectionPicker(o.sectionId,
          v => commit('Section', () => { multi(objs,'sectionId',v);
            multi(objs,'materialId', Model.sec(v).defaultMat); Panels.props(doc); }))),
        UI.row('Material', UI.select(LIB.MATERIALS.map(m => ({ value:m.id, label:m.name })),
          o.materialId, v => commit('Material', () => multi(objs,'materialId',v)))),
        UI.row('Rotation', UI.num(o.roll || 0,
          v => commit('Rotation', () => multi(objs,'roll',v)), { step:15, min:-180, max:180 }), '° about the member axis'),
        UI.row('Justification', UI.select(
          ['centroid','top','bottom','left','right'], o.justification,
          v => commit('Justification', () => multi(objs,'justification',v)))),
        sectionFacts(sec),
        isCol ? UI.explain(
          `<b>Which way does this column resist sway?</b> By convention a vertical member's ` +
          `local <i>y</i> axis points along global <b>Z</b>, so an unrotated column resists ` +
          `sway in Z with its <b>strong</b> axis and sway in X with its weak axis. ` +
          `Set the rotation to 90° to swap them.`) : null
      ].filter(Boolean)),
      UI.section('Analytical', o.analyticalId ? 'linked' : 'not generated', [
        UI.explain('Releases free an internal force at the member end. ' +
          'Pressed = released. A beam pinned at both ends has <b>My</b> and <b>Mz</b> released.'),
        UI.row('Start releases', UI.dof6(o.relI, v => commit('Releases', () => multi(objs,'relI',v.slice())))),
        UI.row('End releases',   UI.dof6(o.relJ, v => commit('Releases', () => multi(objs,'relJ',v.slice())))),
        UI.row('Analysis class', UI.select(['primary','secondary','ignore'], o.analysisClass,
          v => commit('Analysis class', () => multi(objs,'analysisClass',v)))),
        el('div', { class:'row wide' }, [
          el('button', { class:'btn ghost sm', onclick:() => App.regenerate() },
             ['Regenerate analytical model'])])
      ]),
      UI.section('Geometry', null, [
        UI.row('Start X / Y / Z', el('div', { style:'display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px' },
          [0,1,2].map(i => UI.num(U.sig(o.start[i],6),
            v => commit('Move', () => { o.start[i] = v; }))))),
        UI.row('End X / Y / Z', el('div', { style:'display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px' },
          [0,1,2].map(i => UI.num(U.sig(o.end[i],6),
            v => commit('Move', () => { o.end[i] = v; })))))
      ], false)
    ]);
  }

  function amemberProps(doc, objs){
    const o = objs[0];
    return el('div', {}, [
      UI.section('Analytical member', o.id.slice(-5), [
        UI.row('Section', sectionPicker(o.sectionId, v => commit('Section', () => multi(objs,'sectionId',v)))),
        UI.row('Material', UI.select(LIB.MATERIALS.map(m => ({ value:m.id, label:m.name })),
          o.materialId, v => commit('Material', () => multi(objs,'materialId',v)))),
        UI.row('Rotation', UI.num(o.roll||0, v => commit('Rotation', () => multi(objs,'roll',v)), { step:15 })),
        UI.row('Start releases', UI.dof6(o.relI, v => commit('Releases', () => multi(objs,'relI',v.slice())))),
        UI.row('End releases',   UI.dof6(o.relJ, v => commit('Releases', () => multi(objs,'relJ',v.slice())))),
        UI.row('Active', UI.check('include in the analysis', o.active !== false,
          v => commit('Active', () => multi(objs,'active',v))))
      ])
    ]);
  }

  function nodeProps(doc, objs){
    const o = objs[0];
    const presetRow = el('div', { style:'display:flex;gap:4px;flex-wrap:wrap' },
      Object.keys(Model.SUPPORTS).map(k => el('button', { class:'btn ghost sm',
        onclick:() => commit('Support', () => { multi(objs,'support', Model.SUPPORTS[k].slice());
                                                Panels.props(doc); }) }, [k])));
    return el('div', {}, [
      UI.section('Node', o.id.slice(-5), [
        UI.row('Tag', UI.text(o.tag || '', v => commit('Tag', () => multi(objs,'tag',v)))),
        UI.row('X / Y / Z', el('div', { style:'display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px' },
          [0,1,2].map(i => UI.num(U.sig(o.p[i],6), v => commit('Move node', () => { o.p[i] = v; })))))
      ]),
      UI.section('Boundary conditions', null, [
        UI.explain('Pressed = restrained. <b>Fx Fy Fz</b> are translations, ' +
                   '<b>Mx My Mz</b> rotations. Fixed restrains all six; pinned restrains the three translations.'),
        UI.rowWide(presetRow),
        UI.row('Restraints', UI.dof6(o.support, v => commit('Support', () => multi(objs,'support',v.slice()))))
      ]),
      nodeResults(doc, o)
    ]);
  }

  function nodeResults(doc, node){
    const res = Results.res, comb = Results.comb;
    if(!res || !comb) return UI.section('Results', 'not solved', [UI.empty('Solve the model to see displacements and reactions.')]);
    const i = res.ctx.nodeIdx.get(node.id);
    if(i == null) return UI.section('Results', null, [UI.empty('This node is not in the solved model.')]);
    const u = comb.u, R = comb.R;
    const fmt = (v, d) => U.fx(v, d);
    return UI.section('Results', Results.activeCombo(doc)?.name, [
      UI.row('Displacement', el('input', { type:'text', readonly:true,
        value:`${fmt(u[i*6]*1000,2)}, ${fmt(u[i*6+1]*1000,2)}, ${fmt(u[i*6+2]*1000,2)} mm` })),
      UI.row('Rotation', el('input', { type:'text', readonly:true,
        value:`${fmt(u[i*6+3]*1000,3)}, ${fmt(u[i*6+4]*1000,3)}, ${fmt(u[i*6+5]*1000,3)} mrad` })),
      node.support.some(v => v) ? UI.row('Reaction', el('input', { type:'text', readonly:true,
        value:`${fmt(R[i*6],1)}, ${fmt(R[i*6+1],1)}, ${fmt(R[i*6+2],1)} kN` })) : null,
      node.support.some(v => v) ? UI.row('Moment', el('input', { type:'text', readonly:true,
        value:`${fmt(R[i*6+3],1)}, ${fmt(R[i*6+4],1)}, ${fmt(R[i*6+5],1)} kNm` })) : null
    ].filter(Boolean));
  }

  function memberResults(doc, objs){
    const res = Results.res, comb = Results.comb;
    if(!res || !comb) return UI.section('Results','not solved',[UI.empty('Solve the model to see forces here.')]);
    const o = objs[0];
    const amId = o.analyticalId || o.id;
    const e = res.memberOrder.indexOf(amId);
    if(e < 0) return UI.section('Results', null, [UI.empty('This member is not in the solved model.')]);
    const d = Results.diagrams[e];
    const chk = Results.checks && Results.checks.find(c => c.id === amId);
    const cb = Results.activeCombo(doc);
    const brk = Results.caseBreakdown(amId, cb);

    return UI.section('Results', cb?.name, [
      UI.row('Axial N', el('input',{type:'text',readonly:true,value:`${U.fx(-comb.mf[e*12],1)} kN`})),
      UI.row('Max moment', el('input',{type:'text',readonly:true,value:`${U.fx(d?d.maxAbs.Mz:0,1)} kNm`})),
      UI.row('Max shear', el('input',{type:'text',readonly:true,value:`${U.fx(d?d.maxAbs.Vy:0,1)} kN`})),
      UI.row('Max deflection', el('input',{type:'text',readonly:true,
        value:`${U.fx((d?d.maxAbs.d:0)*1000,2)} mm  (span/${d && d.maxAbs.d>0 ? Math.round(d.L/d.maxAbs.d) : '∞'})`})),
      chk ? UI.row('Utilisation', el('div',{style:'display:flex;gap:6px;align-items:center'},
        [UI.utilChip(chk.utilMax), el('span',{class:'hint',text:chk.governs})])) : null,
      chk ? UI.explain(
        `Elastic check: <span class="f">` +
        `sigma = N/A + My/Wel,y + Mz/Wel,z\n` +
        `      = ${U.fx(U.toMPa(chk.sigma),1)} MPa\n` +
        `fd    = fy/gammaM = ${U.fx(U.toMPa(chk.fd),1)} MPa\n` +
        `util  = ${U.fx(chk.util,3)}` +
        `</span>Deflection limit span/${doc.settings.deflLimit}.` ) : null,
      brk.length ? el('div',{class:'explain',html:
        '<b>Where the axial force comes from</b>' + brk.map(b => {
          const c = Model.byId(doc.loads.cases, b.caseId);
          return `<br>${c?c.name:b.caseId}: ${U.fx(b.factor,2)} × ${U.fx(b.N,1)} = <b>${U.fx(b.contribution,1)} kN</b>`;
        }).join('')}) : null,
      el('div',{class:'row wide'},[el('button',{class:'btn ghost sm',
        onclick:() => App.suggestSection(amId)},['Suggest a lighter section that passes'])])
    ].filter(Boolean));
  }

  function slabProps(doc, objs){
    const o = objs[0];
    const A = Geom.area(o.boundary);
    const press = LoadGen.slabPressures(doc).get(o.id);
    return el('div', {}, [
      UI.section('Slab', `${U.fx(A,1)} m²`, [
        UI.row('Level', UI.select(doc.levels.map(l => ({value:l.id,label:l.name})), o.levelId,
          v => commit('Level', () => multi(objs,'levelId',v)))),
        UI.row('Thickness', UI.num(o.thickness, v => commit('Thickness', () => multi(objs,'thickness',v)),
          { step:0.01, min:0.05 }), 'm'),
