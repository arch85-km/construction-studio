<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Structural Studio - a 3D structural modelling, analysis and drafting environment for architecture students. By Karam Al-Obaidi.">
<meta name="author" content="Karam Al-Obaidi">
<title>Structural Studio &mdash; 3D Structural Modelling &amp; Analysis</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
<style>
/* ==========================================================================
   STRUCTURAL STUDIO - stylesheet
   Design tokens -> layout -> chrome -> panels -> widgets -> responsive -> print
   ========================================================================== */

/* --- design tokens ------------------------------------------------------ */
:root{
  --bg-0:#12151a; --bg-1:#181c23; --bg-2:#1f242d; --bg-3:#272d38; --bg-4:#333b49;
  --line:#39424f; --line-soft:#2b323d;
  --ink-0:#eef2f7; --ink-1:#b6c0cd; --ink-2:#7d8899; --ink-3:#5a6474;
  --accent:#4da3ff; --accent-dim:#2e6fb5; --accent-ghost:rgba(77,163,255,.14);
  --ok:#4ec98b; --warn:#f0b23c; --bad:#f2645a; --info:#7f8cff;
  --viewport:#141820; --viewport-2:#0e1116;
  --grid-major:#3a4552; --grid-minor:#232a34;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 6px 24px rgba(0,0,0,.45);
  --shadow-3:0 18px 60px rgba(0,0,0,.55);
  --r-s:4px; --r-m:7px; --r-l:12px;
  --rail:52px; --ribbon:38px; --tabs:34px; --cmd:46px; --status:26px; --panel:310px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --dur:.16s;
}
html[data-theme="light"]{
  --bg-0:#eef1f5; --bg-1:#f6f8fa; --bg-2:#ffffff; --bg-3:#eaeef3; --bg-4:#dde3ea;
  --line:#c8d1dc; --line-soft:#dee4ec;
  --ink-0:#141a22; --ink-1:#3d4757; --ink-2:#6b7686; --ink-3:#939daa;
  --accent:#1668c7; --accent-dim:#4d94dd; --accent-ghost:rgba(22,104,199,.12);
  --viewport:#e7ebf1; --viewport-2:#f4f6f9;
  --grid-major:#b4bfcc; --grid-minor:#d5dce4;
  --shadow-1:0 1px 2px rgba(20,30,45,.12);
  --shadow-2:0 6px 24px rgba(20,30,45,.14);
  --shadow-3:0 18px 60px rgba(20,30,45,.2);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  font-family:var(--sans); font-size:13px; line-height:1.45;
  color:var(--ink-0); background:var(--bg-0);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden; touch-action:none;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box}

/* --- app shell ---------------------------------------------------------- */
#app{
  position:fixed; inset:0; display:grid;
  grid-template-rows:var(--ribbon) var(--tabs) var(--cmd) 1fr var(--status);
  grid-template-columns:var(--rail) 1fr auto;
  grid-template-areas:
    "brand  brand    brand"
    "tabs   tabs     tabs"
    "cmd    cmd      cmd"
    "rail   stage    dock"
    "status status   status";
  background:var(--bg-0);
  min-height:0;
}

/* --- brand bar ---------------------------------------------------------- */
#brand{
  grid-area:brand; display:flex; align-items:center; gap:10px;
  padding:0 10px; background:var(--bg-1); border-bottom:1px solid var(--line-soft);
  z-index:30;
}
#brand .logo{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
#brand .logo svg{width:20px;height:20px;color:var(--accent);flex:none}
#brand .logo b{font-weight:650}
#brand .logo span{color:var(--ink-2);font-weight:450}
#brand .proj{
  margin-left:6px;padding:3px 9px;border-radius:var(--r-s);background:var(--bg-3);
  color:var(--ink-1);font-size:12px;max-width:34vw;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;border:1px solid transparent;cursor:text
}
#brand .proj:hover{border-color:var(--line)}
#brand .spacer{flex:1}
#brand .quick{display:flex;gap:2px;align-items:center}

/* --- ribbon tabs -------------------------------------------------------- */
#tabs{
  grid-area:tabs; display:flex; align-items:stretch; gap:0; padding:0 6px;
  background:var(--bg-2); border-bottom:1px solid var(--line); z-index:25;
  overflow-x:auto; scrollbar-width:none;
}
#tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none;background:none;border:0;padding:0 15px;cursor:pointer;
  color:var(--ink-2);font-size:12.5px;font-weight:520;letter-spacing:.15px;
  white-space:nowrap;position:relative;transition:color var(--dur)
}
.tab:hover{color:var(--ink-0)}
.tab[aria-selected="true"]{color:var(--ink-0)}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;left:9px;right:9px;bottom:0;height:2px;
  background:var(--accent);border-radius:2px 2px 0 0
}
#tabs .tab-sep{width:1px;background:var(--line-soft);margin:8px 6px;flex:none}

/* --- ribbon panel (contextual toolbar) ---------------------------------- */
#ribbon{
  grid-area:cmd;display:flex;align-items:center;gap:4px;padding:4px 8px;
  background:var(--bg-1);border-bottom:1px solid var(--line);
  z-index:24;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;min-width:0
}
#ribbon .grp{display:flex;align-items:center;gap:3px;padding:0 7px;position:relative}
#ribbon .grp + .grp::before{
  content:"";position:absolute;left:0;top:5px;bottom:5px;width:1px;background:var(--line-soft)
}
#ribbon .grp-label{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  font-size:9px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;pointer-events:none
}

/* --- generic buttons ---------------------------------------------------- */
.btn{
  appearance:none;display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:var(--r-s);border:1px solid transparent;
  background:transparent;color:var(--ink-1);cursor:pointer;white-space:nowrap;
  font-size:12.5px;transition:background var(--dur),color var(--dur),border-color var(--dur)
}
.btn:hover{background:var(--bg-3);color:var(--ink-0)}
.btn:active{background:var(--bg-4)}
.btn[aria-pressed="true"],.btn.on{background:var(--accent-ghost);color:var(--accent);border-color:var(--accent-dim)}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn svg{width:15px;height:15px;flex:none}
.btn.icon{padding:6px}
.btn.primary{background:var(--accent);color:#fff;font-weight:560}
.btn.primary:hover{background:var(--accent-dim);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:3px 7px;font-size:11.5px}
.btn.solve{background:var(--ok);color:#08150f;font-weight:640}
.btn.solve:hover{background:#43b87c;color:#08150f}

/* --- left tool rail ----------------------------------------------------- */
#rail{
  grid-area:rail;display:flex;flex-direction:column;gap:2px;padding:6px 4px;
  background:var(--bg-1);border-right:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden;scrollbar-width:none;z-index:20
}
#rail::-webkit-scrollbar{display:none}
.tool{
  appearance:none;display:flex;align-items:center;justify-content:center;
  width:44px;height:40px;border:1px solid transparent;border-radius:var(--r-m);
  background:transparent;color:var(--ink-2);cursor:pointer;position:relative;flex:none;
  transition:background var(--dur),color var(--dur)
}
.tool:hover{background:var(--bg-3);color:var(--ink-0)}
.tool[aria-pressed="true"]{background:var(--accent-ghost);color:var(--accent);border-color:var(--accent-dim)}
.tool svg{width:19px;height:19px}
.tool .kbd{
  position:absolute;right:3px;bottom:2px;font-size:8.5px;color:var(--ink-3);
  font-family:var(--mono);pointer-events:none
}
.tool[aria-pressed="true"] .kbd{color:var(--accent-dim)}
.rail-sep{height:1px;background:var(--line-soft);margin:5px 6px;flex:none}

/* --- stage / viewport --------------------------------------------------- */
#stage{grid-area:stage;position:relative;background:var(--viewport);overflow:hidden;min-width:0}
#gl{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#labels>*{pointer-events:none}
.lbl{
  font-family:var(--mono);font-size:10.5px;line-height:1;white-space:nowrap;
  padding:2px 5px;border-radius:3px;transform:translate(-50%,-50%);
  background:rgba(10,14,20,.72);color:var(--ink-0);border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(3px)
}
html[data-theme="light"] .lbl{background:rgba(255,255,255,.86);color:#141a22;border-color:rgba(0,0,0,.12)}
.lbl.node{color:var(--info)} .lbl.dim{color:var(--ink-1)}
.lbl.tag{color:var(--ok)} .lbl.val{color:var(--warn)}
.lbl.grid{color:var(--accent);font-weight:600;border-radius:50%;padding:4px 6px;min-width:20px;text-align:center}

/* viewport overlays */
.vp-overlay{position:absolute;z-index:6;pointer-events:none}
.vp-overlay>*{pointer-events:auto}
#vp-tl{top:10px;left:10px;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
#vp-tr{top:10px;right:10px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
#vp-bl{bottom:10px;left:10px;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
#vp-br{bottom:10px;right:10px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}

.pill{
  display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  background:rgba(20,26,34,.78);border:1px solid var(--line);color:var(--ink-1);
  font-size:11.5px;backdrop-filter:blur(8px);box-shadow:var(--shadow-1)
}
html[data-theme="light"] .pill{background:rgba(255,255,255,.86)}
.pill b{color:var(--ink-0);font-weight:600}
.seg{
  display:flex;background:rgba(20,26,34,.78);border:1px solid var(--line);
  border-radius:var(--r-m);overflow:hidden;backdrop-filter:blur(8px);box-shadow:var(--shadow-1)
}
html[data-theme="light"] .seg{background:rgba(255,255,255,.86)}
.seg button{
  appearance:none;background:none;border:0;padding:5px 11px;cursor:pointer;
  color:var(--ink-2);font-size:11.5px;white-space:nowrap;transition:background var(--dur),color var(--dur)
}
.seg button + button{border-left:1px solid var(--line-soft)}
.seg button:hover{background:var(--bg-3);color:var(--ink-0)}
.seg button[aria-pressed="true"]{background:var(--accent-ghost);color:var(--accent)}

/* copyright badge - always bottom-left of the model space */
#copyright{
  position:absolute;left:12px;bottom:10px;z-index:9;pointer-events:none;
  font-size:11.5px;letter-spacing:.35px;color:var(--ink-1);
  user-select:none;white-space:nowrap;
  padding:3px 9px;border-radius:999px;
  background:rgba(20,26,34,.62);border:1px solid var(--line-soft);
  backdrop-filter:blur(6px)
}
html[data-theme="light"] #copyright{background:rgba(255,255,255,.72)}
#copyright b{font-weight:600;color:var(--ink-0)}
#copyright .mark{color:var(--accent);font-weight:700;margin-right:1px}

/* result legend */
#legend{
  width:186px;padding:9px 10px;border-radius:var(--r-m);
  background:rgba(20,26,34,.82);border:1px solid var(--line);
  backdrop-filter:blur(8px);box-shadow:var(--shadow-2)
}
html[data-theme="light"] #legend{background:rgba(255,255,255,.9)}
#legend h4{margin:0 0 6px;font-size:11px;font-weight:620;color:var(--ink-0);letter-spacing:.2px}
#legend .ramp{height:11px;border-radius:3px;margin-bottom:4px;border:1px solid var(--line-soft)}
#legend .ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--ink-2)}
#legend .unit{margin-top:5px;font-size:10px;color:var(--ink-3);text-align:center}

/* view cube / nav */
#navcube{
  width:74px;height:74px;border-radius:var(--r-m);
  background:rgba(20,26,34,.72);border:1px solid var(--line);
  backdrop-filter:blur(8px);display:grid;grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);gap:1px;padding:5px;box-shadow:var(--shadow-1)
}
html[data-theme="light"] #navcube{background:rgba(255,255,255,.86)}
#navcube button{
  appearance:none;background:transparent;border:0;border-radius:3px;cursor:pointer;
  color:var(--ink-2);font-size:9.5px;font-weight:600;transition:background var(--dur),color var(--dur)
}
#navcube button:hover{background:var(--accent-ghost);color:var(--accent)}
#navcube button.mid{color:var(--ink-3)}

/* snap indicator + tool hint */
#snaphint{
  position:absolute;z-index:7;pointer-events:none;font-family:var(--mono);font-size:10px;
  color:var(--warn);background:rgba(20,26,34,.85);padding:2px 6px;border-radius:3px;
  border:1px solid var(--warn);transform:translate(12px,-26px);display:none;white-space:nowrap
}
#toolhint{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:8;
  padding:6px 14px;border-radius:999px;background:rgba(20,26,34,.88);border:1px solid var(--line);
  color:var(--ink-1);font-size:12px;backdrop-filter:blur(8px);box-shadow:var(--shadow-2);
  display:none;pointer-events:none;max-width:min(560px,84%);text-align:center
}
html[data-theme="light"] #toolhint{background:rgba(255,255,255,.92)}
#toolhint kbd{
  font-family:var(--mono);font-size:10.5px;background:var(--bg-3);border:1px solid var(--line);
  border-radius:3px;padding:1px 4px;margin:0 2px;color:var(--ink-0)
}

/* selection marquee */
#marquee{
  position:absolute;z-index:7;border:1px solid var(--accent);
  background:var(--accent-ghost);pointer-events:none;display:none
}

/* --- right dock --------------------------------------------------------- */
#dock{
  grid-area:dock;width:var(--panel);display:flex;flex-direction:column;
  background:var(--bg-1);border-left:1px solid var(--line);z-index:20;min-height:0
}
#dock.collapsed{width:0;border-left:0;overflow:hidden}
.dock-tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg-2);flex:none}
.dock-tabs button{
  appearance:none;flex:1;background:none;border:0;padding:8px 4px;cursor:pointer;
  color:var(--ink-2);font-size:11.5px;font-weight:520;position:relative;transition:color var(--dur)
}
.dock-tabs button:hover{color:var(--ink-0)}
.dock-tabs button[aria-selected="true"]{color:var(--ink-0);background:var(--bg-1)}
.dock-tabs button[aria-selected="true"]::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)
}
.dock-body{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.dock-pane{display:none;padding:10px}
.dock-pane.active{display:block}

/* --- property sheet ----------------------------------------------------- */
.sect{margin-bottom:12px;border:1px solid var(--line-soft);border-radius:var(--r-m);overflow:hidden;background:var(--bg-2)}
.sect>summary{
  padding:7px 10px;cursor:pointer;font-size:11px;font-weight:640;color:var(--ink-1);
  text-transform:uppercase;letter-spacing:.55px;background:var(--bg-3);
  list-style:none;display:flex;align-items:center;gap:6px;user-select:none
}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary::before{
  content:"";width:0;height:0;border-left:4px solid var(--ink-2);
  border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
  transition:transform var(--dur);flex:none
}
.sect[open]>summary::before{transform:rotate(90deg)}
.sect>summary .badge{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.sect .body{padding:9px 10px}

.row{display:grid;grid-template-columns:104px 1fr;gap:7px;align-items:center;margin-bottom:6px}
.row:last-child{margin-bottom:0}
.row>label{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.wide{grid-template-columns:1fr}
.row.tri{grid-template-columns:104px 1fr 1fr 1fr;gap:5px}
.row .hint{grid-column:1/-1;font-size:10.5px;color:var(--ink-3);margin-top:-2px}

input[type=text],input[type=number],select,textarea{
  width:100%;padding:5px 8px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--bg-0);color:var(--ink-0);font-size:12px;transition:border-color var(--dur)
}
html[data-theme="light"] input[type=text],html[data-theme="light"] input[type=number],
html[data-theme="light"] select,html[data-theme="light"] textarea{background:#fff}
input[type=number]{font-family:var(--mono);text-align:right}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input[readonly]{color:var(--ink-2);background:var(--bg-1)}
input[type=range]{width:100%;accent-color:var(--accent);background:none;border:0;padding:0}
input[type=color]{width:100%;height:26px;padding:1px;background:var(--bg-0);border:1px solid var(--line);border-radius:var(--r-s)}
select{cursor:pointer}
textarea{resize:vertical;min-height:52px;font-family:var(--mono);font-size:11px;text-align:left}

.chk{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11.5px;color:var(--ink-1);user-select:none}
.chk input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;flex:none}
.chkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px 8px}

.dof6{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.dof6 button{
  appearance:none;padding:5px 0;border:1px solid var(--line);border-radius:var(--r-s);
  background:var(--bg-0);color:var(--ink-3);cursor:pointer;font-size:10px;
  font-family:var(--mono);transition:all var(--dur)
}
.dof6 button[aria-pressed="true"]{background:var(--accent-ghost);color:var(--accent);border-color:var(--accent-dim);font-weight:700}

.empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:12px;line-height:1.6}
.empty svg{width:34px;height:34px;opacity:.34;margin-bottom:8px}

/* --- tables ------------------------------------------------------------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line-soft);border-radius:var(--r-m);background:var(--bg-2)}
table.tbl{border-collapse:collapse;width:100%;font-size:11.5px}
table.tbl th{
  position:sticky;top:0;z-index:1;background:var(--bg-3);color:var(--ink-1);
  font-weight:620;text-align:left;padding:6px 8px;white-space:nowrap;
  border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px
}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--ink-0)}
table.tbl td{padding:4px 8px;border-bottom:1px solid var(--line-soft);white-space:nowrap;color:var(--ink-1)}
table.tbl td.num{font-family:var(--mono);text-align:right;color:var(--ink-0)}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover{background:var(--bg-3)}
table.tbl tbody tr.sel{background:var(--accent-ghost)}
table.tbl tbody tr.sel td{color:var(--ink-0)}
table.tbl tfoot td{padding:6px 8px;font-weight:640;color:var(--ink-0);background:var(--bg-3);border-top:1px solid var(--line)}
table.tbl input{padding:2px 5px;font-size:11px;border-radius:3px}

/* utilisation chips */
.util{display:inline-block;min-width:44px;padding:1px 6px;border-radius:3px;font-family:var(--mono);
  font-size:10.5px;text-align:center;font-weight:600}
.util.ok{background:rgba(78,201,139,.18);color:var(--ok)}
.util.warn{background:rgba(240,178,60,.18);color:var(--warn)}
.util.bad{background:rgba(242,100,90,.2);color:var(--bad)}

/* --- status bar --------------------------------------------------------- */
#status{
  grid-area:status;display:flex;align-items:center;gap:0;padding:0 10px;
  background:var(--bg-2);border-top:1px solid var(--line);
  font-size:11px;color:var(--ink-2);font-family:var(--mono);
  overflow-x:auto;scrollbar-width:none;white-space:nowrap;z-index:20
}
#status::-webkit-scrollbar{display:none}
#status .s{padding:0 10px;position:relative;flex:none}
#status .s + .s::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--line-soft)}
#status .s b{color:var(--ink-0);font-weight:600}
#status .grow{flex:1}
#status .s.ok b{color:var(--ok)} #status .s.warn b{color:var(--warn)} #status .s.bad b{color:var(--bad)}

/* --- modal / dialog ----------------------------------------------------- */
#modalhost{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
#modalhost.open{display:flex}
#modalhost .scrim{position:absolute;inset:0;background:rgba(6,9,13,.62);backdrop-filter:blur(3px)}
.dlg{
  position:relative;background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--shadow-3);max-width:min(880px,94vw);max-height:88vh;
  display:flex;flex-direction:column;min-width:min(420px,92vw)
}
.dlg header{
  display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex:none
}
.dlg header h3{margin:0;font-size:14.5px;font-weight:620}
.dlg header .sub{color:var(--ink-3);font-size:11.5px;margin-left:2px}
.dlg header .x{margin-left:auto}
.dlg .content{padding:16px;overflow-y:auto;min-height:0}
.dlg footer{
  display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;
  border-top:1px solid var(--line);flex:none;background:var(--bg-2);
  border-radius:0 0 var(--r-l) var(--r-l)
}
.dlg footer .left{margin-right:auto}

/* card grid (templates / welcome) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:11px}
.card{
  text-align:left;padding:13px;border-radius:var(--r-m);border:1px solid var(--line);
  background:var(--bg-2);cursor:pointer;transition:all var(--dur);color:inherit
}
.card:hover{border-color:var(--accent-dim);background:var(--bg-3);transform:translateY(-1px)}
.card .ic{width:30px;height:30px;color:var(--accent);margin-bottom:8px}
.card h5{margin:0 0 4px;font-size:12.5px;font-weight:620}
.card p{margin:0;font-size:11px;color:var(--ink-2);line-height:1.5}

/* --- toasts ------------------------------------------------------------- */
#toasts{position:fixed;bottom:calc(var(--status) + 12px);left:50%;transform:translateX(-50%);
  z-index:120;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:9px;padding:8px 15px;border-radius:999px;
  background:var(--bg-3);border:1px solid var(--line);box-shadow:var(--shadow-2);
  font-size:12.5px;color:var(--ink-0);animation:toastIn .2s ease;max-width:min(560px,90vw)
}
.toast.ok{border-color:var(--ok)} .toast.warn{border-color:var(--warn)} .toast.bad{border-color:var(--bad)}
.toast .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--accent)}
.toast.ok .dot{background:var(--ok)} .toast.warn .dot{background:var(--warn)} .toast.bad .dot{background:var(--bad)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* --- explain panel ------------------------------------------------------ */
.explain{
  border-left:2px solid var(--info);background:rgba(127,140,255,.07);
  padding:8px 10px;border-radius:0 var(--r-s) var(--r-s) 0;margin-bottom:9px;font-size:11.5px;
  color:var(--ink-1);line-height:1.6
}
.explain b{color:var(--ink-0)}
.explain .f{
  display:block;font-family:var(--mono);font-size:11px;color:var(--accent);
  background:var(--bg-0);padding:5px 8px;border-radius:var(--r-s);margin:6px 0;
  overflow-x:auto;white-space:pre
}
html[data-theme="light"] .explain .f{background:var(--bg-3)}
.disclaimer{
  border-left:2px solid var(--warn);background:rgba(240,178,60,.08);
  padding:8px 10px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:11px;
  color:var(--ink-1);line-height:1.55;margin-bottom:10px
}
.disclaimer b{color:var(--warn)}
.qmark{
  appearance:none;width:15px;height:15px;border-radius:50%;border:1px solid var(--line);
  background:var(--bg-3);color:var(--ink-2);font-size:9.5px;line-height:1;cursor:pointer;
  padding:0;flex:none;font-weight:700
}
.qmark:hover{border-color:var(--info);color:var(--info)}

/* --- guided tour -------------------------------------------------------- */
#tour{position:fixed;inset:0;z-index:110;display:none;pointer-events:none}
#tour.open{display:block}
#tour .spot{
  position:absolute;border-radius:var(--r-m);border:2px solid var(--accent);
  box-shadow:0 0 0 9999px rgba(6,9,13,.66);transition:all .28s cubic-bezier(.4,0,.2,1);pointer-events:none
}
#tour .bubble{
  position:absolute;max-width:314px;padding:14px 16px;border-radius:var(--r-m);
  background:var(--bg-2);border:1px solid var(--line);box-shadow:var(--shadow-3);
  pointer-events:auto;transition:all .28s cubic-bezier(.4,0,.2,1)
}
#tour .bubble h4{margin:0 0 6px;font-size:13.5px;font-weight:620}
#tour .bubble p{margin:0 0 11px;font-size:12px;color:var(--ink-1);line-height:1.6}
#tour .bubble .nav{display:flex;align-items:center;gap:8px}
#tour .bubble .step{font-size:11px;color:var(--ink-3);font-family:var(--mono);margin-right:auto}

/* --- self-test ---------------------------------------------------------- */
.test-row{
  display:grid;grid-template-columns:22px 1fr 96px 96px 62px;gap:9px;align-items:center;
  padding:5px 8px;border-bottom:1px solid var(--line-soft);font-size:11.5px
}
.test-row.head{font-weight:640;color:var(--ink-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
.test-row .st{font-size:13px;text-align:center;font-weight:700}
.test-row .st.p{color:var(--ok)} .test-row .st.f{color:var(--bad)}
.test-row .num{font-family:var(--mono);text-align:right;color:var(--ink-0);font-size:11px}
.test-row .err{font-family:var(--mono);text-align:right;font-size:10.5px;color:var(--ink-2)}
.test-row .nm{color:var(--ink-1);overflow:hidden;text-overflow:ellipsis}
.test-sum{
  display:flex;gap:16px;align-items:center;padding:10px 12px;margin-bottom:12px;
  border-radius:var(--r-m);background:var(--bg-2);border:1px solid var(--line);font-size:12.5px
}
.test-sum .big{font-size:19px;font-weight:700;font-family:var(--mono)}
.test-sum .big.p{color:var(--ok)} .test-sum .big.f{color:var(--bad)}

/* --- sheet / drafting output -------------------------------------------- */
#sheet-preview{background:#fff;color:#111;border-radius:var(--r-s);overflow:auto;max-height:60vh}
.dropzone{
  border:1.5px dashed var(--line);border-radius:var(--r-m);padding:24px;text-align:center;
  color:var(--ink-2);font-size:12px;transition:all var(--dur);cursor:pointer
}
.dropzone:hover,.dropzone.hot{border-color:var(--accent);background:var(--accent-ghost);color:var(--ink-0)}
.dropzone svg{width:26px;height:26px;opacity:.5;margin-bottom:7px}

/* --- boot / error screens ----------------------------------------------- */
#boot{
  position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;background:var(--bg-0);
  color:var(--ink-2);font-size:13px;text-align:center;padding:24px
}
#boot.hidden{display:none}
#boot .ring{
  width:32px;height:32px;border-radius:50%;border:2.5px solid var(--bg-4);
  border-top-color:var(--accent);animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
#boot .err{max-width:560px;line-height:1.65;color:var(--ink-1);text-align:left}
#boot .err h3{color:var(--bad);font-size:15px;margin:0 0 8px}
#boot .err code{
  font-family:var(--mono);font-size:11.5px;background:var(--bg-2);padding:1px 5px;
  border-radius:3px;color:var(--warn)
}

/* --- responsive --------------------------------------------------------- */
@media (max-width:1180px){
  :root{--panel:272px}
}
@media (max-width:900px){
  :root{--rail:46px;--panel:min(320px,86vw)}
  #dock{
    position:fixed;right:0;top:calc(var(--ribbon) + var(--tabs) + var(--cmd));bottom:var(--status);
    z-index:40;box-shadow:var(--shadow-3);transform:translateX(100%);
    transition:transform .22s cubic-bezier(.4,0,.2,1)
  }
  #dock.open{transform:none}
  #app{grid-template-columns:var(--rail) 1fr 0}
  #brand .proj{max-width:26vw}
}
@media (max-width:640px){
  :root{--ribbon:36px;--tabs:32px;--cmd:44px;--rail:44px;--status:24px}
  body{font-size:12.5px}
  #brand .logo span{display:none}
  #brand .proj{max-width:34vw}
  .tab{padding:0 11px;font-size:12px}
  #rail{flex-direction:row;grid-area:auto;width:100%;border-right:0;border-top:1px solid var(--line);
    overflow-x:auto;padding:4px 6px}
  #app{
    grid-template-rows:var(--ribbon) var(--tabs) var(--cmd) 1fr 50px var(--status);
    grid-template-columns:1fr;
    grid-template-areas:"brand" "tabs" "cmd" "stage" "rail" "status"
  }
  #dock{top:calc(var(--ribbon) + var(--tabs) + var(--cmd));bottom:calc(var(--status) + 50px)}
  .tool{width:40px;height:38px}
  .row{grid-template-columns:88px 1fr}
  .row.tri{grid-template-columns:88px 1fr 1fr 1fr}
  #vp-tl,#vp-tr,#vp-bl,#vp-br{gap:5px}
  #navcube{width:62px;height:62px}
  #legend{width:158px}
  #copyright{font-size:10.5px;left:9px;bottom:8px}
  .dlg{min-width:0;width:100%}
  .cards{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .test-row{grid-template-columns:20px 1fr 78px 78px;row-gap:2px}
  .test-row .err{grid-column:2/-1;text-align:left;color:var(--ink-3)}
  .test-row .nm{white-space:normal}
}
@media (max-width:420px){
  .cards{grid-template-columns:1fr}
  .chkgrid{grid-template-columns:repeat(2,1fr)}
  .test-row{grid-template-columns:20px 1fr 72px}
  .test-row .num:last-of-type{grid-column:2/-1;text-align:left}
}
@media (hover:none){
  .tool,.btn{min-height:38px}
  .dof6 button{padding:8px 0}
}

/* --- print -------------------------------------------------------------- */
@media print{
  #brand,#tabs,#ribbon,#rail,#dock,#status,#toasts,.vp-overlay,#tour{display:none!important}
  #app{position:static;display:block}
  #stage{position:static;height:auto}
  body{overflow:visible;background:#fff;color:#000}
  #print-sheet{display:block!important}
}
#print-sheet{display:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<!-- ====================== boot screen ====================== -->
<div id="boot"><div class="ring"></div><div id="boot-msg">Loading Structural Studio&hellip;</div></div>

<!-- A plain (non-module) watchdog. If the module script never runs - which is
     what happens when a school network or a content-security policy blocks the
     CDN that serves three.js - the loading spinner would otherwise turn forever.
     This turns that into an explanation and a fix. -->
<script>
window.__ssBooted = false;
(function(){
  var shown = false;
  function explain(detail){
    if(shown || window.__ssBooted) return;
    shown = true;
    var b = document.getElementById('boot');
    if(!b) return;
    b.innerHTML =
      '<div class="err">' +
      '<h3>The 3D engine could not be loaded</h3>' +
      'Structural Studio loads the three.js library from a content delivery network the ' +
      'first time it runs. Something on this network or page is blocking that request.' +
      '<br><br><b>What usually fixes it</b><br>' +
      '&bull; A school or office firewall blocking <code>cdn.jsdelivr.net</code> &mdash; try another network, ' +
      'or ask for that host to be allowed.<br>' +
      '&bull; A content-security policy on the hosting page. Embedding the app in its own ' +
      '<code>&lt;iframe&gt;</code> from a plain HTML file avoids the host page policy entirely.<br>' +
      '&bull; To run with no network at all, download three.js r185, put its <code>build/</code> and ' +
      '<code>examples/jsm/</code> folders beside this file, and point the import map at ' +
      '<code>./three/build/three.module.js</code>.' +
      (detail ? '<br><br><code>' + String(detail).slice(0,220) + '</code>' : '') +
      '</div>';
  }
  window.addEventListener('error', function(e){
    var t = e && e.target;
    if(t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) explain(t.src || t.href);
  }, true);
  setTimeout(function(){ explain(''); }, 15000);
})();
</script>

<script type="module">
/* ==========================================================================
   STRUCTURAL STUDIO
   A 3D structural modelling, analysis and drafting environment for
   architecture students.

   (c) Karam Al-Obaidi

   Base units held internally are strict SI-engineering:
       length  m          force   kN         moment  kNm
       stress  kPa        area    m2         inertia m4
   Library data is entered in the units the catalogues publish (mm, cm2, cm4,
   MPa) and converted once, at load, by LIB.
   ========================================================================== */

import * as THREE from 'three';
import { OrbitControls }  from 'three/addons/controls/OrbitControls.js';
import { OBJLoader }      from 'three/addons/loaders/OBJLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { Line2 }          from 'three/addons/lines/Line2.js';
import { LineMaterial }   from 'three/addons/lines/LineMaterial.js';
import { LineGeometry }   from 'three/addons/lines/LineGeometry.js';
import { LineSegments2 }  from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';

/* ==========================================================================
   3  UNITS
   ========================================================================== */
const U = (() => {
  const CM2 = 1e-4, CM4 = 1e-8, CM3 = 1e-6, MM = 1e-3, MPA = 1e3; // MPa -> kPa

  /** Round to n significant figures, keeping 0 as 0. */
  function sig(v, n = 4){
    if(!isFinite(v) || v === 0) return 0;
    const m = Math.pow(10, n - Math.floor(Math.log10(Math.abs(v))) - 1);
    return Math.round(v * m) / m;
  }
  /** Fixed-decimal string that never shows "-0". */
  function fx(v, d = 2){
    if(!isFinite(v)) return '—';
    const s = v.toFixed(d);
    return s === '-' + (0).toFixed(d) ? (0).toFixed(d) : s;
  }
  /** Compact engineering string: switches to exponent only when needed. */
  function eng(v, d = 2){
    if(!isFinite(v)) return '—';
    const a = Math.abs(v);
    if(a !== 0 && (a < 1e-3 || a >= 1e6)) return v.toExponential(d);
    return fx(v, a >= 100 ? Math.max(0, d - 1) : d);
  }
  /** Parse a user-typed number, tolerating commas, spaces and units. */
  function num(s, fallback = 0){
    if(typeof s === 'number') return isFinite(s) ? s : fallback;
    if(s == null) return fallback;
    const m = String(s).replace(/,/g, '.').match(/-?\d*\.?\d+(?:[eE][-+]?\d+)?/);
    return m ? parseFloat(m[0]) : fallback;
  }
  return Object.freeze({
    CM2, CM4, CM3, MM, MPA, sig, fx, eng, num,
    L:'m', F:'kN', M:'kNm', S:'kPa', Q:'kN/m²', W:'kN/m',
    /** Convert kPa back to MPa for display. */
    toMPa: v => v / 1e3,
    /** Format a length in mm for section labels. */
    mm: v => Math.round(v * 1e3)
  });
})();

/* ==========================================================================
   4-6  LIB - materials, sections, load presets
   ========================================================================== */
const LIB = (() => {

  /* --- Saint-Venant torsion constant of a solid rectangle --------------
     J = beta * h * b^3 with b the SHORTER side. beta from the classical
     table, log-interpolated on the aspect ratio. */
  const BETA = [[1,.1406],[1.5,.1958],[2,.229],[2.5,.249],[3,.263],
                [4,.281],[5,.291],[6,.299],[10,.312],[1e4,.3333]];
  function betaRect(ratio){
    const r = Math.max(1, ratio);
    for(let i = 0; i < BETA.length - 1; i++){
      const [r0,b0] = BETA[i], [r1,b1] = BETA[i+1];
      if(r <= r1) return b0 + (b1 - b0) * (r - r0) / (r1 - r0);
    }
    return .3333;
  }

  /* --- section property calculators (all inputs m, outputs SI) -------- */
  const props = {
    /** Solid rectangle, h deep (local y) x b wide (local z). */
    rect(h, b){
      const s = Math.min(h,b), l = Math.max(h,b);
      return { A:b*h, Iy:b*h*h*h/12, Iz:h*b*b*b/12,
               J:betaRect(l/s)*l*s*s*s, Wely:b*h*h/6, Welz:h*b*b/6, h, b };
    },
    /** Solid circle of diameter d. */
    circle(d){
      const I = Math.PI*Math.pow(d,4)/64;
      return { A:Math.PI*d*d/4, Iy:I, Iz:I, J:2*I,
               Wely:I/(d/2), Welz:I/(d/2), h:d, b:d };
    },
    /** Circular hollow section, outer D, wall t. */
    chs(D, t){
      const d = D - 2*t, I = Math.PI*(Math.pow(D,4) - Math.pow(d,4))/64;
      return { A:Math.PI*(D*D - d*d)/4, Iy:I, Iz:I, J:2*I,
               Wely:I/(D/2), Welz:I/(D/2), h:D, b:D };
    },
    /** Rectangular/square hollow section, h x b, wall t.
        Closed thin-wall torsion: J = 4*Am^2*t/p (Bredt). */
    rhs(h, b, t){
      const hi = h - 2*t, bi = b - 2*t;
      const Iy = (b*h**3 - bi*hi**3)/12, Iz = (h*b**3 - hi*bi**3)/12;
      const Am = (h - t)*(b - t), p = 2*((h - t) + (b - t));
      return { A:b*h - bi*hi, Iy, Iz, J:4*Am*Am*t/p,
               Wely:Iy/(h/2), Welz:Iz/(b/2), h, b };
    }
  };

  /* --- materials ------------------------------------------------------
     E, G in MPa (converted to kPa); density in kN/m3; fy/fc in MPa.
     gammaM is the partial factor used by the simplified design check. */
  const MATERIALS = [
    // id, name, family, E(MPa), nu, density(kN/m3), fy(MPa), gammaM
    ['S235','Steel S235','steel',210000,0.30,78.5,235,1.00],
    ['S275','Steel S275','steel',210000,0.30,78.5,275,1.00],
    ['S355','Steel S355','steel',210000,0.30,78.5,355,1.00],
    ['C20','Concrete C20/25','concrete',30000,0.20,25.0,20,1.50],
    ['C25','Concrete C25/30','concrete',31000,0.20,25.0,25,1.50],
    ['C30','Concrete C30/37','concrete',33000,0.20,25.0,30,1.50],
    ['C35','Concrete C35/45','concrete',34000,0.20,25.0,35,1.50],
    ['C40','Concrete C40/50','concrete',35000,0.20,25.0,40,1.50],
    ['C50','Concrete C50/60','concrete',37000,0.20,25.0,50,1.50],
    ['GL24','Glulam GL24h','timber',11500,0.30,4.00,24,1.25],
    ['GL28','Glulam GL28h','timber',12600,0.30,4.20,28,1.25],
    ['C24','Sawn timber C24','timber',11000,0.30,4.20,24,1.30],
    ['CLT','CLT (C24 lamellae)','timber',11000,0.30,4.80,24,1.25],
    ['MAS5','Masonry fk 5 MPa','masonry',5000,0.20,19.0,5,2.00],
    ['MAS10','Masonry fk 10 MPa','masonry',8000,0.20,20.0,10,2.00]
  ].map(([id,name,family,E,nu,density,fy,gammaM]) => ({
    id, name, family,
    E: E * U.MPA,                 // kPa
    G: (E / (2*(1 + nu))) * U.MPA,// kPa
    nu, density,                  // kN/m3
    fy: fy * U.MPA,               // kPa - yield (steel) / fck (concrete) / fmk (timber) / fk (masonry)
    gammaM,
    /** Design strength used by DESIGN, kPa. */
    get fd(){ return this.fy / this.gammaM; }
  }));

  const MAT = Object.fromEntries(MATERIALS.map(m => [m.id, m]));

  /* ======================================================================
     AXIS NAMING - read this before touching any second moment of area.

     Throughout LIB, `Iy` and `Iz` follow the EUROCODE convention:
         Iy = STRONG axis  (bending about y-y, the axis parallel to the
                            flanges of an I-section; the big number)
         Iz = WEAK axis    (bending about z-z, through the web)

     The 3D frame ELEMENT convention is different: there, `Iz` governs
     bending in the local x-y plane and `Iy` governs the local x-z plane.
     Because the up-vector rule gives a normally oriented horizontal beam
     local y = global up, gravity bending of that beam happens in the local
     x-y plane and is therefore governed by the ELEMENT's Iz.

     So the catalogue strong axis must feed the element's Iz:

         element Iz  <-  catalogue Iy   (strong)
         element Iy  <-  catalogue Iz   (weak)

     That swap happens in exactly ONE place: FEM.sectionToLocal().
     Nothing else in the app may reorder these. Benchmark 11 asserts the
     resulting stiffness ratio numerically.
     ====================================================================== */

  /* --- rolled steel catalogue -----------------------------------------
     [name, h(mm), b(mm), tw(mm), tf(mm), A(cm2), Iy(cm4), Iz(cm4),
      Wely(cm3), Welz(cm3), It(cm4)]  - EN 10365 / Euronorm values. */
  const IPE = [
    ['IPE 80',80,46,3.8,5.2,7.64,80.1,8.49,20.0,3.69,0.70],
    ['IPE 100',100,55,4.1,5.7,10.3,171,15.9,34.2,5.79,1.20],
    ['IPE 120',120,64,4.4,6.3,13.2,318,27.7,53.0,8.65,1.74],
    ['IPE 140',140,73,4.7,6.9,16.4,541,44.9,77.3,12.3,2.45],
    ['IPE 160',160,82,5.0,7.4,20.1,869,68.3,109,16.7,3.60],
    ['IPE 180',180,91,5.3,8.0,23.9,1317,101,146,22.2,4.79],
    ['IPE 200',200,100,5.6,8.5,28.5,1943,142,194,28.5,6.98],
    ['IPE 220',220,110,5.9,9.2,33.4,2772,205,252,37.3,9.07],
    ['IPE 240',240,120,6.2,9.8,39.1,3892,284,324,47.3,12.9],
    ['IPE 270',270,135,6.6,10.2,45.9,5790,420,429,62.2,15.9],
    ['IPE 300',300,150,7.1,10.7,53.8,8356,604,557,80.5,20.1],
    ['IPE 330',330,160,7.5,11.5,62.6,11770,788,713,98.5,28.1],
    ['IPE 360',360,170,8.0,12.7,72.7,16270,1043,904,123,37.3],
    ['IPE 400',400,180,8.6,13.5,84.5,23130,1318,1156,146,51.1],
    ['IPE 450',450,190,9.4,14.6,98.8,33740,1676,1500,176,66.9],
    ['IPE 500',500,200,10.2,16.0,116,48200,2142,1928,214,89.3],
    ['IPE 550',550,210,11.1,17.2,134,67120,2668,2441,254,123],
    ['IPE 600',600,220,12.0,19.0,156,92080,3387,3069,308,165]
  ];
  const HEA = [
    ['HEA 100',96,100,5.0,8.0,21.2,349,134,72.8,26.8,5.24],
    ['HEA 120',114,120,5.0,8.0,25.3,606,231,106,38.5,5.99],
    ['HEA 140',133,140,5.5,8.5,31.4,1033,389,155,55.6,8.13],
    ['HEA 160',152,160,6.0,9.0,38.8,1673,616,220,76.9,12.2],
    ['HEA 180',171,180,6.0,9.5,45.3,2510,925,294,103,14.8],
    ['HEA 200',190,200,6.5,10.0,53.8,3692,1336,389,134,21.0],
    ['HEA 220',210,220,7.0,11.0,64.3,5410,1955,515,178,28.5],
    ['HEA 240',230,240,7.5,12.0,76.8,7763,2769,675,231,41.6],
    ['HEA 260',250,260,7.5,12.5,86.8,10450,3668,836,282,52.4],
    ['HEA 280',270,280,8.0,13.0,97.3,13670,4763,1013,340,62.1],
    ['HEA 300',290,300,8.5,14.0,112.5,18260,6310,1260,421,85.2],
    ['HEA 320',310,300,9.0,15.5,124.4,22930,6985,1479,466,108],
    ['HEA 340',330,300,9.5,16.5,133.5,27690,7436,1678,496,127],
    ['HEA 360',350,300,10.0,17.5,142.8,33090,7887,1891,526,149],
    ['HEA 400',390,300,11.0,19.0,159,45070,8564,2311,571,189],
    ['HEA 450',440,300,11.5,21.0,178,63720,9465,2896,631,244],
    ['HEA 500',490,300,12.0,23.0,197.5,86970,10370,3550,691,309],
    ['HEA 550',540,300,12.5,24.0,211.8,111900,10820,4146,721,352],
    ['HEA 600',590,300,13.0,25.0,226.5,141200,11270,4787,751,398]
  ];
  const HEB = [
    ['HEB 100',100,100,6.0,10.0,26.0,450,167,89.9,33.5,9.25],
    ['HEB 120',120,120,6.5,11.0,34.0,864,318,144,52.9,13.8],
    ['HEB 140',140,140,7.0,12.0,43.0,1509,550,216,78.5,20.1],
    ['HEB 160',160,160,8.0,13.0,54.3,2492,889,311,111,31.2],
    ['HEB 180',180,180,8.5,14.0,65.3,3831,1363,426,151,42.2],
    ['HEB 200',200,200,9.0,15.0,78.1,5696,2003,570,200,59.3],
    ['HEB 220',220,220,9.5,16.0,91.0,8091,2843,736,258,76.6],
    ['HEB 240',240,240,10.0,17.0,106,11260,3923,938,327,103],
    ['HEB 260',260,260,10.0,17.5,118.4,14920,5135,1148,395,124],
    ['HEB 280',280,280,10.5,18.0,131.4,19270,6595,1376,471,144],
    ['HEB 300',300,300,11.0,19.0,149.1,25170,8563,1678,571,185],
    ['HEB 320',320,300,11.5,20.5,161.3,30820,9239,1926,616,225],
    ['HEB 340',340,300,12.0,21.5,170.9,36660,9690,2156,646,257],
    ['HEB 360',360,300,12.5,22.5,180.6,43190,10140,2400,676,292],
    ['HEB 400',400,300,13.5,24.0,197.8,57680,10820,2884,721,356],
    ['HEB 450',450,300,14.0,26.0,218,79890,11720,3551,781,440],
    ['HEB 500',500,300,14.5,28.0,238.6,107200,12620,4287,842,538],
    ['HEB 550',550,300,15.0,29.0,254.1,136700,13080,4971,872,600],
    ['HEB 600',600,300,15.5,30.0,270,171000,13530,5701,902,667]
  ];

  function rolled(rows, shape){
    return rows.map(([name,h,b,tw,tf,A,Iy,Iz,Wely,Welz,It]) => ({
      id:name.replace(/\s+/g,''), name, family:'steel', shape,
      h:h*U.MM, b:b*U.MM, tw:tw*U.MM, tf:tf*U.MM,
      A:A*U.CM2, Iy:Iy*U.CM4, Iz:Iz*U.CM4, J:It*U.CM4,
      Wely:Wely*U.CM3, Welz:Welz*U.CM3,
      defaultMat:'S275'
    }));
  }

  /** Build a parametric section entry from a props.* result. */
  function make(id, name, family, shape, p, defaultMat, extra){
    return Object.assign({ id, name, family, shape, defaultMat }, p, extra || {});
  }

  const SECTIONS = [];
  SECTIONS.push(...rolled(IPE,'I'), ...rolled(HEA,'I'), ...rolled(HEB,'I'));

  // Square + rectangular hollow sections (hot finished)
  for(const [h,b,t] of [[80,80,4],[100,100,5],[120,120,5],[150,150,6],[200,200,8],
                        [250,250,8],[300,300,10],[150,100,6],[200,100,6],
                        [250,150,8],[300,200,8],[400,200,10]]){
    const id = `SHS${h}x${b}x${t}`, nm = (h===b?`SHS ${h}×${h}×${t}`:`RHS ${h}×${b}×${t}`);
    SECTIONS.push(make(id, nm, 'steel', 'hollow',
      props.rhs(h*U.MM, b*U.MM, t*U.MM), 'S355', { t:t*U.MM }));
  }
  // Circular hollow sections
  for(const [D,t] of [[76.1,3.2],[88.9,4],[114.3,4],[139.7,5],[168.3,6],
                      [219.1,6.3],[273,8],[323.9,8]]){
    SECTIONS.push(make(`CHS${D}x${t}`, `CHS ${D}×${t}`, 'steel', 'pipe',
      props.chs(D*U.MM, t*U.MM), 'S355', { t:t*U.MM }));
  }
  // Reinforced concrete rectangles
  for(const [b,h] of [[200,400],[250,400],[250,500],[300,500],[300,600],
                      [350,700],[400,600],[400,800],[300,300],[400,400],[500,500]]){
    SECTIONS.push(make(`RC${b}x${h}`, `RC ${b}×${h}`, 'concrete', 'rect',
      props.rect(h*U.MM, b*U.MM), 'C30'));
  }
  // Circular concrete columns
  for(const D of [300,400,500,600]){
    SECTIONS.push(make(`RCD${D}`, `RC Ø${D}`, 'concrete', 'round',
      props.circle(D*U.MM), 'C30'));
  }
  // Glulam
  for(const [b,h] of [[100,200],[100,300],[115,400],[140,400],[140,600],
                      [160,600],[200,600],[200,800]]){
    SECTIONS.push(make(`GL${b}x${h}`, `Glulam ${b}×${h}`, 'timber', 'rect',
      props.rect(h*U.MM, b*U.MM), 'GL24'));
  }
  // Sawn timber
  for(const [b,h] of [[47,150],[47,200],[63,200],[75,225],[100,250]]){
    SECTIONS.push(make(`TS${b}x${h}`, `Timber ${b}×${h}`, 'timber', 'rect',
      props.rect(h*U.MM, b*U.MM), 'C24'));
  }
  // CLT panel strips (1 m wide, used as wall / deep beam strips)
  for(const t of [100,140,200]){
    SECTIONS.push(make(`CLT${t}`, `CLT ${t} (per m)`, 'timber', 'rect',
      props.rect(t*U.MM, 1.0), 'CLT'));
  }
  // Masonry wall strips (1 m run)
  for(const t of [100,140,215,300]){
    SECTIONS.push(make(`MW${t}`, `Masonry ${t} (per m)`, 'masonry', 'rect',
      props.rect(t*U.MM, 1.0), 'MAS5'));
  }

  const SEC = Object.fromEntries(SECTIONS.map(s => [s.id, s]));

  /* --- imposed load presets, EN 1991-1-1 Table 6.2 (kN/m2) ------------- */
  const IMPOSED = [
    ['A-res','A – Residential / domestic',2.0],
    ['A-stair','A – Stairs, residential',3.0],
    ['A-balc','A – Balconies',3.0],
    ['B-off','B – Offices',3.0],
    ['C1','C1 – Tables, cafés, restaurants',3.0],
    ['C2','C2 – Fixed seating',4.0],
    ['C3','C3 – Circulation, no obstacles',5.0],
    ['C4','C4 – Physical activity',5.0],
    ['C5','C5 – Susceptible to crowds',5.0],
    ['D1','D1 – Retail',4.0],
    ['D2','D2 – Department stores',5.0],
    ['E1','E1 – Storage',7.5],
    ['H','H – Roof, not accessible',0.6],
    ['I','I – Roof, accessible (as A–D)',2.0]
  ].map(([id,name,q]) => ({ id, name, q }));

  /* --- superimposed dead load presets (kN/m2) -------------------------- */
  const SDL = [
    ['fin-light','Finishes, light (carpet/vinyl)',0.5],
    ['fin-screed','Screed 50 mm + finishes',1.5],
    ['ceil','Ceiling + services',0.5],
    ['part','Movable partitions',1.0],
    ['roof-flat','Flat roof build-up + insulation',1.5],
    ['roof-tile','Pitched roof, tiles + battens',0.9],
    ['deck','Metal deck + 65 mm topping',2.2]
  ].map(([id,name,q]) => ({ id, name, q }));

  /* --- typical slab / deck build-ups ----------------------------------- */
  const DECKS = [
    ['rc150','RC slab 150 mm','C30',0.150],
    ['rc200','RC slab 200 mm','C30',0.200],
    ['rc250','RC slab 250 mm','C30',0.250],
    ['clt140','CLT 140 mm','CLT',0.140],
    ['clt200','CLT 200 mm','CLT',0.200],
    ['deck130','Composite deck 130 mm','C30',0.130]
  ].map(([id,name,mat,t]) => ({ id, name, mat, t }));

  /* --- seismic behaviour factors (ASCE 7 style R, for the ELF option) --- */
  const SEISMIC_R = [
    ['steel-mrf','Steel moment frame',8.0,0.0724,0.8],
    ['rc-mrf','RC moment frame',8.0,0.0466,0.9],
    ['rc-wall','RC shear wall',6.0,0.0488,0.75],
    ['cbf','Concentrically braced frame',6.0,0.0488,0.75],
    ['timber-wall','Timber shear wall',6.5,0.0488,0.75],
    ['masonry','Masonry bearing wall',2.0,0.0488,0.75]
  ].map(([id,name,R,Ct,x]) => ({ id, name, R, Ct, x }));

  /** Sections offered for a given structural role, ordered by depth. */
  function forRole(role, family){
    return SECTIONS.filter(s => {
      if(family && s.family !== family) return false;
      if(role === 'column') return s.shape !== 'I' || s.id.startsWith('HEB') || s.id.startsWith('HEA');
      return true;
    });
  }

  return Object.freeze({
    MATERIALS, MAT, SECTIONS, SEC, IMPOSED, SDL, DECKS, SEISMIC_R,
    props, betaRect, forRole,
    families: ['steel','concrete','timber','masonry'],
    familyLabel: { steel:'Steel', concrete:'Reinforced concrete',
                   timber:'Timber', masonry:'Masonry' }
  });
})();

/* ==========================================================================
   7  UTIL - tiny helpers shared by everything below
   ========================================================================== */
const Util = (() => {
  let seq = 0;
  const id = p => `${p}${(++seq).toString(36)}${Math.floor(performance.now()*7 % 1296).toString(36)}`;
  const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
  const lerp  = (a,b,t) => a + (b-a)*t;
  const near  = (a,b,t=1e-9) => Math.abs(a-b) <= t;
  const uniq  = a => [...new Set(a)];
  const sum   = a => a.reduce((s,v) => s+v, 0);
  function debounce(fn, ms){
    let t; const f = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
    f.cancel = () => clearTimeout(t); return f;
  }
  /** Deep clone that tolerates browsers without structuredClone. */
  const clone = typeof structuredClone === 'function'
    ? o => structuredClone(o)
    : o => JSON.parse(JSON.stringify(o));
  /** Escape for safe insertion as HTML text. */
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  return { id, clamp, lerp, near, uniq, sum, debounce, clone, esc,
           get seq(){ return seq }, set seq(v){ seq = v } };
})();

/** Minimal synchronous event bus. */
const Bus = (() => {
  const m = new Map();
  return {
    on(k, fn){ (m.get(k) || m.set(k, new Set()).get(k)).add(fn); return () => m.get(k).delete(fn); },
    off(k, fn){ m.get(k)?.delete(fn); },
    emit(k, payload){ m.get(k)?.forEach(fn => { try { fn(payload); } catch(e){ console.error(k, e); } }); }
  };
})();

/* ==========================================================================
   8  GEOM - 2D polygon toolkit used by slabs, takedown and drafting.
       All 2D points are [x, z] plan pairs. Y never appears here.
   ========================================================================== */
const Geom = (() => {
  const EPS = 1e-9;

  const sub = (a,b) => [a[0]-b[0], a[1]-b[1]];
  const dot = (a,b) => a[0]*b[0] + a[1]*b[1];
  const cross = (a,b) => a[0]*b[1] - a[1]*b[0];
  const len = a => Math.hypot(a[0], a[1]);
  const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const norm = a => { const l = len(a) || 1; return [a[0]/l, a[1]/l]; };
  const lerp2 = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];

  /** Signed area; positive when the ring winds counter-clockwise. */
  function signedArea(poly){
    let s = 0;
    for(let i = 0, n = poly.length; i < n; i++){
      const a = poly[i], b = poly[(i+1)%n];
      s += a[0]*b[1] - b[0]*a[1];
    }
    return s/2;
  }
  const area = poly => Math.abs(signedArea(poly));
  const ccw  = poly => signedArea(poly) >= 0 ? poly : poly.slice().reverse();

  function centroid(poly){
    let a = 0, cx = 0, cz = 0;
    for(let i = 0, n = poly.length; i < n; i++){
      const p = poly[i], q = poly[(i+1)%n], f = p[0]*q[1] - q[0]*p[1];
      a += f; cx += (p[0]+q[0])*f; cz += (p[1]+q[1])*f;
    }
    a *= 0.5;
    if(Math.abs(a) < EPS){ // degenerate - fall back to the vertex mean
      const n = poly.length || 1;
      return [Util.sum(poly.map(p=>p[0]))/n, Util.sum(poly.map(p=>p[1]))/n];
    }
    return [cx/(6*a), cz/(6*a)];
  }

  function bbox(poly){
    let x0 = Infinity, z0 = Infinity, x1 = -Infinity, z1 = -Infinity;
    for(const p of poly){
      if(p[0] < x0) x0 = p[0]; if(p[0] > x1) x1 = p[0];
      if(p[1] < z0) z0 = p[1]; if(p[1] > z1) z1 = p[1];
    }
    return { x0, z0, x1, z1, w:x1-x0, d:z1-z0 };
  }

  /** Ray-casting point-in-polygon; boundary counts as inside. */
  function inside(poly, p){
    let hit = false;
    for(let i = 0, j = poly.length-1; i < poly.length; j = i++){
      const a = poly[i], b = poly[j];
      if(distToSeg(p, a, b) < 1e-9) return true;
      if((a[1] > p[1]) !== (b[1] > p[1]) &&
         p[0] < (b[0]-a[0]) * (p[1]-a[1]) / (b[1]-a[1]) + a[0]) hit = !hit;
    }
    return hit;
  }

  function distToSeg(p, a, b){
    const ab = sub(b,a), ap = sub(p,a), L2 = dot(ab,ab);
    if(L2 < EPS) return dist(p,a);
    const t = Util.clamp(dot(ap,ab)/L2, 0, 1);
    return dist(p, [a[0]+ab[0]*t, a[1]+ab[1]*t]);
  }

  /** Closest parameter t in [0,1] of p projected onto segment a-b. */
  function paramOnSeg(p, a, b){
    const ab = sub(b,a), L2 = dot(ab,ab);
    if(L2 < EPS) return 0;
    return Util.clamp(dot(sub(p,a), ab)/L2, 0, 1);
  }

  /** Intersection of two infinite lines, or null when parallel. */
  function lineLine(p, pd, q, qd){
    const d = cross(pd, qd);
    if(Math.abs(d) < 1e-12) return null;
    const t = cross(sub(q,p), qd)/d;
    return [p[0] + pd[0]*t, p[1] + pd[1]*t];
  }

  /** Intersection of two segments, or null. */
  function segSeg(a, b, c, d){
    const r = sub(b,a), s = sub(d,c), den = cross(r,s);
    if(Math.abs(den) < 1e-12) return null;
    const t = cross(sub(c,a), s)/den, u = cross(sub(c,a), r)/den;
    if(t < -1e-9 || t > 1+1e-9 || u < -1e-9 || u > 1+1e-9) return null;
    return [a[0] + r[0]*t, a[1] + r[1]*t];
  }

  /** Sutherland-Hodgman clip of poly against the half-plane left of p->dir. */
  function clipHalf(poly, p, dir){
    if(!poly.length) return [];
    const out = [];
    const side = q => cross(dir, sub(q,p));   // > 0 : left
    for(let i = 0, n = poly.length; i < n; i++){
      const a = poly[i], b = poly[(i+1)%n], sa = side(a), sb = side(b);
      if(sa >= -EPS) out.push(a);
      if((sa > EPS && sb < -EPS) || (sa < -EPS && sb > EPS)){
        const t = sa / (sa - sb);
        out.push(lerp2(a, b, t));
      }
    }
    return dedupe(out);
  }

  function dedupe(poly, tol = 1e-7){
    const out = [];
    for(const p of poly){
      const q = out[out.length-1];
      if(!q || dist(p,q) > tol) out.push(p);
    }
    while(out.length > 1 && dist(out[0], out[out.length-1]) < tol) out.pop();
    return out;
  }

  /** Split a polygon by an infinite line; returns 1 or 2 rings. */
  function splitByLine(poly, p, dir){
    const L = clipHalf(poly, p, dir);
    const R = clipHalf(poly, p, [-dir[0], -dir[1]]);
    const out = [];
    if(L.length >= 3 && area(L) > 1e-7) out.push(L);
    if(R.length >= 3 && area(R) > 1e-7) out.push(R);
    return out.length ? out : [poly];
  }

  /** Andrew monotone-chain convex hull. */
  function hull(pts){
    if(pts.length < 4) return pts.slice();
    const P = pts.slice().sort((a,b) => a[0]-b[0] || a[1]-b[1]);
    const half = src => {
      const h = [];
      for(const p of src){
        while(h.length >= 2 && cross(sub(h[h.length-1], h[h.length-2]), sub(p, h[h.length-2])) <= 0) h.pop();
        h.push(p);
      }
      h.pop(); return h;
    };
    return half(P).concat(half(P.reverse()));
  }

  /** Minimum-area enclosing rectangle by rotating calipers over the hull.
      Returns the rectangle corners plus its two side lengths and rotation. */
  function minAreaRect(pts){
    const H = hull(pts);
    if(H.length < 3){
      const bb = bbox(pts);
      return { corners:[[bb.x0,bb.z0],[bb.x1,bb.z0],[bb.x1,bb.z1],[bb.x0,bb.z1]],
               w:bb.w, d:bb.d, angle:0, axis:[1,0] };
    }
    let best = null;
    for(let i = 0, n = H.length; i < n; i++){
      const e = norm(sub(H[(i+1)%n], H[i]));
      const f = [-e[1], e[0]];
      let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
      for(const q of H){
        const r = sub(q, H[i]), u = dot(r,e), v = dot(r,f);
        if(u < u0) u0 = u; if(u > u1) u1 = u;
        if(v < v0) v0 = v; if(v > v1) v1 = v;
      }
      const w = u1-u0, d = v1-v0, a = w*d;
      if(!best || a < best.a){
        const o = H[i];
        const P = (u,v) => [o[0] + e[0]*u + f[0]*v, o[1] + e[1]*u + f[1]*v];
        best = { a, w, d, axis:e,
                 corners:[P(u0,v0), P(u1,v0), P(u1,v1), P(u0,v1)],
                 angle:Math.atan2(e[1], e[0]) };
      }
    }
    return best;
  }

  /** Ear-clipping triangulation of a simple ring; returns index triples. */
  function triangulate(poly){
    const n = poly.length;
    if(n < 3) return [];
    const idx = ccw(poly) === poly ? [...poly.keys()] : [...poly.keys()].reverse();
    const V = idx.slice(), tris = [];
    let guard = 0;
    while(V.length > 3 && guard++ < 4*n){
      let clipped = false;
      for(let i = 0; i < V.length; i++){
        const a = poly[V[(i+V.length-1)%V.length]], b = poly[V[i]], c = poly[V[(i+1)%V.length]];
        if(cross(sub(b,a), sub(c,b)) <= 0) continue;              // reflex
        let ok = true;
        for(let j = 0; j < V.length; j++){
          const p = poly[V[j]];
          if(p === a || p === b || p === c) continue;
          if(inTri(p,a,b,c)){ ok = false; break; }
        }
        if(!ok) continue;
        tris.push([V[(i+V.length-1)%V.length], V[i], V[(i+1)%V.length]]);
        V.splice(i,1); clipped = true; break;
      }
      if(!clipped) break;
    }
    if(V.length === 3) tris.push([V[0], V[1], V[2]]);
    return tris;
  }
  function inTri(p,a,b,c){
    const d1 = cross(sub(b,a), sub(p,a)), d2 = cross(sub(c,b), sub(p,b)), d3 = cross(sub(a,c), sub(p,c));
    const neg = (d1 < 0) || (d2 < 0) || (d3 < 0), pos = (d1 > 0) || (d2 > 0) || (d3 > 0);
    return !(neg && pos);
  }

  /** Offset a convex-ish ring inward by d (used for yield-line skeletons). */
  function shrinkRect(corners, d){
    const c = centroid(corners);
    return corners.map(p => {
      const v = sub(p, c), L = len(v) || 1;
      const k = Math.max(0, L - d) / L;
      return [c[0] + v[0]*k, c[1] + v[1]*k];
    });
  }

  return { EPS, sub, dot, cross, len, dist, norm, lerp2, signedArea, area, ccw,
           centroid, bbox, inside, distToSeg, paramOnSeg, lineLine, segSeg,
           clipHalf, dedupe, splitByLine, hull, minAreaRect, triangulate, shrinkRect };
})();

/* ==========================================================================
   9  MODEL - document schema, factories, validation, (de)serialisation
   ========================================================================== */
const DOC_VERSION = 1;

const Model = (() => {

  const SUPPORTS = {
    free:   [0,0,0,0,0,0],
    pinned: [1,1,1,0,0,0],
    fixed:  [1,1,1,1,1,1],
    rollerX:[0,1,0,0,0,0],   // free to slide in global X
    rollerZ:[0,1,0,0,0,0],
    slider: [0,1,1,0,0,0]
  };
  const RELEASES = {
    rigid:  [0,0,0,0,0,0],
    pinned: [0,0,0,0,1,1],   // moment free about both bending axes
    shear:  [0,0,0,0,0,1]
  };
  const DOF_NAMES = ['Fx','Fy','Fz','Mx','My','Mz'];

  function emptyDoc(name = 'Untitled Project'){
    return {
      format:'structural-studio', version:DOC_VERSION, app:'1.0.0',
      savedAt:new Date().toISOString(),
      meta:{ name, author:'', course:'', notes:'', units:'SI', code:'EN' },
      settings:{
        gridSnap:0.25, mergeTol:0.005, dofWarn:1200, dofCap:3000,
        qAllowSoil:150, deflLimit:250, liveAnalysis:false, shearDeform:false
      },
      levels:[], grids:[],
      physical:{ members:[], slabs:[], walls:[], footings:[] },
      analytical:{ nodes:[], members:[], links:[], panels:[], stamp:0 },
      loads:{ cases:[], nodal:[], member:[], area:[], combos:[], activeCombo:null },
      views:{ camera:null, style:'shaded', modelMode:'both', resultMode:'none',
              deformScale:'auto', activeLevel:null,
              show:{ grids:true, levels:true, loads:true, supports:true,
                     // numeric load labels are off by default: on a real
                     // building they outnumber everything else several times
                     // over and bury the model
                     labels:{ grid:true, node:false, section:false, load:false,
                              level:true, result:true, dim:true } } },
      underlays:[]
    };
  }

  /* --- factories -------------------------------------------------------
     `only` strips keys whose value is undefined before they are merged over
     the defaults. Without it, passing `{ id: undefined }` — which regeneration
     does whenever there is no previous member to reuse — would overwrite the
     freshly generated id with undefined, and every downstream lookup by id
     would silently resolve to the wrong object. */
  const only = o => {
    if(!o) return {};
    const out = {};
    for(const k in o) if(o[k] !== undefined) out[k] = o[k];
    return out;
  };

  const mk = {
    level: (name, elevation) => ({ id:Util.id('L'), name, elevation, planVisible:true }),
    grid:  (label, p0, p1, axis) => ({ id:Util.id('G'), label, p0, p1, axis:axis||'free', bubble:'both' }),
    member:(o) => Object.assign({
      id:Util.id('M'), role:'beam', sectionId:'IPE300', materialId:'S275',
      start:[0,0,0], end:[1,0,0], roll:0, justification:'centroid',
      offsetStart:[0,0,0], offsetEnd:[0,0,0],
      levelId:null, tag:'', analysisClass:'primary',
      relI:RELEASES.rigid.slice(), relJ:RELEASES.rigid.slice(),
      analyticalId:null, assoc:'auto'
    }, only(o)),
    slab: (o) => Object.assign({
      id:Util.id('S'), levelId:null, boundary:[], openings:[],
      thickness:0.20, materialId:'C30',
      spanMode:'auto', spanAngle:0, category:'B-off', sdl:1.5, imposed:3.0
    }, only(o)),
    wall: (o) => Object.assign({
      id:Util.id('W'), levelId:null, p0:[0,0], p1:[1,0], baseOffset:0,
      height:3.0, thickness:0.20, materialId:'MAS5', role:'loadbearing', sdl:0
    }, only(o)),
    footing:(o) => Object.assign({
      id:Util.id('F'), nodeId:null, type:'pad', B:1.5, L:1.5, D:0.45,
      topLevel:-0.5, materialId:'C30', N_sls:0, N_uls:0,
      qAllow:150, util:0, auto:true
    }, only(o)),
    node: (p, o) => Object.assign({
      id:Util.id('N'), p:p.slice(), support:SUPPORTS.free.slice(),
      spring:null, physicalRef:null, tag:''
    }, only(o)),
    amember:(i, j, o) => Object.assign({
      id:Util.id('AM'), i, j, sectionId:'IPE300', materialId:'S275', roll:0,
      relI:RELEASES.rigid.slice(), relJ:RELEASES.rigid.slice(),
      offI:[0,0,0], offJ:[0,0,0], role:'beam', active:true, physicalRef:null
    }, only(o)),
    panel:(o) => Object.assign({
      id:Util.id('P'), nodeIds:[], boundary:[], levelId:null,
      thickness:0.2, materialId:'C30', loadOnly:true, physicalRef:null
    }, only(o)),
    loadCase:(name, type, o) => Object.assign({
      id:Util.id('LC'), name, type, selfWeight:type === 'DEAD'
    }, only(o)),
    combo:(name, terms, limitState) => ({
      id:Util.id('CB'), name, terms, limitState:limitState||'ULS', active:true
    }),
    memberLoad:(o) => Object.assign({
      id:Util.id('ML'), caseId:null, memberId:null, kind:'udl',
      dir:'GY', w1:0, w2:0, a:0, b:null, source:'user', sourceRef:null
    }, only(o)),
    nodalLoad:(o) => Object.assign({
      id:Util.id('NL'), caseId:null, nodeId:null,
      Fx:0, Fy:0, Fz:0, Mx:0, My:0, Mz:0
    }, only(o)),
    areaLoad:(o) => Object.assign({
      id:Util.id('AL'), caseId:null, slabId:null, q:0, dir:'GY'
    }, only(o))
  };

  /* --- lookup helpers -------------------------------------------------- */
  const byId = (arr, id) => arr.find(o => o.id === id) || null;
  function index(doc){
    return {
      level:  new Map(doc.levels.map(o => [o.id, o])),
      member: new Map(doc.physical.members.map(o => [o.id, o])),
      slab:   new Map(doc.physical.slabs.map(o => [o.id, o])),
      node:   new Map(doc.analytical.nodes.map(o => [o.id, o])),
      amember:new Map(doc.analytical.members.map(o => [o.id, o])),
      case:   new Map(doc.loads.cases.map(o => [o.id, o]))
    };
  }
  const sec = id => LIB.SEC[id] || LIB.SECTIONS[0];
  const mat = id => LIB.MAT[id] || LIB.MATERIALS[0];

  /** Level whose elevation is closest to y. */
  function levelAt(doc, y, tol = 0.05){
    let best = null, bd = tol;
    for(const L of doc.levels){
      const d = Math.abs(L.elevation - y);
      if(d <= bd){ bd = d; best = L; }
    }
    return best;
  }

  /* --- validation ------------------------------------------------------
     Returns { errors, warnings } - errors block the solve, warnings do not. */
  function validate(doc){
    const errors = [], warnings = [];
    const A = doc.analytical;
    const nodeIds = new Set(A.nodes.map(n => n.id));

    if(!A.nodes.length) errors.push({ msg:'The analytical model is empty. Use Model → Regenerate analytical.' });

    let restrained = 0;
    for(const n of A.nodes) if(n.support.some(v => v)) restrained++;
    if(A.nodes.length && !restrained)
      errors.push({ msg:'No supports. The structure would fly away — assign at least one support.' });

    const degree = new Map();
    for(const m of A.members){
      if(!m.active) continue;
      if(!nodeIds.has(m.i) || !nodeIds.has(m.j)){
        errors.push({ msg:`Member ${m.id} references a node that no longer exists.`, id:m.id }); continue;
      }
      const a = byId(A.nodes, m.i), b = byId(A.nodes, m.j);
      const L = Math.hypot(a.p[0]-b.p[0], a.p[1]-b.p[1], a.p[2]-b.p[2]);
      if(L < 1e-6){
        errors.push({ msg:`Member ${m.id} has zero length.`, id:m.id }); continue;
      }
      if(m.relI[0] && m.relJ[0])
        errors.push({ msg:`Member ${m.id} has axial released at both ends — that is a mechanism.`, id:m.id });
      if(m.relI[3] && m.relJ[3])
        errors.push({ msg:`Member ${m.id} has torsion released at both ends — that is a mechanism.`, id:m.id });
      degree.set(m.i, (degree.get(m.i)||0)+1);
      degree.set(m.j, (degree.get(m.j)||0)+1);
    }

    for(const n of A.nodes){
      const d = degree.get(n.id) || 0;
      if(d === 0) warnings.push({ msg:`Node ${n.tag||n.id} is not connected to any member.`, id:n.id });
    }

    // coincident but unmerged nodes - the classic "looks connected, isn't"
    const tol = doc.settings.mergeTol, cell = Math.max(tol*4, 0.02), hash = new Map();
    for(const n of A.nodes){
      const k = `${Math.round(n.p[0]/cell)}|${Math.round(n.p[1]/cell)}|${Math.round(n.p[2]/cell)}`;
      (hash.get(k) || hash.set(k, []).get(k)).push(n);
    }
    let dupes = 0;
    for(const grp of hash.values())
      for(let i = 0; i < grp.length; i++)
        for(let j = i+1; j < grp.length; j++){
          const a = grp[i].p, b = grp[j].p;
          if(Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]) < tol) dupes++;
        }
    if(dupes) warnings.push({ msg:`${dupes} pair(s) of nodes are closer than the merge tolerance. Run Model → Merge nodes.` });

    const nDof = A.nodes.length * 6;
    if(nDof > doc.settings.dofCap)
      errors.push({ msg:`Model has ${nDof} degrees of freedom, above the ${doc.settings.dofCap} limit for in-browser solving. Simplify the model.` });
    else if(nDof > doc.settings.dofWarn)
      warnings.push({ msg:`${nDof} degrees of freedom — the solve may take a few seconds.` });

    return { errors, warnings, nDof };
  }

  /* --- (de)serialisation ------------------------------------------------ */
  function serialize(doc){
    const out = Util.clone(doc);
    out.savedAt = new Date().toISOString();
    out.version = DOC_VERSION;
    return out;
  }

  const MIGRATIONS = {
    // 1: (d) => { ...; d.version = 2; return d; }
  };

  function deserialize(raw){
    let doc = typeof raw === 'string' ? JSON.parse(raw) : Util.clone(raw);
    if(doc.format !== 'structural-studio')
      throw new Error('That file is not a Structural Studio project.');
    if(doc.version > DOC_VERSION)
      throw new Error(`This project was saved by a newer version of Structural Studio (v${doc.version}). Update the app to open it.`);
    while(doc.version < DOC_VERSION){
      const fn = MIGRATIONS[doc.version];
      if(!fn) throw new Error(`No migration from schema v${doc.version}.`);
      doc = fn(doc);
    }
    // heal anything the schema has since gained
    const base = emptyDoc();
    doc.settings = Object.assign({}, base.settings, doc.settings);
    doc.views = Object.assign({}, base.views, doc.views);
    doc.views.show = Object.assign({}, base.views.show, doc.views.show);
    doc.views.show.labels = Object.assign({}, base.views.show.labels, doc.views.show.labels);
    doc.underlays = doc.underlays || [];
    // keep the id generator ahead of anything already in the file
    Util.seq = Math.max(Util.seq, 5000);
    return doc;
  }

  return { emptyDoc, mk, byId, index, sec, mat, levelAt, validate,
           serialize, deserialize, SUPPORTS, RELEASES, DOF_NAMES, DOC_VERSION };
})();

/* ==========================================================================
   10  STORE + HISTORY
   Undo is a whole-document snapshot rather than a command pair. With 30+
   mutating operations - several of which (regenerate analytical, run
   takedown, import) rewrite large parts of the document - a correct inverse
   per operation is far more error-prone than one clone. A 500-member model
   clones in about a millisecond, which is imperceptible.
   Underlays (base64 images, raw DXF text) are held OUTSIDE the snapshot;
   otherwise a 3 MB plan image would be multiplied by the history depth.
   ========================================================================== */
const Store = (() => {
  let doc = Model.emptyDoc();
  let selection = new Set();
  let assets = new Map();          // underlayId -> { dataURL | text }  (not undoable)

  const past = [], future = [];
  const LIMIT = 40;
  let coalesceTag = null, dirty = false;

  function stripAssets(d){
    const c = Util.clone({ ...d, underlays: d.underlays.map(u => ({ ...u, data:null })) });
    return c;
  }
  function restoreAssets(d){
    for(const u of d.underlays) if(assets.has(u.id)) u.data = assets.get(u.id);
    return d;
  }

  const api = {
    get doc(){ return doc },
    get selection(){ return selection },
    get assets(){ return assets },
    get isDirty(){ return dirty },

    /** Push an undo checkpoint. Call BEFORE mutating. */
    checkpoint(label){
      past.push({ label, snap:stripAssets(doc) });
      if(past.length > LIMIT) past.shift();
      future.length = 0;
      coalesceTag = null;
    },
    /** Checkpoint once for a continuous gesture (slider drag, gizmo drag). */
    begin(tag){ if(coalesceTag !== tag){ this.checkpoint(tag); coalesceTag = tag; } },
    end(){ coalesceTag = null; },

    /** Signal that the document changed; rerenders and marks the file dirty. */
    touch(what = 'model'){
      dirty = true;
      doc.analytical.stamp = (doc.analytical.stamp|0) + 1;
      Bus.emit('doc:changed', what);
    },
    markClean(){ dirty = false; Bus.emit('doc:clean'); },

    canUndo: () => past.length > 0,
    canRedo: () => future.length > 0,
    undoLabel: () => past.length ? past[past.length-1].label : null,

    undo(){
      if(!past.length) return false;
      const e = past.pop();
      future.push({ label:e.label, snap:stripAssets(doc) });
      doc = restoreAssets(e.snap);
      selection.clear();
      dirty = true;
      Bus.emit('doc:changed', 'undo');
      Bus.emit('history', { label:e.label, dir:'undo' });
      return true;
    },
    redo(){
      if(!future.length) return false;
      const e = future.pop();
      past.push({ label:e.label, snap:stripAssets(doc) });
      doc = restoreAssets(e.snap);
      selection.clear();
      dirty = true;
      Bus.emit('doc:changed', 'redo');
      Bus.emit('history', { label:e.label, dir:'redo' });
      return true;
    },

    /** Replace the whole document (new / open / template). */
    load(newDoc, { keepHistory = false } = {}){
      if(!keepHistory){ past.length = 0; future.length = 0; assets.clear(); }
      doc = newDoc;
      selection.clear();
      dirty = false;
      Bus.emit('doc:loaded', doc);
      Bus.emit('doc:changed', 'load');
    },

    /* --- selection ---------------------------------------------------- */
    select(ids, mode = 'replace'){
      const list = Array.isArray(ids) ? ids : ids ? [ids] : [];
      if(mode === 'replace'){ selection.clear(); list.forEach(i => selection.add(i)); }
      else if(mode === 'add') list.forEach(i => selection.add(i));
      else if(mode === 'remove') list.forEach(i => selection.delete(i));
      else if(mode === 'toggle') list.forEach(i => selection.has(i) ? selection.delete(i) : selection.add(i));
      Bus.emit('selection', selection);
    },
    clearSelection(){ selection.clear(); Bus.emit('selection', selection); },

    /** Resolve a selected id to { type, obj }. */
    resolve(id){
      const d = doc;
      let o;
      if((o = Model.byId(d.physical.members, id)))  return { type:'member',  obj:o };
      if((o = Model.byId(d.physical.slabs, id)))    return { type:'slab',    obj:o };
      if((o = Model.byId(d.physical.walls, id)))    return { type:'wall',    obj:o };
      if((o = Model.byId(d.physical.footings, id))) return { type:'footing', obj:o };
      if((o = Model.byId(d.analytical.nodes, id)))  return { type:'node',    obj:o };
      if((o = Model.byId(d.analytical.members, id)))return { type:'amember', obj:o };
      if((o = Model.byId(d.levels, id)))            return { type:'level',   obj:o };
      if((o = Model.byId(d.grids, id)))             return { type:'grid',    obj:o };
      return null;
    },
    selected(){ return [...selection].map(id => api.resolve(id)).filter(Boolean); },

    /** Delete every selected entity, cascading to dependants. */
    deleteSelection(){
      if(!selection.size) return 0;
      api.checkpoint('Delete');
      const ids = new Set(selection);
      const d = doc, P = d.physical, A = d.analytical;
      const gone = new Set(ids);

      P.members  = P.members.filter(m => { if(!gone.has(m.id)) return true;
                     if(m.analyticalId) gone.add(m.analyticalId); return false; });
      P.slabs    = P.slabs.filter(s => !gone.has(s.id));
      P.walls    = P.walls.filter(w => !gone.has(w.id));
      P.footings = P.footings.filter(f => !gone.has(f.id) && !gone.has(f.nodeId));
      A.members  = A.members.filter(m => !gone.has(m.id) && !gone.has(m.i) && !gone.has(m.j));
      A.nodes    = A.nodes.filter(n => !gone.has(n.id));
      A.links    = A.links.filter(l => !gone.has(l.id) && !gone.has(l.master) && !gone.has(l.slave));
      A.panels   = A.panels.filter(p => !gone.has(p.id));
      d.grids    = d.grids.filter(g => !gone.has(g.id));
      d.levels   = d.levels.filter(l => !gone.has(l.id));

      const liveNodes = new Set(A.nodes.map(n => n.id));
      const liveMem   = new Set(A.members.map(m => m.id));
      d.loads.nodal  = d.loads.nodal.filter(l => liveNodes.has(l.nodeId));
      d.loads.member = d.loads.member.filter(l => liveMem.has(l.memberId));
      d.loads.area   = d.loads.area.filter(l => P.slabs.some(s => s.id === l.slabId));

      selection.clear();
      api.touch('delete');
      Bus.emit('selection', selection);
      return gone.size;
    }
  };
  return api;
})();

/* ==========================================================================
   11  LINALG - dense symmetric solver on Float64Array
   ========================================================================== */
const LinAlg = (() => {

  /** In-place LDL' factorisation of a symmetric n x n row-major matrix.
      On return A holds L in the strict lower triangle and D on the diagonal.
      No square roots, so a slightly negative pivot from round-off does not
      produce NaN - it is reported instead. */
  function ldl(A, n){
    let maxDiag = 0;
    for(let i = 0; i < n; i++) maxDiag = Math.max(maxDiag, Math.abs(A[i*n+i]));
    const tolPivot = Math.max(maxDiag, 1) * 1e-12;
    const zeroPivots = [];
    let negPivots = 0, minPivot = Infinity;

    for(let j = 0; j < n; j++){
      let d = A[j*n+j];
      for(let k = 0; k < j; k++) d -= A[j*n+k]*A[j*n+k]*A[k*n+k];
      if(Math.abs(d) < tolPivot){ zeroPivots.push(j); d = tolPivot; }
      else if(d < 0) negPivots++;
      minPivot = Math.min(minPivot, Math.abs(d));
      A[j*n+j] = d;
      for(let i = j+1; i < n; i++){
        let s = A[i*n+j];
        for(let k = 0; k < j; k++) s -= A[i*n+k]*A[j*n+k]*A[k*n+k];
        A[i*n+j] = s/d;
      }
    }
    return { ok:zeroPivots.length === 0, zeroPivots, negPivots, minPivot, maxDiag };
  }

  /** Solve using a factorisation produced by ldl(). b is overwritten. */
  function ldlSolve(A, n, b){
    for(let i = 0; i < n; i++){                       // L y = b
      let s = b[i];
      for(let k = 0; k < i; k++) s -= A[i*n+k]*b[k];
      b[i] = s;
    }
    for(let i = 0; i < n; i++) b[i] /= A[i*n+i];      // D z = y
    for(let i = n-1; i >= 0; i--){                    // L' x = z
      let s = b[i];
      for(let k = i+1; k < n; k++) s -= A[k*n+i]*b[k];
      b[i] = s;
    }
    return b;
  }

  /** Gauss-Jordan inverse of a small dense matrix (<= 6x6). */
  function invSmall(M, n){
    const a = new Float64Array(n*n*2);
    for(let i = 0; i < n; i++){
      for(let j = 0; j < n; j++) a[i*2*n+j] = M[i*n+j];
      a[i*2*n+n+i] = 1;
    }
    for(let c = 0; c < n; c++){
      let piv = c, best = Math.abs(a[c*2*n+c]);
      for(let r = c+1; r < n; r++){
        const v = Math.abs(a[r*2*n+c]);
        if(v > best){ best = v; piv = r; }
      }
      if(best < 1e-14) return null;
      if(piv !== c) for(let k = 0; k < 2*n; k++){
        const t = a[c*2*n+k]; a[c*2*n+k] = a[piv*2*n+k]; a[piv*2*n+k] = t;
      }
      const d = a[c*2*n+c];
      for(let k = 0; k < 2*n; k++) a[c*2*n+k] /= d;
      for(let r = 0; r < n; r++){
        if(r === c) continue;
        const f = a[r*2*n+c];
        if(!f) continue;
        for(let k = 0; k < 2*n; k++) a[r*2*n+k] -= f*a[c*2*n+k];
      }
    }
    const out = new Float64Array(n*n);
    for(let i = 0; i < n; i++) for(let j = 0; j < n; j++) out[i*n+j] = a[i*2*n+n+j];
    return out;
  }

  return { ldl, ldlSolve, invSmall };
})();

/* ==========================================================================
   12  FEM - 3D frame finite element core
   ==========================================================================

   SIGN AND AXIS CONVENTION  (reproduced verbatim in Help -> Conventions)

   Local axes      x = node I -> node J.  y and z from the up-vector rule
                   below, then rotated by the member's roll angle.
   Local DOF order [ux uy uz rx ry rz]  at I, then the same at J  (12 total)

   End forces      f_local are the forces the NODES apply TO the member:
                       f_local = k * Gamma * u_global + fef
                   where fef are the fixed-end forces.

   Internal actions at station x, measured on the LEFT segment:
       N(x)  = -f[0] - integral(wx)                  tension positive
       Vy(x) =  f[1] + integral(wy)
       Mz(x) = -f[5] + f[1]*x + integral((x-s)*wy)   SAGGING POSITIVE
       Vz(x) =  f[2] + integral(wz)
       My(x) = -f[4] - f[2]*x - integral((x-s)*wz)
       T(x)  = -f[3]

   Moment diagrams are drawn on the TENSION face, which is the convention
   architecture students meet first (and the one Ftool uses).
   ========================================================================== */
const FEM = (() => {

  const DOF = 6, EDOF = 12;
