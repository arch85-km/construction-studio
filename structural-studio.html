  /* ----------------------------------------------------------------------
     THE AXIS SWAP.  This is the only place it happens.

     LIB reports Iy as the Eurocode STRONG axis. The frame element wants Iz
     to govern bending in the local x-y plane. Because the up-vector rule
     gives a normally oriented horizontal beam local y = global up, gravity
     bending of that beam happens in the local x-y plane - so the catalogue
     STRONG value must be handed to the element as Iz.

         element Iz  <-  catalogue Iy   (strong)
         element Iy  <-  catalogue Iz   (weak)

     Get this backwards and every beam is roughly three times too flexible,
     with results that still look entirely plausible. Benchmark 11 asserts
     the resulting deflection ratio numerically.
     ---------------------------------------------------------------------- */
  function sectionToLocal(sec){
    return { A:sec.A, Iy:sec.Iz, Iz:sec.Iy, J:sec.J,
             Wely:sec.Wely, Welz:sec.Welz, h:sec.h, b:sec.b };
  }

  /* --- direction cosines ------------------------------------------------
     The vertical-member branch below is the single most bug-prone line in
     the application. A member within about 2.6 degrees of vertical uses the
     global-Z reference; everything else uses global-Y. Benchmark 12 asserts
     that results are continuous across that switch. */
  function dirCos(pI, pJ, rollDeg, out /* Float64Array(9), row-major */){
    let ex0 = pJ[0]-pI[0], ex1 = pJ[1]-pI[1], ex2 = pJ[2]-pI[2];
    const L = Math.hypot(ex0, ex1, ex2);
    if(L < 1e-12) return 0;
    ex0 /= L; ex1 /= L; ex2 /= L;

    const vertical = Math.abs(ex1) > 0.999;
    const ux = 0, uy = vertical ? 0 : 1, uz = vertical ? 1 : 0;

    // ez = ex x up
    let ez0 = ex1*uz - ex2*uy, ez1 = ex2*ux - ex0*uz, ez2 = ex0*uy - ex1*ux;
    let n = Math.hypot(ez0, ez1, ez2) || 1;
    ez0 /= n; ez1 /= n; ez2 /= n;
    // ey = ez x ex
    let ey0 = ez1*ex2 - ez2*ex1, ey1 = ez2*ex0 - ez0*ex2, ey2 = ez0*ex1 - ez1*ex0;
    n = Math.hypot(ey0, ey1, ey2) || 1;
    ey0 /= n; ey1 /= n; ey2 /= n;

    // roll is applied AFTER the branch, by rotating (ey, ez) about ex.
    if(rollDeg){
      const a = rollDeg*Math.PI/180, c = Math.cos(a), s = Math.sin(a);
      const y0 = ey0*c + ez0*s, y1 = ey1*c + ez1*s, y2 = ey2*c + ez2*s;
      const z0 = -ey0*s + ez0*c, z1 = -ey1*s + ez1*c, z2 = -ey2*s + ez2*c;
      ey0 = y0; ey1 = y1; ey2 = y2; ez0 = z0; ez1 = z1; ez2 = z2;
    }
    out[0]=ex0; out[1]=ex1; out[2]=ex2;
    out[3]=ey0; out[4]=ey1; out[5]=ey2;
    out[6]=ez0; out[7]=ez1; out[8]=ez2;
    return L;
  }

  /* --- 12x12 local stiffness ------------------------------------------- */
  function kLocal(E, G, A, Iy, Iz, J, L, out){
    out.fill(0);
    const a  = E*A/L,   t = G*J/L;
    const L2 = L*L, L3 = L2*L;
    const bz1 = 12*E*Iz/L3, bz2 = 6*E*Iz/L2, bz3 = 4*E*Iz/L, bz4 = 2*E*Iz/L;
    const by1 = 12*E*Iy/L3, by2 = 6*E*Iy/L2, by3 = 4*E*Iy/L, by4 = 2*E*Iy/L;
    const K = (i,j,v) => { out[i*EDOF+j] = v; out[j*EDOF+i] = v; };

    K(0,0, a);   K(0,6,-a);   K(6,6, a);            // axial
    K(3,3, t);   K(3,9,-t);   K(9,9, t);            // torsion
    // bending in the local x-y plane (governed by Iz)
    K(1,1, bz1); K(1,5, bz2); K(1,7,-bz1); K(1,11, bz2);
    K(5,5, bz3); K(5,7,-bz2); K(5,11, bz4);
    K(7,7, bz1); K(7,11,-bz2);
    K(11,11, bz3);
    // bending in the local x-z plane (governed by Iy) - note the sign flips
    K(2,2, by1); K(2,4,-by2); K(2,8,-by1); K(2,10,-by2);
    K(4,4, by3); K(4,8, by2); K(4,10, by4);
    K(8,8, by1); K(8,10, by2);
    K(10,10, by3);
    return out;
  }

  /* --- Hermite shape functions, used for consistent nodal loads --------- */
  //  v(x) = N1 v_I + N2 rz_I + N3 v_J + N4 rz_J      (x-y plane)
  //  w(x) = N1 w_I - N2 ry_I + N3 w_J - N4 ry_J      (x-z plane)
  const N1 = (t)    => 1 - 3*t*t + 2*t*t*t;
  const N2 = (t, L) => L*(t - 2*t*t + t*t*t);
  const N3 = (t)    => 3*t*t - 2*t*t*t;
  const N4 = (t, L) => L*(t*t*t - t*t);
  // linear shape functions for axial and torsion
  const A1 = t => 1 - t, A2 = t => t;

  // 8-point Gauss-Legendre on [0,1]
  const GX = [0.019855072,0.101666761,0.237233795,0.408282679,
              0.591717321,0.762766205,0.898333239,0.980144928];
  const GW = [0.050614268,0.111190517,0.156853323,0.181341892,
              0.181341892,0.156853323,0.111190517,0.050614268];

  /** Accumulate the fixed-end force vector for one member load.
      `load` carries w1, w2, a, b in LOCAL component form already resolved.
      Adds  fef -= consistentNodalLoad  so that fef = -F_eq. */
  function addFef(fef, load, L){
    const { kind } = load;
    const wx = load.wx || 0, wy = load.wy || 0, wz = load.wz || 0;

    if(kind === 'point'){
      const t = Util.clamp((load.a || 0)/L, 0, 1);
      const n1 = N1(t), n2 = N2(t,L), n3 = N3(t), n4 = N4(t,L);
      const a1 = A1(t), a2 = A2(t);
      fef[0]  -= wx*a1;                fef[6]  -= wx*a2;
      fef[1]  -= wy*n1;  fef[5]  -= wy*n2;
      fef[7]  -= wy*n3;  fef[11] -= wy*n4;
      fef[2]  -= wz*n1;  fef[4]  += wz*n2;
      fef[8]  -= wz*n3;  fef[10] += wz*n4;
      return fef;
    }
    if(kind === 'moment'){
      // concentrated moment about the local axes - use shape derivatives
      const t = Util.clamp((load.a || 0)/L, 0, 1), h = 1e-6;
      const dN = (f, tt) => (f(Math.min(1,tt+h)) - f(Math.max(0,tt-h))) /
                            ((Math.min(1,tt+h) - Math.max(0,tt-h))*L);
      const mz = load.mz || 0, my = load.my || 0, mx = load.mx || 0;
      fef[1]  -= mz*dN(N1,t);  fef[5]  -= mz*dN(u => N2(u,L), t);
      fef[7]  -= mz*dN(N3,t);  fef[11] -= mz*dN(u => N4(u,L), t);
      fef[2]  += my*dN(N1,t);  fef[4]  += my*dN(u => N2(u,L), t);
      fef[8]  += my*dN(N3,t);  fef[10] += my*dN(u => N4(u,L), t);
      fef[3]  -= mx*A1(t);     fef[9]  -= mx*A2(t);
      return fef;
    }

    // distributed: udl / trapezoid / triangle, optionally over a sub-span.
    // The intensity varies linearly from f0*w at x0 to f1*w at x1, so a load
    // that starts at zero (a triangle) is expressed directly rather than as a
    // ratio - w2/w1 would be a division by zero.
    const x0 = Util.clamp(load.a || 0, 0, L);
    const x1 = Util.clamp(load.b == null ? L : load.b, 0, L);
    const span = x1 - x0;
    if(span <= 1e-12) return fef;
    const f0 = load.f0 == null ? 1 : load.f0;
    const f1 = load.f1 == null ? 1 : load.f1;

    for(let g = 0; g < GX.length; g++){
      const s  = x0 + GX[g]*span;
      const jw = GW[g]*span;
      const r  = span > 0 ? (s - x0)/span : 0;
      const k  = f0 + (f1 - f0)*r;                    // linear intensity ramp
      const t  = s/L;
      const n1 = N1(t), n2 = N2(t,L), n3 = N3(t), n4 = N4(t,L);
      const a1 = A1(t), a2 = A2(t);
      const qx = wx*k*jw, qy = wy*k*jw, qz = wz*k*jw;
      fef[0]  -= qx*a1;               fef[6]  -= qx*a2;
      fef[1]  -= qy*n1;  fef[5]  -= qy*n2;
      fef[7]  -= qy*n3;  fef[11] -= qy*n4;
      fef[2]  -= qz*n1;  fef[4]  += qz*n2;
      fef[8]  -= qz*n3;  fef[10] += qz*n4;
    }
    return fef;
  }

  /* --- end releases by static condensation ------------------------------
     k* = k_cc - k_cr * k_rr^-1 * k_rc, with the fixed-end force vector
     condensed identically. General over any release pattern, and because the
     condensed operator is what gets stored, force recovery stays a single
     uniform expression that automatically returns ~0 at released components. */
  function condense(k, fef, relI, relJ){
    const r = [];
    for(let i = 0; i < 6; i++){ if(relI[i]) r.push(i); if(relJ[i]) r.push(i+6); }
    if(!r.length) return { ok:true };

    const c = [];
    for(let i = 0; i < EDOF; i++) if(!r.includes(i)) c.push(i);
    const nr = r.length;

    const Krr = new Float64Array(nr*nr);
    for(let i = 0; i < nr; i++) for(let j = 0; j < nr; j++) Krr[i*nr+j] = k[r[i]*EDOF+r[j]];
    const Inv = LinAlg.invSmall(Krr, nr);
    if(!Inv) return { ok:false, reason:'releases create a mechanism in this member' };

    // W = Krr^-1 * Krc   (nr x nc)   and   v = Krr^-1 * fef_r
    const nc = c.length;
    const W = new Float64Array(nr*nc), v = new Float64Array(nr);
    for(let i = 0; i < nr; i++){
      for(let j = 0; j < nc; j++){
        let s = 0;
        for(let m = 0; m < nr; m++) s += Inv[i*nr+m]*k[r[m]*EDOF+c[j]];
        W[i*nc+j] = s;
      }
      let s = 0;
      for(let m = 0; m < nr; m++) s += Inv[i*nr+m]*fef[r[m]];
      v[i] = s;
    }
    // k*_cc and fef*_c
    const kcc = new Float64Array(nc*nc), fc = new Float64Array(nc);
    for(let i = 0; i < nc; i++){
      for(let j = 0; j < nc; j++){
        let s = k[c[i]*EDOF+c[j]];
        for(let m = 0; m < nr; m++) s -= k[c[i]*EDOF+r[m]]*W[m*nc+j];
        kcc[i*nc+j] = s;
      }
      let s = fef[c[i]];
      for(let m = 0; m < nr; m++) s -= k[c[i]*EDOF+r[m]]*v[m];
      fc[i] = s;
    }
    // scatter back with zeros in the released rows and columns
    k.fill(0); fef.fill(0);
    for(let i = 0; i < nc; i++){
      fef[c[i]] = fc[i];
      for(let j = 0; j < nc; j++) k[c[i]*EDOF+c[j]] = kcc[i*nc+j];
    }
    return { ok:true };
  }

  /* --- rigid end offsets ------------------------------------------------
     Master-slave transform  T = [[I, -r~],[0, I]] applied per end, so that
     the element stiffness expressed at the NODE positions is T' k T. This is
     how Tekla rigid links and Revit analytical offsets behave. */
  function applyOffsets(k, fef, offI, offJ){
    const zero = v => Math.abs(v[0]) < 1e-12 && Math.abs(v[1]) < 1e-12 && Math.abs(v[2]) < 1e-12;
    if(zero(offI) && zero(offJ)) return;

    const T = new Float64Array(EDOF*EDOF);
    for(let i = 0; i < EDOF; i++) T[i*EDOF+i] = 1;
    const setSkew = (base, r) => {
      // u_end = u_node + omega x r   ->   rows base..base+2, cols base+3..base+5
      T[(base+0)*EDOF + base+4] =  r[2]; T[(base+0)*EDOF + base+5] = -r[1];
      T[(base+1)*EDOF + base+3] = -r[2]; T[(base+1)*EDOF + base+5] =  r[0];
      T[(base+2)*EDOF + base+3] =  r[1]; T[(base+2)*EDOF + base+4] = -r[0];
    };
    setSkew(0, offI); setSkew(6, offJ);

    // k <- T' k T
    const tmp = new Float64Array(EDOF*EDOF);
    for(let i = 0; i < EDOF; i++) for(let j = 0; j < EDOF; j++){
      let s = 0; for(let m = 0; m < EDOF; m++) s += k[i*EDOF+m]*T[m*EDOF+j];
      tmp[i*EDOF+j] = s;
    }
    for(let i = 0; i < EDOF; i++) for(let j = 0; j < EDOF; j++){
      let s = 0; for(let m = 0; m < EDOF; m++) s += T[m*EDOF+i]*tmp[m*EDOF+j];
      k[i*EDOF+j] = s;
    }
    // fef <- T' fef
    const f2 = new Float64Array(EDOF);
    for(let i = 0; i < EDOF; i++){
      let s = 0; for(let m = 0; m < EDOF; m++) s += T[m*EDOF+i]*fef[m];
      f2[i] = s;
    }
    fef.set(f2);
  }

  /** Gamma' k Gamma using 3x3 blocks - about nine times cheaper than a naive
      12x12x12 triple loop, and much easier to read. */
  function transform(k, lam, out){
    out.fill(0);
    const b = new Float64Array(9), c = new Float64Array(9);
    for(let bi = 0; bi < 4; bi++) for(let bj = 0; bj < 4; bj++){
      for(let i = 0; i < 3; i++) for(let j = 0; j < 3; j++)
        b[i*3+j] = k[(bi*3+i)*EDOF + bj*3+j];
      // c = lam' * b * lam
      for(let i = 0; i < 3; i++) for(let j = 0; j < 3; j++){
        let s = 0;
        for(let m = 0; m < 3; m++) for(let n = 0; n < 3; n++)
          s += lam[m*3+i]*b[m*3+n]*lam[n*3+j];
        c[i*3+j] = s;
      }
      for(let i = 0; i < 3; i++) for(let j = 0; j < 3; j++)
        out[(bi*3+i)*EDOF + bj*3+j] = c[i*3+j];
    }
    return out;
  }

  /** Rotate a 12-vector from local to global: v_global = Gamma' v_local. */
  function vecToGlobal(v, lam, out){
    for(let b = 0; b < 4; b++){
      const o = b*3;
      for(let i = 0; i < 3; i++)
        out[o+i] = lam[0*3+i]*v[o] + lam[1*3+i]*v[o+1] + lam[2*3+i]*v[o+2];
    }
    return out;
  }
  /** v_local = Gamma * v_global. */
  function vecToLocal(v, lam, out){
    for(let b = 0; b < 4; b++){
      const o = b*3;
      for(let i = 0; i < 3; i++)
        out[o+i] = lam[i*3+0]*v[o] + lam[i*3+1]*v[o+1] + lam[i*3+2]*v[o+2];
    }
    return out;
  }

  return Object.freeze({
    DOF, EDOF, sectionToLocal, dirCos, kLocal, addFef, condense,
    applyOffsets, transform, vecToGlobal, vecToLocal,
    shape:{ N1, N2, N3, N4, A1, A2 }
  });
})();

/* ==========================================================================
   13  SOLVER - assembly, boundary conditions, solve, recovery
   ==========================================================================
   Strategy: factorise K_ff ONCE, then back-substitute per LOAD CASE, and
   build combinations by linear superposition afterwards.

   The formulation is linear-elastic and small-displacement, so superposition
   is exact. One factorisation is O(n^3); each extra case is only O(n^2). Six
   cases and twenty combinations therefore cost about 1.02x a single solve,
   where solving per combination would cost twenty factorisations. That
   difference is what makes live feedback possible at all - and it lets the
   properties panel break a column's load down by case ("of 480 kN, 310 is
   dead and 170 imposed"), which a per-combination solve throws away.

   The cost of this choice: no tension-only bracing, no P-delta, no material
   nonlinearity. Those are stated as out of scope in Help -> Conventions.
   ========================================================================== */
const Solver = (() => {

  const E12 = FEM.EDOF;

  /* --- resolve a stored member load into local components ---------------- */
  function resolveLoad(ld, lam, L, horizFactor){
    const out = { kind:ld.kind === 'point' ? 'point' : ld.kind === 'moment' ? 'moment' : 'dist',
                  a:ld.a || 0, b:ld.b, f0:1, f1:1, wx:0, wy:0, wz:0 };

    // Reference intensity and the two end factors. Using explicit end factors
    // rather than a w2/w1 ratio is what lets a triangle start at exactly zero.
    let mag = ld.w1 || 0;
    if(ld.kind === 'trapezoid' || ld.kind === 'triangle'){
      const w1 = ld.w1 || 0, w2 = ld.w2 || 0;
      mag = Math.abs(w2) > Math.abs(w1) ? w2 : w1;
      if(mag === 0) return out;
      out.f0 = w1/mag; out.f1 = w2/mag;
    }
    if(ld.kind === 'point' || ld.kind === 'moment') mag = ld.w1 || 0;

    if(ld.dir === 'LX'){ out.wx = mag; }
    else if(ld.dir === 'LY'){ out.wy = mag; }
    else if(ld.dir === 'LZ'){ out.wz = mag; }
    else {
      // a global direction resolves into local components through the rows of
      // lambda; PGY is a load per unit HORIZONTAL projection (roof loads)
      const gi = ld.dir === 'GX' ? 0 : ld.dir === 'GZ' ? 2 : 1;
      const k = (ld.dir === 'PGY') ? horizFactor : 1;
      out.wx = mag*k*lam[0*3+gi];
      out.wy = mag*k*lam[1*3+gi];
      out.wz = mag*k*lam[2*3+gi];
    }
    if(out.kind === 'moment'){ out.mx = out.wx; out.my = out.wy; out.mz = out.wz; }
    return out;
  }

  /* --- build the solve context ------------------------------------------ */
  function prepare(doc){
    const A = doc.analytical;
    const nodes = A.nodes, members = A.members.filter(m => m.active !== false);
    const nN = nodes.length, n = nN*6;
    const nodeIdx = new Map(nodes.map((nd,i) => [nd.id, i]));

    // free / fixed partition
    const isFixed = new Uint8Array(n);
    for(let i = 0; i < nN; i++){
      const s = nodes[i].support;
      for(let d = 0; d < 6; d++) if(s[d]) isFixed[i*6+d] = 1;
    }
    const free = [], fixed = [], map = new Int32Array(n).fill(-1);
    for(let i = 0; i < n; i++){
      if(isFixed[i]){ map[i] = -1 - fixed.length; fixed.push(i); }
      else { map[i] = free.length; free.push(i); }
    }
    const nf = free.length, ns = fixed.length;

    // per-element data
    const elems = [];
    const lam = new Float64Array(9);
    const warnings = [];
    for(const m of members){
      const a = nodeIdx.get(m.i), b = nodeIdx.get(m.j);
      if(a == null || b == null) continue;
      const pI = nodes[a].p, pJ = nodes[b].p;
      // clear ends: node position plus the rigid offset
      const cI = [pI[0]+m.offI[0], pI[1]+m.offI[1], pI[2]+m.offI[2]];
      const cJ = [pJ[0]+m.offJ[0], pJ[1]+m.offJ[1], pJ[2]+m.offJ[2]];
      const L = FEM.dirCos(cI, cJ, m.roll || 0, lam);
      if(L < 1e-9){ warnings.push({ msg:`Member ${m.id} has zero length and was skipped.`, id:m.id }); continue; }

      const sec = FEM.sectionToLocal(Model.sec(m.sectionId));
      const mat = Model.mat(m.materialId);
      const k = new Float64Array(E12*E12);
      FEM.kLocal(mat.E, mat.G, sec.A, sec.Iy, sec.Iz, sec.J, L, k);

      const horiz = Math.hypot(cJ[0]-cI[0], cJ[2]-cI[2]) / L;
      elems.push({
        m, ia:a, ib:b, L, lam:lam.slice(), k, sec, mat, horiz,
        dofs:(() => { const d = new Int32Array(12);
          for(let q = 0; q < 6; q++){ d[q] = a*6+q; d[q+6] = b*6+q; } return d; })()
      });
    }
    return { doc, nodes, members, nN, n, nodeIdx, free, fixed, map, nf, ns, elems, warnings };
  }

  /* --- per-case element assembly ---------------------------------------- */
  /** Build k*, fef* (after releases and offsets) for one element and one case. */
  function elementFor(el, caseLoads){
    const k = el.k.slice();
    const fef = new Float64Array(E12);
    for(const ld of caseLoads){
      const r = resolveLoad(ld, el.lam, el.L, el.horiz);
      FEM.addFef(fef, r, el.L);
    }
    const cond = FEM.condense(k, fef, el.m.relI, el.m.relJ);
    FEM.applyOffsets(k, fef, el.m.offI, el.m.offJ);
    return { k, fef, ok:cond.ok, reason:cond.reason };
  }

  /* --- the main entry point --------------------------------------------- */
  function run(doc, opts = {}){
    const t0 = performance.now();
    const ctx = prepare(doc);
    const { nf, ns, free, fixed, map, elems, n } = ctx;
    const errors = [], warnings = [...ctx.warnings];

    // nf === 0 is legitimate (a fully fixed-ended beam, say): every
    // displacement is zero and the member end forces are the fixed-end
    // forces. It solves trivially rather than being an error.
    if(!ctx.elems.length)
      return { ok:false, errors:[{ msg:'There are no members to analyse.' }], warnings };

    // group member loads by case and member
    const cases = doc.loads.cases.filter(c => opts.cases ? opts.cases.includes(c.id) : true);
    const byCaseMember = new Map();
    for(const c of cases) byCaseMember.set(c.id, new Map());
    for(const ld of doc.loads.member){
      const g = byCaseMember.get(ld.caseId); if(!g) continue;
      (g.get(ld.memberId) || g.set(ld.memberId, []).get(ld.memberId)).push(ld);
    }

    // --- assemble K (stiffness does not depend on the load case) ---------
    const Kff = new Float64Array(nf*nf);
    const Ksf = new Float64Array(ns*nf);
    // element operators are load-dependent only through fef, but releases
    // condense the stiffness too - and release patterns are per member, not
    // per case, so one pass is enough.
    const elemOps = [];
    for(const el of elems){
      const built = elementFor(el, []);          // stiffness only
      if(!built.ok){ errors.push({ msg:`Member ${el.m.id}: ${built.reason}.`, id:el.m.id }); continue; }
      const Kg = FEM.transform(built.k, el.lam, new Float64Array(E12*E12));
      elemOps.push({ el, kStar:built.k, Kg });
      const d = el.dofs;
      for(let i = 0; i < 12; i++){
        const gi = map[d[i]];
        for(let j = 0; j < 12; j++){
          const gj = map[d[j]], v = Kg[i*E12+j];
          if(!v) continue;
          if(gi >= 0 && gj >= 0) Kff[gi*nf+gj] += v;
          else if(gi < 0 && gj >= 0) Ksf[(-gi-1)*nf+gj] += v;
        }
      }
    }
    if(errors.length) return { ok:false, errors, warnings };

    // nodal springs add straight onto the diagonal
    for(let i = 0; i < ctx.nN; i++){
      const sp = ctx.nodes[i].spring;
      if(!sp) continue;
      for(let d = 0; d < 6; d++){
        const gi = map[i*6+d];
        if(gi >= 0 && sp[d]) Kff[gi*nf+gi] += sp[d];
      }
    }

    // --- factorise once ---------------------------------------------------
    const fac = nf ? LinAlg.ldl(Kff, nf)
                   : { ok:true, zeroPivots:[], negPivots:0, minPivot:Infinity, maxDiag:0 };
    if(!fac.ok){
      const diag = fac.zeroPivots.slice(0, 6).map(p => {
        const g = free[p], ni = Math.floor(g/6), d = g%6;
        const nd = ctx.nodes[ni];
        return { nodeId:nd.id, dof:Model.DOF_NAMES[d],
                 msg:`Node ${nd.tag || nd.id} is unrestrained in ${Model.DOF_NAMES[d]} — the structure is a mechanism there. Add a support, a brace, or release fewer degrees of freedom.` };
      });
      return { ok:false, singular:true, errors:diag.map(d => ({ msg:d.msg, id:d.nodeId })),
               warnings, diagnostics:diag };
    }

    // --- solve each case --------------------------------------------------
    const perCase = {};
    const memberOrder = elemOps.map(o => o.el.m.id);
    const nM = elemOps.length;
    const nodalByCase = new Map(cases.map(c => [c.id, []]));
    for(const nl of doc.loads.nodal) nodalByCase.get(nl.caseId)?.push(nl);

    for(const c of cases){
      const F = new Float64Array(n);
      // nodal loads
      for(const nl of nodalByCase.get(c.id) || []){
        const i = ctx.nodeIdx.get(nl.nodeId); if(i == null) continue;
        F[i*6+0] += nl.Fx||0; F[i*6+1] += nl.Fy||0; F[i*6+2] += nl.Fz||0;
        F[i*6+3] += nl.Mx||0; F[i*6+4] += nl.My||0; F[i*6+5] += nl.Mz||0;
      }
      // member loads -> equivalent nodal loads (= -fef, already signed)
      const memLoads = byCaseMember.get(c.id) || new Map();
      const fefs = new Array(nM);
      const tmp = new Float64Array(E12);
      for(let e = 0; e < nM; e++){
        const { el } = elemOps[e];
        const lds = memLoads.get(el.m.id) || [];
        const fef = new Float64Array(E12);
        for(const ld of lds) FEM.addFef(fef, resolveLoad(ld, el.lam, el.L, el.horiz), el.L);
        if(lds.length){
          // releases and offsets must condense the load vector identically
          const kk = el.k.slice();
          FEM.condense(kk, fef, el.m.relI, el.m.relJ);
          FEM.applyOffsets(kk, fef, el.m.offI, el.m.offJ);
        }
        fefs[e] = fef;
        if(lds.length){
          FEM.vecToGlobal(fef, el.lam, tmp);
          const d = el.dofs;
          for(let i = 0; i < 12; i++) F[d[i]] -= tmp[i];   // F_eq = -fef
        }
      }

      // partition, solve, recover
      const Ff = new Float64Array(nf);
      for(let i = 0; i < nf; i++) Ff[i] = F[free[i]];
      if(nf) LinAlg.ldlSolve(Kff, nf, Ff);
      const u = new Float64Array(n);
      for(let i = 0; i < nf; i++) u[free[i]] = Ff[i];

      // reactions R = Ksf*uf - Fs
      const R = new Float64Array(n);
      for(let s = 0; s < ns; s++){
        let v = 0;
        for(let j = 0; j < nf; j++) v += Ksf[s*nf+j]*Ff[j];
        R[fixed[s]] = v - F[fixed[s]];
      }

      // member end forces  f_local = k* * Gamma * u_elem + fef*
      const mf = new Float64Array(nM*12);
      const ue = new Float64Array(12), ul = new Float64Array(12);
      for(let e = 0; e < nM; e++){
        const { el, kStar } = elemOps[e], d = el.dofs;
        for(let i = 0; i < 12; i++) ue[i] = u[d[i]];
        FEM.vecToLocal(ue, el.lam, ul);
        const off = e*12, fef = fefs[e];
        for(let i = 0; i < 12; i++){
          let s = fef[i];
          for(let j = 0; j < 12; j++) s += kStar[i*E12+j]*ul[j];
          mf[off+i] = s;
        }
      }
      perCase[c.id] = { u, R, mf, F };
    }

    const solveMs = performance.now() - t0;
    return {
      ok:true, errors, warnings, solveMs,
      nDof:n, nFree:nf, nMembers:nM,
      ctx, elemOps, memberOrder, perCase,
      cases:cases.map(c => c.id),
      minPivot:fac.minPivot, negPivots:fac.negPivots
    };
  }

  /* --- linear superposition into a combination -------------------------- */
  function combine(res, combo){
    const n = res.nDof, nM = res.nMembers;
    const u = new Float64Array(n), R = new Float64Array(n), mf = new Float64Array(nM*12);
    const F = new Float64Array(n);
    for(const t of combo.terms){
      const c = res.perCase[t.caseId];
      if(!c || !t.factor) continue;
      const g = t.factor;
      for(let i = 0; i < n; i++){ u[i] += g*c.u[i]; R[i] += g*c.R[i]; F[i] += g*c.F[i]; }
      for(let i = 0; i < mf.length; i++) mf[i] += g*c.mf[i];
    }
    return { u, R, mf, F, comboId:combo.id, name:combo.name };
  }

  /* --- always-on invariants ---------------------------------------------
     These cost microseconds and turn a whole class of silent wrongness into
     a visible warning. Run on every solve, not only in the test suite. */
  function checkEquilibrium(res, comb){
    const n = res.nDof, nodes = res.ctx.nodes;
    const sums = new Float64Array(6);
    let scale = 0;
    for(let i = 0; i < nodes.length; i++){
      for(let d = 0; d < 6; d++){
        const applied = comb.F[i*6+d], reac = comb.R[i*6+d];
        sums[d] += applied + reac;
        scale = Math.max(scale, Math.abs(applied), Math.abs(reac));
      }
    }
    // moment of the forces about the origin has to be included for Mx..Mz
    let mx = sums[3], my = sums[4], mz = sums[5];
    for(let i = 0; i < nodes.length; i++){
      const p = nodes[i].p;
      const fx = comb.F[i*6]+comb.R[i*6], fy = comb.F[i*6+1]+comb.R[i*6+1], fz = comb.F[i*6+2]+comb.R[i*6+2];
      mx += p[1]*fz - p[2]*fy;
      my += p[2]*fx - p[0]*fz;
      mz += p[0]*fy - p[1]*fx;
    }
    const tol = Math.max(scale, 1)*1e-6;
    const ok = Math.abs(sums[0]) < tol && Math.abs(sums[1]) < tol && Math.abs(sums[2]) < tol &&
               Math.abs(mx) < tol*10 && Math.abs(my) < tol*10 && Math.abs(mz) < tol*10;
    return { ok, F:[sums[0], sums[1], sums[2]], M:[mx,my,mz], tol,
             totalApplied:(() => { let s = 0; for(let i = 1; i < n; i += 6) s += comb.F[i]; return s; })(),
             totalReaction:(() => { let s = 0; for(let i = 1; i < n; i += 6) s += comb.R[i]; return s; })() };
  }

  /* --- diagram sampling --------------------------------------------------
     Internal actions follow the convention block at the top of FEM.

     Deflection is obtained by integrating the curvature twice along the
     member:  v'' = Mz/EIz  in the local x-y plane and  w'' = -My/EIy in the
     local x-z plane, starting from the exact end displacement and rotation.
     That is exact for every load pattern we support. (Interpolating the end
     displacements with the Hermite functions and adding a simply-supported
     span term is the tempting shortcut, and it is wrong - it double-counts
     the end rotations. A fixed-fixed beam comes out five times too flexible,
     which is precisely what benchmark 4 checks.)
     Integration runs on a refined grid and is then subsampled, so 21 output
     stations still carry the accuracy of 81 integration points. */
  function diagram(res, memberIdx, comb, loads, nSt = 21){
    const op = res.elemOps[memberIdx];
    if(!op) return null;
    const { el } = op, L = el.L, lam = el.lam;
    const f = comb.mf.subarray(memberIdx*12, memberIdx*12+12);
    const R = (loads || []).map(ld => resolveLoad(ld, lam, L, el.horiz));

    const ue = new Float64Array(12), ul = new Float64Array(12);
    for(let i = 0; i < 12; i++) ue[i] = comb.u[el.dofs[i]];
    FEM.vecToLocal(ue, lam, ul);

    const EIz = el.mat.E*el.sec.Iz, EIy = el.mat.E*el.sec.Iy;
    const REF = 8;                                   // integration refinement
    const nF = (nSt-1)*REF + 1, h = L/(nF-1);

    const fx = new Float64Array(nF), fN = new Float64Array(nF), fVy = new Float64Array(nF);
    const fVz = new Float64Array(nF), fMz = new Float64Array(nF), fMy = new Float64Array(nF);
    const fT  = new Float64Array(nF);

    for(let s = 0; s < nF; s++){
      const xs = h*s; fx[s] = xs;
      let Ix = 0, Iy_ = 0, Iz_ = 0, Mx_ = 0, My_ = 0, Mz_ = 0;
      for(const r of R){
        if(r.kind === 'point'){
          if(r.a <= xs + 1e-12){
            Ix += r.wx; Iy_ += r.wy; Iz_ += r.wz;
            Mx_ += (xs-r.a)*r.wx; My_ += (xs-r.a)*r.wy; Mz_ += (xs-r.a)*r.wz;
          }
          continue;
        }
        if(r.kind === 'moment') continue;
        const ra = r.a, rb = (r.b == null ? L : r.b);
        const a = Math.min(ra, xs), b = Math.min(rb, xs);
        if(b <= a) continue;
        const span = rb - ra, g0 = r.f0 == null ? 1 : r.f0, g1 = r.f1 == null ? 1 : r.f1;
        const nQ = 16, hq = (b-a)/nQ;
        for(let q = 0; q < nQ; q++){
          const t = a + hq*(q+0.5);
          const k = (g0 + (g1-g0)*((t-ra)/span))*hq;
          Ix += r.wx*k; Iy_ += r.wy*k; Iz_ += r.wz*k;
          Mx_ += (xs-t)*r.wx*k; My_ += (xs-t)*r.wy*k; Mz_ += (xs-t)*r.wz*k;
        }
      }
      fN[s]  = -f[0] - Ix;
      fT[s]  = -f[3];
      fVy[s] =  f[1] + Iy_;
      fMz[s] = -f[5] + f[1]*xs + My_;
      fVz[s] =  f[2] + Iz_;
      fMy[s] = -f[4] - f[2]*xs - Mz_;
    }

    // double integration of curvature, trapezoidal on the refined grid
    const fdy = new Float64Array(nF), fdz = new Float64Array(nF);
    let thZ = ul[5], thY = -ul[4];          // dv/dx = rz ,  dw/dx = -ry
    fdy[0] = ul[1]; fdz[0] = ul[2];
    for(let s = 1; s < nF; s++){
      const kz0 = fMz[s-1]/EIz, kz1 = fMz[s]/EIz;
      const ky0 = -fMy[s-1]/EIy, ky1 = -fMy[s]/EIy;
      const thZ0 = thZ, thY0 = thY;
      thZ += 0.5*h*(kz0 + kz1);
      thY += 0.5*h*(ky0 + ky1);
      fdy[s] = fdy[s-1] + 0.5*h*(thZ0 + thZ);
      fdz[s] = fdz[s-1] + 0.5*h*(thY0 + thY);
    }
    // Distribute the small closure error linearly so the far end lands exactly
    // on its solved displacement. This absorbs the O(h^2) drift and makes the
    // curve agree with the FE solution at both ends by construction.
    const eZ = ul[7] - fdy[nF-1], eY = ul[8] - fdz[nF-1];
    for(let s = 0; s < nF; s++){
      const t = s/(nF-1);
      fdy[s] += eZ*t; fdz[s] += eY*t;
    }

    const pick = a => { const o = new Float64Array(nSt);
      for(let s = 0; s < nSt; s++) o[s] = a[s*REF]; return o; };
    const x = pick(fx), N = pick(fN), Vy = pick(fVy), Vz = pick(fVz);
    const Mz = pick(fMz), My = pick(fMy), T = pick(fT), dy = pick(fdy), dz = pick(fdz);

    return { memberId:el.m.id, L, x, N, Vy, Vz, T, My, Mz, dy, dz,
             maxAbs:{ N:maxAbs(N), Vy:maxAbs(Vy), Vz:maxAbs(Vz),
                      My:maxAbs(My), Mz:maxAbs(Mz), T:maxAbs(T),
                      d:Math.max(maxAbs(dy), maxAbs(dz)) } };
  }
  const maxAbs = a => { let m = 0; for(const v of a) if(Math.abs(v) > m) m = Math.abs(v); return m; };

  /** Per-member extremes for the whole model under one combination. */
  function memberExtremes(res, comb){
    const nM = res.nMembers, out = [];
    for(let e = 0; e < nM; e++){
      const f = comb.mf.subarray(e*12, e*12+12);
      out.push({
        id:res.memberOrder[e],
        N:Math.abs(f[0]) > Math.abs(f[6]) ? -f[0] : f[6],
        Nmax:Math.max(-f[0], f[6]), Nmin:Math.min(-f[0], f[6]),
        Vy:Math.max(Math.abs(f[1]), Math.abs(f[7])),
        Vz:Math.max(Math.abs(f[2]), Math.abs(f[8])),
        Mz:Math.max(Math.abs(f[5]), Math.abs(f[11])),
        My:Math.max(Math.abs(f[4]), Math.abs(f[10])),
        T:Math.abs(f[3])
      });
    }
    return out;
  }

  return { run, combine, diagram, memberExtremes, checkEquilibrium, prepare, resolveLoad, maxAbs };
})();

/* ==========================================================================
   14  LOADGEN - self weight, wind, seismic, standard combinations
   ========================================================================== */
const LoadGen = (() => {

  /** Remove every generated load of a given source from the document. */
  function clearGenerated(doc, source){
    doc.loads.member = doc.loads.member.filter(l => l.source !== source);
    doc.loads.nodal  = doc.loads.nodal.filter(l => l.source !== source);
  }

  /** Self weight of every analytical member, as a UDL in global -Y. */
  function selfWeight(doc, caseId){
    clearGenerated(doc, 'selfweight');
    const out = [];
    for(const m of doc.analytical.members){
      if(m.active === false) continue;
      const s = Model.sec(m.sectionId), mt = Model.mat(m.materialId);
      const w = s.A * mt.density;                 // kN/m
      if(w <= 0) continue;
      out.push(Model.mk.memberLoad({
        caseId, memberId:m.id, kind:'udl', dir:'GY', w1:-w, source:'selfweight'
      }));
    }
    doc.loads.member.push(...out);
    return out;
  }

  /** Slab self weight + superimposed dead, expressed as kN/m2 per slab. */
  function slabPressures(doc){
    const map = new Map();
    for(const s of doc.physical.slabs){
      const mt = Model.mat(s.materialId);
      map.set(s.id, {
        dead: s.thickness * mt.density + (s.sdl || 0),
        live: s.imposed || 0,
        selfWeight: s.thickness * mt.density,
        sdl: s.sdl || 0
      });
    }
    return map;
  }

  /* --- wind -------------------------------------------------------------
     Basic velocity pressure  q_b = 0.613 * v_b^2   (N/m2, v in m/s)
     Student simplification: windward +0.8 q, leeward -0.5 q suction, so the
     total lateral pressure driving the frame is 1.3 q. Storey force
     F_i = 1.3 * q * B * h_i with h_i the tributary storey height. */
  function windPressure(vb){ return 0.613 * vb * vb / 1000; }   // kN/m2

  function wind(doc, caseId, { vb = 24, dir = 'X', cpW = 0.8, cpL = 0.5, width = null } = {}){
    clearGenerated(doc, 'wind');
    const q = windPressure(vb);
    const levels = doc.levels.slice().sort((a,b) => a.elevation - b.elevation);
    if(levels.length < 2) return { q, forces:[], note:'At least two levels are needed to distribute wind.' };

    // plan extent perpendicular to the wind, from the analytical nodes
    const xs = doc.analytical.nodes.map(n => n.p[0]), zs = doc.analytical.nodes.map(n => n.p[2]);
    const B = width != null ? width
            : dir === 'X' ? (Math.max(...zs) - Math.min(...zs))
                          : (Math.max(...xs) - Math.min(...xs));
    const forces = [], out = [];
    for(let i = 1; i < levels.length; i++){
      const L = levels[i];
      const hBelow = L.elevation - levels[i-1].elevation;
      const hAbove = i+1 < levels.length ? levels[i+1].elevation - L.elevation : 0;
      const hTrib = hBelow/2 + hAbove/2;
      const F = (cpW + cpL) * q * Math.max(B, 0) * hTrib;
      // spread across the windward nodes at this level
      const nodes = doc.analytical.nodes.filter(n => Math.abs(n.p[1] - L.elevation) < 0.05);
      if(!nodes.length || F <= 0) continue;
      const edge = dir === 'X' ? Math.min(...nodes.map(n => n.p[0])) : Math.min(...nodes.map(n => n.p[2]));
      const front = nodes.filter(n => Math.abs((dir === 'X' ? n.p[0] : n.p[2]) - edge) < 0.05);
      const share = F / front.length;
      for(const n of front)
        out.push(Model.mk.nodalLoad({ caseId, nodeId:n.id, source:'wind',
          [dir === 'X' ? 'Fx' : 'Fz']: share }));
      forces.push({ level:L.name, elevation:L.elevation, hTrib, F });
    }
    doc.loads.nodal.push(...out);
    return { q, B, forces, total:Util.sum(forces.map(f => f.F)) };
  }

  /* --- seismic, equivalent lateral force ---------------------------------
     V  = Cs * W ,  Cs = Sds/(R/Ie) capped by Sd1/(T*(R/Ie)) and floored at
     0.044*Sds*Ie >= 0.01 .   Ta = Ct * hn^x .
     Fx = Cvx * V ,  Cvx = wx*hx^k / sum(wi*hi^k) . */
  function seismic(doc, caseId, { Sds = 0.5, Sd1 = 0.25, system = 'rc-mrf',
                                  Ie = 1.0, dir = 'X', extraMass = 0 } = {}){
    clearGenerated(doc, 'seismic');
    const sys = LIB.SEISMIC_R.find(s => s.id === system) || LIB.SEISMIC_R[0];
    const levels = doc.levels.slice().sort((a,b) => a.elevation - b.elevation);
    const base = levels[0]?.elevation ?? 0;
    const hn = Math.max(0.1, (levels[levels.length-1]?.elevation ?? 0) - base);

    const Ta = sys.Ct * Math.pow(hn, sys.x);
    let Cs = Sds / (sys.R / Ie);
    const CsMax = Sd1 / (Ta * (sys.R / Ie));
    const CsMin = Math.max(0.044 * Sds * Ie, 0.01);
    Cs = Math.max(CsMin, Math.min(Cs, CsMax));

    // seismic weight: member self weight + slab dead. Imposed load is excluded.
    const press = slabPressures(doc);
    const wLevel = new Map(levels.map(L => [L.id, 0]));
    for(const m of doc.analytical.members){
      const s = Model.sec(m.sectionId), mt = Model.mat(m.materialId);
      const a = Model.byId(doc.analytical.nodes, m.i), b = Model.byId(doc.analytical.nodes, m.j);
      if(!a || !b) continue;
      const L = Math.hypot(a.p[0]-b.p[0], a.p[1]-b.p[1], a.p[2]-b.p[2]);
      const w = s.A * mt.density * L;
      const y = (a.p[1] + b.p[1]) / 2;
      const lv = Model.levelAt(doc, y, 2.5) || levels[levels.length-1];
      if(lv) wLevel.set(lv.id, (wLevel.get(lv.id)||0) + w);
    }
    for(const sl of doc.physical.slabs){
      const p = press.get(sl.id); if(!p) continue;
      const A = Geom.area(sl.boundary);
      wLevel.set(sl.levelId, (wLevel.get(sl.levelId)||0) + p.dead*A);
    }
    if(extraMass) for(const L of levels) wLevel.set(L.id, (wLevel.get(L.id)||0) + extraMass);

    const W = Util.sum([...wLevel.values()]);
    const V = Cs * W;
    const k = Ta <= 0.5 ? 1 : Ta >= 2.5 ? 2 : 1 + (Ta - 0.5)/2;

    let denom = 0;
    const rows = [];
    for(const L of levels){
      const h = L.elevation - base;
      if(h <= 0) continue;
      const wi = wLevel.get(L.id) || 0;
      const t = wi * Math.pow(h, k);
      denom += t;
      rows.push({ level:L, h, w:wi, t });
    }
    const out = [];
    for(const r of rows){
      r.Cvx = denom > 0 ? r.t/denom : 0;
      r.F = r.Cvx * V;
      const nodes = doc.analytical.nodes.filter(n => Math.abs(n.p[1] - r.level.elevation) < 0.05);
      if(!nodes.length || !r.F) continue;
      const share = r.F / nodes.length;
      for(const n of nodes)
        out.push(Model.mk.nodalLoad({ caseId, nodeId:n.id, source:'seismic',
          [dir === 'X' ? 'Fx' : 'Fz']: share }));
    }
    doc.loads.nodal.push(...out);
    return { Ta, Cs, CsMax, CsMin, k, W, V, R:sys.R, system:sys.name,
             rows:rows.map(r => ({ name:r.level.name, h:r.h, w:r.w, Cvx:r.Cvx, F:r.F })) };
  }

  /* --- Eurocode combinations --------------------------------------------
     EN 1990 eq. 6.10 with gG = 1.35 / 1.00, gQ = 1.50,
     psi0 = 0.7 imposed, 0.6 wind, 0.5 snow. */
  function standardCombos(cases){
    const find = t => cases.filter(c => c.type === t).map(c => c.id);
    const G = find('DEAD'), Q = find('LIVE'), W = find('WIND'),
          S = find('SNOW'), E = find('SEISMIC');
    const T = (ids, f) => ids.map(id => ({ caseId:id, factor:f }));
    const out = [];
    const add = (name, terms, ls) => {
      const t = terms.filter(x => x && x.caseId);
      if(t.length) out.push(Model.mk.combo(name, t, ls));
    };
    add('ULS 1 · 1.35G + 1.50Q', [...T(G,1.35), ...T(Q,1.50)], 'ULS');
    if(W.length){
      add('ULS 2 · 1.35G + 1.50Q + 0.90W', [...T(G,1.35), ...T(Q,1.50), ...T(W,0.90)], 'ULS');
      add('ULS 3 · 1.35G + 1.50W + 1.05Q', [...T(G,1.35), ...T(W,1.50), ...T(Q,1.05)], 'ULS');
      add('ULS 4 · 1.00G + 1.50W (uplift)', [...T(G,1.00), ...T(W,1.50)], 'ULS');
    }
    if(S.length) add('ULS 5 · 1.35G + 1.50S + 1.05Q', [...T(G,1.35), ...T(S,1.50), ...T(Q,1.05)], 'ULS');
    if(E.length) add('ULS 6 · 1.00G + 1.00E + 0.30Q', [...T(G,1.00), ...T(E,1.00), ...T(Q,0.30)], 'ULS');
    add('SLS characteristic · G + Q', [...T(G,1.00), ...T(Q,1.00)], 'SLS');
    add('SLS quasi-permanent · G + 0.30Q', [...T(G,1.00), ...T(Q,0.30)], 'SLS');
    return out;
  }

  return { selfWeight, slabPressures, wind, windPressure, seismic,
           standardCombos, clearGenerated };
})();

/* ==========================================================================
   15  TAKEDOWN - tributary areas, gravity load path, foundation sizing
   ==========================================================================
   IMPORTANT, and the thing most texts gloss over:

   The equivalent UDL that textbooks quote for a two-way panel
       w_eq,short = q*Lx/3
   is a BENDING-MOMENT equivalence, not a load equivalence. On a 6 x 6 m
   panel with q = 10 kN/m2 the real triangular load on each beam totals
   90 kN, while w_eq * L = 20 * 6 = 120 kN. Feeding w_eq to the analysis
   would put 33% too much load into the frame and break vertical
   equilibrium, so the total reaction would no longer equal q * A.

   Therefore: the ANALYSIS receives the true triangular and trapezoidal
   shapes, and w_eq is reported for hand-checking only. The self-test
   suite asserts sum(generated loads) == q * A_slab.
   ========================================================================== */
const Takedown = (() => {

  const COLL_TOL = 0.15;      // m, distance for an edge to count as "on" a line
  const ANG_TOL  = 0.12;      // rad, angle for two lines to count as parallel

  /** Every line at a slab's level that can support it. */
  function supportLines(doc, slab){
    const lv = Model.byId(doc.levels, slab.levelId);
    const y = lv ? lv.elevation : 0;
    const lines = [];
    for(const m of doc.analytical.members){
      if(m.active === false) continue;
      const a = Model.byId(doc.analytical.nodes, m.i), b = Model.byId(doc.analytical.nodes, m.j);
      if(!a || !b) continue;
      if(Math.abs(a.p[1] - y) > 0.05 || Math.abs(b.p[1] - y) > 0.05) continue;  // not at this level
      const p0 = [a.p[0], a.p[2]], p1 = [b.p[0], b.p[2]];
      if(Geom.dist(p0, p1) < 0.05) continue;                                    // a column, seen in plan
      lines.push({ type:'member', id:m.id, p0, p1 });
    }
    for(const w of doc.physical.walls){
      if(w.levelId !== slab.levelId || w.role === 'partition') continue;
      lines.push({ type:'wall', id:w.id, p0:w.p0.slice(), p1:w.p1.slice() });
    }
    const B = slab.boundary;
    for(let i = 0; i < B.length; i++)
      lines.push({ type:'edge', id:`${slab.id}-e${i}`, p0:B[i].slice(), p1:B[(i+1)%B.length].slice() });
    return lines;
  }

  /** Split the slab into sub-panels using every interior supporting line. */
  function decompose(slab, lines){
    let polys = [Geom.ccw(slab.boundary.map(p => p.slice()))];
    for(const ln of lines){
      if(ln.type === 'edge') continue;                 // boundary does not split
      const d = Geom.norm(Geom.sub(ln.p1, ln.p0));
      const next = [];
      for(const poly of polys){
        // only split if the line actually crosses this polygon's interior
        const side = poly.map(q => Geom.cross(d, Geom.sub(q, ln.p0)));
        const hasPos = side.some(v => v > 1e-6), hasNeg = side.some(v => v < -1e-6);
        if(hasPos && hasNeg) next.push(...Geom.splitByLine(poly, ln.p0, d));
        else next.push(poly);
      }
      polys = next;
    }
    return polys.filter(p => p.length >= 3 && Geom.area(p) > 0.05);
  }

  /** One-way or two-way, plus the governing rectangle. */
  function classify(poly, slab){
    const rect = Geom.minAreaRect(poly);
    const Lx = Math.min(rect.w, rect.d), Ly = Math.max(rect.w, rect.d);
    const ratio = Lx > 1e-6 ? Ly/Lx : Infinity;
    let twoWay = ratio <= 2.0;
    if(slab.spanMode === 'oneWay') twoWay = false;
    if(slab.spanMode === 'twoWay') twoWay = true;
    const sliver = Geom.area(poly) < 0.05 || ratio > 20;
    return { rect, Lx, Ly, ratio, twoWay, sliver, m:Lx/Ly };
  }

  /** Split the rectangle into the four tributary regions and the loads they
      impose. Returns contributions in the LOCAL rectangle frame. */
  function distribute(cls, q){
    const { rect, Lx, Ly, twoWay } = cls;
    const c = rect.corners;
    // order the corners so that edge 0-1 is a LONG side
    const e01 = Geom.dist(c[0], c[1]);
    const C = e01 >= Geom.dist(c[1], c[2]) ? c : [c[1], c[2], c[3], c[0]];
    // C[0]->C[1] and C[2]->C[3] are long (Ly); C[1]->C[2] and C[3]->C[0] are short (Lx)
    const out = [];
    const peak = q * Lx / 2;

    if(!twoWay){
      // one-way spanning the SHORT direction: the two long edges carry it all
      const w = q * Lx / 2;
      out.push({ edge:[C[0], C[1]], kind:'udl', w1:w, w2:w, total:w*Ly,
                 wEq:w, poly:[C[0], C[1], Geom.lerp2(C[1], C[2], 0.5), Geom.lerp2(C[0], C[3], 0.5)] });
      out.push({ edge:[C[2], C[3]], kind:'udl', w1:w, w2:w, total:w*Ly,
                 wEq:w, poly:[C[2], C[3], Geom.lerp2(C[3], C[0], 0.5), Geom.lerp2(C[2], C[1], 0.5)] });
      return out;
    }

    // two-way: 45 degree yield lines meeting on the long centreline
    const a = Lx/2;
    const P = Geom.lerp2(C[0], C[1], a/Ly);      // apex nearest C[0] on the C0-C1 edge side
    const Q = Geom.lerp2(C[1], C[0], a/Ly);
    // interior apex points of the yield-line skeleton
    const mid0 = Geom.lerp2(C[0], C[3], 0.5), mid1 = Geom.lerp2(C[1], C[2], 0.5);
    const A1 = Geom.lerp2(mid0, mid1, a/Ly), A2 = Geom.lerp2(mid1, mid0, a/Ly);

    // long edges -> trapezoids
    for(const [p, r, apexA, apexB] of [[C[0], C[1], A1, A2], [C[2], C[3], A2, A1]]){
      out.push({
        edge:[p, r], kind:'trapezoid', peak, a, Ly,
        total: q*Lx*(Ly - Lx/2)/2,
        wEq: (q*Lx/3)*(3 - cls.m*cls.m)/2,
        poly:[p, r, apexB, apexA]
      });
    }
    // short edges -> triangles
    for(const [p, r, apex] of [[C[1], C[2], A2], [C[3], C[0], A1]]){
      out.push({
        edge:[p, r], kind:'triangle', peak, Lx,
        total: q*Lx*Lx/4,
        wEq: q*Lx/3,
        poly:[p, r, apex]
      });
    }
    return out;
  }

  /** Find the supporting line an edge sits on. */
  function matchLine(edge, lines){
    const d = Geom.norm(Geom.sub(edge[1], edge[0]));
    let best = null, bestScore = Infinity;
    for(const ln of lines){
      const e = Geom.norm(Geom.sub(ln.p1, ln.p0));
      const ang = Math.abs(Math.abs(Geom.dot(d, e)) - 1);
      if(ang > ANG_TOL) continue;
      const d0 = Geom.distToSeg(edge[0], ln.p0, ln.p1);
      const d1 = Geom.distToSeg(edge[1], ln.p0, ln.p1);
      const score = (d0 + d1) / 2;
      if(score < COLL_TOL && score < bestScore){ bestScore = score; best = ln; }
    }
    return best;
  }

  /** Convert one contribution into member load records on its supporting line. */
  function toMemberLoads(contrib, line, caseId, deadFrac){
    if(!line || line.type !== 'member') return [];
    const L = Geom.dist(line.p0, line.p1);
    let t0 = Geom.paramOnSeg(contrib.edge[0], line.p0, line.p1) * L;
    let t1 = Geom.paramOnSeg(contrib.edge[1], line.p0, line.p1) * L;
    if(t1 < t0){ const t = t0; t0 = t1; t1 = t; }
    const span = t1 - t0;
    if(span < 1e-6) return [];
    const mk = (kind, w1, w2, a, b) => Model.mk.memberLoad({
      caseId, memberId:line.id, kind, dir:'GY',
      w1:-w1*deadFrac, w2:-w2*deadFrac, a, b, source:'takedown', sourceRef:contrib.slabId
    });

    if(contrib.kind === 'udl')
      return [mk('udl', contrib.w1, contrib.w1, t0, t1)];

    if(contrib.kind === 'triangle'){
      // 0 -> peak -> 0 over the edge
      const mid = (t0 + t1)/2;
      return [ mk('trapezoid', 0, contrib.peak, t0, mid),
               mk('trapezoid', contrib.peak, 0, mid, t1) ];
    }
    // trapezoid: ramp / plateau / ramp, ramps of length a = Lx/2
    const a = Math.min(contrib.a, span/2);
    return [ mk('trapezoid', 0, contrib.peak, t0, t0+a),
             mk('udl', contrib.peak, contrib.peak, t0+a, t1-a),
             mk('trapezoid', contrib.peak, 0, t1-a, t1) ];
  }

  /* --- tributary polygons for columns ------------------------------------
     The tributary region of a column is its Voronoi cell clipped to the slab:
     the set of points closer to this column than to any other. For a regular
     grid that reduces exactly to the textbook rectangle bounded by the
     midpoints of the adjacent bays, and it keeps working when the grid is
     irregular - which is the case that defeats the hand rule. */
  function voronoiCell(boundary, pts, i){
    let cell = boundary.map(p => p.slice());
    const c = pts[i];
    for(let j = 0; j < pts.length && cell.length >= 3; j++){
      if(j === i) continue;
      const o = pts[j];
      const mid = [(c[0]+o[0])/2, (c[1]+o[1])/2];
      const n = Geom.sub(o, c);
      const dir = [-n[1], n[0]];               // bisector direction
      // keep the half-plane on the side of c
      const side = Geom.cross(dir, Geom.sub(c, mid));
      cell = side >= 0 ? Geom.clipHalf(cell, mid, dir)
                       : Geom.clipHalf(cell, mid, [-dir[0], -dir[1]]);
    }
    return cell.length >= 3 ? cell : null;
  }

  /** Group columns into vertical stacks by plan position. */
  function columnStacks(doc, tol = 0.15){
    const cols = doc.analytical.members.filter(m => {
      const a = Model.byId(doc.analytical.nodes, m.i), b = Model.byId(doc.analytical.nodes, m.j);
      if(!a || !b) return false;
      return Math.hypot(a.p[0]-b.p[0], a.p[2]-b.p[2]) < 0.05 && Math.abs(a.p[1]-b.p[1]) > 0.2;
    });
    const stacks = [];
    for(const m of cols){
      const a = Model.byId(doc.analytical.nodes, m.i), b = Model.byId(doc.analytical.nodes, m.j);
      const plan = [a.p[0], a.p[2]];
      let st = stacks.find(s => Geom.dist(s.plan, plan) < tol);
      if(!st){ st = { id:`ST${stacks.length+1}`, plan, members:[], nodes:new Set() }; stacks.push(st); }
      st.members.push(m);
      st.nodes.add(a.id); st.nodes.add(b.id);
    }
    for(const s of stacks){
      s.members.sort((p,q) => {
        const py = Model.byId(doc.analytical.nodes, p.i).p[1];
        const qy = Model.byId(doc.analytical.nodes, q.i).p[1];
        return py - qy;
      });
      const ys = [...s.nodes].map(id => Model.byId(doc.analytical.nodes, id).p[1]);
      s.baseY = Math.min(...ys);
      s.baseNodeId = [...s.nodes].find(id => Math.abs(Model.byId(doc.analytical.nodes, id).p[1] - s.baseY) < 1e-6);
    }
    return stacks;
  }

  /* --- the whole run ----------------------------------------------------- */
  function run(doc, { deadCaseId = null, liveCaseId = null, apply = false } = {}){
    const press = LoadGen.slabPressures(doc);
    const panels = [], generated = [], unsupported = [], warnings = [];
    const perSlab = new Map();

    for(const slab of doc.physical.slabs){
      if(slab.boundary.length < 3) continue;
      const p = press.get(slab.id);
      const lines = supportLines(doc, slab);
      const subs = decompose(slab, lines);
      const rec = { slabId:slab.id, area:Geom.area(slab.boundary), dead:p.dead, live:p.live,
                    subs:[], totalDead:0, totalLive:0 };

      for(const poly of subs){
        const cls = classify(poly, slab);
        if(cls.sliver){
          warnings.push({ msg:`A sliver sub-panel in slab ${slab.id} was ignored — check for nearly collinear beams.`, id:slab.id });
          continue;
        }
        const contribsD = distribute(cls, p.dead);
        const contribsL = distribute(cls, p.live);
        const sub = { poly, cls, contribs:[], areaCheck:0 };

        for(let i = 0; i < contribsD.length; i++){
          const cd = contribsD[i], cl = contribsL[i];
          cd.slabId = slab.id; cl.slabId = slab.id;
          const line = matchLine(cd.edge, lines);
          sub.contribs.push({
            poly:cd.poly, kind:cd.kind, wEq:cd.wEq, wEqLive:cl.wEq,
            totalDead:cd.total, totalLive:cl.total,
            line: line ? { type:line.type, id:line.id } : null
          });
          rec.totalDead += cd.total; rec.totalLive += cl.total;
          if(!line || line.type === 'edge'){
            if(!line || line.type === 'edge') unsupported.push({ slabId:slab.id, edge:cd.edge });
            continue;
          }
          if(deadCaseId) generated.push(...toMemberLoads(cd, line, deadCaseId, 1));
          if(liveCaseId) generated.push(...toMemberLoads(cl, line, liveCaseId, 1));
        }
        rec.subs.push(sub);
      }
      // the invariant that matters: what we generated equals q * A
      const expectD = rec.dead * rec.area;
      if(rec.subs.length && Math.abs(rec.totalDead - expectD) > 1e-6*Math.max(1, expectD))
        warnings.push({ msg:`Slab ${slab.id}: distributed ${U.fx(rec.totalDead,1)} kN against ${U.fx(expectD,1)} kN of applied dead load — the tributary decomposition is incomplete.`, id:slab.id });
      perSlab.set(slab.id, rec);
    }

    if(apply){
      doc.loads.member = doc.loads.member.filter(l => l.source !== 'takedown');
      doc.loads.member.push(...generated);
    }

    /* --- column stacks and accumulation ---------------------------------- */
    const stacks = columnStacks(doc);
    const levels = doc.levels.slice().sort((a,b) => b.elevation - a.elevation);   // top down
    const stackRows = stacks.map(s => ({ id:s.id, plan:s.plan, baseNodeId:s.baseNodeId,
                                         levels:[], cumDead:0, cumLive:0 }));

    for(const L of levels){
      const slabsHere = doc.physical.slabs.filter(s => s.levelId === L.id);
      // plan positions of the stacks that reach this level
      const active = stackRows.filter(r =>
        stacks.find(s => s.id === r.id).members.some(m => {
          const a = Model.byId(doc.analytical.nodes, m.i), b = Model.byId(doc.analytical.nodes, m.j);
          return Math.max(a.p[1], b.p[1]) >= L.elevation - 0.05;
        }));
      if(!active.length) continue;
      const pts = active.map(r => r.plan);

      for(const slab of slabsHere){
        const p = press.get(slab.id);
        for(let i = 0; i < active.length; i++){
          const cell = voronoiCell(Geom.ccw(slab.boundary.map(q => q.slice())), pts, i);
          if(!cell) continue;
          const A = Geom.area(cell);
          if(A < 1e-6) continue;
          const row = active[i];
          row.levels.push({ levelId:L.id, name:L.name, elevation:L.elevation,
                            trib:A, poly:cell, dead:p.dead*A, live:p.live*A });
        }
      }
      // column self weight for this storey
      for(const r of active){
        const st = stacks.find(s => s.id === r.id);
        const m = st.members.find(mm => {
          const a = Model.byId(doc.analytical.nodes, mm.i), b = Model.byId(doc.analytical.nodes, mm.j);
          return Math.abs(Math.max(a.p[1], b.p[1]) - L.elevation) < 0.05;
        });
        if(!m) continue;
        const a = Model.byId(doc.analytical.nodes, m.i), b = Model.byId(doc.analytical.nodes, m.j);
        const h = Math.abs(a.p[1]-b.p[1]);
        const sec = Model.sec(m.sectionId), mat = Model.mat(m.materialId);
        const sw = sec.A*mat.density*h;
        const last = r.levels[r.levels.length-1];
        if(last) last.dead += sw; else r.levels.push({ levelId:L.id, name:L.name,
          elevation:L.elevation, trib:0, poly:null, dead:sw, live:0 });
      }
    }
    // accumulate downwards
    for(const r of stackRows){
      r.levels.sort((a,b) => b.elevation - a.elevation);
      let cd = 0, cl = 0;
      for(const lv of r.levels){ cd += lv.dead; cl += lv.live; lv.cumDead = cd; lv.cumLive = cl; }
      r.cumDead = cd; r.cumLive = cl;
      r.N_sls = cd + cl;
      r.N_uls = 1.35*cd + 1.5*cl;
    }

    /* --- footings ---------------------------------------------------------- */
    const qAllow = doc.settings.qAllowSoil || 150;
    const footings = stackRows.map(r => {
      const f = sizeFooting(r.N_sls, qAllow, 0.4);
      return Object.assign({ stackId:r.id, nodeId:r.baseNodeId, plan:r.plan,
                             N_sls:r.N_sls, N_uls:r.N_uls, qAllow }, f);
    });

    return { perSlab, panels, generated, unsupported, warnings, stacks:stackRows, footings,
             totals:{
               dead:Util.sum([...perSlab.values()].map(r => r.totalDead)),
               live:Util.sum([...perSlab.values()].map(r => r.totalLive))
             } };
  }

  /** Square pad footing from the serviceability load. 10% is added for the
      footing's own weight; depth follows a projection rule of thumb. */
  function sizeFooting(N_sls, qAllow, colDim = 0.4){
    const Areq = (N_sls * 1.10) / Math.max(qAllow, 1);
    let B = Math.sqrt(Math.max(Areq, 0.09));
    B = Math.ceil(B / 0.05) * 0.05;
    const D = Math.max(0.35, Math.ceil(((B - colDim)/2 * 0.5) / 0.05) * 0.05);
    const util = N_sls / Math.max(qAllow * B * B, 1e-9);
    return { type:'pad', B, L:B, D, util,
             note:'Bearing pressure only — punching shear and reinforcement are not checked.' };
  }

  return { run, supportLines, decompose, classify, distribute, matchLine,
           toMemberLoads, columnStacks, voronoiCell, sizeFooting };
})();

/* ==========================================================================
   16  DESIGN - simplified utilisation checks
   ==========================================================================
   These are teaching checks, not code-compliant design. They cover elastic
   section capacity and a span/limit deflection check. Buckling, lateral
   torsional buckling, shear interaction, connection and reinforcement design
   are all out of scope, and the UI says so permanently.
   ========================================================================== */
const Design = (() => {

  function memberCheck(doc, m, ext, diag){
    const sec = Model.sec(m.sectionId), mat = Model.mat(m.materialId);
    const fd = mat.fd;                                   // kPa
    const A = sec.A, Wy = sec.Wely, Wz = sec.Welz;

    const sigN  = A  > 0 ? Math.abs(ext.N)  / A  : 0;
    const sigMy = Wy > 0 ? Math.abs(ext.Mz) / Wy : 0;    // catalogue strong axis
    const sigMz = Wz > 0 ? Math.abs(ext.My) / Wz : 0;
    const util  = (sigN + sigMy + sigMz) / fd;

    const limit = doc.settings.deflLimit || 250;
    const L = diag ? diag.L : 0;
    const dMax = diag ? diag.maxAbs.d : 0;
    const dAllow = L / limit;
    const utilD = dAllow > 0 ? dMax / dAllow : 0;

    let governs = 'axial';
    if(sigMy >= sigN && sigMy >= sigMz) governs = 'bending (strong)';
    else if(sigMz >= sigN) governs = 'bending (weak)';
    if(utilD > util) governs = `deflection (span/${limit})`;

    return {
      id:m.id, sectionId:m.sectionId, materialId:m.materialId,
      N:ext.N, Mz:ext.Mz, My:ext.My, V:Math.max(ext.Vy, ext.Vz),
      sigma:(sigN + sigMy + sigMz), fd, util, utilD,
      utilMax:Math.max(util, utilD), dMax, dAllow, L, governs,
      status: Math.max(util, utilD) <= 0.85 ? 'ok'
            : Math.max(util, utilD) <= 1.00 ? 'warn' : 'bad'
    };
  }

  /** Lightest section in the same family that satisfies the demand. */
  function suggest(doc, m, ext, diag){
    const cur = Model.sec(m.sectionId), mat = Model.mat(m.materialId);
    const pool = LIB.SECTIONS.filter(s => s.family === cur.family && s.shape === cur.shape);
    const scored = pool.map(s => {
      const trial = Object.assign({}, m, { sectionId:s.id });
      const chk = memberCheck(doc, trial, ext,
        diag ? { L:diag.L, maxAbs:{ d:diag.maxAbs.d * (cur.Iy / s.Iy) } } : null);
      return { sec:s, util:chk.utilMax, mass:s.A };
    }).filter(r => r.util <= 1.0).sort((a,b) => a.mass - b.mass);
    return scored[0] ? scored[0].sec : null;
  }

  function runAll(doc, res, comb, diagFor){
    const ext = Solver.memberExtremes(res, comb);
    const out = [];
    for(let i = 0; i < ext.length; i++){
      const m = Model.byId(doc.analytical.members, ext[i].id);
      if(!m) continue;
      out.push(memberCheck(doc, m, ext[i], diagFor ? diagFor(i) : null));
    }
    out.sort((a,b) => b.utilMax - a.utilMax);
    return out;
  }

  return { memberCheck, suggest, runAll };
})();

/* ==========================================================================
   17  RENDER - one WebGLRenderer, scene graph, geometry, styles, results
   ========================================================================== */
const Render = (() => {
  let renderer, scene, camera, controls, labelRenderer, canvas, stage;
  let raf = null, dirty = true, onScreen = true, disposed = false;
  const groups = {};
  const geoCache = new Map(), matCache = new Map();
  const pickables = [];
  let modelDiag = 20;

  const C = {                                  // palette, resolved from CSS
    steel:0x8fa3b8, concrete:0xb8b4aa, timber:0xc79a63, masonry:0xa8674f,
    node:0x7f8cff, member:0x9fb2c8, sel:0x4da3ff, support:0x4ec98b,
    load:0xf0b23c, grid:0x3a4552, deform:0xff8c42, trib:0x4da3ff
  };
  const RAMPS = {
    magnitude:[[0.00,[ 30, 70,200]],[0.25,[ 40,180,220]],[0.50,[ 60,200,120]],
               [0.75,[240,200, 60]],[1.00,[230, 60, 50]]],
    signed:   [[0.00,[ 40, 90,220]],[0.50,[236,240,245]],[1.00,[220, 55, 45]]],
    util:     [[0.00,[ 60,190,120]],[0.60,[120,200, 90]],[0.85,[240,180, 60]],
               [1.00,[230, 70, 55]]]
  };
  function ramp(name, t){
    const R = RAMPS[name] || RAMPS.magnitude;
    t = Util.clamp(t, 0, 1);
    for(let i = 0; i < R.length-1; i++){
      const [t0,c0] = R[i], [t1,c1] = R[i+1];
      if(t <= t1){
        const k = (t-t0)/((t1-t0)||1);
        return [c0[0]+(c1[0]-c0[0])*k, c0[1]+(c1[1]-c0[1])*k, c0[2]+(c1[2]-c0[2])*k];
      }
    }
    return R[R.length-1][1];
  }
  const rampHex = (n,t) => { const c = ramp(n,t);
    return (Math.round(c[0])<<16) | (Math.round(c[1])<<8) | Math.round(c[2]); };
  function rampCss(name, stops = 12){
    const parts = [];
    for(let i = 0; i <= stops; i++){
      const c = ramp(name, i/stops);
      parts.push(`rgb(${c.map(Math.round).join(',')}) ${(i/stops*100).toFixed(0)}%`);
    }
    return `linear-gradient(90deg, ${parts.join(',')})`;
  }

  /* --- cross-section outlines ------------------------------------------- */
  function sectionShape(sec){
    const s = new THREE.Shape();
    const h = sec.h || 0.3, b = sec.b || 0.2;
    if(sec.shape === 'I'){
      const tw = sec.tw || b*0.06, tf = sec.tf || h*0.04;
      const hh = h/2, bb = b/2, wh = tw/2;
      s.moveTo(-bb,-hh); s.lineTo(bb,-hh); s.lineTo(bb,-hh+tf); s.lineTo(wh,-hh+tf);
      s.lineTo(wh, hh-tf); s.lineTo(bb, hh-tf); s.lineTo(bb, hh); s.lineTo(-bb, hh);
      s.lineTo(-bb, hh-tf); s.lineTo(-wh, hh-tf); s.lineTo(-wh,-hh+tf); s.lineTo(-bb,-hh+tf);
      s.closePath();
    } else if(sec.shape === 'round' || sec.shape === 'pipe'){
      s.absarc(0, 0, h/2, 0, Math.PI*2, false);
      if(sec.shape === 'pipe' && sec.t){
        const hole = new THREE.Path();
        hole.absarc(0, 0, Math.max(h/2 - sec.t, 1e-4), 0, Math.PI*2, true);
        s.holes.push(hole);
      }
    } else {
      const hh = h/2, bb = b/2;
      s.moveTo(-bb,-hh); s.lineTo(bb,-hh); s.lineTo(bb,hh); s.lineTo(-bb,hh); s.closePath();
      if(sec.shape === 'hollow' && sec.t){
        const t = sec.t, hole = new THREE.Path();
        hole.moveTo(-bb+t,-hh+t); hole.lineTo(-bb+t,hh-t);
        hole.lineTo(bb-t,hh-t); hole.lineTo(bb-t,-hh+t); hole.closePath();
        s.holes.push(hole);
      }
    }
    return s;
  }

  /** Unit-length extrusion of a section, cached; scaled per member in X. */
  function profileGeometry(sectionId, simple){
    const key = sectionId + (simple ? ':s' : '');
    if(geoCache.has(key)) return geoCache.get(key);
    const sec = Model.sec(sectionId);
    let g;
    if(simple){
      g = new THREE.BoxGeometry(1, sec.h || 0.3, sec.b || 0.2);
      g.translate(0.5, 0, 0);
    } else {
      g = new THREE.ExtrudeGeometry(sectionShape(sec), { depth:1, bevelEnabled:false, curveSegments:16 });
      // ExtrudeGeometry puts the section in XY and extrudes along +Z. The
      // section is authored with x = width (local z) and y = depth (local y),
      // so a single quarter turn about Y maps it to: extrude -> local x,
      // section depth -> local y, section width -> local z. The profile then
      // already spans 0..1 in x, which is what memberMatrix scales by L.
      g.rotateY(Math.PI/2);
      g.computeVertexNormals();
    }
    geoCache.set(key, g);
    return g;
  }

  function material(key, opts){
    if(matCache.has(key)) return matCache.get(key);
    const m = new THREE.MeshStandardMaterial(Object.assign(
      { roughness:0.75, metalness:0.05, flatShading:false }, opts));
    matCache.set(key, m);
    return m;
  }
  function familyColour(materialId){
    const f = Model.mat(materialId).family;
    return C[f] != null ? C[f] : C.steel;
  }

  /* --- lifecycle --------------------------------------------------------- */
  function init(canvasEl, stageEl, labelEl){
    canvas = canvasEl; stage = stageEl;
    renderer = new THREE.WebGLRenderer({
      canvas, antialias:true, alpha:false,
      powerPreference:'high-performance', preserveDrawingBuffer:true
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = false;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.NoToneMapping;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, 1, 0.05, 4000);
    camera.position.set(18, 14, 22);

    controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.09;
    controls.screenSpacePanning = false;
    controls.maxPolarAngle = Math.PI*0.98;
    controls.touches = { ONE:THREE.TOUCH.ROTATE, TWO:THREE.TOUCH.DOLLY_PAN };
    controls.addEventListener('change', () => { dirty = true; });

    labelRenderer = new CSS2DRenderer({ element:labelEl });
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';

    for(const k of ['env','ref','underlay','context','physical','analytical',
                    'loads','result','takedown','overlay','pick']){
      groups[k] = new THREE.Group(); groups[k].name = k; scene.add(groups[k]);
    }
    groups.pick.visible = true;

    buildEnvironment();
    bindContextLoss();
    resize();
    start();
  }

  function buildEnvironment(){
    const hemi = new THREE.HemisphereLight(0xdfe8f5, 0x2a3240, 2.1);
    const dir  = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(24, 40, 18);
    dir.shadow.mapSize.set(1024,1024);
    dir.shadow.camera.near = 1; dir.shadow.camera.far = 200;
    dir.shadow.camera.left = -60; dir.shadow.camera.right = 60;
    dir.shadow.camera.top = 60; dir.shadow.camera.bottom = -60;
    const fill = new THREE.DirectionalLight(0xbcd0e8, 0.5);
    fill.position.set(-20, 12, -16);
    groups.env.add(hemi, dir, fill);
    groups.env.userData.sun = dir;

    const grid = new THREE.GridHelper(120, 120, C.grid, 0x232a34);
    grid.material.transparent = true; grid.material.opacity = 0.5;
    grid.position.y = -0.002;
    grid.name = 'groundgrid';
    groups.env.add(grid);

    const ax = new THREE.Group();
    const mkAxis = (v, col) => {
      const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), v]);
      return new THREE.Line(g, new THREE.LineBasicMaterial({ color:col }));
    };
    ax.add(mkAxis(new THREE.Vector3(2.4,0,0), 0xf2645a));
    ax.add(mkAxis(new THREE.Vector3(0,2.4,0), 0x4ec98b));
    ax.add(mkAxis(new THREE.Vector3(0,0,2.4), 0x4da3ff));
    ax.name = 'triad';
    groups.env.add(ax);
  }

  /* Context loss is a documented, reproducible problem for 3D canvases inside
     iframes on external portals - exactly our WordPress case. All model state
     lives in plain JS objects, so a full rebuild is cheap and loses nothing. */
  function bindContextLoss(){
    canvas.addEventListener('webglcontextlost', e => {
      e.preventDefault();                                  // without this, restore never fires
      stop();
      Bus.emit('gl:lost');
    }, false);
    canvas.addEventListener('webglcontextrestored', () => {
      disposeCaches();
      buildEnvironment();
      Bus.emit('gl:restored');
      rebuildAll();
      start();
    }, false);
  }

  function disposeCaches(){
    for(const g of geoCache.values()) g.dispose();
    for(const m of matCache.values()) m.dispose();
    geoCache.clear(); matCache.clear();
  }
  function clearGroup(g){
    for(let i = g.children.length-1; i >= 0; i--){
      const c = g.children[i];
      if(c.geometry && !geoCache.has(c.geometry.uuid)) c.geometry.dispose?.();
      if(c.material && !matCache.has(c.material.uuid)){
        (Array.isArray(c.material) ? c.material : [c.material]).forEach(m => m.dispose?.());
      }
      g.remove(c);
    }
  }

  function resize(){
    if(!renderer || !stage) return;
    const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
    renderer.setSize(w, h, false);
    labelRenderer.setSize(w, h);
    camera.aspect = w/h; camera.updateProjectionMatrix();
    scene.traverse(o => { if(o.material && o.material.isLineMaterial) o.material.resolution.set(w,h); });
    dirty = true;
  }

  function start(){ if(!raf && !disposed) raf = requestAnimationFrame(tick); }
  function stop(){ if(raf){ cancelAnimationFrame(raf); raf = null; } }
  function tick(){
    raf = null;
    if(!onScreen || document.visibilityState === 'hidden'){ return; }
    const moved = controls.update();
    if(dirty || moved){ renderNow(); dirty = false; }
    raf = requestAnimationFrame(tick);
  }
  function renderNow(){
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
    budgetLabels();
  }
  const invalidate = () => { dirty = true; start(); };
  function setOnScreen(v){ onScreen = v; if(v) start(); else stop(); }

  /* --- camera helpers ----------------------------------------------------- */
  function bounds(){
    const box = new THREE.Box3();
    for(const k of ['physical','analytical','ref','context']){
      const g = groups[k];
      if(g.children.length) box.expandByObject(g);
    }
    if(box.isEmpty()) box.set(new THREE.Vector3(-6,0,-6), new THREE.Vector3(6,6,6));
    return box;
  }
  function fit(pad = 1.35){
    const box = bounds();
    const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
    modelDiag = Math.max(size.length(), 2);
    const dist = (modelDiag*pad) / (2*Math.tan(camera.fov*Math.PI/360));
    const dirv = camera.position.clone().sub(controls.target).normalize();
    if(!isFinite(dirv.x) || dirv.lengthSq() < 1e-6) dirv.set(0.7, 0.55, 0.85).normalize();
    controls.target.copy(ctr);
    camera.position.copy(ctr).add(dirv.multiplyScalar(dist));
    camera.near = Math.max(modelDiag/2000, 0.02);
    camera.far = modelDiag*40;
    camera.updateProjectionMatrix();
    controls.update();
    invalidate();
  }
  function standardView(which){
    const box = bounds(), ctr = box.getCenter(new THREE.Vector3());
    const d = Math.max(box.getSize(new THREE.Vector3()).length(), 4)*1.1;
    const V = { top:[0,1,0.001], front:[0,0.001,1], back:[0,0.001,-1],
                left:[-1,0.001,0], right:[1,0.001,0], iso:[0.75,0.6,0.95],
                topleft:[-0.7,0.9,0.4], topright:[0.7,0.9,0.4], botleft:[-0.7,0.35,0.9] };
    const v = V[which] || V.iso;
    controls.target.copy(ctr);
    camera.position.copy(ctr).add(new THREE.Vector3(...v).normalize().multiplyScalar(d));
    camera.up.set(0,1,0);
    camera.updateProjectionMatrix(); controls.update(); invalidate();
  }

  /* --- labels --------------------------------------------------------------
     CSS2D labels are DOM nodes, so a model with a few hundred members will
     happily produce a few thousand of them and bury itself. Every label
     therefore carries a priority, and after each render a budgeting pass keeps
     the most important ones that do not collide in screen space and hides the
     rest. Zooming in reveals more, which is the behaviour people expect. */
  const LBL_PRIORITY = { grid:10, dim:9, tag:6, val:7, node:3, '':5 };
  const LBL_CAP = 64;
  const _lblV = new THREE.Vector3();

  function label(text, pos, cls, pri){
    const e = document.createElement('div');
    e.className = 'lbl ' + (cls || '');
    e.textContent = text;
    const o = new CSS2DObject(e);
    o.position.copy(pos);
    o.center.set(0.5, 0.5);
    o.userData.pri = pri != null ? pri : (LBL_PRIORITY[cls] ?? 5);
    return o;
  }

  function budgetLabels(){
    const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
    const items = [];
    scene.traverse(o => {
      if(!o.isCSS2DObject) return;
      let p = o.parent, shown = true;
      while(p){ if(!p.visible){ shown = false; break; } p = p.parent; }
      if(!shown){ o.element.style.display = 'none'; return; }
      o.getWorldPosition(_lblV);
      const d = _lblV.distanceTo(camera.position);
      _lblV.project(camera);
      if(_lblV.z < -1 || _lblV.z > 1 || Math.abs(_lblV.x) > 1.25 || Math.abs(_lblV.y) > 1.25){
        o.element.style.display = 'none'; return;
      }
      items.push({ o, d,
        x:(_lblV.x*0.5 + 0.5)*w, y:(-_lblV.y*0.5 + 0.5)*h,
        pri:o.userData.pri || 5 });
    });
    // most important first, nearest first within a priority
    items.sort((a,b) => b.pri - a.pri || a.d - b.d);
    const CX = 30, CY = 20, occ = new Uint8Array(CX*CY);
    let shown = 0;
    for(const it of items){
      if(shown >= LBL_CAP){ it.o.element.style.display = 'none'; continue; }
      const cx = Util.clamp(Math.floor(it.x/w*CX), 0, CX-1);
      const cy = Util.clamp(Math.floor(it.y/h*CY), 0, CY-1);
      const k = cy*CX + cx;
      if(occ[k]){ it.o.element.style.display = 'none'; continue; }
      occ[k] = 1;
      it.o.element.style.display = '';
      shown++;
    }
  }

  /* --- member transform ---------------------------------------------------- */
  const _lam = new Float64Array(9);
  function memberMatrix(pI, pJ, roll, L){
    FEM.dirCos(pI, pJ, roll || 0, _lam);
    const m = new THREE.Matrix4();
    m.set(
      _lam[0]*L, _lam[3], _lam[6], pI[0],
      _lam[1]*L, _lam[4], _lam[7], pI[1],
      _lam[2]*L, _lam[5], _lam[8], pI[2],
      0, 0, 0, 1
    );
    return m;
  }

  return { get scene(){return scene}, get camera(){return camera},
           get controls(){return controls}, get renderer(){return renderer},
           get groups(){return groups}, get canvas(){return canvas},
           get modelDiag(){return modelDiag},
           init, resize, start, stop, invalidate, setOnScreen, renderNow,
           fit, standardView, bounds, label, budgetLabels, clearGroup, disposeCaches,
           profileGeometry, sectionShape, material, familyColour,
           memberMatrix, ramp, rampHex, rampCss, RAMPS, C, pickables,
           _rebuildHook:null,
           rebuildAll(){ this._rebuildHook && this._rebuildHook(); } };
})();

/* ==========================================================================
   18  BUILD - turn the document (and results) into scene geometry
   ==========================================================================
   Nothing here holds model state. Every object carries only
   userData = { kind, id } so that a WebGL context rebuild is a single call.
   ========================================================================== */
const Build = (() => {
  const V = (x,y,z) => new THREE.Vector3(x,y,z);
  const G = () => Render.groups;

  const lineMat = (color, width, opts) => Object.assign(new LineMaterial(Object.assign({
    color, linewidth:width, worldUnits:false, dashed:false, alphaToCoverage:true }, opts)),
    { resolution:new THREE.Vector2(
        Render.canvas?.clientWidth || 1, Render.canvas?.clientHeight || 1) });

  function fatLine(points, color, width, opts){
    const geo = new LineSegmentsGeometry();
    const pos = [];
    for(let i = 0; i < points.length-1; i++){
      pos.push(points[i].x, points[i].y, points[i].z,
               points[i+1].x, points[i+1].y, points[i+1].z);
    }
    geo.setPositions(pos);
    const m = lineMat(color, width, opts);
    const l = new LineSegments2(geo, m);
    l.computeLineDistances();
    return l;
  }
  function segs(pairs, color, width, opts){
    const geo = new LineSegmentsGeometry();
    geo.setPositions(pairs);
    const l = new LineSegments2(geo, lineMat(color, width, opts));
    l.computeLineDistances();
    return l;
  }

  /* --- grids and levels --------------------------------------------------- */
  function refs(doc){
    const g = G().ref; Render.clearGroup(g);
    if(!doc.views.show.grids && !doc.views.show.levels) return;
    const box = Render.bounds();
    const yMin = Math.min(0, box.min.y), yMax = Math.max(box.max.y, 3);

    if(doc.views.show.grids){
      const pts = [];
      for(const gl of doc.grids){
        pts.push(gl.p0[0], yMin, gl.p0[1], gl.p1[0], yMin, gl.p1[1]);
        if(doc.views.show.labels.grid){
          const d = Geom.norm(Geom.sub(gl.p1, gl.p0));
          const ext = 1.2;
          const b0 = [gl.p0[0]-d[0]*ext, gl.p0[1]-d[1]*ext];
          g.add(Render.label(gl.label, V(b0[0], yMin, b0[1]), 'grid'));
        }
      }
      if(pts.length) g.add(segs(pts, Render.C.grid, 1.4, { transparent:true, opacity:0.85 }));
    }
    if(doc.views.show.levels){
      const ex = Math.max(box.max.x - box.min.x, 6)*0.55 + 1.5;
      const ez = Math.max(box.max.z - box.min.z, 6)*0.55 + 1.5;
      const cx = (box.max.x + box.min.x)/2, cz = (box.max.z + box.min.z)/2;
      const pts = [];
      for(const L of doc.levels){
        const y = L.elevation;
        pts.push(cx-ex, y, cz-ez, cx+ex, y, cz-ez);
        pts.push(cx-ex, y, cz-ez, cx-ex, y, cz+ez);
        if(doc.views.show.labels.level)
          g.add(Render.label(`${L.name}  +${U.fx(L.elevation,2)}`, V(cx-ex, y, cz-ez), 'dim'));
      }
      if(pts.length) g.add(segs(pts, 0x4ec98b, 1.1, { transparent:true, opacity:0.4 }));
    }
  }

  /* --- physical model ------------------------------------------------------ */
  function physical(doc, style){
    const g = G().physical; Render.clearGroup(g);
    const simple = doc.physical.members.length > 400;

    for(const m of doc.physical.members){
      const L = Math.hypot(m.end[0]-m.start[0], m.end[1]-m.start[1], m.end[2]-m.start[2]);
      if(L < 1e-6) continue;
      const geo = Render.profileGeometry(m.sectionId, simple);
      const col = Render.familyColour(m.materialId);
      const mat = Render.material(`phys:${m.materialId}:${style}`, styleOpts(style, col));
      const mesh = new THREE.Mesh(geo, mat);
      mesh.applyMatrix4(Render.memberMatrix(m.start, m.end, m.roll, L));
      mesh.userData = { kind:'member', id:m.id };
      mesh.castShadow = mesh.receiveShadow = (style === 'realistic');
      g.add(mesh);
      if(style === 'wireframe' || style === 'shaded' || style === 'xray'){
        const e = new THREE.LineSegments(
          new THREE.EdgesGeometry(geo, 24),
          new THREE.LineBasicMaterial({ color:0x0d1117, transparent:true,
            opacity: style === 'wireframe' ? 0.85 : 0.35 }));
        e.applyMatrix4(Render.memberMatrix(m.start, m.end, m.roll, L));
        e.userData = { kind:'edge', id:m.id };
        g.add(e);
      }
    }

    for(const s of doc.physical.slabs){
      if(s.boundary.length < 3) continue;
      const lv = Model.byId(doc.levels, s.levelId);
      const y = lv ? lv.elevation : 0;
      const shape = new THREE.Shape(s.boundary.map(p => new THREE.Vector2(p[0], p[1])));
      for(const o of s.openings || []){
        if(o.length < 3) continue;
        shape.holes.push(new THREE.Path(o.map(p => new THREE.Vector2(p[0], p[1]))));
      }
      const geo = new THREE.ExtrudeGeometry(shape, { depth:s.thickness, bevelEnabled:false });
      geo.rotateX(Math.PI/2);
      const mat = Render.material(`slab:${s.materialId}:${style}`,
        styleOpts(style, Render.familyColour(s.materialId), true));
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = y;
      mesh.userData = { kind:'slab', id:s.id };
      mesh.receiveShadow = (style === 'realistic');
      g.add(mesh);
      const outline = [];
      for(let i = 0; i < s.boundary.length; i++){
        const a = s.boundary[i], b = s.boundary[(i+1)%s.boundary.length];
        outline.push(a[0], y, a[1], b[0], y, b[1]);
      }
      g.add(segs(outline, 0x0d1117, 1.2, { transparent:true, opacity:0.45 }));
    }

    for(const w of doc.physical.walls){
      const lv = Model.byId(doc.levels, w.levelId);
      const y = (lv ? lv.elevation : 0) + (w.baseOffset || 0);
      const L = Geom.dist(w.p0, w.p1);
      if(L < 1e-6) continue;
      const geo = new THREE.BoxGeometry(L, w.height, w.thickness);
      const mat = Render.material(`wall:${w.materialId}:${style}`,
        styleOpts(style, Render.familyColour(w.materialId), true));
      const mesh = new THREE.Mesh(geo, mat);
